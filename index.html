function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function pad(n){return n<10?"0"+n:""+n;}
function pad4(n){return n<10?"000"+n:n<100?"00"+n:n<1000?"0"+n:""+n;}
function key(d){return pad4(d.getFullYear())+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
/* A day's column in the week as it is printed: Monday first in English,
   Saturday first in Persian. */
function weekIndex(d){return isFa()?(d.getDay()+1)%7:(d.getDay()+6)%7;}
/* The day of the month, in the calendar in force. */
function dayNum(date){return isFa()?jOf(key(date)).d:date.getDate();}
/* "16 September" / "۲۵ شهریور" */
function dayMonth(k){var c=cdate(k);return nf(c.d)+" "+MONTHS[c.m-1];}
/* "16 September 2026" / "۲۵ شهریور ۱۴۰۵" */
function fullDate(k){var c=cdate(k);return dayMonth(k)+" "+yearLabel(pad4(c.y));}
function fmtTime(t){
  if(!t) return tr("all day","تمام روز");
  var p=t.split(":"),h=+p[0],m=p[1];
  var hh = (h%12)===0 ? 12 : h%12;
  if(isFa()) return nf(hh+":"+m)+" "+(h<12?"ق.ظ":"ب.ظ");
  return hh+":"+m+(h<12?"am":"pm");
}
function fmtDate(k){
  if(isFa()) return fullDate(k);
  var d=parseKey(k);
  return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3)+" "+d.getFullYear();
}
function dayOffset(k){return Math.round((parseKey(k)-today)/864e5);}
function fmtRelative(d){
  if(d===0) return tr("today","امروز");
  var n=Math.abs(d), unit=n===1?"day":"days";
  if(isFa()) return nf(n)+(d<0?" روز پیش":" روز بعد");
  return d<0 ? (n+" "+unit+" ago") : (n+" "+unit+" later");
}
function reduced(){
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(hex,amt,baseHex){ /* amt 0..1 of hex over base */
  var a=hex2rgb(hex),b=hex2rgb(baseHex);
  return "rgb("+a.map(function(v,i){return Math.round(v*amt+b[i]*(1-amt));}).join(",")+")";
}
function rgba(hex,a){return "rgba("+hex2rgb(hex).join(",")+","+a+")";}
function el(tag,cls,text){
  var n=document.createElement(tag);
  if(cls) n.className=cls;
  if(text!=null) n.textContent=text;
  return n;
}
/* Own tween instead of scrollTo({behavior:"smooth"}): the native one animates
   inconsistently, gets cancelled the moment another scroll starts, and is
   turned off entirely when the OS has animations disabled. Returns the
   duration so the caller knows how long to hold its lock. */
function animateScroll(container,to,smooth,dur){
  if(container.__raf){cancelAnimationFrame(container.__raf);container.__raf=null;}
  to=Math.max(0,Math.min(to,container.scrollHeight-container.clientHeight));
  var from=container.scrollTop, delta=to-from;
  if(!smooth || reduced() || Math.abs(delta)<2){container.scrollTop=to;return 0;}

  if(!dur) dur=Math.min(900,Math.max(420,420+Math.abs(delta)*0.2));
  var t0=(window.performance&&performance.now)?performance.now():Date.now();

  function step(now){
    if(!now) now=(window.performance&&performance.now)?performance.now():Date.now();
    var p=Math.min(1,(now-t0)/dur);
    var e=-(Math.cos(Math.PI*p)-1)/2;   /* easeInOutSine — a page settling, not a UI snap */
    container.scrollTop=from+delta*e;
    if(p<1){container.__raf=requestAnimationFrame(step);}
    else{container.__raf=null;}
  }
  container.__raf=requestAnimationFrame(step);
  return dur;
}
function centerIn(container,elm,smooth,dur){
  if(!container||!elm) return 0;
  var cr=container.getBoundingClientRect(), er=elm.getBoundingClientRect();
  var top=container.scrollTop+(er.top-cr.top)-(cr.height/2-er.height/2);
  return animateScroll(container,top,smooth!==false,dur);
}
/* Double-tap has to be counted by hand: on touch, dblclick either never fires
   or arrives only after the browser has decided to zoom. Counting clicks
   covers mouse and finger with one rule. */
function onDouble(node,fn){
  var last=0;
  node.addEventListener("click",function(e){
    var now=Date.now();
    if(now-last<440){last=0;e.preventDefault();fn(e);}
    else last=now;
  });
  node.addEventListener("dblclick",function(e){e.preventDefault();fn(e);});
}

/* --------------------------------- store --------------------------------- */
/* localStorage when the page is allowed it, an in-memory copy when it is not
   (private windows, sandboxed frames), so nothing throws either way.

   One slot per book rather than one slot for everything. A shelf index keeps
   the titles, counts and dates; each book lives under its own key; "cur" is
   the one that opens. The old single-slot book is adopted onto the shelf the
   first time this runs, so nothing written before today is lost. */

var LEGACY="narratify.v1";          /* the old single slot, read once */
var SHELF="narratify.shelf";
var SLOT="narratify.book.";

var mem={};
function lsGet(k){
  try{var v=localStorage.getItem(k); if(v!=null) return v;}catch(e){}
  return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null;
}
function lsSet(k,v){ mem[k]=v; try{localStorage.setItem(k,v);}catch(e){} }
function lsDel(k){ delete mem[k]; try{localStorage.removeItem(k);}catch(e){} }

var shelf={cur:null,books:[]};
var curBook=null;
/* A sample is a loan, not a book: it is shown without being written down, and
   only becomes a book of its own once something is written into it. scratch
   says a loan is open; curSample says which of the four it is, so the samples
   tab can mark the one being read. */
var scratch=false;
var curSample=null;

function newBookId(){
  return "b"+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36);
}
function shelfRec(id){
  for(var i=0;i<shelf.books.length;i++) if(shelf.books[i].id===id) return shelf.books[i];
  return null;
}
function writeShelf(){
  try{lsSet(SHELF,JSON.stringify(shelf));}catch(e){}
}
function shelfDrop(id){
  shelf.books=shelf.books.filter(function(b){return b.id!==id;});
  if(shelf.cur===id) shelf.cur=null;
  writeShelf();
}
function readShelf(){
  var raw=lsGet(SHELF), parsed=null;
  try{parsed=raw?JSON.parse(raw):null;}catch(e){parsed=null;}
  if(parsed&&parsed.books&&parsed.books.length!==undefined){
    shelf={cur:parsed.cur||null,
           sort:parsed.sort==="name"?"name":"date",
           books:[].slice.call(parsed.books).filter(function(b){return b&&b.id;})};
    return;
  }
  var old=lsGet(LEGACY);
  if(!old) return;
  var id=newBookId(), t="", k=0;
  lsSet(SLOT+id,old);
  try{
    var o=JSON.parse(old)||{};
    t=String(o.title||"");
    k=(o.entries&&o.entries.length)||0;
  }catch(e){}
  shelf={cur:id,books:[{id:id,title:t,n:k,at:Date.now()}]};
  writeShelf();
}

/* Where a book actually lives. IndexedDB is the home \u2014 it has room for a
   long book, where localStorage runs out around five megabytes and fails
   silently. The localStorage copy is kept as a mirror: it costs one cheap
   write, and it is what opens the book if IndexedDB is unavailable. Writes
   are chained per book so two saves can never land out of order. */
var IDB_OK=!!window.indexedDB;
var bookChain={};
var lastJson={};   /* what was last written per book, to skip idle re-writes */

function writeBookContent(id,json){
  if(gone[id]) return Promise.resolve();
  lsSet(SLOT+id,json);
  if(!IDB_OK) return Promise.resolve();
  var prev=bookChain[id]||Promise.resolve();
  bookChain[id]=prev.then(function(){
    if(gone[id]) return;          /* deleted while this write was waiting */
    return idbPut("books",id,{payload:json,at:Date.now()});
  });
  return bookChain[id];
}
/* IndexedDB first, the mirror second, and whatever is found is put back into
   IndexedDB so a book written before this version moves itself across. */
function readBookContent(id){
  if(!id) return Promise.resolve(null);
  var fromLS=function(){
    var raw=lsGet(SLOT+id);
    if(raw&&IDB_OK) idbPut("books",id,{payload:raw,at:Date.now()}).catch(function(){});
    return raw;
  };
  if(!IDB_OK) return Promise.resolve(fromLS());
  return idbGet("books",id).then(function(rec){
    if(rec&&rec.payload) return rec.payload;
    return fromLS();
  }).catch(function(){return fromLS();});
}
/* Taken off the shelf means gone from everywhere, and staying gone: a write
   already queued for that book must not land after the delete and put it
   back. The name is remembered for the session so nothing writes it again. */
var gone={};
function dropBookContent(id){
  gone[id]=1;
  delete lastJson[id];
  bookChain[id]=Promise.resolve();   /* abandon anything still queued */
  lsDel(SLOT+id);
  if(IDB_OK){
    idbDel("books",id);
    idbDel("handles",id);            /* its file is no longer this app's business */
  }
}
/* Records with no book on the shelf: left behind by deletions in older
   versions, or by a write that lost a race. Swept once, on opening. */
function sweepOrphans(){
  if(!IDB_OK) return;
  var keep={};
  shelf.books.forEach(function(b){keep[b.id]=1;});
  idbKeys("books").then(function(ks){
    ks.forEach(function(k){if(!keep[k]) idbDel("books",k);});
  });
  idbKeys("handles").then(function(ks){
    ks.forEach(function(k){if(k!=="book"&&!keep[k]) idbDel("handles",k);});
  });
  try{
    var drop=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf(SLOT)===0&&!keep[k.slice(SLOT.length)]) drop.push(k);
    }
    drop.forEach(function(k){lsDel(k);});
  }catch(e){}
}

function bookState(){
  try{return JSON.stringify({v:5,zoom:zoom,flat:flat?1:0,narf:narFilter,
    title:bookName,narratives:narratives,entries:entries,chapters:chaptersOut()});}catch(e){return null;}
}
function persist(){
  if(scratch) return;                              /* a loan is not written down */
  if(curBook&&gone[curBook]) return;               /* nor is a book taken off the shelf */
  if(!curBook&&!entries.length&&!bookName) return; /* nor is an empty, unnamed page */
  var json=bookState();
  if(json==null) return;
  if(!curBook) curBook=newBookId();
  if(lastJson[curBook]===json){shelf.cur=curBook;writeShelf();return;}
  lastJson[curBook]=json;
  markDirty();
  var id=curBook;
  writeBookContent(id,json).catch(function(){
    bookChain[id]=Promise.resolve();
    toast(tr("Couldn't save to this device's storage \u2014 export the notebook to keep your changes.",
          "ذخیره در حافظهٔ این دستگاه ممکن نشد \u2014 برای حفظ تغییرات، از دفترچه خروجی بگیرید."));
  });
  var rec=shelfRec(curBook);
  if(!rec){
    rec={id:curBook};shelf.books.push(rec);
    if(pendingNoFile){rec.nofile=true;pendingNoFile=false;}
  }
  rec.title=bookName; rec.n=entries.length; rec.at=Date.now();
  shelf.cur=curBook;
  writeShelf();
  touchFile();
}
/* Turns the stored text into a book. Returns its entries; the rest of what it
   carries lands in the pending globals the boot sequence already reads. */
function parseBook(raw){
  chapters=[]; nextChapId=1;
  if(!raw) return [];
  var parsed;
  try{parsed=JSON.parse(raw);}catch(e){return [];}
  narratives=normalizeNarratives(parsed&&parsed.narratives);
  var v=parsed&&+parsed.v;
  var z=parsed&&+parsed.zoom;
  if(v>=4&&z>=1&&z<=LEVELS) pendingZoom=Math.round(z);
  if(parsed&&parsed.flat) pendingFlat=true;
  /* The filter is a reading position, not a fact about the book, but it is
     one the reader set on purpose and would have to set again every open. It
     rides with the book and is pruned against the narratives that survived. */
  /* A search is not a reading position — it is a question the reader asked
     once. It does not ride with the book. */
  query=""; qTerms=[];
  narFilter=[];
  if(parsed&&parsed.narf&&parsed.narf.length){
    narFilter=[];
    parsed.narf.forEach(function(id){
      if(narById(String(id))&&narFilter.indexOf(String(id))<0) narFilter.push(String(id));
    });
  }
  if(parsed&&parsed.title) pendingName=String(parsed.title).slice(0,80);
  var notes=normalize(parsed&&parsed.entries,v>=4?5:(v===3?7:3));
  chapters=cleanChapters(parsed&&parsed.chapters,lastIdMap,notes);
  return notes;
}
/* The shelf is read at once, and nothing else is. The page opens blank with
   the shelf in front of it: which book to read is a decision, and making it
   every time is cheaper than discovering halfway down the page that you are
   in the wrong one. */
function restore(){
  readShelf();
  curBook=null;
  return null;
}
/* Anything the reader writes turns a loan into a book of its own. */
function writeIn(){ scratch=false; }
/* Anything arriving from storage or from a file goes through here: unknown
   tags dropped, times and dates checked, ids renumbered so two books can
   never collide on one. */
var skipped=0;
/* Two older scales to open. The three-step one — minor, notable, major —
   lands on a day, a month and a year, which are the grains those words were
   reaching for. The seven-grain one folds its two cut levels into their
   neighbours: a moment was only ever the bottom of a day, and a decade goes
   to a year rather than a life, since inflating something nobody chose is
   worse than understating it. A life is left to be earned from a distance.
   An unversioned file is guessed at from the numbers in it. */
function lift3(v){return v===1?1:v===3?4:3;}
function fold7(v){return [1,1,2,3,4,4,5][Math.max(1,Math.min(7,v))-1];}
/* A quote names the note it quotes by id, and ids are renumbered on the way
   in — so the id each row arrived with is remembered long enough to point
   every quote at the renumbered note. A row that brought no id of its own
   (every file written before quotes existed) is known by its place in the
   list, which is also how a hand-written file can quote without inventing
   ids. A quote whose note didn't arrive keeps pointing at nothing (0), so it
   still reads as a quote of something that was deleted. */
function validId(v){v=+v;return (v>0&&Math.floor(v)===v)?v:null;}
var lastIdMap=null;
function normalize(list,from){
  var out=[], qraw=[], byOld={}, claimed={};
  skipped=0; lastIdMap=byOld;
  if(!list||!list.length) return out;
  if(!from){
    var mx=0;
    list.forEach(function(e){if(e&&+e.imp>mx) mx=+e.imp;});
    from=(mx>5)?7:(mx<=3?3:5);
  }
  list.forEach(function(e){var k=e&&validId(e.id); if(k!=null) claimed[k]=1;});
  for(var i=0;i<list.length;i++){
    var e=list[i];
    if(!e||!e.dk||!/^\d{4}-\d{2}-\d{2}$/.test(e.dk)){skipped++;continue;}
    var v=+e.imp;
    if(from===3) v=lift3(v===1||v===2||v===3?v:2);
    else if(from===7) v=fold7(v);
    if(!(v>=1&&v<=LEVELS)) v=MID;
    var rec={
      id:out.length+1,
      dk:e.dk,
      t:(typeof e.t==="string"&&/^\d{2}:\d{2}$/.test(e.t))?e.t:null,
      nar:resolveNar(e.nar||e.tags,true),
      imp:Math.round(v),
      j:!!e.j,            /* has this ever been judged from a distance */
      title:String(e.title||"").slice(0,140),
      note:String(e.note||"").slice(0,1200),
      rem:cleanRem(e.rem)
    };
    var old=validId(e.id);
    if(old==null&&!claimed[i+1]) old=i+1;
    if(old!=null&&byOld[old]==null) byOld[old]=rec.id;
    qraw.push((e.q!=null&&e.q!=="")?e.q:null);
    out.push(rec);
  }
  out.forEach(function(rec,k){
    if(qraw[k]==null) return;
    var to=byOld[validId(qraw[k])];
    rec.q=(to!=null&&to!==rec.id)?to:0;
  });
  /* A quote can only quote a note. A file written before that rule (or by
     hand) may hold a quote of a quote; it is pointed at the note its chain
     began with, so what it reflects on is still there. A chain that never
     reaches a note — quotes quoting each other in a loop — is left quoting a
     deleted note. */
  var byNew={};
  out.forEach(function(rec){byNew[rec.id]=rec;});
  out.forEach(function(rec){
    if(!rec.q) return;
    var at=byNew[rec.q], seen={}, steps=0;
    seen[rec.id]=1;
    while(at&&at.q!=null&&steps<64){
      if(seen[at.id]||!at.q){at=null;break;}
      seen[at.id]=1; at=byNew[at.q]; steps++;
    }
    rec.q=(at&&at.q==null&&at.id!==rec.id)?at.id:0;
  });
  return out;
}
/* the note a chain of quotes began with, for a quote made before quoting a
   quote was refused; 0 if the chain never reaches one */
function rootOfQuote(e){
  var seen={}, steps=0;
  while(e&&e.q!=null&&steps<64){
    if(seen[e.id]||!e.q) return 0;
    seen[e.id]=1; e=findEntry(e.q); steps++;
  }
  return (e&&e.q==null)?e.id:0;
}


/* ------------------------------- reminders -------------------------------- */
/* A reminder is a property of the note it was set on, never a note of its
   own, so it moves, is exported and is deleted with it.

     k     "once" | "rep"
     on    once: the day to remind on (a stored Gregorian key, like dk)
     n,u   rep: every n days / weeks / months / years ("d","w","m","y")
     cal   rep: which calendar a month or a year is counted in, "g" or "j"
     pre   rep: count back from the note's day (a countdown)
     post  rep: count forward from it (anniversaries)
     end   rep: the last day a repeat may land on, or null
     read  the days already checked off

   A month or a year is always counted from the note's own day rather than
   from the last reminder, so a note written on the 31st comes back on the
   last day of a short month and on the 31st again once there is one. */
var REM_UNITS=["d","w","m","y"];
var UNIT_DAYS={d:1,w:7,m:30.436875,y:365.2425};
var REM_WINDOW=7;
var KEY_RE=/^\d{4}-\d{2}-\d{2}$/;
function cleanRem(r){
  if(!r||typeof r!=="object") return null;
  var k=r.k==="once"?"once":r.k==="rep"?"rep":null;
  if(!k) return null;
  var read=[];
  if(r.read&&r.read.length) r.read.forEach(function(x){
    x=String(x);
    if(KEY_RE.test(x)&&read.indexOf(x)<0&&(typeof todayKey!=="string"||x<=todayKey)) read.push(x);
  });
  if(k==="once"){
    if(!KEY_RE.test(String(r.on||""))) return null;
    return {k:k,on:String(r.on),read:read};
  }
  var n=Math.round(+r.n);
  return {
    k:k,
    n:(n>=1&&n<=999)?n:1,
    u:REM_UNITS.indexOf(r.u)>=0?r.u:"y",
    cal:r.cal==="j"?"j":"g",
    pre:!!r.pre, post:!!r.post,
    end:KEY_RE.test(String(r.end||""))?String(r.end):null,
    read:read
  };
}
function copyRem(r){return r?cleanRem(JSON.parse(JSON.stringify(r))):null;}
function remOut(r){
  if(!r) return undefined;
  if(r.k==="once") return {k:"once",on:r.on,read:r.read};
  return {k:"rep",n:r.n,u:r.u,cal:r.cal,pre:r.pre?1:0,post:r.post?1:0,end:r.end,read:r.read};
}
function dnOfKey(k){return g2dn(+k.slice(0,4),+k.slice(5,7),+k.slice(8,10));}
function keyOfDn(dn){var g=dn2g(dn);return pad4(g.gy)+"-"+pad(g.gm)+"-"+pad(g.gd);}
function gLen(y,m){
  if(m===2) return ((y%4===0&&y%100!==0)||y%400===0)?29:28;
  return [31,0,31,30,31,30,31,31,30,31,30,31][m-1];
}
/* dk moved by count units, in the calendar asked for */
function remShift(dk,count,u,cal){
  if(u==="d"||u==="w") return keyOfDn(dnOfKey(dk)+count*(u==="w"?7:1));
  var months=u==="y"?count*12:count;
  var gy=+dk.slice(0,4);
  if(cal==="j"&&gy>=700&&gy<=3700){
    var j=jOf(dk), t=j.y*12+(j.m-1)+months;
    var jy=Math.floor(t/12), jm=t-jy*12+1;
    return keyOfDn(j2dn(jy,jm,Math.min(j.d,jMonthLen(jy,jm))));
  }
  var gm=+dk.slice(5,7), gd=+dk.slice(8,10), tt=gy*12+(gm-1)+months;
  var ny=Math.floor(tt/12), nm=tt-ny*12+1;
  return pad4(ny)+"-"+pad(nm)+"-"+pad(Math.min(gd,gLen(ny,nm)));
}
/* Every day between fromK and toK, both included, that this note reminds on. */
function remDays(e,fromK,toK){
  var r=e&&e.rem, out=[];
  if(!r||fromK>toK) return out;
  if(r.k==="once"){
    if(r.on>=fromK&&r.on<=toK) out.push(r.on);
    return out;
  }
  if(!r.pre&&!r.post) return out;
  var base=dnOfKey(e.dk), step=r.n*UNIT_DAYS[r.u];
  var lo=Math.floor((dnOfKey(fromK)-base)/step)-2;
  var hi=Math.ceil((dnOfKey(toK)-base)/step)+2;
  if(!r.pre) lo=Math.max(lo,1);
  if(!r.post) hi=Math.min(hi,0);
  for(var c=lo;c<=hi;c++){
    var o=remShift(e.dk,c*r.n,r.u,r.cal);
    if(o<fromK||o>toK) continue;
    if(r.end&&o>r.end) continue;
    if(out.indexOf(o)<0) out.push(o);
  }
  return out.sort();
}
/* the first day on or after today, looking far enough ahead to see one */
function remNext(r,dk){
  if(!r) return null;
  if(r.k==="once") return r.on>=todayKey?r.on:null;
  var span=Math.ceil(r.n*UNIT_DAYS[r.u]*2)+62;
  return remDays({dk:dk,rem:r},todayKey,keyOfDn(dnOfKey(todayKey)+span))[0]||null;
}
/* One row per note, always on its nearest day in the coming week. The days
   ahead are a preview; only what falls due today can have been read, and it
   is read all together, with the one box at the foot of the list. */
function dueReminders(){
  var toK=key(addDays(today,REM_WINDOW-1)), list=[];
  entries.forEach(function(e){
    if(!e.rem) return;
    var days=remDays(e,todayKey,toK);
    if(!days.length) return;
    var now=days[0]===todayKey;
    list.push({e:e,day:days[0],now:now,read:now&&e.rem.read.indexOf(todayKey)>=0});
  });
  list.sort(function(a,b){
    return a.day<b.day?-1:a.day>b.day?1:(a.e.dk<b.e.dk?-1:a.e.dk>b.e.dk?1:0);
  });
  return list;
}
function remDueToday(){
  for(var i=0;i<entries.length;i++){
    var e=entries[i];
    if(e.rem&&e.rem.read.indexOf(todayKey)<0&&remDays(e,todayKey,todayKey).length) return true;
  }
  return false;
}

/* --------------------------------- state --------------------------------- */

var today=startOfDay(new Date()), todayKey=key(today);

/* The height the book is being read from. 1 is the ground, where everything
   shows; each rung up drops the least of whatever is left. Stored with the
   book so it opens where you left it, never shown as a number. */
var zoom=1, pendingZoom=null;
/* Whether the page sets an entry at the size of its grain, or sets everything
   the same and lets the filing mark carry the size in words. A reading
   preference, not a property of the book, but it is kept with the book
   because that is where the reader left it. */
var flat=false, pendingFlat=false;
/* What the book is called. Nothing here invents one — it is the name of the
   file the book came from or was last written to, minus the extension, and
   until there has been such a file the book is honestly unnamed. */
var bookName="", pendingName="";

var entries=[];
var nextId=1;
restore();   /* the shelf now; the book a moment later, in start() */

var byDay={}, dayKeys=[];          /* what this height shows */
var allByDay={}, allDayKeys=[];    /* everything ever written */

var selected=todayKey;
var selectedItem=null;   /* id of the focused entry, or null for a whole day */
var split=50;
var lockTl=0, lockCal=0;   /* suppress a pane's handler while it is being scrolled for it */
var followTimer=null;

var calScroll=document.getElementById("calScroll");
var tlScroll=document.getElementById("tlScroll");
var calPane=document.getElementById("calPane");
var splitEl=document.getElementById("split");
var seam=document.getElementById("seam");
var monthsWrap=document.getElementById("months");
var daysWrap=document.getElementById("days");
var weekrow=document.getElementById("weekrow");

function lockT(ms){lockTl=Date.now()+(ms||750);}
function lockC(ms){lockCal=Date.now()+(ms||750);}

/* Two indexes, and the difference between them is the whole idea. allByDay is
   the book; byDay is the book seen from the height you are standing at. The
   table of contents is laid out from the first, so its shape doesn't heave
   about as you climb — only its ink follows the second. */
/* The book has two filters and they are the same kind of thing: one asks how
   long a stretch an entry has to matter across, the other asks which threads
   are being read. Both narrow the same list, so both live in visible() and
   neither needs to know about the other. An empty filter is every narrative,
   not none — the bar at rest is the whole book. */
var narFilter=[];
var quotedBy={};
/* A quote carries no narratives of its own. It is filed under Reflection, and
   under whatever the note it quotes is filed under — read live from that
   note, so re-filing the note re-files its quotes too, and a quote whose note
   was deleted is left with Reflection alone. quoteTarget is rebuilt on every
   reindex, and every change that could alter it (an edit, a deletion)
   reindexes. */
var quoteTarget={};
function narsOf(e){
  if(e.q==null) return e.nar||[];
  var out=[REFLECT], t=quoteTarget[e.id];
  function add(id){if(out.indexOf(id)<0) out.push(id);}
  if(t) (t.nar||[]).forEach(add);
  (e.nar||[]).forEach(add);
  return out;
}
/* the same question without building a list, for loops over the whole book */
function hasNar(e,id){
  if(e.nar&&e.nar.indexOf(id)>=0) return true;
  if(e.q==null) return false;
  if(id===REFLECT) return true;
  var t=quoteTarget[e.id];
  return !!t&&!!t.nar&&t.nar.indexOf(id)>=0;
}
function anyQuotes(){
  for(var i=0;i<entries.length;i++) if(entries[i].q!=null) return true;
  return false;
}
function filtering(){return narFilter.length>0;}
function matchNar(e){
  if(!narFilter.length) return true;
  for(var i=0;i<narFilter.length;i++) if(hasNar(e,narFilter[i])) return true;
  return false;
}
/* A thread taken off the shelf must not go on filtering from beyond it. */
function pruneFilter(){
  var out=[];
  narFilter.forEach(function(id){if(narById(id)) out.push(id);});
  narFilter=out;
}
/* The third filter, and the same shape as the other two. Words are taken as
   a set that must all appear somewhere in the entry's own text — its title
   or its note — rather than as a phrase, because a reader looking for a
   half-remembered entry has the words and not the order. The narratives are
   not searched: the bar above already picks those, and folding the two
   together would make a search for a thread's name mean two different
   things at once. */
var query="";
var qTerms=[];
function searching(){return qTerms.length>0;}
/* A word is found where a word begins, not wherever its letters happen to
   sit: "ring" finds ring, rings and ringing, and ear-ring, but not bring or
   string. The start is any place not preceded by a letter, a digit or an
   apostrophe (so the s of Émile's isn't a word of its own). A term that
   itself begins with punctuation — "#work", "-ish" — is looked for anywhere. */
var WORDCH=(function(){
  try{return new RegExp("[\\p{L}\\p{N}\\p{M}'\u2019]","u");}
  catch(e){return /[A-Za-z0-9\u00C0-\u024F\u0370-\u03FF\u0400-\u04FF'\u2019]/;}
})();
function findTerm(low,t,from){
  var needStart=WORDCH.test(t.charAt(0));
  var at=low.indexOf(t,from||0);
  while(at>=0){
    if(!needStart||at===0||!WORDCH.test(low.charAt(at-1))) return at;
    at=low.indexOf(t,at+1);
  }
  return -1;
}
function matchText(e){
  if(!qTerms.length) return true;
  var hay=((e.title||"")+" "+(e.note||"")).toLowerCase();
  for(var i=0;i<qTerms.length;i++) if(findTerm(hay,qTerms[i],0)<0) return false;
  return true;
}
function visible(e){return e.imp>=zoom&&matchNar(e)&&matchText(e)&&matchChap(e);}
function ceiling(){
  var c=1;
  for(var i=0;i<entries.length;i++) if(entries[i].imp>c) c=entries[i].imp;
  return c;
}
/* The heights worth standing at. A rung earns its place by taking something
   off the page: you can't climb past the highest thing written, and you can't
   stand on a height that shows exactly what the one below it showed. So a book
   written all at month-level has one height and no ladder, and the ladder
   grows by itself the moment a second grain is kept.

   The ground is always 1, whatever the lowest grain is, so it keeps meaning
   everything. Every other stop is a grain that is present and above the
   lowest one — standing on the lowest would look just like the ground. */
var zoomStops=[1], zoomFloor=Infinity;
function computeStops(){
  var seen={}, lo=Infinity;
  for(var i=0;i<entries.length;i++){var v=entries[i].imp; seen[v]=1; if(v<lo) lo=v;}
  var out=[1];
  for(var z=2;z<=LEVELS;z++) if(seen[z]&&z>lo) out.push(z);
  zoomStops=out; zoomFloor=lo;
}
/* The stop that shows what height z would have shown. At or under the lowest
   grain that is everything, which is the ground. Above it, nothing sits
   between z and the next stop up, so that stop shows the same page. */
function snapZoom(z){
  z=Math.round(z)||1;
  if(z<=zoomFloor) return 1;
  for(var i=0;i<zoomStops.length;i++) if(zoomStops[i]>=z) return zoomStops[i];
  return zoomStops[zoomStops.length-1];
}
function stopIndex(z){return Math.max(0,zoomStops.indexOf(snapZoom(z)));}
function ladderUp(){return zoomStops.length>1;}
function maxZoom(){return zoomStops[zoomStops.length-1];}
function clampZoom(){computeStops(); zoom=snapZoom(zoom);}

function reindex(){
  narCache={};                 /* a thread may have been recoloured or removed */
  pruneFilter();
  entries.sort(function(a,b){
    if(a.dk!==b.dk) return a.dk<b.dk?-1:1;
    var at=a.t||"24:00", bt=b.t||"24:00";
    if(at!==bt) return at<bt?-1:1;
    return a.id-b.id;
  });
  clampZoom();
  byDay={};dayKeys=[];allByDay={};allDayKeys=[];
  /* who quotes whom, the other way round: in date order, so the first quote
     a note hands you to is the first thing written about it */
  quotedBy={}; quoteTarget={};
  var byIdNow={};
  entries.forEach(function(e){byIdNow[e.id]=e;});
  entries.forEach(function(e){
    if(e.q) (quotedBy[e.q]||(quotedBy[e.q]=[])).push(e.id);
    if(e.q&&byIdNow[e.q]) quoteTarget[e.id]=byIdNow[e.q];
  });
  entries.forEach(function(e){
    if(!allByDay[e.dk]){allByDay[e.dk]=[];allDayKeys.push(e.dk);}
    allByDay[e.dk].push(e);
    if(!visible(e)) return;
    if(!byDay[e.dk]){byDay[e.dk]=[];dayKeys.push(e.dk);}
    byDay[e.dk].push(e);
  });
  if(selMode) paintSelBar();
}
function findEntry(id){
  for(var i=0;i<entries.length;i++) if(entries[i].id===id) return entries[i];
  return null;
}
function leadColor(nar){
  return (nar&&nar.length)?narColor(nar[0]):NEUTRAL;
}

/* --------------------------------- build --------------------------------- */

/* The strip under the header, which is the old legend grown a job. It sits
   above both panes because the filter scopes both, at a fixed height because
   anything hung off the draggable seam moves out from under the thumb, and
   it is the one place in the book where a colour is given its name.

   It has contents rather than states: a pill for every narrative doing the
   filtering, a dash for every one that isn't. Nothing selected is all
   dashes. The pills carry labels because a lit filter has to say what it is;
   the dashes don't. Both share one sideways-scrolling row, pills first. */
var narbar=document.getElementById("narbar");
var nbOn=document.getElementById("nbOn");
var nbOff=document.getElementById("nbOff");
var nbRow=document.getElementById("nbRow");
/* the narrative just switched on, so the rebuild can bring its pill into
   view — it jumps to the front of the row, which may be scrolled away */
var nbReveal=null;
var peeking=false;
function buildNarbar(){
  if(!narbar) return;
  pruneFilter();
  /* Reflection joins the row, last, once the book has a quote to file */
  var list=narratives.slice();
  if(anyQuotes()) list.push(reflectionNar());
  var reading=paintChapPill();
  narbar.hidden=!list.length&&!reading;
  narbar.classList.toggle("peek",peeking&&list.length>0);
  /* a rebuild replaces the dashes, not the row they scroll in — keep the
     reader where they were in it */
  var keepX=nbRow.scrollLeft;
  nbOn.textContent=""; nbOff.textContent="";
  if(!list.length) return;

  list.forEach(function(n){
    var on=narFilter.indexOf(n.id)>=0;
    var k=0;
    entries.forEach(function(e){if(e.imp>=zoom&&hasNar(e,n.id)&&matchChap(e)) k++;});

    if(on){
      var p=el("button","nb-pill");
      p.style.color=narColor(n.id);
      var sw=el("i"); sw.dataset.nar=n.id;
      p.appendChild(sw);
      p.appendChild(el("span",null,n.label));
      p.appendChild(el("b",null,nf(k)));
      p.setAttribute("aria-pressed","true");
      p.setAttribute("aria-label",tr("Stop reading only "+n.label+", ","لغو نمایش فقط "+n.label+"، ")+notesN(k));
      p.dataset.id=n.id;
      p.addEventListener("click",function(){toggleNar(n.id);});
      nbOn.appendChild(p);
      return;
    }
    var d,bar;
    if(peeking){
      d=el("button","nb-pill quiet");
      bar=el("i"); bar.dataset.nar=n.id; bar.style.background=narColor(n.id);
      d.appendChild(bar);
      d.appendChild(el("span",null,n.label));
      d.appendChild(el("b",null,nf(k)));
    }else{
      d=el("button","nb-dash");
      bar=el("b"); bar.dataset.nar=n.id; bar.style.background=narColor(n.id);
      if(!k) bar.style.opacity=".35";
      d.appendChild(bar);
    }
    d.title=n.label;
    d.setAttribute("aria-pressed","false");
    d.setAttribute("aria-label",tr("Read only "+n.label+", ","نمایش فقط "+n.label+"، ")+notesN(k));
    d.addEventListener("click",function(){toggleNar(n.id);});
    nbOff.appendChild(d);
  });
  nbRow.scrollLeft=keepX;
  if(nbReveal){
    var lit=nbOn.querySelector('[data-id="'+(window.CSS&&CSS.escape?CSS.escape(nbReveal):nbReveal)+'"]');
    nbReveal=null;
    if(lit){
      var l=lit.offsetLeft, r=l+lit.offsetWidth, pad=8;
      if(l-pad<nbRow.scrollLeft) nbRow.scrollLeft=Math.max(0,l-pad);
      else if(r+pad>nbRow.scrollLeft+nbRow.clientWidth) nbRow.scrollLeft=r+pad-nbRow.clientWidth;
    }
  }
}

/* weekday header */
var yearBtn=document.getElementById("yearBtn");
var yearNow=document.getElementById("yearNow");
var yearList=document.getElementById("yearList");
var yearNames=[];
function buildWeekrow(){
  var old=weekrow.querySelectorAll(".wd");
  for(var i=0;i<old.length;i++) weekrow.removeChild(old[i]);
  WEEKDAYS.forEach(function(w){weekrow.appendChild(el("div","wd",w));});
}
buildWeekrow();

/* The years on offer are the years the book actually prints. Anywhere else
   is a blank stretch with nothing to scroll to, and the editor's date picker
   is the way there. */
function yearLabel(y){return nf(y.replace(/^0+(?=\d)/,""));}
function buildYearSel(){
  var seen={};
  yearNames=[];
  var ms=monthsWrap.querySelectorAll("[data-month]");
  for(var i=0;i<ms.length;i++){
    var y=ms[i].getAttribute("data-month").slice(0,4);
    if(!seen[y]){seen[y]=1;yearNames.push(y);}
  }
  yearList.textContent="";
  yearNames.forEach(function(y){
    var o=el("button","yopt",yearLabel(y));
    o.setAttribute("role","option");
    o.dataset.year=y;
    o.addEventListener("click",function(){goToYear(y);});
    yearList.appendChild(o);
  });
  paintYear();
}
function paintYear(){
  var y=ykey(selected);
  yearNow.textContent=yearLabel(y);
  var opts=yearList.children;
  for(var i=0;i<opts.length;i++) opts[i].classList.toggle("on",opts[i].dataset.year===y);
}
function goToYear(y){
  closeYears();
  var i;
  /* land on the first thing written that year, not on the blank padding
     month in front of it */
  for(i=0;i<dayKeys.length;i++) if(ykey(dayKeys[i])===y){pickDay(dayKeys[i],true);return;}
  for(i=0;i<calKeys.length;i++) if(ykey(calKeys[i])===y){pickDay(calKeys[i],true);return;}
}
function openYears(){
  yearList.hidden=false;
  yearBtn.setAttribute("aria-expanded","true");
  var on=yearList.querySelector(".yopt.on");
  if(on) yearList.scrollTop=Math.max(0,on.offsetTop-yearList.clientHeight/2+on.offsetHeight/2);
}
function closeYears(){
  yearList.hidden=true;
  yearBtn.setAttribute("aria-expanded","false");
}
yearBtn.addEventListener("click",function(e){
  e.stopPropagation();
  if(yearList.hidden) openYears(); else closeYears();
});
document.addEventListener("click",function(e){
  if(yearList.hidden) return;
  if(yearList.contains(e.target)||yearBtn.contains(e.target)) return;
  closeYears();
});
/* up and down walk the years, enter takes the one in front of you */
yearBtn.addEventListener("keydown",function(e){
  var at=yearNames.indexOf(ykey(selected));
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    if(yearList.hidden){openYears();return;}
    var n=at+(e.key==="ArrowDown"?1:-1);
    if(n<0||n>=yearNames.length) return;
    goToYear(yearNames[n]);
    openYears();
  }
});

/* The table of contents prints the months that are actually in use: two
   either side of today, one either side of anything written, and nothing at
   all in between. A contents page doesn't list blank pages, and an entry set
   ten years out shouldn't mean scrolling ten years of empty grids to reach
   it. Neighbouring stretches are bridged rather than broken when the gap is
   only a month or two, since a break row costs as much height as a month. */


function monthBlocks(){
  var used={};
  function mark(a,b){for(var i=a;i<=b;i++) used[i]=1;}
  var t=monthNoK(todayKey);
  mark(t-2,t+2);
  allDayKeys.forEach(function(dk){var m=monthNoK(dk);mark(m-1,m+1);});

  var list=Object.keys(used).map(Number).sort(function(a,b){return a-b;});
  var blocks=[], cur=null;
  list.forEach(function(n){
    if(cur && n-cur.to<=3){cur.to=n;return;}
    cur={from:n,to:n};
    blocks.push(cur);
  });
  return blocks;
}
function gapLabel(n){
  var y=Math.floor(n/12), m=n%12;
  if(isFa()){
    if(n<12) return nf(n)+" ماه نانوشته";
    return nf(y)+" سال"+(m?" و "+nf(m)+" ماه":"")+" نانوشته";
  }
  if(n<12) return n+(n===1?" month":" months")+" unwritten";
  var s=y+(y===1?" year":" years");
  if(m) s+=", "+m+(m===1?" month":" months");
  return s+" unwritten";
}
function buildGap(n){
  var g=el("div","gapper");
  g.setAttribute("role","separator");
  g.setAttribute("aria-label",gapLabel(n));
  g.appendChild(el("div","gapcol"));
  var line=el("div","gapline");
  line.appendChild(el("span","gaptext",gapLabel(n)));
  g.appendChild(line);
  return g;
}
function buildCalendar(){
  monthsWrap.textContent="";
  var blocks=monthBlocks();
  blocks.forEach(function(bl,bi){
    if(bi) monthsWrap.appendChild(buildGap(bl.from-blocks[bi-1].to-1));
    for(var n=bl.from;n<=bl.to;n++) monthsWrap.appendChild(buildMonth(calMonth(n),n===bl.from));
  });
  calKeys=[];
  var cells=monthsWrap.querySelectorAll("[data-date]");
  for(var i=0;i<cells.length;i++) calKeys.push(cells[i].getAttribute("data-date"));
  calSpan=spanKey();
  buildYearSel();
}
/* The months the calendar covers are fixed by the first and last thing ever
   written, which no height or filter can move. */
function spanKey(){
  var blocks=monthBlocks();
  return LANG+(DUAL?"+":"")+":"+blocks.map(function(b){return b.from+"-"+b.to;}).join("|");
}
var calSpan="";
/* Same grid, different ink. Repainting in place is the difference between a
   step of the rail costing a few hundred style updates and costing five
   thousand new elements with their listeners attached. */
function repaintCalendar(){
  var cells=monthsWrap.querySelectorAll("[data-date]");
  for(var i=0;i<cells.length;i++){
    var k=cells[i].getAttribute("data-date");
    paintCell(cells[i],parseKey(k),k);
  }
  var months=monthsWrap.querySelectorAll("[data-month]");
  for(var j=0;j<months.length;j++){
    var mk=months[j].getAttribute("data-month"), shown=0;
    for(var d=0;d<dayKeys.length;d++) if(mkey(dayKeys[d])===mk) shown+=byDay[dayKeys[d]].length;
    var badge=months[j].querySelector(".monthbadge");
    if(badge) badge.classList.toggle("quiet",(filtering()||searching())&&!shown);
  }
}
/* Arrow keys must be able to cross a break: if the day they land on was never
   printed, take the first printed day beyond it in the same direction. */
var calKeys=[];
function stepKey(from,delta){
  var want=key(addDays(parseKey(from),delta)), i;
  if(delta>0){
    for(i=0;i<calKeys.length;i++) if(calKeys[i]>=want) return calKeys[i];
    return null;
  }
  for(i=calKeys.length-1;i>=0;i--) if(calKeys[i]<=want) return calKeys[i];
  return null;
}
function buildMonth(cm,opensStretch){
  var first=cm.first, daysIn=cm.daysIn, mk=cm.mk;
  var count=0;
  entries.forEach(function(it){ if(mkey(it.dk)===mk) count++; });

  var m=el("div","month");
  m.setAttribute("data-month",mk);
  /* its height before it is drawn: the stylesheet's row pitch (--rowp, 31px
     on a phone, taller on a desk) times the week rows, less the last row's
     gap (the 8px padding below is added by the box itself) */
  m.style.setProperty("--wk",Math.ceil((weekIndex(first)+daysIn)/7));

  var mcol=el("div","monthcol");
  var mstick=el("div","monthsticky");
  var isNow=mk===mkey(todayKey);
  var shown=0;
  dayKeys.forEach(function(dk){if(mkey(dk)===mk) shown+=byDay[dk].length;});
  var mb=el("button","monthbadge"+(isNow?" isnow":"")+
    (((filtering()||searching())&&!shown)?" quiet":""));
  mb.setAttribute("aria-label",cm.name+" "+yearLabel(pad4(cm.y))+tr(", ","، ")+notesN(count));
  mb.appendChild(el("span","mname",isFa()?cm.name:cm.name.slice(0,3).toLowerCase()));
  if(DUAL){
    /* The two months of the other calendar this one runs across. The year
       above the grid names the year, so a tab only repeats it where the reader
       could lose it: the first month of a year, and the first month after a
       stretch of unwritten ones. */
    var ends=monthEnds(cm), a1=altOf(ends[0]), a2=altOf(ends[1]);
    var altTxt=a1.name.slice(0,3);
    if(a2.m!==a1.m||a2.y!==a1.y) altTxt+=" \u2013 "+a2.name.slice(0,3);
    mb.appendChild(altSpan("malt",altTxt));
    if(cm.m===0||opensStretch) mb.appendChild(el("span","myear",yearLabel(pad4(cm.y))));
    mb.setAttribute("aria-label",mb.getAttribute("aria-label")+tr(", ","، ")+altRange(ends[0],ends[1]));
  }else{
    mb.appendChild(el("span","myear",yearLabel(pad4(cm.y))));
  }
  /* Land on the first thing written that month, not on the 1st — which is
     usually blank, which leaves the calendar marking one day while the
     journal reads another. The year picker already works this way; the month
     badge should not disagree with the control directly above it. */
  mb.addEventListener("click",function(){
    var mk2=mk, i;
    for(i=0;i<dayKeys.length;i++) if(mkey(dayKeys[i])===mk2){pickDay(dayKeys[i],true);return;}
    for(i=0;i<calKeys.length;i++) if(mkey(calKeys[i])===mk2){pickDay(calKeys[i],true);return;}
    pickDay(key(first),true);
  });
  mstick.appendChild(mb); mcol.appendChild(mstick); m.appendChild(mcol);

  var cells=el("div","cells");
  for(var b=0;b<weekIndex(first);b++) cells.appendChild(el("div"));
  for(var dd=0;dd<daysIn;dd++){
    cells.appendChild(buildCell(addDays(first,dd)));
  }
  m.appendChild(cells);
  return m;
}
/* The table of contents is a map, and a map that only draws the road you are
   already on is no use for getting off it. Every entry standing at this
   height leaves its mark here whatever the narrative filter says; the filter
   only decides which marks are lit. So a thread still shows its rhythm — it
   is the only full-strength ink on the page — and the clusters of everything
   else stay visible enough to be worth going back for. */
/* A cell's contents change with the height, the filter and the search; the
   grid of cells does not. Painting is therefore kept apart from building, so
   that climbing a step can repaint twelve hundred cells in place instead of
   throwing them away and making twelve hundred more. */
function paintCell(b,date,k){
  var list=byDay[k]||[];
  var atHeight=(allByDay[k]||[]).filter(function(e){return e.imp>=zoom;});
  var weight=atHeight.reduce(function(a,b2){return a+b2.imp;},0);
  var lit=[], dim=[];
  atHeight.forEach(function(i){
    if(!visible(i)) return;
    narsOf(i).forEach(function(t){if(lit.indexOf(t)<0) lit.push(t);});
  });
  /* a thread carried by one entry in view and one out of it is in view */
  atHeight.forEach(function(i){
    if(visible(i)) return;
    narsOf(i).forEach(function(t){
      if(lit.indexOf(t)<0&&dim.indexOf(t)<0) dim.push(t);
    });
  });
  /* what is being read is never the thing that gets cut off the end */
  var tags=lit.concat(dim).slice(0,4);

  /* Most days in most books hold nothing, and a day that holds nothing looks
     the same at every height. Writing to a cell that has not changed still
     costs the browser the style and layout work of one that has, so the cell
     is asked first whether anything about it is different. */
  var sig=weight+"|"+atHeight.length+"|"+list.length+"|"+
          lit.join(",")+"|"+dim.join(",");
  if(b.dataset.sig===sig) return;
  b.dataset.sig=sig;

  b.setAttribute("aria-label",dayMonth(k)+tr(", ","، ")+notesN(atHeight.length)+
    ((filtering()||searching())&&atHeight.length?tr(", "+list.length+" in view","، "+nf(list.length)+" در نما"):"")+
    (DUAL?tr(", ","، ")+altFull(k):"")+
    tr(". Double-click to add a note.",". برای افزودن یادداشت دوبار کلیک کنید."));
  b.dataset.weight=weight;
  b.style.setProperty("--cw",String(Math.min(.09,weight*.006)));
  b.style.color=atHeight.length?"":"var(--mute)";

  var num=b.firstChild;
  num.style.fontWeight=weight>=10?"600":"";

  var dots=b.lastChild;
  dots.textContent="";
  tags.forEach(function(t){
    var i=el("i");
    i.dataset.nar=t;
    i.style.background=narColor(t);
    if(dim.indexOf(t)>=0) i.classList.add("off");
    dots.appendChild(i);
  });
}
function buildCell(date){
  var k=key(date);
  var b=el("button","cell");
  b.setAttribute("data-date",k);
  b.setAttribute("tabindex",k===selected?"0":"-1");
  if(k===todayKey) b.classList.add("today");
  b.appendChild(el("span","num",nf(dayNum(date))));
  if(DUAL){
    var ad=altOf(k);
    var sp=el("span","alt"+(ad.d===1?" first":""),String(ad.d));
    sp.setAttribute("aria-hidden","true");
    b.appendChild(sp);
  }
  b.appendChild(el("span","dots"));
  paintCell(b,date,k);

  b.addEventListener("click",function(){pickDay(k);});
  b.addEventListener("keydown",function(e){
    if(e.key==="Enter"){e.preventDefault();openEditor(null,k);}
  });
  onDouble(b,function(){openEditor(null,k);});
  armHold(b,function(){holdDay(k);},function(){return !railLive;});
  if(selMode&&pickDays[k]) b.classList.add("haspick");
  return b;
}

/* ---------------------------- windowed journal ----------------------------
   A book of any size puts the same handful of days in the DOM. The cards are
   the expensive part — gradients, shadows, a transition each — and a year of
   them costs the browser a full style and layout pass on every scroll frame
   whether or not any of it is on screen.

   One day is one block: its month rule, if it opens a month, and its group.

/* The tag stroke beside an entry: one tag paints a solid bar, several split it

var TAG_FILL=[.02,.05,.09,.14,.2];

    });

/* Puts the search's own words back on the page. Every occurrence of every

function hilite(node,text){

  var low=text.toLowerCase(), hits=[];
  qTerms.forEach(function(t){
    var at=findTerm(low,t,0);

  hits.sort(function(a,b){return a[0]-b[0];});

    at=h[1];

/* ---- quotes ----

   day, its own grain, its own narratives — carrying a one-line preview of the

   reader home again, because the jump is written into the trail at both ends.

/* nodes: everything that counts as one target — the first tap may land on

   itself). */
function armQuoteTap(nodes,lit,card,it,go,kind,single){
  var timer=null, fired=0, last=null, prev=null;
  /* A double-tap belongs to whatever its first tap touched. Opening or
     closing a card moves everything under it, and the preview sits last —
     so the second tap of a double-tap aimed at the words or the filing line
     can land on a preview that has just slid under the finger. The card
     notes every tap before anything inside it hears of it; if the tap just
     before this one was on the card but not on this target, this tap is the
     card's, and is left for the card. */

    prev=last;
    last={t:Date.now(),mine:nodes.some(function(n){return n.contains(e.target);})};
  },true);
  function cardsTap(){
    return !timer&&prev&&!prev.mine&&(Date.now()-prev.t)<QUOTE_WAIT;
  }

    if(e){e.preventDefault();e.stopPropagation();}
    if(Date.now()-fired<700) return;

    lit.classList.remove("lit");

  nodes.forEach(function(node){
    node.addEventListener("click",function(e){
      /* the card never hears about taps on the target, so it can't count one
         of them as half of its own double-tap and open the editor */
      if(cardsTap()) return;
      e.stopPropagation();

/* Which entries the reader has opened out, kept by id so a rebuild — a new

var openPosts={};

var REFL_FIRST=3;

var clipRAF=0;

     expensive thing on the frame. */
  var cut=[],i,b;

/* ------------------------------ interaction ------------------------------ */

function nearestDay(k){
  if(!dayKeys.length) return null;
  if(byDay[k]) return k;
  for(var i=0;i<dayKeys.length;i++) if(dayKeys[i]>=k) return dayKeys[i];
  return dayKeys[dayKeys.length-1];
}
function firstIdOn(k){
  var nd=nearestDay(k);
  return (nd&&byDay[nd])?byDay[nd][0].id:null;
}
/* A moment on the clock for any entry. An entry with no time sits at the end
   of its day — the same place the sort puts it, so the two never disagree. */
function stamp(dk,t){
  var p=(t||"24:00").split(":");
  return parseKey(dk).getTime()+(+p[0])*36e5+(+p[1])*6e4;
}
/* The entry still showing that sits closest in time to a given moment. Ties
   go to the earlier one, which is the direction a reader is coming from. */
function nearestVisibleAt(ms){
  var best=null,bd=Infinity;
  for(var i=0;i<entries.length;i++){
    var e=entries[i];
    if(!visible(e)) continue;
    var d=Math.abs(stamp(e.dk,e.t)-ms);
    if(d<bd){bd=d;best=e;}
  }
  return best;

/* ---- the trail ----

   are back and forward rather than up and down the page. A remembered stop
   carries the height it was read at, because half the reason a reader wants
   to go back is that they climbed away from something.

   Only stops are kept. Scrolling past twenty cards on the way somewhere is
   not twenty decisions, so a selection has to sit still for a moment before
   it joins the trail — and a selection we made ourselves, walking the trail,
   never joins it at all. */
var trail=[], trailAt=-1, trailTimer=null, trailHold=false;

function trailNote(){
  if(trailHold) return;

  trailTimer=setTimeout(function(){
    if(selectedItem==null) return;
    trailPush(selectedItem,selected,zoom);
  },TRAIL_SETTLE);

/* A stop written down at once, for moves that were decisions from the start. */
function trailPush(id,dk,z){

     somewhere new after going back always has */
  if(trailAt<trail.length-1) trail.length=trailAt+1;
  trail.push({id:id,dk:dk,z:z});
  if(trail.length>TRAIL_MAX) trail.shift();
  trailAt=trail.length-1;

  for(var i=trail.length-1;i>=0;i--){
    if(findEntry(trail[i].id)) continue;
    trail.splice(i,1);
    /* a stop before the pointer takes the pointer back with it; losing the
       stop the pointer stands on is a different thing, and is reported */
    if(i<trailAt) trailAt--;
    else if(i===trailAt) lost=true;
  }

  if(trailAt>trail.length-1) trailAt=trail.length-1;
  return lost;

  var n=lost?trailAt:trailAt+dir;
  if(n<0||n>=trail.length){paintSeek();return;}
  var stop=trail[n], e=findEntry(stop.id);
  trailAt=n;
  trailHold=true;
  clearTimeout(trailTimer);
  /* the height it was read at, or as far up as the entry still reaches if it
     has been filed lower since */
  var z=snapZoom(Math.min(stop.z,e.imp));
  var was=zoom, climbed=(z!==zoom);
  if(climbed){zoom=z;refresh(false);}
  selected=e.dk; selectedItem=e.id;
  renderSelection();
  scrollCalendarTo(selected,true);
  focusEntry(e.id,"fast");
  if(climbed){paintRail();sayHeight(was,z);}
  setTimeout(function(){trailHold=false;},1000);

/* An arrow with nowhere left to go greys out. */
function paintSeek(){
  if(!seekPrev||!seekNext) return;
  seekPrev.disabled=(trailAt<=0);
  seekNext.disabled=(trailAt<0||trailAt>=trail.length-1);
  var rw=document.getElementById("railWrap");
  if(rw) rw.classList.toggle("notrail",seekPrev.disabled&&seekNext.disabled);

/* The instant path, for moves the reader didn't ask to watch (a rebuild, a
   change of height, reduced motion): jump to where the cached heights say the
   day sits, render there, then centre for real. Moves the reader did ask for
   go through glideTo below. */
function jumpToDay(dk){
  var i=dayIndex(dk);
  if(i<0) return false;
  lockT(900);
  /* Landing is iterative because the ground moves while you land on it: the
     offset comes from heights that are still guesses, and rendering there
     replaces those guesses with measurements, which moves the very offset
     that was aimed at. Each pass aims at a better number. It converges in two
     or three on any real book; the count is a stop, not a plan. */
  var last=-1;
  for(var n=0;n<8;n++){
    var want=Math.max(0,blockTop[i]-(paneH-blockH[dk])/2);
    if(Math.abs(want-last)<1) break;
    last=want;
    tlScroll.scrollTop=want;
    renderWindow(true);
  }
  return true;
}
function settle(id,tries){
  /* The window is rendered on purpose here rather than waited for: its own
     pass is batched to a frame, and centring against a frame that hasn't run
     yet is centring against the heights we were trying to correct. */
  renderWindow(true);
  var e=tlScroll.querySelector('[data-item="'+id+'"]');
  /* The card can fall out of the window while the heights around it settle.
     Going back for its day is what stops a jump ending two months from where
     it was aimed, with the marked entry off the top of the page. */
  if(!e){
    var it=findEntry(id);
    if(!it||tries<=0) return;
    jumpToDay(it.dk);
    e=tlScroll.querySelector('[data-item="'+id+'"]');
    if(!e) return;
  }
  lockT(900);
  centerIn(tlScroll,e,false);
  if(tries<=0) return;
  requestAnimationFrame(function(){
    var s=tlScroll.getBoundingClientRect();
    var n=tlScroll.querySelector('[data-item="'+id+'"]');
    if(!n){settle(id,tries-1);return;}
    var r=n.getBoundingClientRect();
    var off=Math.abs((r.top+r.height/2)-(s.top+s.height/2));
    if(off>4) settle(id,tries-1);

/* ---- the glide ----
   A smooth move can't be steered in pixels on a windowed page. The offsets
   ahead are estimates, every frame of travel measures days it hasn't seen,
   and each measurement moves scrollTop under an animation still aiming by the
   old numbers — which is how a jump used to end a screen or two from its card.
   So the glide steers by place instead: where it left from and where it is
   going are both held as (day, distance into that day), and every frame turns
   them back into a scrollTop using whatever the heights say at that moment. A
   correction mid-flight moves the numbers and the aim together.

   Anything further than a few screens is not travelled in full. The first half
   of the flight leaves from the start, the second half arrives at the end, and
   the ground between is skipped at the moment of greatest speed — where a
   hundred days going by and a thousand look the same. */
var GLIDE_SPAN=8;          /* screens actually travelled, at most */

  if(!glide) return;

/* where day 0 begins, in scroll coordinates: the top spacer always starts there */

}
function placeAt(y){
  var i=seekTop(Math.max(0,y));

}
function placeY(p){ return blockTop[p.i]+p.off; }
function walk(p,px){
  var i=p.i, off=p.off+px, n=dayKeys.length;
  while(off<0&&i>0){ i--; off+=blockH[dayKeys[i]]; }
  while(i<n-1&&off>=blockH[dayKeys[i]]){ off-=blockH[dayKeys[i]]; i++; }
  return {i:i, off:off};
}
/* A card's middle as a place. Measured when its day is on the page; until
   then, its share of the day's estimated height. */
function entryPlace(id){
  var it=findEntry(id);
  if(!it) return null;
  var i=dayIndex(it.dk);
  if(i<0) return null;
  var rec=live[it.dk], node=rec&&rec.group.querySelector('[data-item="'+id+'"]');
  if(node){
    var head=(rec.rule||rec.group).getBoundingClientRect().top, r=node.getBoundingClientRect();
    return {i:i, off:r.top-head+r.height/2};
  }
  var g=byDay[it.dk], k=0;
  while(k<g.length&&g[k].id!==id) k++;
  var h=blockH[it.dk], rule=opensMonth(it.dk)?Math.min(h/2,RULE_H*calScale):0;
  return {i:i, off:rule+(h-rule)*(k+0.5)/g.length};
}
function dayPlace(dk){
  var i=dayIndex(dk);
  if(i<0) return null;
  var rec=live[dk];
  if(rec){
    var head=(rec.rule||rec.group).getBoundingClientRect().top, r=rec.group.getBoundingClientRect();
    return {i:i, off:r.top-head+r.height/2};
  }

/* Returns the flight's length in ms, 0 if already there, or false if there is
   nowhere to go. */
function glideTo(target,landed,mode){
  stopGlide();
  if(tlScroll.__raf){cancelAnimationFrame(tlScroll.__raf);tlScroll.__raf=null;}
  if(!dayKeys.length||!padTop) return false;
  var to=target();
  if(!to) return false;
  var mid=paneH/2;
  var from=placeAt(tlScroll.scrollTop+mid-glideBase());
  var D=placeY(to)-placeY(from), dir=D<0?-1:1, dist=Math.abs(D);
  if(dist<2){ if(landed) landed(); return 0; }
  var L=Math.min(dist,GLIDE_SPAN*paneH), skips=dist>L;
  var dur=mode==="fast"?Math.min(420,Math.max(260,260+L*0.05))
                       :Math.min(900,Math.max(420,420+L*0.2));
  var g={raf:0}, t0=performance.now(), hopped=false, prev=null;
  glide=g;
  lockT(dur+300);
  function frame(now){
    if(glide!==g) return;
    var p=Math.min(1,(now-t0)/dur);
    var s=L*(-(Math.cos(Math.PI*p)-1)/2);        /* easeInOutSine, as animateScroll */
    var t=target();
    if(!t){ stopGlide(); return; }
    var at;
    if(s<L/2) at=walk(from,dir*s);
    else{
      at=walk(t,-dir*(L-s));
      /* the skip lands at full speed; a breath of fade covers the seam */
      if(skips&&!hopped){ hopped=true; daysWrap.classList.add("gliding"); }
    }
    /* Days measured on the way in can turn out taller than guessed, which
       pulls a place that far along back up the page. Never give ground: hold
       still for that frame instead of drifting backwards. */
    if(prev&&(hopped===prev.hopped)&&(placeY(at)-placeY(prev.at))*dir<0) at=prev.at;
    prev={at:at,hopped:hopped};
    if(hopped&&p>0.62) daysWrap.classList.remove("gliding");
    lockT(300);
    tlScroll.scrollTop=placeY(at)+glideBase()-mid;
    renderWindow(true);
    if(p<1){ g.raf=requestAnimationFrame(frame); return; }
    glide=null;
    daysWrap.classList.remove("gliding");
    if(landed) landed();
  }
  g.raf=requestAnimationFrame(frame);
  return dur;
}
/* The reader taking hold of the page ends any flight in progress. */
["wheel","touchstart","pointerdown","keydown"].forEach(function(type){
  tlScroll.addEventListener(type,stopGlide,{passive:true});
});

function focusEntry(id,mode){
  if(id==null) return;

    var d=glideTo(function(){return entryPlace(id);},function(){settle(id,3);},mode);
    if(d!==false) return;
  }
  var e=tlScroll.querySelector('[data-item="'+id+'"]');
  if(!e){
    var it=findEntry(id);
    if(!it||!jumpToDay(it.dk)) return;
    if(!tlScroll.querySelector('[data-item="'+id+'"]')) return;
    /* Landing in fresh country means every day around it is still a guess.
       The first frame renders them, the next corrects their heights and moves
       the ground underneath — so the card is centred again once that has
       stopped happening, rather than once against an estimate. */
    settle(id,8);
    return;
  }
  lockT(1400);
  var d=centerIn(tlScroll,e,mode!==false,mode==="fast"?260:0);
  lockT(d+260);
}
function scrollCalendarTo(k,smooth){
  var e=calScroll.querySelector('[data-date="'+k+'"]');
  if(!e) return;
  lockC(1400);
  var d=centerIn(calScroll,e,smooth!==false);

}
function renderSelection(){
  var prev=calScroll.querySelector(".cell.sel");

  var cell=calScroll.querySelector('[data-date="'+selected+'"]');
  if(cell){cell.classList.add("sel");cell.setAttribute("tabindex","0");}

  /* Cards are built with the mark already on when they belong to the entry in
     focus, so a rebuild can leave more than one wearing it. Clearing only the
     first leaves a stale twin in the DOM. */
  var olds=tlScroll.querySelectorAll(".post.sel"), ps=olds[0]||null;
  for(var oi=0;oi<olds.length;oi++) olds[oi].classList.remove("sel");

  if(mm) mm.classList.add("active");

function pickDay(k,moveCal){

}
function pickItem(k){
  selected=k; selectedItem=firstIdOn(k);
  renderSelection(); scrollCalendarTo(k); focusEntry(selectedItem,true);
}
var tapTimer=null;
function pickPost(it){
  selected=it.dk; selectedItem=it.id;
  renderSelection();
  lockT(700);
  clearTimeout(tapTimer);
  tapTimer=setTimeout(function(){
    scrollCalendarTo(it.dk); focusEntry(it.id,true);
  },250);

/* Focus follows the scroll: whichever card is nearest the middle of the pane is
   the one in focus, so its circle fills and the calendar tracks its date. */
tlScroll.addEventListener("scroll",function(){
  queueWindow();
  if(Date.now()<lockTl) return;
  var mid=tlScroll.getBoundingClientRect().top+tlScroll.clientHeight/2;
  /* The cards are in document order and stacked down the page, so the one
     nearest the middle can be found by halving the list rather than by
     measuring every card in the book on every frame of every scroll. */
  var posts=tlScroll.querySelectorAll(".post");
  if(!posts.length) return;
  var lo=0,hi=posts.length-1,mI;
  while(lo<hi){
    mI=(lo+hi)>>1;
    var rm=posts[mI].getBoundingClientRect();
    if(rm.top+rm.height/2<mid) lo=mI+1; else hi=mI;
  }
  var best=posts[lo],bestD=Infinity;
  for(var i=Math.max(0,lo-1);i<=Math.min(posts.length-1,lo+1);i++){
    var r=posts[i].getBoundingClientRect();
    var dist=Math.abs(r.top+r.height/2-mid);
    if(dist<bestD){bestD=dist;best=posts[i];}
  }
  if(!best) return;

  var id=+best.getAttribute("data-item");
  var day=best.parentNode.parentNode.getAttribute("data-day");
  if(id===selectedItem && day===selected) return;

  var dayChanged = day!==selected;
  selected=day; selectedItem=id; renderSelection();

  if(dayChanged){
    clearTimeout(followTimer);
    followTimer=setTimeout(function(){
      var cell=calScroll.querySelector('[data-date="'+selected+'"]');
      if(!cell) return;
      var cr=calScroll.getBoundingClientRect(), er=cell.getBoundingClientRect();
      if(!(er.top>cr.top+24 && er.bottom<cr.bottom-24)){lockC(1400);lockC(centerIn(calScroll,cell,true)+260);}
    },160);
  }
});

/* The calendar drives too: the topmost day visible in the calendar sets where
   the timeline sits, so scrolling months moves the stream underneath. Instant
   rather than smooth — a queued smooth scroll would lag behind the finger. */
var calRaf=null;
/* Which day a week of the calendar hands to the journal. The scroll can only
   ever resolve to a row — there is no horizontal position in a vertical
   gesture — so the row has to choose for itself, and the first cell in it is
   the worst possible answer: it is whatever the grid happened to put on the
   left, it is frequently empty, and it resets the reader's column to the
   start of the week on every single step.

   So: keep the column the reader was already on when that day holds
   something, otherwise take the nearest day across the row that does. The
   step is still a week, but it lands on an entry rather than near one. */
/* Both take a list already ordered down the page and a test that flips from
   false to true once (or true to false, for lastCell) across it. */
function firstCell(cells,ok){
  var lo=0,hi=cells.length-1,m;
  if(!cells.length||!ok(cells[hi])) return -1;
  while(lo<hi){ m=(lo+hi)>>1; if(ok(cells[m])) hi=m; else lo=m+1; }
  return lo;
}
function lastCell(cells,ok){
  var lo=0,hi=cells.length-1,m;
  if(!cells.length||!ok(cells[0])) return -1;
  while(lo<hi){ m=(lo+hi+1)>>1; if(ok(cells[m])) lo=m; else hi=m-1; }
  return lo;
}
function pickInRow(cells,at){
  var top=cells[at].getBoundingClientRect().top;
  /* The cell handed in is the row's leading edge going down and its trailing
     edge coming back up, so the row is grown in both directions rather than
     assumed to start here. */
  var s=at,e=at;
  while(s>0&&Math.abs(cells[s-1].getBoundingClientRect().top-top)<=2) s--;
  while(e+1<cells.length&&Math.abs(cells[e+1].getBoundingClientRect().top-top)<=2) e++;
  var row=[];
  for(var i=s;i<=e;i++) row.push(cells[i].getAttribute("data-date"));
  if(!row.length) return cells[at].getAttribute("data-date");

  /* Columns, not weekday numbers. The grid is Monday-first, so a raw getDay()
     puts Sunday at 0 — reading as one step from Monday when it sits six
     columns away at the far end of the row. */
  var want=weekIndex(parseKey(selected));
  var best=null,bestGap=99,sameCol=null;
  row.forEach(function(k){
    var d=weekIndex(parseKey(k));
    if(d===want) sameCol=k;
    if(!(byDay[k]&&byDay[k].length)) return;
    var gap=Math.abs(d-want);
    if(gap<bestGap){bestGap=gap;best=k;}
  });

  return best||sameCol||row[0];

calScroll.addEventListener("scroll",function(){
  if(Date.now()<lockCal) return;
  if(calRaf) return;
  calRaf=requestAnimationFrame(function(){
    calRaf=null;
    if(Date.now()<lockCal) return;

    var box=calScroll.getBoundingClientRect();
    var top=box.top, bot=box.bottom;
    var cells=calScroll.querySelectorAll("[data-date]");
    if(!cells.length) return;

    /* A scroll that leaves the marked day on screen changes nothing. Snapping
       to a fixed edge on every frame is what made a nudge throw the journal
       across a fortnight: the day being read was mid-pane, and the handler
       dragged it to the top row whether or not the reader had gone that far.
       Selection only moves once the day is gone, and then only as far as the
       edge it went out by — down the page it comes from the top row, back up
       the page from the bottom one. */
    var cur=calScroll.querySelector('[data-date="'+selected+'"]');
    var back=false;
    if(cur){
      var cr=cur.getBoundingClientRect();
      if(cr.top>=top-2&&cr.bottom<=bot+2) return;
      /* Which edge the day is crossing, not where its top happens to be. A
         cell hanging over the bottom still has its top inside the pane, so
         asking about the top calls that forward motion and throws the
         selection to the row at the opposite end of the calendar. */
      back=cr.bottom>bot+2;
    }

    /* Cells run row by row down the page, so both edges are found by halving
       the list. Walking it from one end costs a rect for every day in the
       book on every frame, and the answer is always a dozen cells from where
       the reader already is. */
    var at=-1,edge=null;
    if(back){
      /* the last day fully above the fold */
      at=lastCell(cells,function(n){return n.getBoundingClientRect().bottom<=bot+2;});
    }else{
      /* the first day fully in view, not the first with a sliver showing: a
         four-pixel test hands the selection to a row that is scrolled up under
         the weekday header, so the day marked as current can't be seen at all */
      at=firstCell(cells,function(n){return n.getBoundingClientRect().top>=top-2;});
    }
    if(at<0) return;
    edge=cells[at];

    var k=pickInRow(cells,at);
    if(k===selected) return;

    selected=k;
    selectedItem=firstIdOn(k);
    renderSelection();
    focusEntry(selectedItem,"fast");
  });
});

/* keyboard: move day by day in the calendar */
calScroll.addEventListener("keydown",function(e){
  var map={ArrowLeft:isFa()?1:-1,ArrowRight:isFa()?-1:1,ArrowUp:-7,ArrowDown:7};
  if(!(e.key in map)) return;

  var next=stepKey(selected,map[e.key]);

/* --------------------------- height and verdict --------------------------- */
/* Two halves of one idea.

   The height is a threshold: an entry shows while it is at least as high as
   the rung you are standing on. Climb and the least of what is left falls
   away, one band at a time, exactly as a map drops villages before it drops
   cities. Nothing else changes — the same stream, read from further off.

   The verdict is the editing, and it lives up here rather than in a form,
   because hindsight is not a separate activity. It happens while you are
   looking at the wide view and something is wrong: why is that still showing,
   where did that go. So the edit is a reaction to what is on screen.

     swipe left, "not from here"  — it drops just under this height. Gone from
       this view immediately, waiting one step closer in.
     swipe right, "further out"   — it climbs one rung past where it sits, and
       keeps showing as you climb after it.

   The reader thinks here or not here. The arithmetic is ours, and the seven
   bands stay plumbing that nobody has to meet. Neither gesture can lose an
   entry: the ground floor shows everything and nothing can fall below it. */

var zoomRail=document.getElementById("zoomRail");
var zoomCap=document.getElementById("zoomCap");
var capTimer=null;

function buildRail(){
  var sig=zoomStops.join(",");
  if(zoomRail.dataset.stops!==sig){
    zoomRail.dataset.stops=sig;
    zoomRail.textContent="";
    zoomStops.forEach(function(z,i){
      var r=el("div","rung");
      r.dataset.z=z;
      r.style.setProperty("--rw",(23-3*z)+"px");   /* day 20px … life 8px */
      r.style.setProperty("--i",i);
      zoomRail.appendChild(r);
    });
  }
  paintRail();
}
function paintRail(){
  var rungs=zoomRail.children;
  for(var i=0;i<rungs.length;i++){
    var z=+rungs[i].dataset.z;
    rungs[i].classList.toggle("on",z===zoom);
    rungs[i].classList.toggle("lit",z>=zoom);
  }
  zoomRail.setAttribute("aria-valuemin","1");
  zoomRail.setAttribute("aria-valuemax",String(zoomStops.length));
  zoomRail.setAttribute("aria-valuenow",String(stopIndex(zoom)+1));
  zoomRail.setAttribute("aria-valuetext",ALT_LABELS[zoom-1]);
  var up=document.getElementById("railUp"), dn=document.getElementById("railDown");
  if(up) up.disabled=(zoom>=maxZoom());
  if(dn) dn.disabled=(zoom<=1);
