  if(rw) rw.classList.toggle("noladder",!ladderUp());
}

/* The only place a height is ever named, and it is named in words. The first
   line is where you are standing; the second is what the move changed, in the
   same words as the filing mark on the cards, so the tag and the ladder read
   as one scale. A burst of steps — a pinch, a held arrow — is told as one
   move, from where the burst began. Held longer for the first few, while the
   words are still new. */
var capFrom=null, capLast=0;
var CAP_SEEN="narratify.heightsRead";
function grainsIn(lo,hi){
  var seen={}, out=[];
  for(var i=0;i<entries.length;i++) seen[entries[i].imp]=1;
  for(var g=lo;g<hi;g++) if(seen[g]) out.push(GRAIN[g-1]);
  return out;
}
/* ["day","week","month"] -> "day-, week- and month-level" */
function grainPhrase(gs){
  if(isFa()){
    if(gs.length<2) return gs[0]||"";
    return gs.slice(0,-1).join("، ")+" و "+gs[gs.length-1];
  }
  var w=gs.map(function(g,i){return i<gs.length-1?g+"-":g+"-level";});
  if(w.length<2) return w[0]||"";
  return w.slice(0,-1).join(", ")+" and "+w[w.length-1];
}
function movedLine(from,to){
  if(from==null||from===to) return "";
  var gs=to>from?grainsIn(from,to):grainsIn(to,from);
  if(!gs.length) return "";
  if(isFa()) return "یادداشت‌های در حد "+grainPhrase(gs)+(to>from?" کنار رفتند":" به صفحه برگشتند");
  return grainPhrase(gs)+(to>from?" notes set aside":" notes back on the page");
}
function paintCap(main,more,ms){
  zoomCap.textContent=main;
  if(more) zoomCap.appendChild(el("span","cap-more",more));
  zoomCap.classList.add("show");
  clearTimeout(capTimer);
  capTimer=setTimeout(function(){zoomCap.classList.remove("show");capFrom=null;},ms);
}
function sayHeight(from,to){
  if(to==null) to=zoom;
  var now=Date.now();
  if(now-capLast>700) capFrom=null;     /* a pause ends the burst */
  capLast=now;
  var fresh=(capFrom==null);
  if(fresh) capFrom=(from==null?to:from);
  var seen=+(lsGet(CAP_SEEN)||0);
  if(fresh&&seen<6) lsSet(CAP_SEEN,String(seen+1));
  var more=movedLine(capFrom,to);
  paintCap(ALT_LABELS[to-1],more,seen<6?3400:(more?2300:1700));
}

/* The first time a book holds two grains, the ladder appears — and that is
   worth one sentence, once on this device. Only moves the reader made can set
   it off (writing, a verdict, the sample book): opening a book that already
   has a ladder is not news. */
var LADDER_MET="narratify.ladderMet";
function ladderNews(had){
  if(had||!ladderUp()||lsGet(LADDER_MET)) return;
  lsSet(LADDER_MET,"1");
  var rw=document.getElementById("railWrap");
  if(rw){
    rw.classList.remove("intro"); void rw.offsetWidth; rw.classList.add("intro");
    setTimeout(function(){rw.classList.remove("intro");},2400);
  }
  capFrom=null;
  paintCap(tr("Some of this notebook matters for longer than the rest.","بخشی از این دفترچه بیش از بقیه‌اش ماندگار است."),
           tr("Climb the ladder on the right to read it from further off.","از نردبان سمت چپ بالا بروید تا آن را از دورتر بخوانید."),5600);
}
/* Saving lights the rung the entry can still be read from: the highest height
   that shows it. */
var pingTimer=null;
function pingRung(imp){
  if(!ladderUp()) return;
  var z=1;
  zoomStops.forEach(function(st){if(st<=imp) z=st;});
  var r=zoomRail.querySelector('.rung[data-z="'+z+'"]');
  var rw=document.getElementById("railWrap");
  if(!r||!rw) return;
  zoomRail.querySelectorAll(".rung.ping").forEach(function(n){n.classList.remove("ping");});
  void r.offsetWidth;
  r.classList.add("ping"); rw.classList.add("lit");
  clearTimeout(pingTimer);
  pingTimer=setTimeout(function(){r.classList.remove("ping");rw.classList.remove("lit");},1400);
}

/* A page set flat stays flat while the height moves: climbing never reformats
   the cards under the reader's fingers. */
/* rebuild in place, without moving the reader */
function redraw(){
  var dk=selected, id=selectedItem;
  refresh(false);
  selected=dk; selectedItem=id;
  renderSelection();
  scrollCalendarTo(selected,false);
  focusEntry(selectedItem,false);
}

/* Climbing must not lose the reader's place: the entry in focus is the anchor
   and it is kept as long as the new height still shows it — climbing past
   smaller things around it doesn't move the reader off the one they were on.
   When the entry itself falls out, we land on whatever is still showing
   closest to it on the clock, which is usually the thing that was sitting
   right beside it on the page.

   A climb is shown rather than cut. The cards that are going step back and
   fade, then close up, while the scroll is paid out frame by frame so the
   entry the reader will land on slides to the middle instead of jumping
   there. Nothing is rebuilt until it is over, and anything that needs the page
   in the meantime — another step, a swipe, a rebuild — finishes it at once. */
var zoomAnim=null, departing=false;
function setZoom(z,quiet){
  z=snapZoom(z);
  if(z===zoom){paintRail();return;}
  if(zoomAnim) finishZoom();
  var from=zoom, anchor=selected, held=selectedItem;
  zoom=z;
  if(!(z>from&&depart(from,z,anchor,held))){
    refresh(false);
    keepPlace(anchor,held);
    if(z<from) markArrivals(from);
  }
  if(!quiet) sayHeight(from,z);
}
function stepZoom(n){
  var i=Math.max(0,Math.min(zoomStops.length-1,stopIndex(zoom)+n));
  setZoom(zoomStops[i]);
}
function finishZoom(fromRefresh){
  var a=zoomAnim;
  if(!a) return;
  zoomAnim=null; departing=false;
  clearTimeout(a.t1); clearTimeout(a.t2); cancelAnimationFrame(a.raf);
  if(fromRefresh) return;          /* the caller is already rebuilding */
  refresh(false);
  keepPlace(a.anchor,a.held);
}
function depart(from,to,anchor,held){
  if(reduced()||!padTop) return false;
  function stays(e){return e.imp>=to&&matchNar(e)&&matchText(e)&&matchChap(e);}
  var going=[];
  tlScroll.querySelectorAll(".post[data-item]").forEach(function(p){
    var e=findEntry(+p.dataset.item);
    if(e&&!stays(e)) going.push(p);
  });
  if(!going.length) return false;

  /* where keepPlace will land, found the way it will find it */
  var h=held!=null?findEntry(held):null, land=null;
  if(h&&stays(h)) land=h;
  else{
    var ms=h?stamp(h.dk,h.t):stamp(anchor,null), bd=Infinity;
    entries.forEach(function(e){
      if(!stays(e)) return;
      var d=Math.abs(stamp(e.dk,e.t)-ms);
      if(d<bd){bd=d;land=e;}
    });
  }
  var landEl=land?tlScroll.querySelector('.post[data-item="'+land.id+'"]'):null;

  /* whole days and whole months close as one, so no badge or rule is left
     standing over nothing */
  var closing=[];
  tlScroll.querySelectorAll(".daygroup").forEach(function(g){
    var ps=g.querySelectorAll(".post[data-item]"), all=ps.length>0;
    for(var i=0;i<ps.length;i++) if(going.indexOf(ps[i])<0){all=false;break;}
    if(all) closing.push(g);
    else for(var j=0;j<ps.length;j++) if(going.indexOf(ps[j])>=0) closing.push(ps[j]);
  });
  tlScroll.querySelectorAll(".monthrule[data-monthrule]").forEach(function(r){
    var mk=r.getAttribute("data-monthrule");
    if(!entries.some(function(e){return mkey(e.dk)===mk&&stays(e);})) closing.push(r);
  });

  departing=true;
  lockT(1200);
  going.forEach(function(p){p.classList.add("departing");});
  var a={from:from,to:to,anchor:anchor,held:held,t1:0,t2:0,raf:0};
  zoomAnim=a;
  paintRail();

  a.t1=setTimeout(function(){
    if(zoomAnim!==a) return;
    closing.forEach(function(n){n.style.height=n.offsetHeight+"px";n.classList.add("closing");});
    void tlScroll.offsetHeight;
    closing.forEach(function(n){
      n.style.height="0px";
      n.style.paddingTop=n.style.paddingBottom="0px";
      n.style.marginTop=n.style.marginBottom="0px";
      /* a card in a column also owes back the gap beside it, or every one
         that closes leaves a sliver the rebuild then snaps shut */
      if(n.classList.contains("post")){
        if(n.nextElementSibling) n.style.marginBottom="-3px";
        else if(n.previousElementSibling) n.style.marginTop="-3px";
      }
    });
    if(!landEl) return;
    var cr=tlScroll.getBoundingClientRect();
    var start=landEl.getBoundingClientRect().top;
    var goal=cr.top+cr.height/2-landEl.offsetHeight/2;
    var t0=performance.now(), DUR=220;
    (function frame(now){
      if(zoomAnim!==a) return;
      var t=Math.min(1,(now-t0)/DUR), p=1-Math.pow(1-t,3);
      var want=start+(goal-start)*p;
      var cur=landEl.getBoundingClientRect().top;
      if(Math.abs(cur-want)>0.5){lockT(400); tlScroll.scrollTop+=cur-want;}
      if(t<1) a.raf=requestAnimationFrame(frame);
    })(t0);
  },130);
  a.t2=setTimeout(function(){if(zoomAnim===a) finishZoom();},130+240);
  return true;
}
/* Coming down: the cards that were under the old height fade in where they
   land. Only the ones on the page now — anything scrolled to later simply
   is there. */
function markArrivals(from){
  if(reduced()) return;
  tlScroll.querySelectorAll(".post[data-item]").forEach(function(p){
    if(+p.dataset.imp>=from) return;
    p.classList.add("arriving");
    p.addEventListener("animationend",function(){p.classList.remove("arriving");},{once:true});
  });
}

/* Narrowing to a thread loses the reader's place the same way climbing does,
   and is put right the same way: hold the entry in focus if it survives the
   new filter, otherwise land on whatever is still showing nearest to it. */
function keepPlace(anchor,held){
  var kept=(held!=null)?findEntry(held):null;
  if(kept&&visible(kept)){
    selected=kept.dk; selectedItem=kept.id;
  }else{
    var near=nearestVisibleAt(kept?stamp(kept.dk,kept.t):stamp(anchor,null));
    if(near){ selected=near.dk; selectedItem=near.id; }
    else{ selected=nearestDay(anchor)||anchor; selectedItem=firstIdOn(selected); }
  }
  renderSelection();
  scrollCalendarTo(selected,false);
  focusEntry(selectedItem,false);
}
function applyFilter(){
  var anchor=selected, held=selectedItem;
  refresh(false);
  keepPlace(anchor,held);
}
var peekGuard=0;
function toggleNar(id){
  var at=narFilter.indexOf(id);
  if(at<0){narFilter.push(id); nbReveal=id;} else narFilter.splice(at,1);
  /* Picking from the peek moves both panes, and that movement must not be
     mistaken for the reader moving on — the names stay up so a second thread
     can be let in without opening the strip again. */
  if(peeking) peekGuard=Date.now()+700;
  applyFilter();
}
function clearFilter(){
  if(!narFilter.length) return;
  narFilter=[];
  applyFilter();
}
document.getElementById("nbMore").addEventListener("click",openManage);

/* Opening the peek changes nothing about what is on the page — it only puts
   names to the colours. Closing it is not on a clock: a timer can't tell
   reading from deciding, and firing mid-choice is the one failure that would
   make the whole gesture not worth having. It folds when the reader moves on
   to something else, which they were going to do anyway. */
var nbPeek=document.getElementById("nbPeek");
function setPeek(on){
  on=!!on&&(narratives.length>0||anyQuotes());
  if(on===peeking) return;
  peeking=on;
  nbPeek.setAttribute("aria-expanded",on?"true":"false");
  paintPeekLabel();
  buildNarbar();
}
function paintPeekLabel(){
  nbPeek.setAttribute("aria-label",peeking?tr("Hide narrative names","پنهان کردن نام روایت‌ها")
                                          :tr("Show narrative names","نمایش نام روایت‌ها"));
}
function dropPeek(){ if(Date.now()<peekGuard) return; setPeek(false); }
nbPeek.addEventListener("click",function(){setPeek(!peeking);});
document.addEventListener("pointerdown",function(e){
  if(!peeking) return;
  if(e.target&&e.target.closest&&e.target.closest("#narbar")) return;
  dropPeek();
},true);
/* Only the reader's own scrolling counts as moving on. The journal shifts
   itself when a windowed day turns out taller than guessed, and the calendar
   shifts itself to follow focus — neither is a reason to put the names away. */
calScroll.addEventListener("scroll",function(){
  if(Date.now()<lockCal) return; dropPeek();
},{passive:true});
tlScroll.addEventListener("scroll",function(){
  if(Date.now()<lockTl) return; dropPeek();
},{passive:true});

var findbar=document.getElementById("findbar");
var findIn=document.getElementById("findIn");
var findBtn=document.getElementById("findBtn");
var findX=document.getElementById("findX");
var findN=document.getElementById("findN");
var findGo=document.getElementById("findGo");

function countVisible(){
  var k=0;
  entries.forEach(function(e){if(visible(e)) k++;});
  return k;
}
function paintFind(){
  findBtn.classList.toggle("lit",searching());
  findBtn.setAttribute("aria-expanded",findbar.hidden?"false":"true");
  findX.hidden=!searching();
  findN.textContent=searching()?tr(countVisible()+" found",nf(countVisible())+" مورد پیدا شد"):"";
  findGo.classList.toggle("ready",findIn.value.trim()!==query);
}
function runSearch(raw){
  query=String(raw||"").trim();
  qTerms=query.toLowerCase().split(/\s+/).filter(Boolean);
  applyFilter();
  paintFind();
}
/* Opening costs nothing and closing must never cost the reader an
   explanation: a live search keeps the row on screen, so the only way out of
   one is to clear it. */
function openFind(){
  findbar.hidden=false;
  paintFind();
  findIn.focus();
  findIn.select();
}
function closeFind(){
  if(searching()) return false;
  findbar.hidden=true;
  findIn.value=""; findIn.dir="";
  paintFind();
  return true;
}
function clearSearch(focus){
  findIn.value=""; findIn.dir="";
  if(searching()) runSearch("");
  else paintFind();
  if(focus) findIn.focus();
}
findBtn.addEventListener("click",function(){
  if(findbar.hidden) openFind();
  else if(!closeFind()) findIn.focus();
});
/* Same commit as the enter key, and it takes the keyboard down with it the
   way enter does — otherwise the answer arrives behind the keyboard. */
findGo.addEventListener("click",function(){
  runSearch(findIn.value);
  findIn.blur();
});
findIn.addEventListener("input",paintFind);
findIn.addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();runSearch(findIn.value);findIn.blur();return;}
  if(e.key==="Escape"){
    e.preventDefault();
    if(searching()) clearSearch(true); else closeFind();
  }
});
findX.addEventListener("click",function(){clearSearch(true);});

function railZoom(clientY){
  var r=zoomRail.getBoundingClientRect(), m=zoomStops.length;
  if(m<2) return 1;
  var p=1-((clientY-r.top)/Math.max(1,r.height));   /* the ground is the bottom */
  return zoomStops[Math.round(Math.max(0,Math.min(1,p))*(m-1))];
}
var railWrap=document.getElementById("railWrap");
var railLive=false;
zoomRail.addEventListener("pointerdown",function(e){
  e.preventDefault();
  railLive=true; railWrap.classList.add("live");
  try{zoomRail.setPointerCapture(e.pointerId);}catch(err){}
  setZoom(railZoom(e.clientY));
});
zoomRail.addEventListener("pointermove",function(e){
  if(railLive) setZoom(railZoom(e.clientY));
});
function railEnd(){
  if(!railLive) return;
  railLive=false; railWrap.classList.remove("live");
}
/* Press for one level, hold to keep going. The repeat starts slowly, because
   the whole ladder is only a few rungs and overshooting it is the one thing
   these are meant to prevent. */
function stepButton(node,dir){
  var timer=null, rep=null;
  function step(){stepZoom(dir);}
  function stop(){clearTimeout(timer);clearInterval(rep);timer=rep=null;}
  node.addEventListener("pointerdown",function(e){
    e.preventDefault(); e.stopPropagation();
    /* A press that arrives without the last one having been released would
       otherwise overwrite the handles to its repeat, leaving an interval
       running that nothing can ever stop. */
    stop();
    step();
    timer=setTimeout(function(){rep=setInterval(step,190);},480);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    node.addEventListener(ev,stop);
  });
}
stepButton(document.getElementById("railUp"),1);
stepButton(document.getElementById("railDown"),-1);
/* Deliberately not stepButton: these retrace a path, and a held press would
   unwind the whole of it before the reader could read any of it. */
var seekPrev=document.getElementById("seekPrev");
var seekNext=document.getElementById("seekNext");
function seekButton(node,dir){
  if(!node) return;
  node.addEventListener("pointerdown",function(e){
    e.preventDefault(); e.stopPropagation();
    if(!node.disabled) trailStep(dir);
  });
}
seekButton(seekPrev,-1);
seekButton(seekNext,1);
paintSeek();
zoomRail.addEventListener("pointerup",railEnd);
zoomRail.addEventListener("pointercancel",railEnd);
/* The two axes keep their meanings here too: up and down is how significant,
   left and right is where you have already been. */
zoomRail.addEventListener("keydown",function(e){
  if(e.key==="ArrowUp"){e.preventDefault();stepZoom(1);}
  if(e.key==="ArrowDown"){e.preventDefault();stepZoom(-1);}
  if(e.key==="ArrowLeft"){e.preventDefault();trailStep(-1);}
  if(e.key==="ArrowRight"){e.preventDefault();trailStep(1);}
});

/* Pinch, the same way as a map: fingers apart pulls the ground closer and the
   small things come back with it. Measured from where the fingers landed
   rather than from the last frame, so a slow spread and a quick one arrive at
   the same place, and one comfortable pinch can cross the whole ladder.

   Pointer events with capture rather than touch events, and that is not a
   preference. A touch keeps the element it landed on as its target for the
   whole gesture, and the first rung we climb rebuilds the timeline and throws
   that element away — after which the moves are delivered to a node that is
   no longer in the document and never reach a listener again. The gesture
   died one rung in, every time. Capturing both pointers on the pane, which is
   never rebuilt, makes the rest of the gesture come to us instead. */
var PINCH_STEP = 1.3;     /* span ratio per rung */
var tlPaneEl=document.getElementById("tlPane");
var pts={}, pinch=null;

function ptCount(){var n=0;for(var k in pts) n++;return n;}
function ptSpan(){
  var a=null,b=null;
  for(var k in pts){ if(!a) a=pts[k]; else if(!b) b=pts[k]; }
  if(!a||!b) return 0;
  var dx=a.x-b.x, dy=a.y-b.y;
  return Math.sqrt(dx*dx+dy*dy);
}
tlPaneEl.addEventListener("pointerdown",function(e){
  if(e.pointerType!=="touch") return;
  if(railLive||zoomRail.contains(e.target)) return;
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  if(ptCount()!==2) return;
  /* a swipe already under way was meant as the first finger of this */
  if(swipeAbort) swipeAbort();
  pinch={d:ptSpan(),i:stopIndex(zoom)};
  for(var k in pts){
    try{tlPaneEl.setPointerCapture(+k);}catch(err){}
  }
},true);
tlPaneEl.addEventListener("pointermove",function(e){
  if(!pts[e.pointerId]) return;
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  if(!pinch||ptCount()!==2) return;
  if(e.cancelable) e.preventDefault();
  var d=ptSpan();
  if(d<=0||pinch.d<=0) return;
  var pi=pinch.i-Math.round(Math.log(d/pinch.d)/Math.log(PINCH_STEP));
  setZoom(zoomStops[Math.max(0,Math.min(zoomStops.length-1,pi))]);
},true);
function pinchDrop(e){
  delete pts[e.pointerId];
  if(ptCount()<2) pinch=null;
}
tlPaneEl.addEventListener("pointerup",pinchDrop,true);
tlPaneEl.addEventListener("pointercancel",pinchDrop,true);

/* a trackpad pinch reaches the page as a wheel event with ctrl held down */
var wheelAcc=0;
tlScroll.addEventListener("wheel",function(e){
  if(!e.ctrlKey&&!e.metaKey) return;
  e.preventDefault();
  wheelAcc+=e.deltaY;
  if(Math.abs(wheelAcc)<34) return;
  stepZoom(wheelAcc>0?1:-1);
  wheelAcc=0;
},{passive:false});

var SWIPE_GO=56;
var swipeAbort=null;   /* set while a card is mid-swipe, so a pinch can take over */

/* One step, either way, from wherever the entry already sits. The height you
   are reading from decides which entries you are being shown and therefore
   which ones you are in a position to judge — but it must not decide how far
   they move, or a life-level entry glanced at from month height would fall
   three levels on one flick. */
function stepTo(imp,dir){
  return Math.max(1,Math.min(LEVELS,imp+(dir<0?-1:1)));
}
/* true when the step will drop it under the floor, so the card should fly */
function willLeave(it,dir){
  return dir<0 && stepTo(it.imp,dir)<zoom;
}

function judge(it,dir){
  var id=it.id, before=it.imp, wasJ=it.j, dk=it.dk;
  var next=stepTo(before,dir);
  var gone=next<zoom;
  var had=ladderUp();
  it.imp=next; it.j=true;

  refresh(false);
  ladderNews(had);

  if(next===before){
    toast(tr("Already "+SIG_LABELS[before-1]+".","از قبل در حد "+GRAIN[before-1]+" است."));
  }else{
    toast(isFa()?("به حد "+GRAIN[next-1]+(dir<0?" پایین آمد.":" بالا رفت."))
               :((dir<0?"Demoted to ":"Promoted to ")+SIG_LABELS[next-1]+"."),
      function(){
        var e=findEntry(id); if(!e) return;
        e.imp=before; e.j=wasJ;
        refresh(false);
        selected=e.dk; selectedItem=id;
        renderSelection(); scrollCalendarTo(selected,false); focusEntry(id,false);
      });
  }

  if(gone){
    selected=nearestDay(dk)||dk;
    selectedItem=firstIdOn(selected);
  }else{
    selected=dk; selectedItem=id;
  }
  renderSelection();
  scrollCalendarTo(selected,false);
  focusEntry(selectedItem,false);
}

/* The gesture itself. The card is free to travel sideways while the pane keeps
   the vertical (touch-action:pan-y), the first nine pixels decide which of the
   two it was, and past SWIPE_GO the pull stiffens so the point of no return
   can be felt rather than guessed at. */
function armSwipe(node,it,ml,mr){
  var pid=null, x0=0, y0=0, dx=0, on=false, blocked=false;

  function paint(v){
    node.style.setProperty("--sx",v.toFixed(1)+"px");
    var p=Math.min(1,Math.abs(v)/SWIPE_GO).toFixed(2);
    ml.style.opacity = v<0 ? p : 0;
    mr.style.opacity = v>0 ? p : 0;
  }
  function settle(){
    node.classList.remove("swiping");
    node.classList.add("settling");
    paint(0);
    setTimeout(function(){node.classList.remove("settling");},280);
  }
  function drop(){
    pid=null; on=false;
    blocked=true;
    setTimeout(function(){blocked=false;},450);
  }

  node.addEventListener("pointerdown",function(e){
    if(e.button&&e.button!==0) return;
    if(!ov.hidden||railLive||selMode) return;
    pid=e.pointerId; x0=e.clientX; y0=e.clientY; dx=0; on=false;
  });
  node.addEventListener("pointermove",function(e){
    if(pid===null||e.pointerId!==pid) return;
    var mx=e.clientX-x0, my=e.clientY-y0;
    if(!on){
      if(Math.abs(my)>9&&Math.abs(my)>=Math.abs(mx)){pid=null;return;}  /* the pane wanted it */
      if(Math.abs(mx)<9) return;
      on=true;
      node.classList.add("swiping");
      swipeAbort=function(){pid=null;on=false;swipeAbort=null;settle();};
      try{var sel=window.getSelection();if(sel&&sel.removeAllRanges) sel.removeAllRanges();}catch(err){}
      try{node.setPointerCapture(pid);}catch(err){}
    }
    if(e.cancelable) e.preventDefault();
    var over=Math.abs(mx)-SWIPE_GO;
    dx = over<=0 ? mx : (mx<0?-1:1)*(SWIPE_GO+over*0.34);
    paint(dx);
  });
  node.addEventListener("pointerup",function(e){
    if(pid===null||e.pointerId!==pid) return;
    swipeAbort=null;
    if(!on){pid=null;return;}
    var far=Math.abs(dx)>=SWIPE_GO, dir=dx<0?-1:1;
    drop();
    if(!far){settle();return;}
    /* it only flies off if the step will actually take it under the floor;
       otherwise it settles back and simply steps down a size in place */
    if(willLeave(it,dir)){
      node.classList.remove("swiping");
      node.classList.add("leaving");
      node.style.setProperty("--sx","-150px");
      setTimeout(function(){judge(it,dir);},180);
    }else{
      settle(); judge(it,dir);
    }
  });
  node.addEventListener("pointercancel",function(){
    if(pid===null) return;
    pid=null; on=false; swipeAbort=null; settle();
  });
  /* a swipe must not also read as a tap, or as half of a double-tap */
  node.addEventListener("click",function(e){
    if(blocked){e.stopPropagation();e.preventDefault();}
  },true);
}

/* the same two verdicts from the keyboard, on whichever entry is in focus */
tlScroll.addEventListener("keydown",function(e){
  if(!ov.hidden) return;
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight") return;
  if(selectedItem==null) return;
  var it=findEntry(selectedItem);
  if(!it) return;
  e.preventDefault();
  judge(it,e.key==="ArrowLeft"?-1:1);
});
document.addEventListener("keydown",function(e){
  if(!ov.hidden) return;
  var t=e.target;
  if(t&&t.matches&&t.matches("input,textarea")) return;
  if(e.key==="-"||e.key==="_"){e.preventDefault();stepZoom(1);}
  else if(e.key==="+"||e.key==="="){e.preventDefault();stepZoom(-1);}
});

/* split */
/* Two layouts share one seam. On a phone it is a fold across the page and
   `split` is the contents' share of the height. On a desk (see "the desk" in
   the stylesheet) the book lies open, the seam is the spine, and the contents
   page has a width of its own in pixels: a percentage would make the calendar
   swell on a wide monitor while the journal, set to a column, gained nothing.
   The media query is the one authority on which layout is in force; this only
   asks it. */
var WIDE=window.matchMedia?window.matchMedia("(min-width: 900px) and (min-height: 540px)"):null;
function wide(){return !!(WIDE&&WIDE.matches);}
var PAGE_W="narratify.pageWidth";
var calW=+(lsGet(PAGE_W)||0);          /* the reader's chosen width, 0 for none */
var calShown=0;                         /* what is actually drawn, after clamping */
function calDefault(){
  return Math.round(Math.min(500,Math.max(380,window.innerWidth*0.3)));
}
/* The contents never narrower than a week of legible days, and never so wide
   that the journal is left less room than its own column. */
function calBounds(){
  var total=splitEl.getBoundingClientRect().width||window.innerWidth;
  var hi=Math.min(640,total-15-460);
  return [320,Math.max(320,hi)];
}
function setSplit(pct){
  split=Math.min(82,Math.max(16,pct));
  applySplit();
}
function applySplit(){
  if(wide()){
    var b=calBounds(), total=splitEl.getBoundingClientRect().width||window.innerWidth;
    calShown=Math.round(Math.min(b[1],Math.max(b[0],calW||calDefault())));
    calPane.style.height="";
    calPane.style.width=calShown+"px";
    document.documentElement.style.setProperty("--calw",calShown+"px");
    seam.setAttribute("aria-orientation","vertical");
    seam.setAttribute("aria-label",tr("Resize calendar and journal","تغییر اندازهٔ تقویم و روزنگار"));
    seam.setAttribute("aria-valuemin",Math.round(b[0]/total*100));
    seam.setAttribute("aria-valuemax",Math.round(b[1]/total*100));
    seam.setAttribute("aria-valuenow",Math.round(calShown/total*100));
  }else{
    calPane.style.width="";
    calPane.style.height=split+"%";
    document.documentElement.style.removeProperty("--calw");
    seam.setAttribute("aria-orientation","horizontal");
    seam.setAttribute("aria-label",tr("Resize calendar and timeline","تغییر اندازهٔ تقویم و خط زمان"));
    seam.setAttribute("aria-valuemin","16");
    seam.setAttribute("aria-valuemax","82");
    seam.setAttribute("aria-valuenow",Math.round(split));
  }
  requestAnimationFrame(function(){syncGrid();syncPaneH();renderWindow(true);});
}
function setCalWidth(px){
  var b=calBounds();
  calW=Math.round(Math.min(b[1],Math.max(b[0],px)));
  applySplit();
}
var dragging=false;
seam.addEventListener("pointerdown",function(e){
  if(e.button>0) return;
  e.preventDefault();
  dragging=true;
  seam.classList.add("dragging"); splitEl.classList.add("dragging");
});
window.addEventListener("pointermove",function(e){
  if(!dragging) return;
  var r=splitEl.getBoundingClientRect();
  lockC(400); lockT(400);
  if(wide()){
    /* the spine's middle follows the pointer; it settles on the default
       width when passed close by, so the page can always be put back */
    var px=(isFa()?r.right-e.clientX:e.clientX-r.left)-7, d=calDefault();
    if(Math.abs(px-d)<10) px=d;
    setCalWidth(px);
    return;
  }
  var pct=((e.clientY-r.top)/r.height)*100;
  for(var i=0;i<SNAPS.length;i++) if(Math.abs(pct-SNAPS[i])<3.5) pct=SNAPS[i];
  setSplit(pct);
});
function endDrag(){
  if(!dragging) return;
  dragging=false;
  seam.classList.remove("dragging"); splitEl.classList.remove("dragging");
  if(wide()){ keepCalWidth(); measureClips(); }
  focusEntry(selectedItem,"fast");
  scrollCalendarTo(selected,true);
}
/* A width equal to the default is no preference at all, so it is not kept:
   the page then goes on following the window as it is resized. */
function keepCalWidth(){
  if(!calW||calW===calDefault()){ calW=0; lsDel(PAGE_W); }
  else lsSet(PAGE_W,String(calW));
}
window.addEventListener("pointerup",endDrag);
window.addEventListener("pointercancel",endDrag);
seam.addEventListener("keydown",function(e){
  if(wide()){
    var step=e.shiftKey?80:24;
    var wider=isFa()?"ArrowLeft":"ArrowRight", narrower=isFa()?"ArrowRight":"ArrowLeft";
    if(e.key===narrower){e.preventDefault();setCalWidth(calShown-step);keepCalWidth();measureClips();}
    if(e.key===wider){e.preventDefault();setCalWidth(calShown+step);keepCalWidth();measureClips();}
    return;
  }
  if(e.key==="ArrowUp"){e.preventDefault();setSplit(split-4);}
  if(e.key==="ArrowDown"){e.preventDefault();setSplit(split+4);}
});
/* a double-click on the spine puts the contents page back to its own width */
seam.addEventListener("dblclick",function(){
  if(!wide()) return;
  calW=0; lsDel(PAGE_W); applySplit();
  requestAnimationFrame(function(){measureClips();focusEntry(selectedItem,"fast");});
});
/* Crossing between the two layouts — a window dragged narrower, a tablet
   turned — changes which way every measurement runs, so both panes are
   re-laid and the reader is put back on the day they were reading. */
function layoutChanged(){
  applySplit();
  requestAnimationFrame(function(){
    measureClips();
    focusEntry(selectedItem,false);
    lockC(600);
    scrollCalendarTo(selected,false);
    queueTodayFab();
  });
}
if(WIDE){
  if(WIDE.addEventListener) WIDE.addEventListener("change",layoutChanged);
  else if(WIDE.addListener) WIDE.addListener(layoutChanged);
}

var todayFab=document.getElementById("todayBtn");
todayFab.addEventListener("click",function(){
  pickDay(todayKey); scrollCalendarTo(todayKey);
  /* Nothing written today means no entry to land on, so the journal is walked
     to the nearest day instead of being left where it was. */
  if(selectedItem==null) scrollNearestDay(todayKey);
});
function scrollNearestDay(k){
  if(!dayKeys.length) return;
  var best=0;
  for(var i=0;i<dayKeys.length;i++){ if(dayKeys[i]<=k) best=i; else break; }
  var dk=dayKeys[best];
  if(!reduced()&&glideTo(function(){return dayPlace(dk);},queueTodayFab,true)!==false) return;
  var g=daysWrap.querySelector('[data-day="'+dk+'"]');
  if(!g){ if(!jumpToDay(dk)) return; g=daysWrap.querySelector('[data-day="'+dk+'"]'); }
  if(g) centerIn(tlScroll,g,true);
  queueTodayFab();
}
/* The journal is what to watch, not the calendar: the calendar holds a whole
   month at a time and will happily still be showing today while the reading
   is weeks away from it. */
function todayShowing(){
  var s=tlScroll.getBoundingClientRect();
  var g=daysWrap.querySelector('[data-day="'+todayKey+'"]');
  if(g){
    var r=g.getBoundingClientRect();
    return r.bottom>s.top+8 && r.top<s.bottom-8;
  }
  /* Nothing written today, so there is no day to look for. Today counts as in
     view if the stretch on screen runs either side of it. */
  var gs=daysWrap.querySelectorAll("[data-day]");
  var first=null, last=null;
  for(var i=0;i<gs.length;i++){
    var rr=gs[i].getBoundingClientRect();
    if(rr.bottom>s.top+8&&rr.top<s.bottom-8){
      var k=gs[i].getAttribute("data-day");
      if(first===null) first=k;
      last=k;
    }
  }
  if(first===null) return true;            /* a blank page has nowhere to go back to */
  return first<=todayKey&&todayKey<=last;  /* the keys sort as dates */
}
function paintTodayFab(){
  todayFab.classList.toggle("show",!todayShowing());
}
var tfQueued=false;
function queueTodayFab(){
  if(tfQueued) return;
  tfQueued=true;
  requestAnimationFrame(function(){tfQueued=false;paintTodayFab();});
}
calScroll.addEventListener("scroll",queueTodayFab,{passive:true});
tlScroll.addEventListener("scroll",queueTodayFab,{passive:true});
window.addEventListener("resize",queueTodayFab);
document.getElementById("addBtn").addEventListener("click",function(){
  openEditor(null,selected);
});

/* The badge column and the calendar's left indent are both --badge-w, so the
   badge's right edge lands exactly on the first column's left edge. That holds
   in CSS alone. The one thing JS is needed for: the weekday row sits outside
   the scrolling area, so it has to be padded past the calendar's scrollbar or
   the letters drift off their columns. */
function syncGrid(){
  /* clientLeft is the scrollbar's width when it sits on the left, as it does
     on a right-to-left page, and nothing otherwise */
  var sb=calScroll.offsetWidth-calScroll.clientWidth, sl=Math.min(sb,calScroll.clientLeft||0);
  weekrow.style.paddingLeft=(16+sl)+"px";
  weekrow.style.paddingRight=(16+sb-sl)+"px";
  var pane=document.getElementById("tlPane");
  if(pane) pane.classList.toggle("cramped",pane.getBoundingClientRect().height<190);
}
var resizeTimer=null;
window.addEventListener("resize",function(){
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(syncGrid,120);
  /* the spine's limits are set by the window, so a narrower one may push it */
  if(wide()) applySplit();
  syncPaneH();
  /* a narrower column wraps differently, so what was cut may now fit */
  measureClips();
});

/* ------------------------------ entry editor ------------------------------ */
/* One loose leaf, filled in and either pinned into the book or thrown away.

/* The row is rebuilt whenever the shelf changes: a standing pill to start a

var chipEls={};
function buildChips(){

/* Asking "how big was this" at the moment of writing is a question nobody can
   answer. Asking "how long is this going to matter for" is one everybody can
   have a guess at, and a guess is all this is: the month in the middle is
   already chosen, so writing an entry costs the same two taps it always did,
   and the swipes are still what settles it later. */
var segEls=[];
var fSigHint=document.getElementById("fSigHint");
/* Said in the ladder's terms, so the choice made here is the height it will
   be read from later. */

buildSegs();

function paintChips(){

}
/* What the leaf is quoting, read-only: the thing being written about sits
   right under the words written about it. */
function paintDraftQuote(){

  document.getElementById("fNarRow").hidden=!!(draft&&draft.q!=null);
  fQuoteBox.textContent="";
  if(!draft||draft.q==null){fQuote.hidden=true;return;}
  fQuote.hidden=false;

function armDelete(on){

/* The editor's warning line says one thing at a time. Deleting a note that
   has reflections: they stay, quoting a deleted note, unless they go too.
   Dating a note after its reflections: allowed — the note's old date may be

var edWarn=document.getElementById("edWarn"), edWarnMsg=document.getElementById("edWarnMsg"), edWarnAct=document.getElementById("edWarnAct");
function draftReflections(){

}

/* ---- the keyboard, measured ----
   A phone keyboard does not push the page up; it slides over it. The layout
   viewport stays its full height while the part you can actually see shrinks,
   so a panel pinned to the bottom is pinned to a bottom nobody can reach.
   visualViewport knows the difference. We publish the missing strip as --kb
   and every overlay subtracts it.

   Chrome 108+ with interactive-widget=resizes-content already shortens the
   layout viewport itself; there the arithmetic lands on zero and nothing
   moves twice. iOS and older Android get the correction from here. */
var kbPad=0;
function syncKb(){
  var vv=window.visualViewport;
  var px=vv ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
  if(px<60) px=0;                       /* ignore URL-bar jitter */
  if(px===kbPad) return;
  kbPad=px;
  document.documentElement.style.setProperty("--kb", px+"px");
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",syncKb);
  window.visualViewport.addEventListener("scroll",syncKb);
  syncKb();
}

/* Even above the keyboard the sheet can be short. Whatever field you land in
   should sit in the middle of what is left, not behind the header. */
function keepInView(el){
  if(!el) return;
  setTimeout(function(){
    try{ el.scrollIntoView({block:"center",behavior:"smooth"}); }
    catch(e){ el.scrollIntoView(false); }
  },220);
}
["focus"].forEach(function(ev){
  document.addEventListener(ev,function(e){
    var t=e.target;
    if(!t||!t.matches) return;
    if(t.matches("input[type=text],input:not([type]),textarea")) keepInView(t);
  },true);
});

/* quoteOf: the id of a note to quote. A quote is dated the day it is written
   — it is what was thought later, not a correction slipped into the past.
   A quote has no narratives at all — the leaf doesn't offer them — so its
   settings can't be mistaken for those of the note it quotes. */
function openEditor(id,dk,quoteOf,focusOn){
  if(!ov.hidden||selMode) return;
  if(typeof dropGoToast==="function") dropGoToast();
  clearTimeout(tapTimer);
  var src=(id!=null)?findEntry(id):null;
  var qsrc=(!src&&quoteOf!=null)?findEntry(quoteOf):null;
  if(qsrc&&qsrc.q!=null){
    toast(tr("A reflection can't be quoted. Quote the note it reflects on instead.","تأمل را نمی‌توان نقل کرد. خودِ یادداشتی را که بر آن تأمل شده نقل کنید."));
    return;
  }
  draft = src
    ? {id:src.id,dk:src.dk,t:src.t,nar:src.nar.slice(),imp:src.imp,j:!!src.j,title:src.title,note:src.note||"",rem:copyRem(src.rem)}
    : qsrc
    ? {id:null,dk:(todayKey<qsrc.dk?qsrc.dk:todayKey),t:null,nar:[],imp:MID,j:false,title:"",note:"",q:qsrc.id,rem:null}
    : {id:null,dk:dk||selected||todayKey,t:null,nar:[],imp:MID,j:false,title:"",note:"",rem:null};
  if(src&&src.q!=null) draft.q=src.q;
  remCustomOpen=false;

  edKind.textContent=src
    ? (src.q!=null?tr("Edit reflection","ویرایش تأمل"):tr("Edit note","ویرایش یادداشت"))
    : (qsrc?tr("New reflection","تأمل تازه"):tr("New note","یادداشت تازه"));
  fTitle.value=draft.title;
  setTimeout(function(){fitDir(fTitle);fitDir(fNote);},0);
  fNote.value=draft.note;
  edDel.style.display=src?"":"none";
  /* Only a note can be quoted, never a quote: a reflection answers something
     that happened, not another reflection. */
  edQuote.style.display=(src&&src.q==null)?"":"none";
  armDelete(false);
  paintDraft();
  paintEdWarn();

  ov.hidden=false;
  if(focusOn==="rem"){
    /* no keyboard: the reader asked for a reminder, not to retype the title */
    setTimeout(function(){
      var fr=document.getElementById("fRem");
      try{fr.scrollIntoView({block:"center",behavior:"smooth"});}catch(err){fr.scrollIntoView();}
      fr.classList.remove("flash"); void fr.offsetWidth; fr.classList.add("flash");
      var b=remKindEl.querySelector('[aria-checked="true"]')||remKindEl.querySelector("button");
      if(b) try{b.focus({preventScroll:true});}catch(err){}
    },60);
  }else setTimeout(function(){fTitle.focus();},40);
}
function closeEditor(){
  ov.hidden=true;
  popDate.hidden=true;
  popTime.hidden=true;
  popNar.hidden=true;
  popMan.hidden=true;
  draft=null;
}
function commit(){
  if(!draft) return;
  writeIn();
  var t=fTitle.value.trim();
  if(!t) return;
  var rec={id:draft.id,dk:draft.dk,t:draft.t,nar:draft.nar.slice(),
           imp:draft.imp,j:!!draft.j,title:t,note:fNote.value.trim(),rem:copyRem(draft.rem)};
  if(draft.q!=null){
    var target=draft.q?findEntry(draft.q):null;
    /* only a note can be quoted; a quote that still points at a quote is
       saved pointing at the note that chain began with */
    rec.q=(target&&target.q!=null)?rootOfQuote(target):draft.q;
    rec.nar=[];
    var floorNote=rec.q?findEntry(rec.q):null;
    if(floorNote&&rec.dk<floorNote.dk){
      toast(tr("A reflection can't be dated before the note it reflects on ("+fmtDate(floorNote.dk)+"). Pick a later date.",
               "تأمل نمی‌تواند پیش از یادداشتی که بر آن تأمل شده ("+fmtDate(floorNote.dk)+") تاریخ بخورد. تاریخ دیرتری انتخاب کنید."));
      return;
    }
  }
  var firstQuote=(rec.id==null&&rec.q!=null);
  /* Writing a reflection on a note is judging it from a distance, so the
     note counts as judged — it won't be offered back for judging. */
  if(firstQuote&&rec.q){var judged=findEntry(rec.q); if(judged) judged.j=true;}
  var intoChap=null;
  if(rec.id==null){
    rec.id=nextId++;entries.push(rec);
    intoChap=chapFilter?chapById(chapFilter):null;
    if(intoChap){intoChap.ids.push(rec.id); setChapSet(intoChap);}
  }
  else{
    for(var i=0;i<entries.length;i++) if(entries[i].id===rec.id){entries[i]=rec;break;}
  }
  var dk=rec.dk, id=rec.id, had=ladderUp();
  closeEditor();
  selected=dk; selectedItem=id;
  refresh(false);
  selected=dk; selectedItem=id;
  renderSelection();
  scrollCalendarTo(dk,false);
  focusEntry(id,false);
  ladderNews(had);
  pingRung(rec.imp);
  if(firstQuote) quoteHint("preview");
  if(intoChap) toast(tr("Written into "+quoteName(chapterName(intoChap))+", the chapter you're reading.",
                        "در "+quoteName(chapterName(intoChap))+"، فصلی که می‌خوانید، نوشته شد."),function(){
    intoChap.ids=intoChap.ids.filter(function(x){return x!==id;});
    chaptersChanged();
    toast(tr("Taken out of the chapter. The note is still in the notebook.","از فصل بیرون آمد. یادداشت هنوز در دفترچه است."));
  },tr("Take out","بیرون آوردن"));
}
function removeDraft(withReflections){
  if(!draft||draft.id==null) return;
  writeIn();
  var dk=draft.dk;
  var gone={}; gone[draft.id]=1;
  if(withReflections) draftReflections().forEach(function(id){gone[id]=1;});
  /* an entry that is gone is not left open, nor any of its reflection stripes */
  Object.keys(gone).forEach(function(id){
    delete openPosts[id]; delete openStrips[id]; delete allRefl[id];
    Object.keys(openRefl).forEach(function(k){
      var two=k.split(":"); if(two[0]===id||two[1]===id) delete openRefl[k];
    });
  });
  entries=entries.filter(function(e){return !gone[e.id];});
  dropFromChapters(gone);
  if(chapFilter) chapFilterFollow();
  if(selMode) prunePicks();
  closeEditor();
  selected=dk;
  reindex();
  selectedItem=firstIdOn(dk);
  refresh();
}

/* Off, once on a day of your choosing, or repeating from the note's own day.
   A repeat counts in whole days, weeks, months or years; a month or a year
   is counted in the calendar the reader picks for this one reminder, because
   a birthday kept on 25 Shahrivar is not kept on a fixed day of September. */

var remKindEl=document.getElementById("remKind");
var remOnBtn=document.getElementById("remOn");
var remOnV=document.getElementById("remOnV");

function remSegs(host,vals,onPick){
  return vals.map(function(v){
    var b=el("button","seg");
    b.type="button"; b.dataset.v=v; b.setAttribute("role","radio");
    b.addEventListener("click",function(){ if(draft){onPick(v);paintRem();} });
    host.appendChild(b);
    return b;
  });
}
function paintRemSegs(bs,labels,cur){
  bs.forEach(function(b,i){
    b.textContent=labels[i];
    var on=b.dataset.v===cur;
    b.classList.toggle("on",on);

function remWhen(day){
  var d=dayOffset(day);
  if(d===0) return tr("today","امروز");
  if(d===1) return tr("tomorrow","فردا");
  if(d<0) return fmtRelative(d);
  return tr("in "+d+" days",nf(d)+" روز دیگر");
}

var remKindBs=remSegs(remKindEl,["off","once","rep"],function(v){
  var r=draft.rem;
  if(v==="off"){draft.rem=null;return;}
  if(v==="once"){
    if(!r||r.k!=="once") draft.rem={k:"once",on:draft.dk>=todayKey?draft.dk:todayKey,read:[]};
    return;
  }
  if(r&&r.k==="rep") return;
  /* a note still to come is counted down to; one already past comes back */
  var ahead=draft.dk>todayKey;
  remCustomOpen=false;
  draft.rem={k:"rep",n:1,u:"y",cal:isFa()?"j":"g",pre:ahead,post:!ahead,end:null,read:[]};
});
var remEveryBs=remSegs(remEveryEl,["y","m","w","c"],function(v){
  var r=draft.rem; if(!r||r.k!=="rep") return;
  if(v==="c"){remCustomOpen=true;return;}
  remCustomOpen=false; r.n=1; r.u=v;
});
var remUnitBs=remSegs(remUnitEl,["d","w","m","y"],function(v){
  var r=draft.rem; if(r&&r.k==="rep") r.u=v;
});
var remCalBs=remSegs(remCalEl,["g","j"],function(v){
  var r=draft.rem; if(r&&r.k==="rep") r.cal=v;
});

function paintRem(){
  if(!draft) return;
  var r=draft.rem;
  document.getElementById("remLb").textContent=tr("Reminder","یادآور");
  document.getElementById("remOnL").textContent=tr("Remind on","یادآوری در");
  document.getElementById("remEveryL").textContent=tr("Every","هر");
  document.getElementById("remCalL").textContent=tr("Follow the calendar","بر اساس تقویم");
  document.getElementById("remDirL").textContent=tr("From the event's day","از روز این رویداد");
  document.getElementById("remEndL").textContent=tr("Until","تا");
  remEndX.textContent=tr("Remove end","برداشتن پایان");

  paintRemSegs(remKindBs,[tr("Off","خاموش"),tr("Once","یک‌بار"),tr("Repeat","تکرار")],r?r.k:"off");
  remOnBtn.hidden=!(r&&r.k==="once");
  remRep.hidden=!(r&&r.k==="rep");

  if(r&&r.k==="once"){
    remOnV.textContent=fmtDate(r.on)+(r.on===todayKey?tr(" · today"," · امروز"):"");
  }
  if(r&&r.k==="rep"){
    var custom=remCustomOpen||r.n!==1||r.u==="d";
    paintRemSegs(remEveryBs,[tr("Yearly","سالانه"),tr("Monthly","ماهانه"),tr("Weekly","هفتگی"),tr("Custom","دلخواه")],
                 custom?"c":r.u);
    remCustomEl.hidden=!custom;
    if(document.activeElement!==remNEl) remNEl.value=r.n;
    remNEl.setAttribute("aria-label",tr("How many","چند"));
    paintRemSegs(remUnitBs,r.n===1?[tr("day","روز"),tr("week","هفته"),tr("month","ماه"),tr("year","سال")]
                                   :[tr("days","روز"),tr("weeks","هفته"),tr("months","ماه"),tr("years","سال")],r.u);
    remCalRow.hidden=!(r.u==="m"||r.u==="y");
    paintRemSegs(remCalBs,[tr("Gregorian","میلادی"),tr("Solar Hijri","شمسی")],r.cal);
    remPreEl.textContent=tr("Before, counting down","پیش از آن، شمارش معکوس");
    remPostEl.textContent=tr("After, looking back","پس از آن، مرور گذشته");
    [[remPreEl,r.pre],[remPostEl,r.post]].forEach(function(p){
      p[0].classList.toggle("on",p[1]);
      p[0].setAttribute("aria-pressed",p[1]?"true":"false");
    });
    remEndV.textContent=r.end?fmtDate(r.end):tr("No end","بی‌پایان");
    remEndX.hidden=!r.end;
  }

  remHint.hidden=!r;
  if(!r){remHint.textContent="";return;}
  if(r.k==="rep"&&!r.pre&&!r.post){
    remHint.textContent=tr("Choose Before, After, or both.","«پیش از آن»، «پس از آن» یا هر دو را انتخاب کنید.");
    return;
  }
  var next=remNext(r,draft.dk);
  remHint.textContent=next
    ? tr("Next reminder: ","یادآور بعدی: ")+fmtDate(next)+tr(", ","، ")+remWhen(next)+tr(".","")
    : tr("No reminder ahead with these settings.","با این تنظیمات یادآوری در پیش نیست.");
}

/* ------------------------ narratives (two popovers) ----------------------- */
/* One to start a thread, one to keep the shelf in order. Edits in the shelf
   land on the model straight away but the book is not rebuilt until it
   closes: retyping a name would otherwise redraw every card per keystroke. */

var popNar=document.getElementById("popNar");
var popMan=document.getElementById("popMan");
var nnName=document.getElementById("nnName");
var nnSwatches=document.getElementById("nnSwatches");
var nnSave=document.getElementById("nnSave");

function swatchRow(host,current,onPick){
  host.textContent="";
  for(var i=1;i<=PALETTE;i++){
    (function(slot){
      var s=el("button","sw"+(slot===current?" on":""));
      s.style.background=slotColor(slot);
      s.setAttribute("aria-label",tr("Colour ","رنگ ")+nf(slot));

    })(i);

}
function paintNewSwatches(){

}
function openNewNarrative(){
  nnSlot=freeSlot();

}
nnName.addEventListener("input",function(){nnSave.disabled=!nnName.value.trim();});
nnName.addEventListener("keydown",function(e){

});
function createNarrative(){
  var label=nnName.value.trim();

  writeIn();

  closeNewNarrative();
  /* a thread started from an entry is one that entry belongs to */

/* Closing the newer layer hands focus back to the one underneath rather than
   dropping it on the page, so the list it was opened from is still where the
   keyboard is. */

function openManage(){
  manDirty=false;
  drawManage();
  popMan.hidden=false;
}
function closeManage(){
  popMan.hidden=true;
  if(manDirty){manDirty=false;refresh();}
  buildChips();
}
/* Order on the shelf is order everywhere a narrative is listed — the strip,
   the chips in the editor, the file. It is set by the grip at the head of
   each row: drag it, or focus it and use the arrow keys. */
function moveNarrative(from,to){
  if(to<0||to>=narratives.length||to===from) return false;
  var m=narratives.splice(from,1)[0];
  narratives.splice(to,0,m);
  manDirty=true; writeIn(); persist(); buildNarbar();
  return true;
}
function focusGrip(id){
  var g=manList.querySelector('.man-grip[data-id="'+
    (window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
  if(g) g.focus();
}
var manDrag=null;
function startGripDrag(e,item,grip,n){
  if(manDrag||(e.pointerType==="mouse"&&e.button!==0)) return;
  e.preventDefault();
  var items=[].slice.call(manList.querySelectorAll(".man-item"));
  var from=items.indexOf(item);
  if(from<0||items.length<2) return;
  var GAP=5;
  var tops=items.map(function(x){return x.offsetTop;});
  var hts=items.map(function(x){return x.offsetHeight;});
  var h=hts[from]+GAP;
  var last=items.length-1;
  /* the row can travel to either end of the list — a little past it, if it
     is taller than the row it has to get by (an open colour picker) */
  var mid0=tops[from]+hts[from]/2;
  var minDy=Math.min(tops[0]-tops[from],tops[0]+hts[0]/2-1-mid0);
  var maxDy=Math.max(tops[last]+hts[last]-(tops[from]+hts[from]),
                     tops[last]+hts[last]/2+1-mid0);
  var d=manDrag={id:n.id,from:from,to:from,startY:e.clientY,y:e.clientY,
    scroll0:manList.scrollTop,raf:0,pid:e.pointerId};
  try{grip.setPointerCapture(e.pointerId);}catch(_){}
  item.classList.add("dragging");
  manList.classList.add("sorting");

  function layout(){
    var dy=d.y-d.startY+(manList.scrollTop-d.scroll0);
    dy=Math.max(minDy,Math.min(maxDy,dy));
    item.style.transform="translateY("+dy+"px)";
    var centre=tops[from]+hts[from]/2+dy, to=0;
    items.forEach(function(x,i){
      if(i!==from&&centre>tops[i]+hts[i]/2) to++;
    });
    d.to=to;
    items.forEach(function(x,i){
      if(i===from) return;
      var shift=(from<to&&i>from&&i<=to)?-h:(from>to&&i>=to&&i<from)?h:0;
      x.style.transform=shift?"translateY("+shift+"px)":"";
    });
  }
  /* near either edge of a long list, the list comes to meet the finger */
  function tick(){
    var r=manList.getBoundingClientRect(), EDGE=40, v=0;
    if(d.y<r.top+EDGE) v=-Math.ceil((r.top+EDGE-d.y)/5);
    else if(d.y>r.bottom-EDGE) v=Math.ceil((d.y-(r.bottom-EDGE))/5);
    if(v) manList.scrollTop+=v;
    layout();
    d.raf=requestAnimationFrame(tick);
  }
  function move(ev){ if(ev.pointerId===d.pid) d.y=ev.clientY; }
  function end(ev){
    if(ev&&ev.pointerId!==d.pid) return;
    grip.removeEventListener("pointermove",move);
    grip.removeEventListener("pointerup",end);
    grip.removeEventListener("pointercancel",end);
    cancelAnimationFrame(d.raf);
    layout();
    var to=ev&&ev.type==="pointercancel"?from:d.to, off=0, i;
    /* settle into the gap it opened before the list is redrawn */
    if(to>from) for(i=from+1;i<=to;i++) off+=hts[i]+GAP;
    else for(i=to;i<from;i++) off-=hts[i]+GAP;
    if(to===from) items.forEach(function(x){if(x!==item)x.style.transform="";});
    manList.classList.add("settling");
    item.style.transform=off?"translateY("+off+"px)":"";
    setTimeout(function(){
      manList.classList.remove("sorting","settling");
      items.forEach(function(x){x.style.transform="";});
      item.classList.remove("dragging");
      manDrag=null;
      if(moveNarrative(from,to)) drawManage();
      focusGrip(n.id);
    },reduced()?0:150);
  }
  grip.addEventListener("pointermove",move);
  grip.addEventListener("pointerup",end);
  grip.addEventListener("pointercancel",end);
  d.raf=requestAnimationFrame(tick);
}

function drawManage(){
  var keepTop=manList.scrollTop;
  manList.textContent="";
  if(!narratives.length){
    manList.appendChild(el("p","man-empty",tr("No narratives yet. Start one and it will appear here.","هنوز روایتی ندارید. یکی بسازید تا اینجا دیده شود.")));
    return;
  }
  var total=narratives.length;
  narratives.forEach(function(n,idx){
    var item=el("div","man-item");
    var row=el("div","man-row");
    item.appendChild(row);

    var grip=el("button","man-grip");
    grip.type="button";
    grip.dataset.id=n.id;
    grip.title=tr("Drag to reorder","برای جابه‌جایی بکشید");
    grip.setAttribute("aria-label",isFa()
      ?("جابه‌جایی "+n.label+"، "+nf(idx+1)+" از "+nf(total)+". با کلیدهای جهت‌نمای بالا و پایین جابه‌جایش کنید.")
      :("Reorder "+n.label+", "+(idx+1)+" of "+total+". Use the up and down arrow keys to move it."));
    grip.innerHTML='<svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true">'+
      '<circle cx="2.5" cy="3" r="1.4"/><circle cx="7.5" cy="3" r="1.4"/>'+
      '<circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/>'+
      '<circle cx="2.5" cy="13" r="1.4"/><circle cx="7.5" cy="13" r="1.4"/></svg>';
    grip.addEventListener("pointerdown",function(e){startGripDrag(e,item,grip,n);});
    grip.addEventListener("keydown",function(e){
      var at=narratives.indexOf(n), to=null;
      if(e.key==="ArrowUp") to=at-1;
      else if(e.key==="ArrowDown") to=at+1;
      else if(e.key==="Home") to=0;
      else if(e.key==="End") to=narratives.length-1;
      if(to===null) return;
      e.preventDefault();
      if(moveNarrative(at,to)){drawManage();focusGrip(n.id);}
    });
    row.appendChild(grip);

    var dot=el("button","man-dot");
    dot.style.background=slotColor(n.c);
    dot.setAttribute("aria-label",tr("Colour of ","رنگ ")+n.label);
    row.appendChild(dot);

    var name=el("input","man-name");
    name.value=n.label; name.maxLength=40; fitDir(name);
    name.setAttribute("aria-label",tr("Name of ","نام ")+n.label);
    name.addEventListener("input",function(){
      n.label=name.value.slice(0,40);
      manDirty=true; writeIn(); persist(); buildNarbar();
    });
    row.appendChild(name);

    var k=narCount(n.id);
    row.appendChild(el("span","man-count",notesN(k)));

    var x=el("button","man-x","\u2715");
    x.setAttribute("aria-label",tr("Remove ","حذف ")+n.label);
    var armed=false;
    x.addEventListener("click",function(){
      if(!armed){
        armed=true; x.classList.add("armed"); x.textContent=tr("Remove","حذف");
        setTimeout(function(){
          if(armed){armed=false;x.classList.remove("armed");x.textContent="\u2715";}
        },4000);
        return;
      }
      /* a thread taken off the shelf comes off every entry that carried it */
      narratives=narratives.filter(function(m){return m.id!==n.id;});
      entries.forEach(function(e){
        var at=e.nar.indexOf(n.id);
        if(at>=0) e.nar.splice(at,1);
      });
      if(draft){
        var d=draft.nar.indexOf(n.id);
        if(d>=0) draft.nar.splice(d,1);
      }
      pruneFilter();
      manDirty=true; writeIn(); persist(); buildNarbar(); drawManage();
    });
    row.appendChild(x);

    manList.appendChild(item);

    var picker=el("div","man-sw");
    picker.hidden=true;
    var open=false;
    function paintPicker(){
      swatchRow(picker,n.c,function(slot){
        n.c=slot;
        dot.style.background=slotColor(slot);
        paintPicker();
        manDirty=true; writeIn(); persist(); buildNarbar();
      });
    }
    paintPicker();
    dot.addEventListener("click",function(){
      open=!open; picker.hidden=!open;
    });
    item.appendChild(picker);
  });
  manList.scrollTop=keepTop;
}
document.getElementById("manNew").addEventListener("click",openNewNarrative);
document.getElementById("manClose").addEventListener("click",closeManage);
popMan.addEventListener("click",function(e){if(e.target===popMan) closeManage();});

/* --------------------------- date picker (popover) ------------------------ */
/* The same month grid as the table of contents, shrunk onto a card. */

var popDate=document.getElementById("popDate");
var dpMonthEl=document.getElementById("dpMonth");
var dpYearEl=document.getElementById("dpYear");
var dpWin=document.getElementById("dpWin");
var dpGrid=document.getElementById("dpGrid");
/* the month on the card, as a running month number in the calendar in force */
var dpN=0;
/* The card picks for whichever date on the leaf opened it: the note's own
   day, or one of its reminder's. */
var dpCur=null, dpOnPick=null;
/* whether it is the note's own day being picked: only that day is held back
   by the note a reflection looks back on */
var dpIsDay=true;
function buildDpWeek(){
  var wk=document.getElementById("dpWeek");
  wk.textContent="";
  WEEKDAYS.forEach(function(w){wk.appendChild(el("div",null,w.charAt(0)));});
}
buildDpWeek();

var DP_ROWS=6;
function drawDatePicker(){
  var cm=calMonth(dpN);
  var dpAlt=document.getElementById("dpAlt");
  dpAlt.hidden=!DUAL;
  if(DUAL){
    var ends=monthEnds(cm);
    dpAlt.textContent=altRange(ends[0],ends[1]);
    dpAlt.lang=isFa()?"en":"fa"; dpAlt.dir=isFa()?"ltr":"rtl";
  }
  dpMonthEl.textContent=cm.name;
  dpYearEl.textContent=yearLabel(pad4(cm.y));
  dpGrid.textContent="";
  var lead=weekIndex(cm.first);
  var daysIn=cm.daysIn;
  /* always the same number of boxes: the days either side fill out the grid
     so a 28-day February is exactly as tall as a 31-day March */
  for(var i=0;i<DP_ROWS*7;i++){
    var n=i-lead;
    dpGrid.appendChild(dpCell(addDays(cm.first,n),n<0||n>=daysIn));
  }
}
/* A reflection can't be dated before the note it reflects on: days before it
   are there to see but can't be picked. */
function draftFloor(){
  if(!draft||!draft.q||!dpIsDay) return null;
  var t=findEntry(draft.q);
  return t?t.dk:null;
}
/* the earliest reflection on the note being edited, if any */
function draftReflFloor(){
  if(!draft||draft.id==null||draft.q!=null) return null;
  var min=null;
  (quotedBy[draft.id]||[]).forEach(function(id){var r=findEntry(id); if(r&&(min===null||r.dk<min)) min=r.dk;});
  return min;
}
function dpCell(date,out){
  var k=key(date), floor=draftFloor(), barred=!!(floor&&k<floor);
  var b=el("button","dpc"+(out?" out":"")+(k===todayKey?" tdy":"")+(barred?" barred":"")+
           (draft&&k===dpCur?" on":"")+((allByDay[k]&&allByDay[k].length)?" has":""),nf(dayNum(date)));
  b.setAttribute("aria-label",fullDate(k)+(barred?tr(", before the note this reflects on","، پیش از یادداشتی که بر آن تأمل شده"):""));
  if(barred) b.setAttribute("aria-disabled","true");
  b.addEventListener("click",function(){
    if(!draft||dpMoved||!dpOnPick) return;
    if(barred){
      toast(tr("A reflection can't be dated before the note it reflects on ("+fmtDate(floor)+").",
               "تأمل نمی‌تواند پیش از یادداشتی که بر آن تأمل شده ("+fmtDate(floor)+") تاریخ بخورد."));
      return;
    }
    popDate.hidden=true;
    dpOnPick(k);
    paintDraft();
    paintEdWarn();
  });
  return b;
}
function openDatePicker(cur,onPick){
  if(!draft) return;
  dpIsDay=(typeof cur!=="string");
  if(dpIsDay){cur=draft.dk;onPick=function(k){draft.dk=k;};}
  dpCur=cur; dpOnPick=onPick;
  dpN=monthNoK(cur);
  dpMoved=false;
  dpGrid.classList.remove("slide");
  dpGrid.style.transform="";
  drawDatePicker();

}
document.getElementById("fDate").addEventListener("click",openDatePicker);
/* One way in for every month change. The new sheet arrives from the side the
   old one left towards: forward in time comes up from below. */
function shiftMonth(n,slide){
  dpN+=n;
  drawDatePicker();
  if(!slide||reduced()){dpGrid.classList.remove("slide");dpGrid.style.transform="";return;}
  var span=dpWin.clientHeight||260;
  dpGrid.classList.remove("slide");
  dpGrid.style.transform="translateY("+(n>0?span:-span)+"px)";
  requestAnimationFrame(function(){
    dpGrid.classList.add("slide");
    dpGrid.style.transform="translateY(0)";
  });
}
function shiftYear(n){
  dpN+=12*n;
  drawDatePicker();
}
/* Dragging the grid turns the page, on the one axis the rest of the app
   scrolls on: pull up and later weeks come from below. The sheet follows the
   finger so the gesture is visible before it commits, and a drag that stops
   short springs back rather than jumping. A sideways drag moves nothing, but
   it still counts as a drag, so it can't fall through and pick a day. */
var dpMoved=false, dpDrag=null;
dpWin.addEventListener("pointerdown",function(e){
  if(e.button) return;
  dpDrag={x:e.clientX,y:e.clientY,axis:null,id:e.pointerId};
  dpMoved=false;
  dpGrid.classList.remove("slide");
});
dpWin.addEventListener("pointermove",function(e){
  if(!dpDrag) return;
  var dx=e.clientX-dpDrag.x, dy=e.clientY-dpDrag.y;
  if(!dpDrag.axis){
    if(Math.abs(dx)<6&&Math.abs(dy)<6) return;
    dpDrag.axis=Math.abs(dx)>Math.abs(dy)?"x":"y";
    /* capture only once this is a drag: capturing on pointerdown would
       retarget the click that ends a plain tap away from the day it landed on */
    try{dpWin.setPointerCapture(dpDrag.id);}catch(err){}
  }
  dpMoved=true;
  if(dpDrag.axis==="y") dpGrid.style.transform="translateY("+(dy*0.88)+"px)";
});
function dpRelease(e){
  if(!dpDrag) return;
  var axis=dpDrag.axis;
  var dy=(e&&e.clientY!=null)?e.clientY-dpDrag.y:0;
  dpDrag=null;
  if(axis!=="y"){dpGrid.style.transform="";return;}
  /* about one row of travel commits, so the pull is short enough to repeat */
  var far=Math.min(48,(dpWin.clientHeight||260)*0.16);
  if(Math.abs(dy)>far){shiftMonth(dy<0?1:-1,true);}
  else{
    dpGrid.classList.add("slide");
    dpGrid.style.transform="translateY(0)";
  }
  /* let the click that ends the drag fall on the floor, then re-arm */
  setTimeout(function(){dpMoved=false;},0);
}
dpWin.addEventListener("pointerup",dpRelease);
dpWin.addEventListener("pointercancel",dpRelease);

/* The two spindles. Twenty-two pixels of travel is one notch, so a short
   flick moves one month and a long drag runs through a year. */
function spindle(node,step){
  var from=null, acc=0;
  node.addEventListener("pointerdown",function(e){
    if(e.button) return;
    e.preventDefault();
    from=e.clientY; acc=0;
    node.classList.add("spinning");
    try{node.setPointerCapture(e.pointerId);}catch(err){}
  });
  node.addEventListener("pointermove",function(e){
    if(from==null) return;
    var dy=e.clientY-from, guard=0;
    while(dy-acc>=22&&guard++<400){acc+=22;step(-1);}
    while(dy-acc<=-22&&guard++<400){acc-=22;step(1);}
  });
  function off(){from=null;node.classList.remove("spinning");}
  node.addEventListener("pointerup",off);
  node.addEventListener("pointercancel",off);
  node.addEventListener("wheel",function(e){
    e.preventDefault();
    step(e.deltaY>0?1:-1);
  },{passive:false});
  node.addEventListener("keydown",function(e){
    if(e.key==="ArrowUp"){e.preventDefault();step(-1);}
    if(e.key==="ArrowDown"){e.preventDefault();step(1);}
  });
}
spindle(dpMonthEl,function(n){shiftMonth(n,false);});
spindle(dpYearEl,shiftYear);

/* ------------------------------ clock (popover) --------------------------- */
/* A dial rather than two spinners: hours first, then minutes, the way a
   watch face is read. Dragging the hand works as well as tapping a number. */

var popTime=document.getElementById("popTime");
var dialWrap=document.getElementById("dialwrap");
var tpH=document.getElementById("tpH"), tpM=document.getElementById("tpM");
var tpAM=document.getElementById("tpAM"), tpPM=document.getElementById("tpPM");
var tpAll=document.getElementById("tpAll");
var clock={h:9,m:0,all:true,mode:"h"};

function drawClock(){
  var h12=clock.h%12; if(h12===0) h12=12;
  tpH.textContent=nf(pad(h12));
  tpM.textContent=nf(pad(clock.m));
  tpH.classList.toggle("on",clock.mode==="h");
  tpM.classList.toggle("on",clock.mode==="m");
  tpAM.classList.toggle("on",clock.h<12);
  tpPM.classList.toggle("on",clock.h>=12);
  tpAll.checked=clock.all;
  dialWrap.classList.toggle("off",clock.all);

  var cx=120, cy=120, r=94;
  var ang=(clock.mode==="h") ? (clock.h%12)*30 : clock.m*6;
  var kx=cx+r*Math.sin(ang*Math.PI/180), ky=cy-r*Math.cos(ang*Math.PI/180);

  var s='<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
  s+='<circle class="dial-face" cx="120" cy="120" r="113"/>';
  s+='<line class="dial-hand" x1="120" y1="120" x2="'+kx.toFixed(1)+'" y2="'+ky.toFixed(1)+'"/>';
  s+='<circle class="dial-knob" cx="'+kx.toFixed(1)+'" cy="'+ky.toFixed(1)+'" r="17"/>';
  s+='<circle class="dial-hub" cx="120" cy="120" r="3"/>';
  for(var i=0;i<12;i++){
    var a=i*30;
    var x=cx+r*Math.sin(a*Math.PI/180), y=cy-r*Math.cos(a*Math.PI/180);
    var label, on;
    if(clock.mode==="h"){label=nf(i===0?12:i); on=(clock.h%12)===i;}
    else{label=nf(pad(i*5)); on=clock.m===i*5;}
    s+='<text class="dial-n'+(on?" on":"")+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'">'+label+'</text>';
  }
  s+='</svg>';
  dialWrap.innerHTML=s;
}
function setFromPointer(e){
  var svg=dialWrap.firstChild;
  if(!svg) return;
  var rect=svg.getBoundingClientRect();
  var x=e.clientX-rect.left-rect.width/2;
  var y=e.clientY-rect.top-rect.height/2;
  if(Math.abs(x)<1&&Math.abs(y)<1) return;
  var ang=Math.atan2(x,-y)*180/Math.PI;
  if(ang<0) ang+=360;
  if(clock.mode==="h"){
    var idx=Math.round(ang/30)%12;
    clock.h=(clock.h>=12?12:0)+idx;
  }else{
    clock.m=Math.round(ang/6)%60;
  }
  drawClock();
}
var dialDrag=false;
dialWrap.addEventListener("pointerdown",function(e){
  e.preventDefault();
  if(clock.all){clock.all=false;}
  dialDrag=true;
  try{dialWrap.setPointerCapture(e.pointerId);}catch(err){}
  setFromPointer(e);
});
dialWrap.addEventListener("pointermove",function(e){
  if(dialDrag) setFromPointer(e);
});
function endDial(){
  if(!dialDrag) return;
  dialDrag=false;
  if(clock.mode==="h"){clock.mode="m";drawClock();}
}
dialWrap.addEventListener("pointerup",endDial);
dialWrap.addEventListener("pointercancel",endDial);

tpH.addEventListener("click",function(){clock.mode="h";clock.all=false;drawClock();});
tpM.addEventListener("click",function(){clock.mode="m";clock.all=false;drawClock();});
tpAM.addEventListener("click",function(){clock.h=clock.h%12;clock.all=false;drawClock();});
tpPM.addEventListener("click",function(){clock.h=(clock.h%12)+12;clock.all=false;drawClock();});
tpAll.addEventListener("change",function(){clock.all=tpAll.checked;drawClock();});

function openClock(){
  if(!draft) return;
  if(draft.t){var p=draft.t.split(":");clock.h=+p[0];clock.m=+p[1];clock.all=false;}
  else{clock.h=9;clock.m=0;clock.all=true;}
  clock.mode="h";
  drawClock();
  popTime.hidden=false;
}
function closeClock(commitIt){
  if(commitIt&&draft) draft.t=clock.all?null:(pad(clock.h)+":"+pad(clock.m));
  popTime.hidden=true;
  if(draft) paintDraft();
}
document.getElementById("fTime").addEventListener("click",openClock);
document.getElementById("tpDone").addEventListener("click",function(){closeClock(true);});
