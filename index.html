opulsion is proved satisfactory. The motor party goes on man-hauling as arranged. With full loads the ponies did splendidly; my own Snippets had over 700 lbs. Even Oates is pleased!"}, {"id": 56, "dk": "1911-11-15", "t": null, "nar": ["n1", "n3"], "imp": 2, "j": false, "title": "One Ton Camp again", "note": "Found our One Ton Camp without difficulty, 130 geographical miles from Cape Evans. The animals get a day's rest here. Oates thinks the ponies will get through, but that they have lost condition quicker than he expected, which for him is a hopeful view. I am much more hopeful."}, {"id": 57, "dk": "1911-11-22", "t": null, "nar": ["n3"], "imp": 1, "j": false, "title": "The Barrier Wonder and the Thunderbolt", "note": "Everything much the same. The ponies thinner but not much weaker, and the crocks still going along. Jehu is now called 'The Barrier Wonder' and Chinaman 'The Thunderbolt.' Nobby keeps his pre-eminence and carries the heaviest load. The weather is glorious."}, {"id": 58, "dk": "1911-11-24", "t": null, "nar": ["n3", "n4"], "imp": 2, "j": false, "title": "Poor old Jehu", "note": "This morning after the march poor old Jehu was led back on the track and shot. After our doubts about his even reaching Hut Point, it is wonderful to think he got eight marches beyond our last year's limit. Towards the end he was pulling very little, and it is merciful to have ended his life. Day and Hooper leave us to-night."}, {"id": 59, "dk": "1911-11-29", "t": null, "nar": ["n5", "n1"], "imp": 2, "j": false, "title": "Land again", "note": "The land showed up late yesterday: Mount Markham, a magnificent triple peak, appearing wonderfully close. Our pony goal is less than 70 miles away. The ponies are tired, but I believe all have five days' work left in them."}, {"id": 60, "dk": "1911-12-01", "t": null, "nar": ["n3"], "imp": 2, "j": false, "title": "Christopher must go", "note": "The ponies are tiring rapidly. To-night, against some opinion, I decided Christopher must go. Less regret goes with him than with the others, remembering all the trouble he gave. Nobby was tried in snowshoes and came along splendidly for four miles. There is no doubt that snowshoes are the thing for ponies."}, {"id": 61, "dk": "1911-12-05", "t": "12:00", "nar": ["n5", "n3"], "imp": 2, "j": false, "title": "A raging, howling blizzard", "note": "We awoke to a raging, howling blizzard, the fine powdery snow fully developed. A minute in the open and one is covered head to foot. The ponies are coated with ice and standing deep in snow. One cannot see the next tent, let alone the land. What on earth does such weather mean at this time of year?"}, {"id": 62, "dk": "1911-12-06", "t": "12:00", "nar": ["n5", "n3"], "imp": 3, "j": false, "title": "The Slough of Despond", "note": "Miserable, utterly miserable. We have camped in the Slough of Despond. The temperature has risen to 33\u00b0 and everything in the tent is soaking; people come in looking as though they had been in heavy rain. The ponies look utterly desolate. And we are only 12 miles from the Glacier. What immense patience is needed for such occasions!"}, {"id": 63, "dk": "1911-12-07", "t": null, "nar": ["n5", "n1"], "imp": 3, "j": false, "title": "The situation is now serious", "note": "The storm continues. One small feed remains for the ponies, so we must march to-morrow or sacrifice them. Worse, we have started the summer rations calculated from the Glacier depot. Resignation to misfortune is the only attitude, but not an easy one. The margin for bad weather was ample by all experience. It is very evil to lie here in a wet sleeping-bag and think of the pity of it."}, {"id": 64, "dk": "1911-12-08", "t": "23:00", "nar": ["n5", "n3"], "imp": 2, "j": false, "title": "The sky breaking at last", "note": "At noon the wind dropped and we dug out the sledges. The snow is terribly deep; Nobby plunged to his belly. At 11 P.M. the wind has gone to the north, the sky is really breaking, the land appearing out of the haze. There is good cheer in the camp to-night at the prospect of action. But nothing can recall four lost days."}, {"id": 65, "dk": "1911-12-09", "t": "20:00", "nar": ["n3", "n2"], "imp": 4, "j": true, "title": "The ponies are shot", "note": "A most painful day on an intolerably soft surface. We pressed the poor half-rationed animals on; P.O. Evans saved the situation by putting the last pair of snowshoes on Snatcher. By 8 P.M. we were within a mile of Shackleton's Gateway, and the ponies were quite done, one and all. We camped, and the ponies have been shot. Poor beasts! They have done wonderfully well. Three huge pillars of granite form the right buttress of the Gateway. In spite of everything, jokes are flying freely around to-night."}, {"id": 66, "dk": "1911-12-11", "t": null, "nar": ["n4", "n2"], "imp": 2, "j": false, "title": "Man-hauling on the glacier", "note": "We built our depot and the dogs turn back for home; they should get back quite easily. Could we pull our full loads? My own party got away first and, to my joy, made fairly good headway on ski. The great thing is to keep the sledge moving. Evans' party didn't get in till 10. Ski are the thing, and here are my tiresome fellow-countrymen too prejudiced to have prepared themselves for them."}, {"id": 67, "dk": "1911-12-13", "t": null, "nar": ["n2", "n5"], "imp": 1, "j": false, "title": "A most damnably dismal day", "note": "A most damnably dismal day. A new crust in patches, not enough to support the ski but without any hold, so the pullers slipped back on the hard patches and the sledges plunged into the soft places and stopped dead."}, {"id": 68, "dk": "1911-12-20", "t": "19:00", "nar": ["n2", "n1"], "imp": 3, "j": false, "title": "Choosing who must return", "note": "A fine march of 19 1/2 miles, rising 800 feet up the glacier. To-night I told off the people to return to-morrow night: Atkinson, Wright, Cherry-Garrard and Keohane. All are disappointed, poor Wright rather bitterly, I fear. I dread this necessity of choosing. Nothing could be more heartrending."}, {"id": 69, "dk": "1911-12-22", "t": null, "nar": ["n2", "n1"], "imp": 3, "j": false, "title": "Farewell to the first returning party", "note": "Made our depot at the top of the glacier this morning, then said an affecting farewell to the returning party, who have taken it very well, dear good fellows as they are. Then we started with our heavy loads, I in some trepidation, quickly dissipated as we went up a slope at a smart pace. The weather beautifully fine all day. Wilson has just been sketching."}, {"id": 70, "dk": "1911-12-25", "t": "21:00", "nar": ["n2"], "imp": 3, "j": false, "title": "Christmas on the plateau", "note": "Lashly fell suddenly into a crevasse, 50 feet deep, and was pulled out on the Alpine rope. Lashly is 44 to-day and as hard as nails; his fall didn't disturb his equanimity. We covered 15 miles. Supper was a 'tightener': pemmican with slices of horse meat flavoured with onion and curry, an arrowroot and cocoa hoosh, plum-pudding, cocoa with raisins, and a dessert of caramels and ginger. I am so replete I can scarcely write. Wilson and I couldn't finish our plum-pudding."}, {"id": 71, "dk": "1911-12-31", "t": "22:00", "nar": ["n2", "n1"], "imp": 2, "j": false, "title": "New Year's Eve at the Three Degree Depot", "note": "Height about 9126 feet, Lat. 86\u00b0 56'. Evans (P.O.) and Crean are rebuilding the sledges down to 10 feet, a remarkable piece of work under these conditions. P.O. Evans is the most invaluable asset to our party. The five of us are turned into our bags in the double tent, as warm as toast."}, {"id": 72, "dk": "1912-01-03", "t": null, "nar": ["n2", "n1"], "imp": 4, "j": true, "title": "Five to go on", "note": "Within 150 miles of our goal. Last night I decided to reorganise, and this morning told off Teddy Evans, Lashly and Crean to return. They are disappointed, but take it well. Bowers comes into our tent, and we go on as a five-man unit: Wilson, Bowers, Oates, P.O. Evans and myself. We have over a month's allowance of food. A last note from a hopeful position. I think it's going to be all right."}, {"id": 73, "dk": "1912-01-04", "t": "13:15", "nar": ["n2", "n1"], "imp": 3, "j": false, "title": "The last farewell", "note": "As soon as I was sure we could pull the sledge, we stopped and said farewell. Teddy Evans is terribly disappointed but behaved like a man. Poor old Crean wept, and even Lashly was affected. To-night it is flat calm and the sun so warm that we can stand about outside in comfort, remembering the horrors of this place as they were painted for us."}, {"id": 74, "dk": "1912-01-09", "t": null, "nar": ["n1", "n2"], "imp": 4, "j": false, "title": "RECORD", "note": "Lat. 88\u00b0 25', beyond the record of Shackleton's walk. All is new ahead. The barometer has risen since the blizzard, and it looks as though we are on a level plateau. The marching grows terribly monotonous, but one cannot grumble as long as the distance is kept up. Bowers' watch has suddenly dropped 26 minutes, which makes one more chary of leaving stores on this great plain."}, {"id": 75, "dk": "1912-01-15", "t": null, "nar": ["n1"], "imp": 2, "j": false, "title": "The last depot", "note": "Here we leave our last depot, only four days' food and a sundry or two. The surface was terrible, and we were all pretty well done at camping, but the sledge came surprisingly lightly after lunch and tea, and we made over 12 miles in the day."}, {"id": 76, "dk": "1912-01-16", "t": null, "nar": ["n9", "n1", "n2"], "imp": 5, "j": true, "title": "The black flag", "note": "The worst has happened, or nearly the worst. We started the afternoon in high spirits, feeling that to-morrow would see us at our destination. Bowers' sharp eyes detected a cairn, then a black speck ahead: a black flag tied to a sledge bearer, the remains of a camp, sledge tracks and ski tracks, and the clear trace of dogs' paws, many dogs. The Norwegians have forestalled us and are first at the Pole. It is a terrible disappointment, and I am very sorry for my loyal companions. All the day dreams must go."}, {"id": 77, "dk": "1912-01-17", "t": null, "nar": ["n1", "n2", "n5"], "imp": 5, "j": true, "title": "The Pole", "note": "The Pole. Yes, but under very different circumstances from those expected. A horrible day: a head wind, -22\u00b0, companions labouring on with cold feet and hands, none of us having slept after the shock of our discovery. Little Bowers is getting sights in terribly difficult conditions. Great God! this is an awful place, and terrible enough for us to have laboured to it without the reward of priority. Well, it is something to have got here. A fat Polar hoosh, a stick of chocolate and a cigarette brought by Wilson. Now for the run home and a desperate struggle. I wonder if we can do it."}, {"id": 78, "dk": "1912-01-18", "t": null, "nar": ["n9", "n1", "n10"], "imp": 4, "j": false, "title": "Amundsen's tent", "note": "We found the Norwegian tent about 1 1/2 miles from the Pole, with a record of five Norwegians dated 16 Dec. 1911, and a note from Amundsen asking me to forward a letter to King Haakon. Left a note to say I had visited the tent with my companions. We built a cairn, put up our poor slighted Union Jack, and photographed ourselves, mighty cold work. Our predecessors have made thoroughly sure of their mark. Now we have turned our back on the goal of our ambition and must face 800 miles of solid dragging. Good-bye to most of the daydreams!"}, {"id": 79, "dk": "1912-01-19", "t": null, "nar": ["n9"], "imp": 1, "j": false, "title": "The last of the Norwegians", "note": "We followed our outward tracks to the ominous black flag that first told us of our predecessors' success, took it up, and are using the staff for our sail. So that is the last of the Norwegians for the present. I'm afraid the return journey is going to be dreadfully tiring and monotonous."}, {"id": 80, "dk": "1912-01-24", "t": "13:00", "nar": ["n5", "n2"], "imp": 3, "j": false, "title": "Things beginning to look serious", "note": "A full blizzard at lunch, and we have had to get into our sleeping-bags only 7 miles from our depot. This is the second full gale since we left the Pole. I don't like the look of it. Is the weather breaking up? If so, God help us, with the tremendous summit journey and scant food. Wilson and Bowers are my standby. I don't like the easy way in which Oates and Evans get frostbitten."}, {"id": 81, "dk": "1912-01-25", "t": null, "nar": ["n2", "n1"], "imp": 2, "j": false, "title": "The Half Degree Depot", "note": "Thank God we found our Half Degree Depot. It was a long and terribly cold job digging out the sledge, but at 2.30 we saw the red depot flag. We are not without ailments: Oates has a very cold foot, Evans' fingers and nose are in a bad state, and to-night Wilson is suffering tortures from his eyes."}, {"id": 82, "dk": "1912-01-30", "t": "21:00", "nar": ["n2"], "imp": 2, "j": false, "title": "Nineteen miles", "note": "Thank the Lord, another fine march, 19 miles. The track is clear, the wind helpful, the gradient down. The reverse of the medal is serious: Wilson has strained a tendon in his leg, and Evans has dislodged two finger-nails. His hands are really bad."}, {"id": 83, "dk": "1912-02-02", "t": null, "nar": ["n2"], "imp": 1, "j": false, "title": "An awful purler", "note": "Trying to keep the track and my feet on a slippery slope, I came an awful purler on my shoulder. It is horribly sore to-night. Another sick person in our tent, three out of five injured, and the most troublesome surfaces to come."}, {"id": 84, "dk": "1912-02-07", "t": "19:30", "nar": ["n1", "n2", "n9"], "imp": 2, "j": false, "title": "Mount Darwin Depot", "note": "First panic: the biscuit box is a full day's allowance short. Bowers is dreadfully disturbed about it. But we reached the depot at 7.30 and found a note from Evans; the second returning party passed safely on January 14. We have come through our seven weeks' ice camp journey. I think another week might have had a very bad effect on Evans, who is going steadily downhill."}, {"id": 85, "dk": "1912-02-08", "t": null, "nar": ["n8", "n2"], "imp": 3, "j": false, "title": "Rock after fourteen weeks", "note": "Out of the wind under the cliffs of Mount Buckley we camped and spent the rest of the day geologising. Sandstone cliffs with veritable coal seams, and Wilson, with his sharp eyes, found plant impressions: a piece of coal with beautifully traced leaves in layers. A lot could be written on the delight of setting foot on rock after 14 weeks of snow and ice. It is like going ashore after a sea voyage."}, {"id": 86, "dk": "1912-02-11", "t": null, "nar": ["n5", "n2"], "imp": 3, "j": false, "title": "The worst ice mess I have ever been in", "note": "The worst day of the trip, and greatly owing to our own fault. In horrible light we found ourselves in pressure, and then came the fatal decision to steer east. For three hours we plunged on on ski, first too far right, then too far left, into the worst ice mess I have ever been in. At times it seemed almost impossible to find a way out."}, {"id": 87, "dk": "1912-02-12", "t": "21:00", "nar": ["n5", "n2"], "imp": 3, "j": false, "title": "In a very critical situation", "note": "By a fatal chance we kept too far to the left, struck uphill, and arrived tired and despondent in a horrid maze of crevasses and fissures. Divided councils. At 9 P.M. we camped in the worst place of all, after a very short supper, with one meal left in the food bag and the depot doubtful in locality. We are cheerful with an effort. Pray God we have fine weather to-morrow."}, {"id": 88, "dk": "1912-02-13", "t": null, "nar": ["n2", "n5"], "imp": 2, "j": false, "title": "The depot flag", "note": "Fog all round; tea and one biscuit so as to save our last meal. We hit an old moraine track and went on, checking bearings. Evans raised our hopes with a shout of depot ahead, but it was only a shadow on the ice. Then Wilson saw the actual depot flag. The relief to all is inexpressible. We mustn't get into a hole like this again."}, {"id": 89, "dk": "1912-02-16", "t": null, "nar": ["n2"], "imp": 3, "j": false, "title": "Evans has nearly broken down", "note": "A rather trying position. Evans has nearly broken down in brain, we think. He is absolutely changed from his normal self-reliant self, and twice to-day he stopped the march on some trivial excuse. We are on short rations. We cannot be more than 10 or 12 miles from the depot, but the weather is all against us. It is anxious work with the sick man."}, {"id": 90, "dk": "1912-02-17", "t": null, "nar": ["n2"], "imp": 5, "j": true, "title": "Edgar Evans", "note": "A very terrible day. Evans declared, as he always did, that he was quite well, but he kept dropping back. At lunch he was still far astern, and all four of us went back on ski. I reached him first: on his knees, clothing disarranged, hands uncovered and frostbitten, a wild look in his eyes. He said slowly that he thought he must have fainted. We brought the sledge back for him, and in the tent he became comatose. He died quietly at 12.30 A.M. Wilson thinks he must have injured his brain in a fall. It is a terrible thing to lose a companion in this way."}, {"id": 91, "dk": "1912-02-18", "t": null, "nar": ["n3", "n2"], "imp": 2, "j": false, "title": "Shambles Camp", "note": "We gave ourselves 5 hours' sleep at the lower glacier depot after the horrible night, and came on to Shambles Camp, where the ponies were shot. Here, with plenty of horse meat, we have had a fine supper. New life seems to come with greater food almost at once, but I am anxious about the Barrier surfaces."}, {"id": 92, "dk": "1912-02-24", "t": null, "nar": ["n2", "n1"], "imp": 2, "j": false, "title": "A shortage of oil", "note": "Reached the depot. The store is in order except for a shortage of oil; we shall have to be very saving with fuel. Notes from Meares, from Atkinson, and a short, not very cheerful one from Evans, which says the surface was bad. It is an immense relief to have picked up this depot, and for the time anxieties are thrust aside."}, {"id": 93, "dk": "1912-02-27", "t": null, "nar": ["n2", "n5"], "imp": 2, "j": false, "title": "We talk of little but food", "note": "Desperately cold last night, -37\u00b0 minimum. We have done 7 miles this morning. We talk of little but food, except after meals, and are always discussing the possibility of meeting the dogs, where and when. It is a critical position. Pray God we have no further set-backs."}, {"id": 94, "dk": "1912-03-02", "t": "13:00", "nar": ["n2", "n5"], "imp": 4, "j": true, "title": "Misfortunes rarely come singly", "note": "Three distinct blows since the Middle Barrier depot. First, a shortage of oil; with the most rigid economy it can scarcely carry us 71 miles to the next depot on this surface. Second, Titus Oates disclosed his feet, the toes very bad indeed. Third, the wind brought dark overcast weather and it fell below -40\u00b0 in the night. It took an hour and a half to get our foot gear on. We have done only 5 1/2 miles with full sail. We are in a very queer street."}, {"id": 95, "dk": "1912-03-04", "t": "13:00", "nar": ["n2", "n5"], "imp": 3, "j": false, "title": "Things looking very black", "note": "In 4 1/2 hours, pulling with all our strength, we covered 3 1/2 miles over sandy frostrime. About 42 miles from the next depot, with a week's food but only three or four days' fuel. None of us despondent yet, or at least we preserve every semblance of good cheer, but one's heart sinks as the sledge stops dead. I don't know what I should do if Wilson and Bowers weren't so determinedly cheerful over things."}, {"id": 96, "dk": "1912-03-06", "t": "13:00", "nar": ["n2"], "imp": 3, "j": false, "title": "Poor Oates is unable to pull", "note": "For the first time on the journey I overslept by more than an hour. Pulling for our lives, we could scarcely make a mile an hour. Poor Oates is unable to pull and sits on the sledge while we search for the track. He is wonderfully plucky; his feet must be giving him great pain. He makes no complaint, but he grows more silent in the tent. We are making a spirit lamp to replace the primus when the oil runs out."}, {"id": 97, "dk": "1912-03-07", "t": null, "nar": ["n2", "n4"], "imp": 3, "j": false, "title": "What we will do together at home", "note": "A little worse, I fear. One of Oates' feet very bad this morning; he is wonderfully brave. We still talk of what we will do together at home. We are 16 miles from our depot. We hope against hope that the dogs have been to Mount Hooper; then we might pull through."}, {"id": 98, "dk": "1912-03-10", "t": null, "nar": ["n2", "n4"], "imp": 3, "j": false, "title": "Cold comfort at Mount Hooper", "note": "Things steadily downhill. Oates' foot worse. He has rare pluck and must know he can never get through. He asked Wilson this morning if he had a chance, and of course Bill had to say he didn't know. We reached the Mount Hooper depot yesterday. Cold comfort: shortage on our allowance all round. The dogs which would have been our salvation have evidently failed. I don't know that anyone is to blame."}, {"id": 99, "dk": "1912-03-11", "t": null, "nar": ["n2"], "imp": 3, "j": false, "title": "Titus Oates is very near the end", "note": "Titus Oates is very near the end, one feels. What we or he will do, God only knows. He is a brave fine fellow and understands the situation, but he practically asked for advice. Nothing could be said but to urge him to march as long as he could. We have 7 days' food and should be about 55 miles from One Ton Camp to-night. Six miles is about the limit of our endurance now. The season rapidly advances."}, {"id": 100, "dk": "1912-03-14", "t": null, "nar": ["n5", "n2"], "imp": 3, "j": false, "title": "-43\u00b0 at midday", "note": "No doubt about the going downhill, but everything going wrong for us. Poor Wilson horribly cold and could not get off his ski for some time; Bowers and I practically made camp. The temperature at midday -43\u00b0 and the wind strong. No idea there could be temperatures like this at this time of year. We must go on. Must fight it out to the last biscuit."}, {"id": 101, "dk": "1912-03-16", "t": null, "nar": ["n2", "n10"], "imp": 5, "j": true, "title": "\"I am just going outside\"", "note": "Lost track of dates. Tragedy all along the line. The day before yesterday poor Titus Oates said he couldn't go on and proposed we leave him in his sleeping-bag. That we could not do, and he struggled on through the afternoon. He slept through the night hoping not to wake, but he woke in the morning, in a blizzard. He said, 'I am just going outside and may be some time.' He went out into the blizzard and we have not seen him since. His last thoughts were of his mother. We knew poor Oates was walking to his death. It was the act of a brave man. He was a brave soul."}, {"id": 102, "dk": "1912-03-18", "t": "13:00", "nar": ["n2", "n10"], "imp": 3, "j": false, "title": "My right foot has gone", "note": "To-day, lunch, we are 21 miles from the depot. Ill fortune presses, but better may come. My right foot has gone, nearly all the toes; two days ago I was proud possessor of the best feet. Bowers takes first place in condition. The others are still confident of getting through, or pretend to be. We have the last half fill of oil in the primus and a very small quantity of spirit. This alone stands between us and thirst."}, {"id": 103, "dk": "1912-03-19", "t": "13:00", "nar": ["n2", "n5"], "imp": 3, "j": false, "title": "Fifteen and a half miles", "note": "We camped with difficulty last night and were dreadfully cold till after a supper of cold pemmican and biscuit and half a pannikin of cocoa. Then, contrary to expectation, we got warm and all slept well. We are 15 1/2 miles from the depot and ought to get there in three days. Two days' food but barely a day's fuel. Amputation is the least I can hope for now."}, {"id": 104, "dk": "1912-03-21", "t": null, "nar": ["n2", "n5"], "imp": 4, "j": false, "title": "Eleven miles from the depot", "note": "Got within 11 miles of the depot on Monday night, then had to lay up all yesterday in a severe blizzard. To-day, a forlorn hope: Wilson and Bowers going to the depot for fuel."}, {"id": 105, "dk": "1912-03-22", "t": null, "nar": ["n2", "n5", "n10"], "imp": 4, "j": false, "title": "The last chance", "note": "Blizzard as bad as ever. Wilson and Bowers unable to start. To-morrow the last chance. No fuel and only one or two days of food left. Have decided it shall be natural: we shall march for the depot with or without our effects and die in our tracks."}, {"id": 106, "dk": "1912-03-29", "t": null, "nar": ["n2", "n10", "n1"], "imp": 5, "j": true, "title": "For God's sake look after our people", "note": "Since the 21st we have had a continuous gale from W.S.W. and S.W. We had fuel to make two cups of tea apiece and bare food for two days on the 20th. Every day we have been ready to start for our depot 11 miles away, but outside the door of the tent it remains a scene of whirling drift. I do not think we can hope for any better things now. We shall stick it out to the end, but we are getting weaker, of course, and the end cannot be far. It seems a pity, but I do not think I can write more. R. SCOTT. For God's sake look after our people."}]}},
{"fa": "\u062f\u0641\u062a\u0631\u0686\u0647\u0654 \u0646\u06cc\u06a9 \u06a9\u0627\u0631\u0627\u0648\u06cc", "say": "Nick Carraway's notebook, from Fitzgerald's The Great Gatsby \u2014 one summer on Long Island.", "sayFa": "\u062f\u0641\u062a\u0631\u0686\u0647\u0654 \u0646\u06cc\u06a9 \u06a9\u0627\u0631\u0627\u0648\u06cc\u060c \u0627\u0632 \u00ab\u06af\u062a\u0633\u0628\u06cc \u0628\u0632\u0631\u06af\u00bb \u0627\u0633\u06a9\u0627\u062a \u0641\u06cc\u062a\u0632\u062c\u0631\u0627\u0644\u062f.", "book": {"v": 4, "zoom": 3, "flat": 0, "narf": [], "title": "Nick Carraway's Notebook", "narratives": [{"id": "n1", "label": "Gatsby", "c": 1}, {"id": "n2", "label": "Daisy", "c": 2}, {"id": "n3", "label": "Tom", "c": 3}, {"id": "n4", "label": "Jordan", "c": 4}, {"id": "n5", "label": "The Parties", "c": 5}, {"id": "n6", "label": "New York", "c": 6}, {"id": "n7", "label": "The Wilsons", "c": 7}, {"id": "n8", "label": "The Past", "c": 8}, {"id": "n9", "label": "The Middle West", "c": 9}, {"id": "n10", "label": "Myself", "c": 10}], "entries": [{"id": 1, "dk": "1922-05-24", "t": null, "nar": ["n9", "n10"], "imp": 3, "j": false, "title": "Came East for good", "note": "Father has agreed to finance me for one year, and I am to learn the bond business, since everybody I know is in the bond business. The war left me restless. The Middle West, which used to feel like the warm centre of the world, began to look like the ragged edge of the universe. So here I am, permanently, I think."}, {"id": 2, "dk": "1922-05-27", "t": "19:40", "nar": ["n10"], "imp": 2, "j": false, "title": "A cardboard bungalow at eighty a month", "note": "A young man at the office found us a house in a commuting town on Long Island, and then the firm ordered him to Washington at the last minute. So I am out here alone in a weather-beaten bungalow in West Egg, with an old Dodge, a dog, and a Finnish woman who makes my bed, cooks breakfast and mutters Finnish wisdom over the electric stove."}, {"id": 3, "dk": "1922-05-29", "t": "08:15", "nar": ["n10"], "imp": 1, "j": false, "title": "Someone asked me the way", "note": "Lonely for a day or two, until this morning a man even newer than I am stopped me on the road and asked, quite helplessly, how to get to West Egg village. I told him. Walking on, I felt like a guide, a pathfinder, an original settler. He had given me the freedom of the neighbourhood without knowing it."}, {"id": 4, "dk": "1922-05-31", "t": null, "nar": ["n10"], "imp": 1, "j": false, "title": "The dog ran away", "note": "The dog has gone. He stayed a few days and then decided West Egg was not for him. I am trying not to take it personally."}, {"id": 5, "dk": "1922-06-02", "t": "21:00", "nar": ["n10", "n6"], "imp": 1, "j": false, "title": "A dozen volumes on banking", "note": "Bought a dozen books on banking, credit and investment securities. They stand on my shelf in red and gold like new money from the mint, promising the secrets only Midas and Morgan and Maecenas knew. I was rather literary at Yale, and I mean to read other books besides. The idea is to become that most limited of specialists, the well-rounded man."}, {"id": 6, "dk": "1922-06-04", "t": null, "nar": ["n1", "n5"], "imp": 1, "j": false, "title": "The house next door", "note": "My house sits at the very tip of the egg, fifty yards from the Sound, squeezed between two huge places. The one on my right is an imitation of some H\u00f4tel de Ville in Normandy: a tower spanking new under a thin beard of ivy, a marble swimming pool, and more than forty acres of lawn and garden. It belongs to a Mr. Gatsby. My own house is an eyesore, but a small one, and I have a view of his lawn for eighty a month."}, {"id": 7, "dk": "1922-06-07", "t": "18:30", "nar": ["n2", "n3", "n4"], "imp": 3, "j": false, "title": "Dinner with the Tom Buchanans", "note": "Drove across the bay to East Egg. Daisy is my second cousin once removed, and I knew Tom at New Haven, where he was one of the most powerful ends who ever played. He has a hard mouth now and a body capable of enormous leverage. Daisy laughed and said she was p-paralysed with happiness to see me. There was a girl lying perfectly still on the couch, balancing something invisible on her chin. Daisy says in two weeks it will be the longest day of the year."}, {"id": 8, "dk": "1922-06-07", "t": "21:15", "nar": ["n3", "n2", "n4"], "imp": 3, "j": false, "title": "The telephone kept ringing", "note": "Tom lectured us about a book by a man named Goddard that says civilization is going to pieces. Then the telephone rang, and he left the table, and Daisy followed. The girl, Miss Baker, told me in a whisper that Tom has some woman in New York. Later Daisy told me that when her daughter was born she hoped the child would be a fool, because that is the best thing a girl can be in this world, a beautiful little fool. It sounded like a performance, and I think she knew it."}, {"id": 9, "dk": "1922-06-07", "t": "23:40", "nar": ["n1", "n8"], "imp": 4, "j": true, "title": "A man reaching toward a green light", "note": "When I got home a cat's silhouette was moving across the moonlight, and I saw that I was not alone. A figure stood on the lawn next door, hands in his pockets, looking at the stars. Mr. Gatsby, I suppose. I nearly called to him. Then he stretched out his arms toward the dark water in a curious way, and I could have sworn he was trembling. I looked out to sea and saw nothing but a single green light, minute and far away, perhaps the end of a dock. When I looked back he had vanished."}, {"id": 10, "dk": "1922-06-08", "t": null, "nar": ["n4"], "imp": 1, "j": false, "title": "Jordan Baker, the golfer", "note": "Miss Baker plays in a tournament at Westchester today. That is why her face seemed familiar: her pleasing, contemptuous expression has looked out at me from photographs of the sporting life at Asheville and Hot Springs and Palm Beach. I have also heard some story about her, a critical, unpleasant story, but I cannot remember what it was."}, {"id": 11, "dk": "1922-06-12", "t": "08:05", "nar": ["n6", "n10"], "imp": 1, "j": false, "title": "The Probity Trust", "note": "Early sun throws my shadow westward as I hurry down the white chasms of lower New York to the office. I know the other clerks and young bond-salesmen by their first names now, and we lunch in dark crowded restaurants on little pig sausages and mashed potatoes and coffee. Most of the time I simply work."}, {"id": 12, "dk": "1922-06-15", "t": "22:10", "nar": ["n6", "n10"], "imp": 1, "j": false, "title": "Dinner at the Yale Club", "note": "Dinner at the Yale Club is, for some reason, the gloomiest event of my day. Afterward I go up to the library and study investments and securities for a conscientious hour. Then, if the night is mellow, I walk down Madison Avenue past the old Murray Hill Hotel to the Pennsylvania Station."}, {"id": 13, "dk": "1922-06-18", "t": null, "nar": ["n9", "n10"], "imp": 2, "j": false, "title": "Love, Nick", "note": "Wrote home again. I write once a week and sign the letters \"Love, Nick\", and there is a vague understanding back there that has to be broken off tactfully before I am free. What I actually remember about that girl is the faint moustache of perspiration on her upper lip when she played tennis. That is not much to build a life on."}, {"id": 14, "dk": "1922-06-21", "t": "20:30", "nar": ["n6", "n10"], "imp": 1, "j": false, "title": "New York at night", "note": "I have begun to like New York: the racy, adventurous feel of it at night, the constant flicker of men and women and machines. I like to walk up Fifth Avenue picking out romantic women from the crowd and imagining that in a few minutes I will enter their lives, and no one will ever know or disapprove. At the enchanted metropolitan twilight I sometimes feel a haunting loneliness, and I feel it in others too."}, {"id": 15, "dk": "1922-06-24", "t": "23:30", "nar": ["n5", "n1"], "imp": 1, "j": false, "title": "Music across the hedge", "note": "Music from my neighbour's house all night. Men and girls come and go like moths among the whisperings and the champagne and the stars. On weekends his Rolls-Royce becomes an omnibus, bearing parties to and from the city from nine in the morning until long past midnight, and his station wagon scampers like a brisk yellow bug to meet all the trains."}, {"id": 16, "dk": "1922-06-26", "t": "07:30", "nar": ["n5"], "imp": 1, "j": false, "title": "Monday morning next door", "note": "Eight servants, including an extra gardener, are over there with mops and hammers and garden-shears, repairing the ravages of Saturday night. Five crates of oranges and lemons go in every Friday. Every Monday the same oranges and lemons leave by the back door in a pyramid of pulpless halves."}, {"id": 17, "dk": "1922-06-29", "t": null, "nar": ["n6", "n10"], "imp": 1, "j": false, "title": "The girl from accounting", "note": "A short affair with a girl who lives in Jersey City and works in the accounting department. Her brother has begun throwing mean looks in my direction."}, {"id": 18, "dk": "1922-07-02", "t": "14:00", "nar": ["n3", "n7"], "imp": 2, "j": false, "title": "Tom made me get off the train", "note": "Tom took me to meet his girl. Halfway to the city the road runs beside a valley of ashes, a grey farm where ashes grow like wheat, and above it the enormous blue eyes of Doctor T. J. Eckleburg stare out of a pair of yellow spectacles on a faded billboard. Tom hauled me off the train at a garage owned by a spiritless, anaemic man named George Wilson. His wife came down the stairs, faintly stout and smouldering with vitality, walked straight past her husband, and Tom told her quietly to get on the next train."}, {"id": 19, "dk": "1922-07-02", "t": "17:00", "nar": ["n3", "n7", "n6"], "imp": 2, "j": false, "title": "An apartment on 158th Street", "note": "Mrs. Wilson bought a puppy from a man in the street. He called it a police dog; Tom said it was no such thing, and the man admitted it was more of an Airedale. The apartment is crammed with tapestried furniture far too large for it. Her sister Catherine came up, and the McKees from the flat below. Catherine told me it is really Tom's wife who keeps them apart, because Daisy is a Catholic and does not believe in divorce. Daisy is not a Catholic. I was a little shocked at the elaborateness of the lie."}, {"id": 20, "dk": "1922-07-02", "t": "22:30", "nar": ["n3", "n7", "n2", "n10"], "imp": 3, "j": false, "title": "Tom broke her nose", "note": "I have been drunk just twice in my life, and the second time was this afternoon, so it all has a hazy cast. Toward midnight Tom and Mrs. Wilson stood face to face arguing about whether she had any right to say Daisy's name. She shouted it, again and again. With one short, deft movement Tom broke her nose with his open hand. Then bloody towels on the bathroom floor, women scolding, and a long broken wail of pain."}, {"id": 21, "dk": "1922-07-03", "t": "04:00", "nar": ["n6", "n10"], "imp": 1, "j": false, "title": "Penn Station at four in the morning", "note": "Somehow I ended up lying half asleep in the cold lower level of the Pennsylvania Station, staring at the morning Tribune and waiting for the four o'clock train. I would like it noted that I did not want to go up to that apartment in the first place."}, {"id": 22, "dk": "1922-07-08", "t": "08:10", "nar": ["n1", "n5"], "imp": 2, "j": false, "title": "A formal note in robin's-egg blue", "note": "A chauffeur in a uniform of robin's-egg blue crossed my lawn this morning with a surprisingly formal note: the honour would be entirely Gatsby's if I would attend his little party tonight. He has seen me several times and meant to call long before, but a peculiar combination of circumstances prevented it. Signed Jay Gatsby, in a majestic hand."}, {"id": 23, "dk": "1922-07-08", "t": "22:30", "nar": ["n5", "n4"], "imp": 2, "j": false, "title": "My first party at Gatsby's", "note": "As far as I can tell I was one of the few guests actually invited. People simply come. I wandered around in white flannels among people I didn't know until I found Jordan Baker on the steps. In the library a stout man with owl-eyed spectacles was astounded that the books are real. He showed me a volume of the Stoddard Lectures: bona-fide printed matter, pages uncut. \"This fella's a regular Belasco,\" he said. \"Knew when to stop.\""}, {"id": 24, "dk": "1922-07-09", "t": "00:30", "nar": ["n1"], "imp": 4, "j": true, "title": "\"I'm Gatsby\"", "note": "A man at our table said my face was familiar; had I been in the First Division? We talked about wet grey little villages in France. I mentioned that I hadn't even seen our host, and he looked at me a moment and said, \"I'm Gatsby.\" He calls everyone old sport. He has one of those rare smiles with a quality of eternal reassurance, that understands you as far as you want to be understood. Then it vanishes, and he is an elegant young roughneck a year or two over thirty whose formality of speech just misses being absurd. He himself drinks nothing."}, {"id": 25, "dk": "1922-07-09", "t": "02:00", "nar": ["n4", "n1", "n5"], "imp": 2, "j": false, "title": "Jordan summoned inside", "note": "A butler came to say that Mr. Gatsby would like to speak to Miss Baker alone. She was gone an hour. When she came back she said she had just heard the most amazing thing, but she swore not to tell it, and she was plainly delighted to have a secret."}, {"id": 26, "dk": "1922-07-09", "t": "02:40", "nar": ["n5", "n1"], "imp": 1, "j": false, "title": "A coup\u00e9 in the ditch", "note": "Leaving, we found a new coup\u00e9 in the ditch by the drive, missing a wheel, with the owl-eyed man insisting he knew nothing about mechanics. The driver finally climbed out and explained he hadn't been driving; there was another man in the car. When I glanced back, Gatsby was standing alone on his steps with his hand raised in a formal gesture of farewell."}, {"id": 27, "dk": "1922-07-15", "t": null, "nar": ["n10"], "imp": 1, "j": false, "title": "Let it blow away", "note": "The girl from Jersey City went on her vacation this week, and I have let the whole thing blow quietly away."}, {"id": 28, "dk": "1922-07-16", "t": "19:00", "nar": ["n4"], "imp": 2, "j": false, "title": "I remembered the story about Jordan", "note": "It came back to me. At her first big golf tournament there was a row that nearly reached the newspapers: a suggestion that she had moved her ball from a bad lie in the semi-final. The caddy retracted, the only other witness admitted he might have been mistaken. She is incurably dishonest, I think. She left a borrowed car out in the rain with the top down and then lied about it. And yet I don't blame her very much."}, {"id": 29, "dk": "1922-07-19", "t": "17:20", "nar": ["n4", "n10"], "imp": 2, "j": false, "title": "It takes two to make an accident", "note": "Jordan drove so close to some workmen that her fender flicked a button off one man's coat. I told her she was a rotten driver. She said other people are careful; they'll keep out of her way. It takes two to make an accident. Suppose she met someone as careless as herself? \"I hope I never will,\" she said. \"I hate careless people. That's why I like you.\""}, {"id": 30, "dk": "1922-07-21", "t": null, "nar": ["n4", "n9", "n10"], "imp": 2, "j": false, "title": "One of the few honest people", "note": "For a moment I thought I loved her. But I am slow-thinking and full of interior rules, and first I have to get myself out of that tangle back home. Everyone suspects himself of at least one of the cardinal virtues, and this is mine: I am one of the few honest people I have ever known."}, {"id": 31, "dk": "1922-07-23", "t": "10:30", "nar": ["n5", "n1"], "imp": 1, "j": false, "title": "Names on an old timetable", "note": "While church bells rang along the shore, the world and its mistress returned to Gatsby's lawn. The young ladies say he is a bootlegger, or that he killed a man who found out he was nephew to Von Hindenburg. I've started writing down the guests' names in the empty spaces of an old timetable headed \"This schedule in effect July 5th, 1922.\" One man named Klipspringer is there so often he is known as the boarder. I doubt he has any other home."}, {"id": 32, "dk": "1922-07-26", "t": "09:00", "nar": ["n1"], "imp": 3, "j": false, "title": "Gatsby drove me to town", "note": "Gatsby's gorgeous car came up my drive at nine: a rich cream colour, bright with nickel, upholstered like a green leather conservatory. On the way he told me God's truth: son of wealthy people in the Middle West, all dead now; educated at Oxford, a family tradition. When I asked what part of the Middle West, he said San Francisco. Then jewels, big game, the war. I nearly laughed. Then he showed me a medal from little Montenegro and a photograph taken in Trinity Quad at Oxford, and it was all true."}, {"id": 33, "dk": "1922-07-26", "t": "10:40", "nar": ["n1", "n6"], "imp": 1, "j": false, "title": "A white card for the policeman", "note": "We scattered light through half of Astoria at full speed until a motorcycle policeman pulled up beside us. Gatsby waved a white card at him, and the man tipped his cap and apologised. Gatsby says he once did the commissioner a favour. Then over the Queensboro Bridge, with the city rising across the river in white heaps and sugar lumps. The city seen from that bridge is always the city seen for the first time."}, {"id": 34, "dk": "1922-07-26", "t": "13:00", "nar": ["n1", "n6", "n3"], "imp": 2, "j": false, "title": "Cuff buttons made of molars", "note": "Lunch in a cellar on Forty-second Street with Gatsby's friend Meyer Wolfshiem, a small flat-nosed man whose cuff buttons, he told me proudly, are the finest specimens of human molars. Afterward Gatsby said, coolly, that Wolfshiem is the man who fixed the World's Series back in 1919. It had never occurred to me that one man could play with the faith of fifty million people. Then Tom Buchanan walked in. I introduced them, and when I turned around Gatsby had disappeared."}, {"id": 35, "dk": "1922-07-26", "t": "16:30", "nar": ["n2", "n1", "n4", "n8"], "imp": 4, "j": true, "title": "Jordan's story at the Plaza", "note": "Tea in the Plaza garden, and Jordan finally told me. Louisville, October 1917. Daisy was eighteen, dressed in white, with a little white roadster, and officers from Camp Taylor phoned her house all day. One of them was a lieutenant named Jay Gatsby. Then he went overseas, and in June 1919 she married Tom, who gave her a string of pearls worth three hundred and fifty thousand dollars. The night before the wedding Jordan found her drunk in the bath, clutching a letter until it came apart. Gatsby bought his house so that Daisy would be just across the bay. He wants me to invite her to tea."}, {"id": 36, "dk": "1922-07-26", "t": "19:30", "nar": ["n4", "n10"], "imp": 3, "j": false, "title": "A kiss in Central Park", "note": "Riding through Central Park in a victoria at dusk, with Jordan leaning back inside the circle of my arm, a phrase began to beat in my ears: there are only the pursued, the pursuing, the busy, and the tired. Her wan, scornful mouth smiled, and I drew her face up to mine."}, {"id": 37, "dk": "1922-07-27", "t": "02:00", "nar": ["n1"], "imp": 2, "j": false, "title": "His house lit up at two in the morning", "note": "Came home to find the whole corner of the peninsula blazing with light. Gatsby's house, lit from tower to cellar, with nobody in it. He came across the lawn to ask casually whether I'd call Daisy. I said I would, and he offered me in return a little business on the side, a confidential sort of thing. I refused. It was so obviously a service for a service."}, {"id": 38, "dk": "1922-07-27", "t": "11:15", "nar": ["n2"], "imp": 1, "j": false, "title": "I invited Daisy", "note": "Called Daisy from the office and asked her to tea. \"Don't bring Tom,\" I said. \"Who is Tom?\" she asked innocently."}, {"id": 39, "dk": "1922-07-28", "t": "11:00", "nar": ["n1"], "imp": 1, "j": false, "title": "Rain, and a man to cut my grass", "note": "Pouring rain. At eleven a man in a raincoat arrived with a lawn-mower; Mr. Gatsby had sent him to cut my grass. I drove to the village to find my Finn and buy cups, lemons and flowers. The flowers were unnecessary: at two a greenhouse arrived from next door. An hour later Gatsby came in, in a white flannel suit, silver shirt and gold tie, pale, with dark signs of sleeplessness under his eyes."}, {"id": 40, "dk": "1922-07-28", "t": "16:00", "nar": ["n1", "n2", "n8"], "imp": 4, "j": true, "title": "The clock on the mantelpiece", "note": "Daisy came. Gatsby had gone out into the rain and came back in through the front door, pale as death. He leaned against the mantelpiece in a counterfeit of ease, knocked the defunct clock off, caught it with trembling fingers, and said, \"I'm sorry about the clock.\" It was dreadful. I went out and stood under a black knotted tree for half an hour. When I came back, Daisy's face was smeared with tears, and Gatsby was literally glowing. He radiated well-being over my little room."}, {"id": 41, "dk": "1922-07-28", "t": "17:30", "nar": ["n1", "n2", "n5"], "imp": 3, "j": false, "title": "Such beautiful shirts", "note": "He took us through his house, past music rooms and a man in pyjamas doing liver exercises (Klipspringer, the boarder). In his bedroom he opened cabinets of shirts piled like bricks a dozen high and began throwing them before us, linen and silk and flannel, until Daisy bent her head into them and cried. \"They're such beautiful shirts. It makes me sad because I've never seen such beautiful shirts before.\" Out the window, the green light on her dock was only a green light again."}, {"id": 42, "dk": "1922-07-28", "t": "19:00", "nar": ["n1", "n2", "n10"], "imp": 2, "j": false, "title": "In the morning, in the evening", "note": "Gatsby made Klipspringer play the piano: \"The Love Nest\", then \"Ain't We Got Fun\". Thunder along the Sound, and the lights going on across West Egg. As I left, there was a look of bewilderment on Gatsby's face, as though some faint doubt had occurred to him about his present happiness. Five years. Daisy must have fallen short of his dream, through no fault of her own. When I said goodbye they looked back at me remotely, possessed by intense life, and I went out into the rain and left them there together."}, {"id": 43, "dk": "1922-08-03", "t": null, "nar": ["n1", "n5"], "imp": 1, "j": false, "title": "A reporter at Gatsby's door", "note": "An ambitious young reporter from New York turned up at Gatsby's door this morning and asked if he had anything to say. About what? The reporter couldn't say. He had heard Gatsby's name around, and wanted it in the paper. Gatsby is becoming a legend."}, {"id": 44, "dk": "1922-08-08", "t": null, "nar": ["n4", "n6"], "imp": 1, "j": false, "title": "Jordan's aunt", "note": "Mostly in New York these weeks, trotting around with Jordan and trying to ingratiate myself with her senile aunt. I haven't seen Gatsby or heard his voice on the phone."}, {"id": 45, "dk": "1922-08-13", "t": "16:00", "nar": ["n1", "n3"], "imp": 2, "j": false, "title": "Tom rode up on horseback", "note": "I went over to Gatsby's this Sunday, and Tom Buchanan rode up with a man named Sloane and a pretty woman in a brown riding-habit, in for a drink. Gatsby was profoundly affected. The woman invited him to supper, and he went to fetch his car. Tom said, \"My God, I believe the man's coming. Doesn't he know she doesn't want him?\" They rode off down the drive before he came back."}, {"id": 46, "dk": "1922-08-19", "t": "22:30", "nar": ["n2", "n3", "n5"], "imp": 3, "j": false, "title": "Tom and Daisy at Gatsby's party", "note": "The following Saturday Tom came with Daisy. Gatsby pointed out a movie star sitting in state under a white-plum tree, like a scarcely human orchid, with her director bending over her. Tom said he'd like to find out what Gatsby does. Daisy said he owned some drugstores. She was appalled by West Egg, by its raw vigour, and I saw the party through her eyes and it all seemed thin. \"Three O'Clock in the Morning\", a sad little waltz, drifted out of the open door."}, {"id": 47, "dk": "1922-08-20", "t": "01:30", "nar": ["n1", "n8", "n2"], "imp": 4, "j": true, "title": "\"Can't repeat the past?\"", "note": "Gatsby stayed up with me after they left. She didn't like it, he said. He wants her to tell Tom she never loved him, and then they'll go back to Louisville and be married from her house, just as if it were five years ago. I said I wouldn't ask too much of her; you can't repeat the past. \"Can't repeat the past?\" he cried. \"Why of course you can!\" He looked around wildly, as if the past were hiding in the shadow of his house, just out of reach."}, {"id": 48, "dk": "1922-09-02", "t": "21:30", "nar": ["n1", "n2", "n5"], "imp": 2, "j": false, "title": "The lights didn't go on", "note": "The lights in Gatsby's house failed to go on this Saturday night. I went over to see if he was ill, and an unfamiliar butler with a villainous face squinted at me and shut the door. My Finn says he has dismissed every servant in the house and taken on half a dozen others who never go into the village. Daisy comes over in the afternoons, and these people won't gossip."}, {"id": 49, "dk": "1922-09-03", "t": "10:00", "nar": ["n1", "n2", "n4"], "imp": 1, "j": false, "title": "Lunch tomorrow at Daisy's", "note": "Gatsby called. Daisy wants us both to lunch at her house tomorrow, and Miss Baker will be there. Half an hour later Daisy called herself, and seemed relieved that I would come. Something is up."}, {"id": 50, "dk": "1922-09-04", "t": "12:30", "nar": ["n2", "n1", "n3"], "imp": 3, "j": false, "title": "\"You always look so cool\"", "note": "Broiling, almost the last day of summer and certainly the warmest. At the Buchanans', a nurse brought in their little girl, Pammy, and Gatsby kept looking at the child as if he had never really believed she existed. Then Daisy looked at Gatsby across the table and said, \"You always look so cool.\" She had told him she loved him, and Tom saw. Gatsby said to me afterward that her voice is full of money. That was it. I had never understood before."}, {"id": 51, "dk": "1922-09-04", "t": "14:30", "nar": ["n3", "n7", "n4"], "imp": 2, "j": false, "title": "At Wilson's garage", "note": "Tom insisted on driving Gatsby's yellow car into town, with Jordan and me, and stopped for gas at Wilson's. Wilson looked sick. He needs money; he has found something out and means to take his wife West, whether she wants to go or not. Tom went pale. Upstairs, Myrtle Wilson was watching from a window, staring with jealous terror at Jordan, whom she took for Tom's wife."}, {"id": 52, "dk": "1922-09-04", "t": "16:00", "nar": ["n1", "n2", "n3", "n8"], "imp": 4, "j": true, "title": "The suite at the Plaza", "note": "Hot and restless, we took a parlour at the Plaza. Mendelssohn's Wedding March came up from a ballroom below. Tom sneered about Mr. Nobody from Nowhere making love to his wife. Gatsby told him Daisy never loved him. Daisy said, sobbing, \"I did love him once\u2014but I loved you too.\" Then Tom brought out what he'd learned: drugstores selling grain alcohol over the counter, Wolfshiem, worse. Gatsby talked and talked, and with every word Daisy drew further into herself. Tom sent her home with him in Gatsby's car, quite sure it was over."}, {"id": 53, "dk": "1922-09-04", "t": "18:55", "nar": ["n10", "n4"], "imp": 5, "j": true, "title": "Thirty", "note": "I just remembered that today is my birthday. I am thirty. Before me stretches the portentous, menacing road of a new decade. Thirty: the promise of a decade of loneliness, a thinning list of single men to know, a thinning briefcase of enthusiasm, thinning hair. But Jordan was beside me in the coup\u00e9, and her hand pressed mine, and the formidable stroke of thirty died away."}, {"id": 54, "dk": "1922-09-04", "t": "20:30", "nar": ["n7", "n3"], "imp": 5, "j": true, "title": "An accident in the valley of ashes", "note": "A crowd at Wilson's garage in the dusk. Myrtle Wilson had run out into the road, and a car coming from New York struck her and didn't stop. She is dead. Wilson was wailing in his office. A witness said the car was yellow. Tom drove us away slowly, and then fast, and after a while I heard a low sob and saw tears running down his face. \"The God damned coward,\" he whimpered. \"He didn't even stop his car.\""}, {"id": 55, "dk": "1922-09-04", "t": "21:45", "nar": ["n1", "n2"], "imp": 4, "j": false, "title": "Gatsby in the Buchanans' bushes", "note": "I wouldn't go in, not even with Jordan; I'd had enough of all of them for one day. Walking down the drive, I found Gatsby standing in the shrubbery. \"Was she killed?\" he asked. Daisy was driving. She tried to swerve, lost her nerve, and it happened. He will say he was. He means to stand out here all night, in case Tom tries to bully her about this afternoon."}, {"id": 56, "dk": "1922-09-04", "t": "22:15", "nar": ["n2", "n3"], "imp": 3, "j": false, "title": "Cold fried chicken and two bottles of ale", "note": "I went round to look. Through a rift in the pantry blind I saw Daisy and Tom at the kitchen table with a plate of cold fried chicken and two bottles of ale. He was talking earnestly, his hand over hers, and she nodded now and then. Neither of them was happy, and yet they weren't unhappy either. There was an unmistakable air of natural intimacy, as if they were conspiring together. I left Gatsby standing there in the moonlight, watching over nothing."}, {"id": 57, "dk": "1922-09-05", "t": "05:00", "nar": ["n1", "n8", "n2"], "imp": 4, "j": false, "title": "Dawn at Gatsby's", "note": "Couldn't sleep; a foghorn groaned on the Sound all night. Toward dawn I went over. Nothing happened, he said: about four she came to the window, stood a minute, and turned out the light. We hunted his dusty house for cigarettes. I told him to go away, to Atlantic City or Montreal, since they'll trace the car. He wouldn't hear of it. Then he told me everything. James Gatz of North Dakota. Rowing out at seventeen to Dan Cody's yacht on Lake Superior. Louisville, and Daisy, the first nice girl he had ever known. Oxford after the war, and her letter."}, {"id": 58, "dk": "1922-09-05", "t": "09:00", "nar": ["n1", "n10"], "imp": 4, "j": true, "title": "\"They're a rotten crowd\"", "note": "Breakfast. The gardener wanted to drain the pool before the leaves fell and clogged the pipes; Gatsby said not today, he hadn't used it all summer. He is waiting for Daisy to call. We shook hands and I started away, then turned at the hedge and shouted across the lawn: \"They're a rotten crowd. You're worth the whole damn bunch put together.\" His face broke into that radiant smile. His gorgeous pink rag of a suit made a bright spot against the white steps. It was the only compliment I ever gave him."}, {"id": 59, "dk": "1922-09-05", "t": "12:00", "nar": ["n4", "n1"], "imp": 2, "j": false, "title": "Jordan on the telephone", "note": "Fell asleep in my office chair. Jordan called me, and I was curt, and then one of us hung up, and I didn't care. Called Gatsby's house four times; the line was busy, being kept open for long distance from Detroit. I drew a circle around the three-fifty train in my timetable and sat back to think. It was just noon."}, {"id": 60, "dk": "1922-09-05", "t": "16:40", "nar": ["n1", "n7"], "imp": 5, "j": true, "title": "Gatsby in the pool", "note": "I hurried from the station. The chauffeur, the butler, a gardener and I ran down to the pool. Gatsby had gone down at two with the pneumatic mattress, telling the butler to bring word if anyone phoned. The mattress was moving irregularly down the pool with its laden burden, tracing a thin red circle in the water. A little way off in the grass lay George Wilson. He had walked all the way from the valley of ashes to find the owner of the yellow car."}, {"id": 61, "dk": "1922-09-05", "t": "17:10", "nar": ["n2", "n3"], "imp": 4, "j": false, "title": "Daisy has gone away", "note": "I called Daisy half an hour after we found him, called her instinctively, without hesitation. But she and Tom had gone away early this afternoon, and taken baggage with them. Left no address. Didn't say when they'd be back."}, {"id": 62, "dk": "1922-09-06", "t": null, "nar": ["n1", "n7", "n10"], "imp": 2, "j": false, "title": "The newspapers", "note": "An endless drill of police and photographers and newspapermen. The reports are a nightmare. At the inquest Catherine swore that her sister had never seen Gatsby and was completely happy with her husband. So Wilson is a madman, and that is all. The practical questions about Gatsby are referred to me, because no one else is interested, and I find I am on his side, alone."}, {"id": 63, "dk": "1922-09-06", "t": "15:00", "nar": ["n1", "n6"], "imp": 2, "j": false, "title": "Wolfshiem's letter", "note": "Sent the butler to New York with a letter to Wolfshiem, begging him to come. The answer: he is tied up in very important business and cannot get mixed up in this thing now; let him know about the funeral. Then long distance from Chicago. I thought it was Daisy at last. It was a man named Slagle, talking about bonds and some young Parke in trouble, and he hung up when he understood Gatsby was dead."}, {"id": 64, "dk": "1922-09-07", "t": null, "nar": ["n1", "n9"], "imp": 2, "j": false, "title": "A telegram from Minnesota", "note": "A telegram signed Henry C. Gatz, from a town in Minnesota. He is leaving immediately; postpone the funeral until he comes."}, {"id": 65, "dk": "1922-09-08", "t": "16:00", "nar": ["n1", "n9", "n8"], "imp": 3, "j": false, "title": "Gatsby's father", "note": "A solemn old man, helpless and dismayed, bundled up in a long cheap ulster against the warm September day. He asked where they had got Jimmy. After he'd been in with his son, he stood looking at the height and splendour of the hall, and his grief began to be mixed with an awed pride. \"If he'd of lived, he'd of been a great man,\" he said. \"A man like James J. Hill. He'd of helped build up the country.\""}, {"id": 66, "dk": "1922-09-08", "t": "21:00", "nar": ["n1", "n5"], "imp": 1, "j": false, "title": "Klipspringer and the tennis shoes", "note": "Klipspringer called. I told him the funeral is tomorrow at three, at the house, and to tell anybody who'd be interested. He is staying with some people in Greenwich; there's a sort of picnic; he'll do his best. What he really called about was a pair of tennis shoes he left at the house; he's sort of helpless without them. I hung up."}, {"id": 67, "dk": "1922-09-09", "t": "11:00", "nar": ["n1", "n6"], "imp": 2, "j": false, "title": "Wolfshiem's office", "note": "Went to the city on the morning of the funeral to see Wolfshiem. He talked about how he made Gatsby, took him up out of nothing when he came in, still in uniform, too poor to buy other clothes. He won't come to the funeral. \"Let us learn to show our friendship for a man when he is alive and not after he is dead,\" he said. \"After that my own rule is to let everything alone.\""}, {"id": 68, "dk": "1922-09-09", "t": "14:00", "nar": ["n1", "n8", "n9"], "imp": 3, "j": false, "title": "A schedule dated 1906", "note": "Mr. Gatz showed me a ragged copy of Hopalong Cassidy that Jimmy had as a boy. On the last flyleaf, the word schedule and the date September 12, 1906. Rise from bed at six. Dumbbell exercise and wall-scaling. Study electricity. And General Resolves: No wasting time. No more smoking or chewing. Bath every other day. Read one improving book or magazine per week. Save $5.00, crossed out, $3.00 per week. Be better to parents. \"It just shows you,\" his father said."}, {"id": 69, "dk": "1922-09-09", "t": "17:30", "nar": ["n1", "n5", "n2"], "imp": 4, "j": true, "title": "The funeral in the rain", "note": "We waited for half an hour past three. Nobody came. At five our three cars reached the cemetery in a thick drizzle. Then the owl-eyed man from the library, the one who marvelled at the books, came splashing up. He was the only one of all the hundreds. Daisy hadn't sent a message or a flower. Someone murmured \"Blessed are the dead that the rain falls on.\" At the gate, the owl-eyed man took off his glasses and wiped them. \"The poor son-of-a-bitch,\" he said."}, {"id": 70, "dk": "1922-09-23", "t": "23:00", "nar": ["n6", "n5"], "imp": 1, "j": false, "title": "Saturday nights in the city", "note": "I spend my Saturday nights in New York now, because Gatsby's gleaming, dazzling parties are still so vivid to me that I can hear the music and laughter from his garden, faint and incessant, and the cars going up and down his drive. One night a taxi stopped at his steps for a moment. Somebody who had been away and hadn't heard the party was over."}, {"id": 71, "dk": "1922-09-30", "t": null, "nar": ["n9", "n8", "n10"], "imp": 3, "j": false, "title": "Coming home from prep school", "note": "I keep remembering the trains home from prep school and college at Christmas: the dim Union Station in Chicago at six o'clock of a December evening, the real snow, our snow, sparkling against the windows. That's my Middle West. I see now that this has been a story of the West after all: Tom and Gatsby, Daisy and Jordan and I were all Westerners, and perhaps we shared some deficiency that made us subtly unadaptable to Eastern life."}, {"id": 72, "dk": "1922-10-14", "t": "11:00", "nar": ["n4", "n10"], "imp": 4, "j": false, "title": "Jordan, dressed for golf", "note": "Went to see Jordan and talked over and around what had happened to us. She was dressed to play golf, her hair the colour of an autumn leaf. She said she is engaged to another man. \"You threw me over on the telephone,\" she said. She reminded me that I once said a bad driver was only safe until she met another bad driver, and she had met one. She thought I was an honest, straightforward person. \"I'm thirty,\" I said. \"I'm five years too old to lie to myself and call it honour.\" Angry, and half in love with her, and tremendously sorry, I turned away."}, {"id": 73, "dk": "1922-10-20", "t": null, "nar": ["n9", "n10"], "imp": 4, "j": false, "title": "I decided to come back home", "note": "Since Gatsby's death the East has been haunted for me, distorted beyond my eyes' power of correction. So now, with the blue smoke of brittle leaves in the air and the wind blowing the wet laundry stiff on the line, I have decided to come back home."}, {"id": 74, "dk": "1922-10-24", "t": "15:30", "nar": ["n3", "n7", "n1"], "imp": 4, "j": true, "title": "Tom on Fifth Avenue", "note": "Saw Tom walking ahead of me on Fifth Avenue, alert and aggressive. I asked what he said to Wilson that afternoon. \"I told him the truth,\" he said. Wilson had come to the house with his hand on a revolver, and Tom told him who owned the car. \"That fellow had it coming to him.\" He said when he went to give up the flat and saw the box of dog biscuits on the sideboard, he sat down and cried like a baby. They were careless people, Tom and Daisy. They smashed up things and creatures and then retreated back into their money, and let other people clean up the mess. I shook his hand. He went into a jewellery store to buy a pearl necklace, or perhaps only a pair of cuff buttons."}, {"id": 75, "dk": "1922-10-30", "t": "23:30", "nar": ["n1", "n8", "n9", "n10"], "imp": 5, "j": true, "title": "The last night in West Egg", "note": "Trunk packed, car sold to the grocer. I went over and looked at that huge incoherent failure of a house once more. Some boy had scrawled an obscene word on the white steps with a piece of brick, and I erased it with my shoe. Then I lay on the beach. Most of the big places are closed, and as the moon rose the houses melted away, and I thought of the old island that once flowered for Dutch sailors' eyes. Gatsby believed in the green light at the end of Daisy's dock. He didn't know his dream was already behind him. So we beat on, boats against the current, borne back ceaselessly into the past."}]}}
