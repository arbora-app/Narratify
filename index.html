<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Narratify</title>
<style>
  :root{
    --bg:#EFE6D3;       --bg-rgb:239,230,211;
    --panel:#FAF4E6;     --panel-rgb:250,244,230;
    --ink:#2B2013;       --ink-rgb:43,32,19;
    --ink2:#5B4A34;
    --mute:#9C8967;
    --line:#E3D6B9;
    --rail:#CBB88C;
    --ribbon:#9C6B12;    --ribbon-2:#7E5510;
    --ribbon-hi:#B98A2A; --ribbon-hi-2:#96700F;
    --nar-1:#35527C; --nar-2:#3F6B45; --nar-3:#A24B5E; --nar-4:#A97B23; --nar-5:#6B4E8E;
    --nar-6:#257A87; --nar-7:#9C5626; --nar-8:#6E7A34; --nar-9:#4C5A6B; --nar-10:#7A3F6B;
    --nar-reflect:#7D6A56;
    --vignette: rgba(255,251,240,.55);
    --scrim: rgba(43,32,19,.36);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
    --badge-w: 50px;    /* shared width: day-tick column and chapter-tab column */
    --gap: 8px;
    --gutter: 16px;
  }
  /* Same book, read by lamplight: paper and ink swap roles rather than
     just dimming — the page goes the colour of old leather, the ink goes
     the colour of the light falling on it.
     Three states: no data-theme + OS set to dark = follow the system;
     data-theme="dark" forces it regardless of the OS; data-theme="light"
     opts back out of the system's dark setting. The two dark blocks below
     carry the same tokens on purpose — one for "system says dark", one
     for "the reader said dark" — so both paths land on the same page. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1611;      --bg-rgb:27,22,17;
      --panel:#241D15;    --panel-rgb:36,29,21;
      --ink:#EDE1C9;      --ink-rgb:237,225,201;
      --ink2:#C9BB9E;
      --mute:#8F8268;
      --line:#3A2E20;
      --rail:#4A3B28;
      --ribbon:#D9A63E;   --ribbon-2:#B8862A;
      --ribbon-hi:#E6B855; --ribbon-hi-2:#C2953A;
      --nar-1:#6C93C9; --nar-2:#74AD7E; --nar-3:#D0788C; --nar-4:#D9A94A; --nar-5:#A88AD1;
      --nar-6:#4FB0BE; --nar-7:#D08A57; --nar-8:#AEBB63; --nar-9:#93A4B7; --nar-10:#C08AB2;
      --nar-reflect:#C2AD93;
      --vignette: rgba(255,235,200,.05);
    --scrim: rgba(8,5,3,.62);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1611;       --bg-rgb:27,22,17;
    --panel:#241D15;    --panel-rgb:36,29,21;
    --ink:#EDE1C9;      --ink-rgb:237,225,201;
    --ink2:#C9BB9E;
    --mute:#8F8268;
    --line:#3A2E20;
    --rail:#4A3B28;
    --ribbon:#D9A63E;   --ribbon-2:#B8862A;
    --ribbon-hi:#E6B855; --ribbon-hi-2:#C2953A;
    --nar-1:#6C93C9; --nar-2:#74AD7E; --nar-3:#D0788C; --nar-4:#D9A94A; --nar-5:#A88AD1;
    --nar-6:#4FB0BE; --nar-7:#D08A57; --nar-8:#AEBB63; --nar-9:#93A4B7; --nar-10:#C08AB2;
    --nar-reflect:#C2AD93;
    --vignette: rgba(255,235,200,.05);
    --scrim: rgba(8,5,3,.62);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(1100px 480px at 12% -8%, var(--vignette), transparent 60%),
      var(--bg);
    color:var(--ink);
    font:14px/1.45 var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  /* Without this a button with a transparent background is painted by the
     platform instead of by us, which on Android shows through as a white
     slab under the border. Every button here draws its own surface. */
  button{
    font:inherit;cursor:pointer;color:inherit;
    -webkit-appearance:none;appearance:none;background:transparent;
  }
  button:focus-visible,[role="separator"]:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  /* pan-y, not auto: pinch-zoom is run by the compositor and a touch handler
     calling preventDefault cannot stop it — only touch-action can. Left at
     auto, a pinch aimed at the rail magnifies the page instead, and the app
     is left at a scale it has no way to undo. Vertical panning is all either
     pane needs. */
  .scroll{flex:1;overflow-y:auto;touch-action:pan-y;position:relative;padding:0 var(--gutter);
    scrollbar-width:thin;scrollbar-color:var(--rail) transparent;-webkit-overflow-scrolling:touch;}
  .scroll::-webkit-scrollbar{width:9px;}
  .scroll::-webkit-scrollbar-thumb{background:var(--rail);border-radius:9px;border:3px solid transparent;background-clip:content-box;}

  /* ---- app shell ---- */
  #app{height:100%;display:flex;flex-direction:column;}
  header{
    height:48px;flex:none;display:flex;align-items:center;gap:9px;
    padding:0 var(--gutter);border-bottom:1px solid var(--line);
    position:relative;
  }
  /* The mark is the way back to the shelf, so it is a button, dressed like
     the header's other controls: no surface, an outline only when reached. */
  .brand{
    flex:none;display:flex;align-items:center;margin-left:-6px;padding:3px 6px;
    border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;
    transition:border-color 180ms ease,transform 120ms ease;
  }
  @media (hover:hover){ .brand:hover{border-color:var(--line);} }
  .brand:active{transform:scale(.94);}
  .brand:focus-visible{outline:2px solid var(--ribbon);outline-offset:1px;}
  /* The ribbon wordmark reads on both papers as-is, so it takes no dark-mode filter. */
  .logo{display:block;height:28px;width:auto;}
  /* A book on its way in. Nothing shows for a quick import; a slow one gets
     a short length of ribbon running along the header's own rule, and the
     page it is about to replace steps back. The bar sits above the scrim so
     it is still seen when the import was started from the shelf. */
  .loadbar{
    position:absolute;left:0;right:0;bottom:-1px;height:2px;z-index:52;
    overflow:hidden;pointer-events:none;opacity:0;transition:opacity 160ms ease;
  }
  .loadbar::before{
    content:"";position:absolute;top:0;bottom:0;left:0;width:34%;
    border-radius:2px;background:var(--ribbon);transform:translateX(-100%);
  }
  #app.importing .loadbar{opacity:1;}
  #app.importing .loadbar::before{animation:loadglide 1.15s cubic-bezier(.45,0,.35,1) infinite;}
  @keyframes loadglide{from{transform:translateX(-100%);}to{transform:translateX(300%);}}
  #split{transition:opacity 180ms ease;}
  #app.importing #split{opacity:.25;pointer-events:none;}
  #app.importing .booktitle{font-style:italic;color:var(--mute);}
  #app.importing .unsaved{display:none;}
  @media (prefers-reduced-motion:reduce){
    #app.importing .loadbar::before{width:100%;transform:none;animation:loadpulse 1.4s ease-in-out infinite alternate;}
  }
  @keyframes loadpulse{from{opacity:.3;}to{opacity:.9;}}
  /* The book's own name, set in the book's own face, centred on the header
     and taking as much of the room between the logo and the buttons as it
     can while staying there. Editable in place: it is an
     input rather than a button now, so typing renames the book directly and
     the name is kept with the book's own data rather than a file on disk. */
  /* The dot rides at the end of the title's own text rather than at the edge
     of the field, so it reads as a mark on the name of the book. Its left is
     measured, not guessed \u2014 see paintDot. */
  .titlewrap{flex:1;min-width:0;position:relative;display:flex;}
  .unsaved{
    position:absolute;top:5px;left:0;width:5px;height:5px;border-radius:50%;
    background:#c0392b;pointer-events:none;
  }
  .unsaved[hidden]{display:none;}
  /* Centred on the header itself, not on the room between the logo and the
     buttons — that room is lopsided, the buttons being wider than the logo.
     centerTitle evens the two sides with a margin on the narrow one. */
  .booktitle{
    flex:1;min-width:0;text-align:center;
    border:1px solid transparent;border-radius:7px;background:transparent;
    padding:5px 7px 6px;color:var(--ink);
    font:400 15px/1.2 var(--serif);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:border-color 180ms ease,color 180ms ease;
  }
  .booktitle::placeholder{color:var(--mute);font-style:italic;opacity:1;}
  @media (hover:hover){
    .booktitle:hover{border-color:var(--line);}
  }
  .booktitle:focus{outline:none;border-color:var(--ribbon);background:rgba(var(--ink-rgb),.03);}
  .tools{display:flex;align-items:center;gap:7px;flex:none;position:relative;margin-left:2px;}
  .menu-wrap{position:relative;display:flex;}
  /* Each panel hangs from its own trigger and is centred on it, so a column of
     options is always plainly the property of the button above it. Centring is
     done with a margin rather than a translate because the panel arrives on a
     transform of its own and the two would fight.

     The width is the arithmetic that keeps them apart: two 30px triggers 11px
     apart put their centres 41px apart, and a 38px panel either side of that
     leaves the two columns 3px of daylight even in the case they should never
     be in — both open at once. */
  .bookmenu,.setmenu{
    position:absolute;top:calc(100% + 8px);left:50%;margin-left:-19px;z-index:30;
    display:flex;flex-direction:column;gap:4px;padding:4px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    box-shadow:0 12px 28px rgba(var(--ink-rgb),.24);
    animation:rise 170ms cubic-bezier(.2,.7,.3,1);
  }
  .bookmenu[hidden],.setmenu[hidden]{display:none;}
  .bm-btn{
    width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink2);
    transition:background 180ms ease,color 180ms ease,border-color 180ms ease;
  }
  .bm-btn:hover{border-color:var(--ribbon);color:var(--ribbon);}
  .bm-btn svg{display:block;}
  .bm-btn[disabled]{opacity:.3;}
  .bm-btn[disabled]:hover{border-color:transparent;color:var(--ink2);}
  .bm-sep{height:1px;background:var(--line);margin:1px 4px;}
  /* The same tray the book menu drops, hung off the other end of the row:
     each toggle is the icon it always was, stacked under the gear. */
  /* Lit is a filled button, not a tinted icon, so it cannot be confused with
     a hover or a focus ring: entries are set by size. */
  .bm-btn[aria-pressed="true"]{
    background:var(--ribbon);border-color:var(--ribbon);color:var(--panel);
  }
  .bm-btn[aria-pressed="true"]:hover{border-color:var(--ribbon);color:var(--panel);}
  .bm-btn .icon-sun{display:none;}
  .bm-btn.is-dark .icon-moon{display:none;}
  .bm-btn.is-dark .icon-sun{display:block;}
  .icon-sun circle,.icon-sun line{stroke:currentColor;stroke-width:1.6;stroke-linecap:round;fill:none;}
  .icon-moon path{fill:currentColor;}
  /* Writing is the one thing done far more often than anything else in the
     header, and the header is the far corner of a phone. It sits under the
     thumb instead, clear of the rail, and rides above the home indicator on
     the phones that have one. Below the overlays, so it cannot float over an
     open editor. */
  /* Going back to today is a move you make while scrolling, so it sits where
     the thumb already is rather than across the screen. It is deliberately
     not a second writing button: smaller, the colour of the page, a lighter
     shadow. And it is only there when today has gone off screen \u2014 the rest
     of the time it would be a button offering to take you where you are. */
  .todayfab{
    position:fixed;z-index:20;
    right:19px;bottom:calc(78px + env(safe-area-inset-bottom,0px));
    width:42px;height:42px;display:flex;align-items:center;justify-content:center;
    background:var(--panel);color:var(--ink2);
    border:1px solid var(--ribbon);border-radius:14px 16px 15px 17px;
    box-shadow:0 3px 10px rgba(var(--ink-rgb),.14);
    opacity:0;transform:translateY(7px) scale(.95);pointer-events:none;
    transition:opacity 200ms ease,transform 220ms cubic-bezier(.2,.7,.3,1),
               background 200ms ease;
  }
  .todayfab svg path{fill:var(--ribbon);transition:fill 200ms ease;}
  .todayfab.show{opacity:1;transform:none;pointer-events:auto;}
  @media (hover:hover){
    .todayfab:hover{background:var(--ribbon);}
    .todayfab:hover svg path{fill:var(--panel);}
  }
  .fab{
    position:fixed;z-index:20;
    right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
    width:52px;height:52px;display:flex;align-items:center;justify-content:center;
    background:var(--ink);color:var(--panel);
    border:1px solid var(--ink);border-radius:17px 21px 18px 20px;
    box-shadow:0 6px 18px rgba(var(--ink-rgb),.28);
    transition:background 200ms ease,border-color 200ms ease,transform 160ms ease;
  }
  @media (hover:hover){
    .fab:hover{background:var(--ribbon);border-color:var(--ribbon);}
  }
  .fab:active{transform:scale(.94);}
  .fab svg{display:block;}
  /* the toast is the one thing allowed to sit in front of it, so it steps
     aside rather than being covered */
  .toast{
    position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
    display:flex;align-items:center;gap:11px;max-width:min(430px,calc(100% - 32px));
    background:var(--ink);color:var(--panel);border-radius:9px;padding:9px 12px;
    font:13px/1.35 var(--sans);box-shadow:0 12px 28px rgba(var(--ink-rgb),.3);
    animation:rise 200ms cubic-bezier(.2,.7,.3,1);
  }
  .toast[hidden]{display:none;}
  .toast.hint{pointer-events:none;}
  .toast-act{
    flex:none;border:1px solid rgba(var(--panel-rgb),.42);background:transparent;color:var(--panel);
    border-radius:6px;padding:3px 10px;font:600 11px var(--sans);letter-spacing:.03em;
    transition:background 180ms ease;
  }
  .toast-act:hover{background:rgba(var(--panel-rgb),.18);}
  .toast-act[hidden]{display:none;}
  /* Outlines on the page, not chips above it: the header has no surface of
     its own, so a panel fill here reads as a white sticker rather than a
     raised thing. The border alone is enough to say it can be pressed. */
  .theme-btn{
    width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:7px;
    transition:background 200ms ease,color 200ms ease,border-color 200ms ease;
  }
  .theme-btn:active{background:rgba(var(--ink-rgb),.05);}
  /* Hover is guarded: a finger leaves it stuck on after a tap, and on a
     toggle a stuck hover reads as the lit state, which inverts the control. */
  @media (hover:hover){
    .theme-btn:hover{border-color:var(--ribbon);color:var(--ribbon);}
  }
  .theme-btn svg{display:block;}

  /* ---- the search row ----
     Opened by the glass in the header and closed the same way, but never
     closed out from under a live search: a query that is still narrowing the
     book has to stay on screen saying so, or the missing entries have no
     explanation. Enter commits; nothing is filtered while you type, because
     a book rearranging itself under each keystroke is unreadable. */
  .findbar{
    flex:none;display:flex;align-items:center;gap:8px;
    height:38px;padding:0 var(--gutter);
    border-bottom:1px solid var(--line);background:var(--bg);
  }
  .findbar[hidden]{display:none;}
  /* The glass is the enter key for anyone not holding a keyboard. It lights
     when what is typed is not yet what is being read, so there is always a
     visible answer to "did that take?" — the one thing a commit-on-enter
     field is bad at telling you. */
  .fb-go{
    flex:none;display:flex;align-items:center;justify-content:center;
    width:26px;height:26px;border:1px solid transparent;border-radius:7px;
    background:transparent;color:var(--mute);
    transition:border-color 180ms ease,color 180ms ease;
  }
  .fb-go svg{display:block;}
  .fb-go.ready{color:var(--ribbon);border-color:var(--ribbon);}
  @media (hover:hover){ .fb-go:hover{border-color:var(--line);color:var(--ink2);} }
  @media (hover:hover){ .fb-go.ready:hover{border-color:var(--ribbon);color:var(--ribbon);} }
  .fb-in{
    flex:1;min-width:0;border:0;background:transparent;color:var(--ink);
    font:15px/1.2 var(--serif);padding:4px 0;
  }
  .fb-in:focus{outline:none;}
  .fb-in::placeholder{color:var(--mute);}
  .fb-n{flex:none;color:var(--mute);font:11.5px/1 var(--sans);letter-spacing:.02em;}
  .fb-x{
    flex:none;display:flex;align-items:center;justify-content:center;
    width:24px;height:24px;border:1px solid transparent;border-radius:7px;
    color:var(--mute);font:13px/1 var(--sans);
    transition:border-color 180ms ease,color 180ms ease;
  }
  .fb-x[hidden]{display:none;}
  @media (hover:hover){ .fb-x:hover{border-color:var(--line);color:var(--ink2);} }
  .theme-btn.lit{color:var(--ribbon);}

  /* A hit is marked the way a hand would mark it: a wash of ink behind the
     word and a line ruled under it, rather than a highlighter slab that
     fights the page. */
  .post mark{
    background:transparent;color:inherit;border-radius:1px;padding:0 1px;
    box-shadow:inset 0 -0.44em 0 rgba(var(--ink-rgb),.10);
    border-bottom:1px solid var(--ribbon);
  }

  /* ---- the narrative bar ----
     One strip, no modes. A narrative that is filtering shows as a named pill;
     one that isn't shows as a dash. Nothing selected is simply every dash,
     which is also the book's colour key. Pills lead, dashes follow, and the
     two travel together in one row that scrolls sideways when it outgrows
     the strip; only the menu and the peek stay pinned at the end. A pill is
     never squeezed — it is either in view, whole, or scrolled past. */
  .narbar{
    flex:none;display:flex;align-items:center;gap:7px;
    height:36px;padding:0 var(--gutter);
    border-bottom:1px solid var(--line);background:var(--bg);
  }
  .narbar[hidden]{display:none;}
  .nb-row{position:relative;display:flex;align-items:center;gap:6px;
    flex:0 1 auto;min-width:0;height:100%;
    overflow-x:auto;overscroll-behavior-x:contain;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .nb-row::-webkit-scrollbar{display:none;}
  .nb-on{display:flex;align-items:center;gap:6px;flex:none;}
  .nb-on:empty{display:none;}
  .nb-off{display:flex;align-items:center;gap:2px;flex:none;}
  .nb-grow{flex:1;}

  /* The dash is the same mark the entry cards wear, at rest. Its button is
     wider and taller than the ink it paints so the target survives a thumb. */
  .nb-dash{
    flex:none;display:flex;align-items:center;justify-content:center;
    width:30px;height:32px;border:0;border-radius:6px;background:transparent;
  }
  .nb-dash b{display:block;width:20px;height:4px;border-radius:1px 4px 1px 4px;
    transform:rotate(-6deg);transition:height 160ms ease,opacity 160ms ease;}
  @media (hover:hover){ .nb-dash:hover b{height:6px;} }
  .nb-dash:active b{height:6px;}

  .nb-pill{
    flex:none;display:flex;align-items:center;gap:6px;max-width:150px;
    border:1px solid currentColor;border-radius:20px;
    background:rgba(var(--ink-rgb),.05);padding:4px 10px 5px 8px;
    font:600 11.5px/1 var(--sans);letter-spacing:.01em;
  }
  .nb-pill i{flex:none;width:10px;height:4px;border-radius:1px 4px 1px 4px;
    display:block;transform:rotate(-6deg);background:currentColor;}
  .nb-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nb-pill b{font-weight:400;opacity:.6;}

  .nb-more{
    flex:none;display:flex;align-items:center;justify-content:center;
    width:30px;height:26px;border:1px solid transparent;border-radius:7px;
    color:var(--mute);transition:border-color 180ms ease,color 180ms ease;
  }
  .nb-more svg{display:block;fill:currentColor;}
  @media (hover:hover){ .nb-more:hover{border-color:var(--line);color:var(--ink2);} }

  /* The peek. On a pointer the names would arrive on hover and cost nothing;
     a thumb has no hover, so the chevron buys the same look for one tap and
     changes nothing else. It reveals, it doesn't filter — which is the whole
     point of having it, since every other way into a name is a commitment. */
  .nb-peek{
    flex:none;display:flex;align-items:center;justify-content:center;
    width:28px;height:26px;border:1px solid transparent;border-radius:7px;
    color:var(--mute);transition:border-color 180ms ease,color 180ms ease,transform 200ms ease;
  }
  .nb-peek svg{display:block;}
  @media (hover:hover){ .nb-peek:hover{border-color:var(--line);color:var(--ink2);} }
  .narbar.peek .nb-peek{transform:rotate(180deg);color:var(--ink2);}
  .nb-pill.quiet{border-color:var(--line);color:var(--ink2);background:transparent;}

  /* A filtered book must never look like a damaged one: the map keeps every
     mark it had, and the filter only takes the ink out of the ones it isn't
     reading. Faint enough to recede, solid enough to be worth a tap. */
  .cell .dots i.off{opacity:.3;}
  .monthbadge.quiet{opacity:.45;}

  #split{flex:1;display:flex;flex-direction:column;min-height:0;}
  #split.dragging{user-select:none;}
  #calPane{
    display:flex;flex-direction:column;min-height:90px;background:var(--bg);height:50%;
    box-shadow:inset 0 -10px 12px -12px rgba(var(--ink-rgb),.16);
  }
  #tlPane{
    flex:1;display:flex;flex-direction:column;min-height:90px;background:var(--panel);
    position:relative;
    box-shadow:inset 0 10px 12px -12px rgba(var(--ink-rgb),.12);
  }

  /* ---- table of contents (calendar) ---- */
  .weekrow{display:flex;align-items:center;padding:5px var(--gutter) 4px;color:var(--mute);font-size:11px;letter-spacing:.02em;}
  .weekrow div{flex:1;text-align:center;}
  /* The badge column is blank on this row, and it is the one place in the
     calendar that names a year rather than a month — so the year lives here,
     sitting directly above the chapter tabs it indexes. */
  .yearwrap{flex:none;width:var(--badge-w);position:relative;display:flex;align-items:center;}
  .yearbtn{
    display:flex;align-items:center;gap:4px;
    border:1px solid transparent;border-radius:6px;background:transparent;
    color:var(--ink2);font:12px/1 var(--serif);font-variant-numeric:tabular-nums;
    padding:3px 5px 4px 3px;
    transition:border-color 180ms ease,color 180ms ease;
  }
  .yearbtn:hover,.yearbtn[aria-expanded="true"]{border-color:var(--line);color:var(--ink);}
  .ycaret{
    flex:none;width:0;height:0;
    border-left:3px solid transparent;border-right:3px solid transparent;
    border-top:3.5px solid var(--mute);
  }
  /* Its own list rather than the operating system's: the native one arrives
     in the platform's font and colours and breaks the page in half. */
  .yearlist{
    position:absolute;top:calc(100% + 6px);left:0;z-index:20;
    min-width:calc(var(--badge-w) + 14px);max-height:216px;overflow-y:auto;
    display:flex;flex-direction:column;gap:2px;padding:5px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    box-shadow:0 12px 28px rgba(var(--ink-rgb),.24);
    scrollbar-width:thin;scrollbar-color:var(--rail) transparent;
    animation:rise 170ms cubic-bezier(.2,.7,.3,1);
  }
  .yearlist[hidden]{display:none;}
  .yopt{
    border:none;border-radius:6px;background:transparent;color:var(--ink2);
    font:13.5px/1 var(--serif);font-variant-numeric:tabular-nums;
    padding:5px 9px 6px;text-align:left;white-space:nowrap;
    transition:background 160ms ease,color 160ms ease;
  }
  .yopt:hover{background:rgba(var(--ink-rgb),.07);color:var(--ink);}
  .yopt.on{background:var(--ink);color:var(--panel);}
  /* One chapter tab per month, sticky in the left column, riding alongside
     whichever week row you're looking at — the book's table of contents.
     Sized the same as the timeline's day-ticks, so the two panes read as
     one column of badges rather than two different systems. */
  .month{position:relative;display:flex;padding-bottom:8px;
    /* A book decades long prints a thousand months and thirty thousand days.
       Only the months on screen are styled, laid out and painted; the rest
       hold their place at their exact height (set per month from its number
       of week rows), so the scroll never shifts as they come into view. Without
       this, anything that restyles the page — a theme change most of all —
       restyles every day in the book, and the page freezes for seconds with
       its colours half-changed. */
    content-visibility:auto;contain-intrinsic-size:auto calc(var(--wk,5) * var(--rowp,31px) - 2px);}
  .monthcol{flex:none;width:var(--badge-w);}
  .monthsticky{position:sticky;top:6px;}
  .monthbadge{
    width:calc(var(--badge-w) - var(--gap));
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    background:var(--bg);border:1px solid var(--line);border-radius:7px;
    padding:3px 4px 4px 5px;color:var(--ink2);overflow:hidden;
    transition:background 220ms ease,border-color 220ms ease,color 220ms ease;
  }
  .monthbadge.isnow{border-color:var(--ribbon);}
  .month.active .monthbadge{background:var(--ink);border-color:var(--ink);color:var(--panel);}
  .mname{font:15px/1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .myear{font-size:9.5px;line-height:1;color:var(--mute);font-variant-numeric:tabular-nums;}
  .month.active .myear{color:rgba(var(--panel-rgb),.72);}
  /* Where nothing was written, the book skips — one ruled line carrying the
     span, the way a chapter break stands in for the years it passes over. */
  .gapper{display:flex;align-items:center;padding:3px 0 11px;}
  .gapcol{flex:none;width:var(--badge-w);}
  .gapline{flex:1;display:flex;align-items:center;gap:10px;color:var(--mute);}
  .gapline::before,.gapline::after{content:"";flex:1;height:1px;background:var(--line);}
  .gaptext{font:italic 400 11.5px/1 var(--serif);white-space:nowrap;letter-spacing:.01em;}

  .cells{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cell{
    position:relative;border:none;border-radius:5px;min-height:29px;padding:3px 5px 4px;
    display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;
    gap:3px;transition:background 200ms ease,color 200ms ease;
    /* The ink-weight shading is the theme's own ink at a per-cell strength, so
       a theme change retints every day without a line of script touching the
       grid — which, in a book decades long, is tens of thousands of cells. */
    background:rgba(var(--ink-rgb),var(--cw,0));
  }
  .cell .num{font-family:var(--serif);font-size:12px;line-height:1;font-variant-numeric:tabular-nums;}
  .cell .dots{display:flex;gap:2px;}
  .cell .dots i{width:4px;height:3.5px;border-radius:1px 3px 1px 3px;display:block;}
  .cell.today{box-shadow:inset 0 0 0 1.25px var(--ribbon);}
  .cell.sel{background:var(--ink)!important;color:var(--panel);box-shadow:none;}

  /* ---- seam / ribbon bookmark ---- */
  #seam{
    flex:none;height:15px;display:flex;align-items:flex-start;justify-content:center;
    background:var(--bg);border-top:1px solid var(--line);
    touch-action:none;cursor:grab;
    position:relative;z-index:5;
  }
  /* The line stays 15px; the grab target reaches 10px into each pane, or it is
     about 2mm tall on a phone and impossible to catch with a finger. */
  #seam::before{content:"";position:absolute;left:0;right:0;top:-10px;bottom:-10px;}
  #seam.dragging{cursor:grabbing;}
  .handle{
    position:relative;top:-1px;width:22px;height:26px;
    background:linear-gradient(180deg,var(--ribbon),var(--ribbon-2));
    clip-path:polygon(0 0,100% 0,100% 66%,50% 100%,0 66%);
    box-shadow:0 1px 3px rgba(var(--ink-rgb),.28);
    transition:height 240ms ease,width 240ms ease,background 240ms ease;
  }
  #seam:hover .handle,#seam.dragging .handle{height:33px;width:25px;background:linear-gradient(180deg,var(--ribbon-hi),var(--ribbon-hi-2));}

  /* The calendar marks a new month with a chapter tab; the journal had no
     mark at all, and no year anywhere. This is the same rule the chapter
     break uses, set the other way round — the name first, then the line
     running out to the margin, the way a section opens on a page. */
  .monthrule{
    display:flex;align-items:baseline;gap:8px;
    margin:17px 0 11px calc(var(--badge-w) + 3px);
  }
  #days > .monthrule:first-of-type{margin-top:2px;}
  .monthrule::after{content:"";flex:1;height:1px;background:var(--line);align-self:center;}
  .mrname{font:400 13.5px/1 var(--serif);color:var(--ink2);white-space:nowrap;}
  .mryear{
    font:11px/1 var(--serif);font-variant-numeric:tabular-nums;
    color:var(--mute);white-space:nowrap;
  }

  /* ---- timeline / journal ---- */
  .daygroup{position:relative;display:flex;gap:3px;margin-bottom:9px;}
  /* Stand-ins for the days above and below the window. They hold the scroll
     height and nothing else, so the line down the margin still runs the full
     length of the book. */
  .tl-pad{flex:none;width:100%;pointer-events:none;}
  #days{position:relative;}
  .tl-line{position:absolute;left:calc(var(--badge-w)/2);
    top:0;bottom:0;width:1px;background:var(--rail);opacity:.65;z-index:0;}
  .daycol{flex:none;width:var(--badge-w);position:relative;z-index:2;}
  .daysticky{position:sticky;top:6px;}

  .daybadge{
    width:var(--badge-w);display:flex;align-items:center;gap:4px;overflow:hidden;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:3px 4px 4px 5px;color:var(--ink2);
    transition:background 220ms ease,border-color 220ms ease,color 220ms ease;
  }
  .daybadge.istoday{border-color:var(--ribbon);}
  .daygroup.active .daybadge{background:var(--ink);border-color:var(--ink);color:var(--panel);}
  .bnum{font:15px/1 var(--serif);font-variant-numeric:tabular-nums;}
  .bstack{display:flex;flex-direction:column;line-height:1.12;font-size:9px;
    color:var(--mute);text-align:left;letter-spacing:.01em;white-space:nowrap;}
  .daygroup.active .bstack{color:rgba(var(--panel-rgb),.72);}

  .cards{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;position:relative;z-index:1;}
  .post{
    position:relative;
    border-radius:3px 7px 7px 2px;padding:5px 10px 6px 15px;cursor:pointer;
    background:var(--bg);align-self:flex-start;width:100%;
    transform:translateX(var(--sx,0px)) rotate(var(--tilt,0deg));
    transition:opacity 240ms ease,box-shadow 240ms ease,transform 240ms ease;
    touch-action:pan-y;   /* the pane keeps the vertical, the card takes the horizontal */
  }
  .post:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  /* The ladder, and it is absolute: a card looks the size it is, from every
     height. A map does not fade a city as you zoom out to warn you it is
     about to go — it just gets bolder, and the villages leave when they
     leave. Four channels carry the five grains together, because no single
     one of them can carry five steps: the measure the text is set to, its
     size, its ink, and the width of the pen stroke in the margin. The ragged
     right edge that falls out of it is the point — a month of entries can be
     read for shape before a word of it is read. */
  .post.g1{max-width:70%;}
  .post.g2{max-width:80%;}
  .post.g3{max-width:89%;}
  .post.g4{max-width:96%;}
  .post.g5{max-width:100%;}
  .post.swiping{transition:none;user-select:none;-webkit-user-select:none;}
  .post.settling{transition:transform 260ms cubic-bezier(.2,.7,.3,1),opacity 260ms ease;}
  .post.leaving{transition:transform 260ms ease-in,opacity 260ms ease-in;opacity:0 !important;}
  /* the verdict, written on the card in the direction it is being pulled */
  .swipemark{
    position:absolute;top:1px;bottom:1px;display:flex;align-items:center;
    padding:0 9px;border-radius:6px;background:var(--bg);
    font:600 9.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;
    opacity:0;pointer-events:none;white-space:nowrap;
  }
  .swipemark.l{left:2px;color:var(--mute);}
  .swipemark.r{right:2px;color:var(--ribbon);}
  /* never judged from a distance, and old enough that it could have been:
     a dashed margin, not a prompt. Ignoring it costs nothing. */
  .post.unread::after{
    content:"";position:absolute;inset:-2px -3px;pointer-events:none;
    border:1px dashed var(--rail);border-radius:7px;opacity:.8;
  }
  /* the tag's pen stroke, laid beside the text rather than boxing it in —
     tapered at both ends so it reads as a mark, not a UI border */
  .post::before{
    content:"";position:absolute;left:1px;top:3px;bottom:3px;width:var(--barw,2px);
    background:var(--barc);border-radius:4px;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 16%,#000 84%,transparent);
    mask-image:linear-gradient(180deg,transparent,#000 16%,#000 84%,transparent);
  }
  /* sits on the line, level with its own card — a small ink blot, not a UI
     dot, sized by how hard the pen pressed: a light tap for a passing note,
     a heavy press — already filled in, not just outlined — for what mattered */
  .dot{
    --dotr:4.5px;
    position:absolute;
    left:calc(-1 * (var(--gap) + var(--badge-w)/2 + var(--dotr)));
    top:50%;margin-top:calc(-1 * var(--dotr));
    width:calc(var(--dotr) * 2);height:calc(var(--dotr) * 2);
    border-radius:45% 55% 50% 50%/55% 45% 55% 45%;
    border:1px solid var(--rail);background:var(--panel);display:block;
    transition:background 200ms ease,border-color 200ms ease,transform 200ms ease,width 200ms ease,height 200ms ease;
  }
  .post.g1 .dot{--dotr:3px;opacity:.7;}
  .post.g2 .dot{--dotr:3.8px;}
  .post.g4 .dot{--dotr:5.6px;background:var(--ink2);border-color:var(--ink2);}
  .post.g5 .dot{--dotr:7px;background:var(--ink);border-color:var(--ink);}
  .post.sel .dot{background:var(--ink);border-color:var(--ink);transform:scale(1.3);}

  /* The entry in focus. Nothing here may touch the four channels the ladder
     uses, or a day-sized entry would read as a year-sized one just for being
     scrolled past. Emphasis comes from the ring and the lift instead, and no
     size changes: focus moves with the scroll and nothing is allowed to
     reflow the text under it. */
  .post.sel{
    box-shadow:inset 0 0 0 1.5px var(--ring), 0 1px 5px rgba(var(--ink-rgb),.15);
  }
  .post.sel .note{color:var(--ink);}
  .post:hover{filter:brightness(.985);}
  /* Type size is the loudest of the four channels and the one that costs
     vertical room, so the ramp is gentle at the bottom and only opens up at
     the top, where there is less to fit on a page anyway. Stroke-doubling
     rather than bold for the largest — a heavier nib, not another typeface. */
  .post .line{margin:0;font:400 13px/1.35 var(--serif);color:var(--mute);}
  .post.g2 .line{font-size:13.8px;color:var(--ink2);}
  .post.g3 .line{font-size:14.8px;color:var(--ink2);}
  .post.g4 .line{
    font-size:16.2px;color:var(--ink);
    text-shadow:0.5px 0 currentColor,-0.5px 0 currentColor;
  }
  .post.g5 .line{
    font-size:18.4px;line-height:1.28;color:var(--ink);
    text-shadow:0.6px 0 currentColor,-0.6px 0 currentColor,0 0.4px currentColor;
  }
  .post.g4 .note,.post.g5 .note{color:var(--ink2);}
  .post .time{font:600 11px/1 var(--sans);font-variant-numeric:tabular-nums;
    margin-right:7px;white-space:nowrap;}
  .post .note{
    margin:2px 0 0;font-size:12px;line-height:1.45;color:var(--mute);
  }
  /* Title and note are capped together, by height rather than by line count.
     A clamp counts lines, and a line's capacity depends on the measure — and
     the measure here is one of the four channels significance travels on. So
     equal line counts across the levels produce unequal heights, ranked
     backwards: five lines set to 70% of the column stack taller than five set
     to 100%. Capping the height directly says the thing that was meant. */
  .pbody{position:relative;overflow:hidden;max-height:var(--cap,44px);
    transition:max-height 220ms cubic-bezier(.2,.7,.3,1);}
  .post.g1 .pbody{--cap:38px;}
  .post.g2 .pbody{--cap:42px;}
  .post.g3 .pbody{--cap:48px;}
  .post.g4 .pbody{--cap:60px;}
  .post.g5 .pbody{--cap:76px;}
  /* The card under the reader's eye gets more room, but a fixed amount of it.
     An uncapped focus would change height by however long the note happens to
     be, and since focus follows the scroll, every card would shove the page
     about by an unpredictable distance on its way past the middle. A bounded
     step still moves things — it just moves them the same way every time.
     Both classes are named so this outranks the resting cap above. */
  .post.sel.g1 .pbody{--cap:60px;}
  .post.sel.g2 .pbody{--cap:68px;}
  .post.sel.g3 .pbody{--cap:80px;}
  .post.sel.g4 .pbody{--cap:100px;}
  .post.sel.g5 .pbody{--cap:126px;}
  /* A quote ends in a strip: the note it quotes, one line, across the bottom
     of the card under the card's own filing line — the quote's words, day
     and grain first, what it points at last.

     The journal is windowed: a day's height is estimated from its grains
     before it is ever drawn, and the scroll position is built on those
     estimates. So a quote obeys exactly the rule every card obeys — never
     taller than its grain's cap — and the strip is paid for, not added: it
     takes --qh out of the words' cap and 4px of the card's bottom padding,
     24px in all, which is exactly the strip and its margin. Nothing about
     the quoted note — its length, an edit, its deletion — can change the
     quote's height: the strip is one line whatever it holds.

     Everything that says "this is a quote, and it goes somewhere" is drawn:
     the quote mark in the quoted note's colour, a tinted surface under a
     hairline, a day that isn't the card's own, a chevron at the end. The
     strip runs out to the card's edges, so the whole of it is target. */
  .post{--qh:20px;}
  .post.hasq,html[dir="rtl"] .post.hasq{padding-bottom:2px;}
  .post.hasq .pbody{max-height:calc(var(--cap,44px) - var(--qh));}
  .post.hasq .pbody.clipped::after{height:8px;}
  .qpv{
    position:relative;display:flex;align-items:center;gap:6px;min-width:0;
    height:22px;margin:2px -8px 0 -9px;padding:3px 9px 2px 8px;
    border-top:1px solid var(--line);border-radius:0 0 5px 2px;
    background:var(--sbg,rgba(var(--panel-rgb),.85));
    font:12px/16px var(--serif);color:var(--ink2);
    white-space:nowrap;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background-color 180ms ease,height 220ms cubic-bezier(.2,.7,.3,1);
  }
  html[dir="rtl"] .qpv{margin:2px -9px 0 -8px;padding:3px 8px 2px 9px;border-radius:0 0 2px 5px;}
  /* the target reaches up over the strip's margin, to the filing line */
  .qpv::before{content:"";position:absolute;left:0;right:0;top:-3px;height:3px;}
  /* The strip's surface is the far note's own card colour (--sbg, set where
     the strip is built), so lighting it must keep that colour: a wash of ink
     laid over the tint rather than a swap back to plain panel. */
  @media (hover:hover){ .qpv:not(.gone):hover{background-image:linear-gradient(rgba(var(--ink-rgb),.06),rgba(var(--ink-rgb),.06));} }
  .qpv:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;}
  .qpv.lit{background-image:linear-gradient(rgba(var(--ink-rgb),.06),rgba(var(--ink-rgb),.06));}
  .qpv-mark{flex:none;height:16px;overflow:hidden;
    font:400 22px/27px var(--serif);color:var(--qc,var(--mute));}
  .qpv-head{flex:1;display:flex;align-items:baseline;gap:6px;min-width:0;overflow:hidden;}
  .qpv-when{flex:none;font:600 9px/16px var(--sans);letter-spacing:.045em;text-transform:uppercase;color:var(--mute);}
  .qpv-title{min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .qpv-go{flex:none;font:400 17px/16px var(--sans);color:var(--mute);}
  .qpv[dir="rtl"] .qpv-go{transform:scaleX(-1);}
  .qpv-note{display:none;}
  .qpv.gone{cursor:default;font-style:italic;color:var(--mute);}
  /* In focus the strip opens to two lines — the day and title, then the start
     of the quoted note (or, for a note that is only a title, the rest of the
     title). Focus already raises every card's cap by a fixed step for its
     grain; the strip's second line comes out of that raised cap, exactly as
     its first comes out of the resting one. So a focused quote is never
     taller than any focused card of its grain, and the estimate still has
     nothing about quotes to know. */
  .post.hasq.sel:not(.open):not(.qopen) .pbody{max-height:calc(var(--cap,44px) - var(--qh) - 16px);}
  .post.sel:not(.qopen) .qpv{height:38px;align-items:flex-start;padding-top:4px;padding-bottom:3px;}
  .post.sel:not(.qopen) .qpv-go{align-self:center;}
  .post.sel:not(.qopen) .qpv-head{display:grid;grid-template-columns:auto minmax(0,1fr);
    grid-auto-rows:15px;column-gap:6px;align-items:baseline;overflow:hidden;}
  .post.sel:not(.qopen) .qpv-note{display:block;grid-column:1 / -1;
    font:11.5px/15px var(--sans);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .post.sel:not(.qopen) .qpv.nonote .qpv-title{white-space:normal;display:-webkit-box;
    -webkit-box-orient:vertical;-webkit-line-clamp:2;}
  /* The strip opens on a tap of its own, apart from the card: opening the
     card shows the quote's own words, opening the strip shows the whole of
     the note it quotes, and either can be open without the other. Opened, a
     strip has no cap, exactly like an opened card — something the reader
     asked for, measured when the journal next paints and paid back into the
     scroll like any other height it learns. At rest and in focus nothing
     here applies, so those heights are what they were. The chevron turns
     down while the strip is open. */
  .post.qopen .qpv,#days.finding .qpv{height:auto;align-items:flex-start;white-space:normal;padding-top:4px;padding-bottom:5px;}
  .post.qopen .qpv-head,#days.finding .qpv-head{flex-wrap:wrap;overflow:visible;}
  .post.qopen .qpv-title,#days.finding .qpv-title{overflow:visible;}
  .post.qopen .qpv-note{display:block;flex-basis:100%;margin-top:1px;font:11.5px/1.4 var(--sans);color:var(--mute);white-space:pre-line;}
  .qpv-go{transition:transform 180ms ease;}
  .post.qopen .qpv-go{transform:rotate(90deg);}

  /* A note that has been reflected on lists its reflections when it is
     opened: a label, then a stripe for each, across the bottom of the card.
     The colours run crosswise. A reflection's own card is sepia and its strip
     carries the colour of the note it looks back on; a note keeps its own
     colour and its reflection stripes are sepia — each strip wears the colour
     of the far end of the link.

     Only the opened state has them. At rest and in focus the list isn't laid
     out at all, so those heights are exactly what they were; opened, like any
     opened card, the height is whatever the reader asked to see, measured when
     the journal next paints and paid back into the scroll. */
  .refl{display:none;margin:4px -8px 0 -9px;}
  html[dir="rtl"] .refl{margin:4px -9px 0 -8px;}
  .post.open .refl{display:block;}
  .post.hasrefl.open,html[dir="rtl"] .post.hasrefl.open{padding-bottom:2px;}
  .refl-lb{
    display:block;padding:5px 9px 3px 8px;border-top:1px solid var(--line);
    font:600 9px/14px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--nar-reflect);
  }
  html[dir="rtl"] .refl-lb{padding:5px 8px 3px 9px;letter-spacing:0;}
  .rstrip{
    position:relative;display:flex;align-items:flex-start;gap:6px;min-width:0;
    padding:4px 9px 4px 8px;border-top:1px solid var(--line);
    background:var(--sbg,rgba(var(--panel-rgb),.85));font:12px/16px var(--serif);color:var(--ink2);
    cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color 180ms ease;
  }
  html[dir="rtl"] .rstrip{padding:4px 8px 4px 9px;}
  .refl>.rstrip:last-child,.refl>.refl-more:last-child{border-radius:0 0 5px 2px;}
  html[dir="rtl"] .refl>.rstrip:last-child,html[dir="rtl"] .refl>.refl-more:last-child{border-radius:0 0 2px 5px;}
  @media (hover:hover){ .rstrip:hover{background-image:linear-gradient(rgba(var(--ink-rgb),.06),rgba(var(--ink-rgb),.06));} }
  .rstrip.lit{background-image:linear-gradient(rgba(var(--ink-rgb),.06),rgba(var(--ink-rgb),.06));}
  .rstrip:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;}
  .rs-mark{flex:none;height:16px;overflow:hidden;font:400 22px/27px var(--serif);color:var(--nar-reflect);}
  /* A stripe is never thinner than two lines — the title's 16px and the
     note's 15px — so a reflection with only a title is still a target a
     finger can land twice on. Where there is a note it already fills this. */
  .rs-head{flex:1;min-width:0;min-height:31px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-auto-rows:min-content;column-gap:6px;align-items:baseline;}
  .rs-when{font:600 9px/16px var(--sans);letter-spacing:.045em;text-transform:uppercase;color:var(--mute);white-space:nowrap;}
  .rs-title{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rs-note{grid-column:1 / -1;font:11.5px/15px var(--sans);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rstrip.ropen .rs-title{white-space:normal;overflow:visible;}
  .rstrip.ropen .rs-note{white-space:pre-line;overflow:visible;line-height:1.4;margin-top:1px;}
  .rs-go{flex:none;align-self:center;font:400 17px/16px var(--sans);color:var(--mute);transition:transform 180ms ease;}
  .rstrip[dir="rtl"] .rs-go{transform:scaleX(-1);}
  .rstrip.ropen .rs-go{transform:rotate(90deg);}
  .refl-more{
    display:block;width:100%;padding:6px 9px 6px 30px;border:0;border-top:1px solid var(--line);
    background:transparent;text-align:start;font:600 11px/14px var(--sans);color:var(--ink2);cursor:pointer;
  }
  html[dir="rtl"] .refl-more{padding:6px 30px 6px 9px;}
  @media (hover:hover){ .refl-more:hover{color:var(--ribbon);} }
  /* The cut is shown rather than marked: a half-visible line is unarguable
     evidence of more below, where an ellipsis suggests a sentence was
     trimmed rather than a paragraph held back. */
  .pbody.clipped::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:20px;
    background:linear-gradient(to bottom,rgba(var(--bg-rgb),0),var(--bg));
    pointer-events:none;
  }
  .post.open .pbody{max-height:none;}
  .post.open .pbody::after{display:none;}
  /* A search shows only entries that matched, and the word that matched may
     sit well below any cap. Hiding the hit the reader searched for is worse
     than not marking it at all, so while a search is running nothing is cut. */
  #days.finding .pbody{max-height:none;}
  #days.finding .pbody::after{display:none;}

  /* the filing mark: tag, significance and how far off today it sits —
     always legible, even when the entry is faded into the margin */
  .post .meta{
    margin:3px 0 0;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px;
    font:600 9px/1.3 var(--sans);letter-spacing:.045em;text-transform:uppercase;
  }
  .meta-tag{font-weight:700;text-transform:none;letter-spacing:.01em;font-size:9.5px;}
  .meta-sig{color:var(--mute);}
  .post.g3 .meta-sig{color:var(--ink2);}
  .post.g4 .meta-sig{color:var(--ink2);}
  .post.g5 .meta-sig{color:var(--ink);text-shadow:0.4px 0 currentColor,-0.4px 0 currentColor;}
  .meta-dot{color:var(--rail);}
  .meta-when{
    font:italic 400 11.5px/1 var(--serif);text-transform:none;letter-spacing:0;color:var(--mute);
  }
  /* How many later notes quote this one. It rides in the title line, beside
     the hour, rather than in the filing line underneath: the title line is
     inside the capped box, so the mark can never give a card an extra row.
     Shorter than the line it sits in at every grain, so the line keeps its
     own height too. */
  .qmark{
    display:inline-block;vertical-align:1px;margin-inline-end:6px;padding:0 5px;
    border:1px solid var(--line);border-radius:7px;background:rgba(var(--panel-rgb),.72);
    font:500 10.5px/13px var(--sans);font-variant-numeric:tabular-nums;color:var(--ink2);
    text-shadow:none;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .qmark:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}
  .qmark.lit{background:var(--panel);border-color:var(--rail);}

  .is-empty .pad-top,.is-empty .pad-bottom{height:10px;}
  .pad-top{height:22%;}
  .pad-bottom{height:40%;}
  .pad-cal{height:45%;}

  /* ---- empty book ---- */
  .empty{
    margin:6px 0 0 calc(var(--badge-w) + 3px);padding:18px 16px 20px;
    border:1px dashed var(--line);border-radius:10px;background:var(--bg);
  }
  /* The full wordmark lives where there is room for its detail: over the
     blank book a new reader starts in, and over the shelf. */
  .wordmark{display:block;width:auto;}
  .empty-mark{height:40px;margin:0 0 14px -4px;}
  /* On the shelf the wordmark is the card's title: the dialog is still
     named "The shelf" for screen readers, it just isn't printed. Side
     padding matches the close button so the mark stays centred and clear. */
  .shelf-hd{padding:8px 40px;}
  .shelf-hd .wordmark{height:28px;}
  .empty-h{margin:0;font:400 17px/1.3 var(--serif);color:var(--ink2);}
  .empty-p{margin:5px 0 0;font:12.5px/1.5 var(--sans);color:var(--mute);}
  .empty-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .where-open{display:none;}

  /* ---- the reading height ---- */
  /* A ladder up the right margin. Seven rungs at most, and never a number on
     any of them — the rungs inked in are the grains still on the page, down
     to the one you are standing on.
     It only prints rungs that take something off the page, so you can never
     climb to a height where nothing is written or nothing changes; a rung
     appears the moment a new grain is kept. */
  /* the cards stop short of the rail: it gets a margin rather than sitting
     on top of the text */
  /* overflow-y:auto alone leaves overflow-x computing to auto, which makes
     the pane a horizontal scroller — a gesture the browser will take for
     itself. Nothing here scrolls sideways, and a card flying out to the left
     should be clipped rather than scrolled to. */
  #tlScroll{padding-right:64px;overflow-x:hidden;}
  /* The ladder and its two steps travel together, and the tinted card belongs
     to the pair. The rungs keep their own box: the drag reads a position
     against that box, so an arrow inside it would bend the arithmetic.
     The two trail arrows flank the ladder rather than joining its column, so
     the axis says what it does: up and down is how significant, left and
     right is back and forward through where the reader has been. */
  .railwrap{
    position:absolute;right:2px;top:max(84px,calc(50% - 34px));transform:translateY(-50%);z-index:6;
    display:flex;flex-direction:row;align-items:center;gap:0;
    padding:3px 1px;border-radius:9px;
    background:rgba(var(--panel-rgb),.86);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    opacity:.85;transition:opacity 220ms ease,border-color 220ms ease;
  }
  .railcol{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .railwrap:hover,.railwrap.live,.railwrap:focus-within{opacity:1;border-color:var(--rail);}
  /* A rung is three pixels tall and the whole ladder barely eighty, so tapping
     one exactly is a finger's worth of luck. These are the same move made
     reliably: one level, one press, held down to keep climbing. */
  .railstep{
    width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;
    border:none;background:transparent;color:var(--ink2);border-radius:6px;
    transition:color 160ms ease,opacity 160ms ease;
  }
  .railstep:disabled{opacity:.25;}
  .railstep:not(:disabled):active{color:var(--ribbon);background:rgba(var(--ink-rgb),.05);}
  @media (hover:hover){
    .railstep:not(:disabled):hover{color:var(--ribbon);}
  }
  /* One press, one stop, and no hold-to-repeat: these retrace a path, and
     they stop at either end of it. */
  .railseek{
    width:18px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;
    border:none;background:transparent;color:var(--ink2);border-radius:6px;
    transition:color 160ms ease,opacity 160ms ease;
  }
  .railseek:disabled{opacity:.22;}
  .railseek:not(:disabled):active{color:var(--ribbon);background:rgba(var(--ink-rgb),.05);}
  @media (hover:hover){
    .railseek:not(:disabled):hover{color:var(--ribbon);}
  }
  .zoomrail{
    display:flex;flex-direction:column-reverse;align-items:center;gap:7px;
    padding:5px 1px;
    touch-action:none;cursor:ns-resize;
  }
  .zoomrail:focus-visible{outline:none;}
  /* Dragged down far enough and the journal has no room for both the ladder
     and the writing button down one edge. The ladder is the one that goes:
     pinch and the keyboard still change the height, and pulling the divider
     back up brings it straight back. */
  #tlPane.cramped .railwrap{display:none;}
  /* Each rung is as long as the stretch it stands for is short: the ground,
     where every day is on the page, is the longest, and each grain up is
     shorter, so the ladder narrows the way the page thins as you climb. The
     rungs lit are the grains still on the page — from the top down to where
     you stand — and the ones below you, set aside, go out. */
  .rung{
    width:var(--rw,13px);height:3px;border-radius:2px;background:var(--ink2);opacity:.28;
    transition:height 200ms ease,background 200ms ease,opacity 200ms ease;
  }
  .rung.lit{background:var(--ribbon);opacity:1;}
  /* what this height means, in words, for as long as it takes to read it */
  /* Going back to today is a move you made while scrolling, so it now lives
     above the writing button rather than up here. What is left in this corner
     is the band of blank page the timeline keeps above its first entry. */
  .zoomcap{
    position:absolute;right:14px;top:16px;z-index:6;
    max-width:min(230px,54vw);text-align:right;pointer-events:none;
    font:italic 400 12.5px/1.35 var(--serif);color:var(--ink2);
    background:rgba(var(--panel-rgb),.92);border-radius:7px;padding:4px 8px;
    opacity:0;transition:opacity 260ms ease;
  }
  .zoomcap.show{opacity:1;}

  /* ---- shared buttons ---- */
  .btn{
    border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:7px;
    padding:6px 13px;font:600 12px var(--sans);letter-spacing:.01em;
    transition:background 180ms ease,color 180ms ease,border-color 180ms ease;
  }
  .btn:hover{border-color:var(--ribbon);color:var(--ribbon);}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel);}
  .btn.primary:hover{background:var(--ribbon);border-color:var(--ribbon);color:var(--panel);}
  .btn[disabled]{opacity:.38;cursor:default;border-color:var(--line);color:var(--ink2);background:var(--panel);}
  .btn.quiet{border-color:transparent;background:transparent;color:var(--mute);}
  .btn.quiet:hover{color:var(--ribbon);border-color:var(--line);}
  .btn.danger{border-color:transparent;background:transparent;color:var(--mute);}
  .btn.danger:hover{color:var(--nar-3);border-color:var(--nar-3);}
  .btn.danger.armed{background:var(--nar-3);border-color:var(--nar-3);color:var(--panel);}

  /* ---- the loose leaf: entry editor ---- */
  /* --kb is the height the on-screen keyboard has stolen from the viewport.
     Set from JS (visualViewport); 0 when no keyboard is up. The overlay ends
     where the keyboard begins, so anything anchored to its bottom edge — the
     sheet, its footer — rides above the keys instead of under them. */
  .ov{
    position:fixed;left:0;right:0;top:0;bottom:var(--kb,0px);
    z-index:40;display:flex;align-items:center;justify-content:center;
    padding:16px;background:var(--scrim);
    transition:bottom 140ms ease;
  }
  .ov[hidden]{display:none;}
  .sheet{
    width:min(430px,100%);max-height:min(94dvh,680px);display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 18px 44px rgba(var(--ink-rgb),.32);overflow:hidden;
    animation:rise 220ms cubic-bezier(.2,.7,.3,1);
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985);}}
  .sheet-hd{
    flex:none;display:flex;align-items:center;gap:8px;
    padding:11px 11px 10px 15px;border-bottom:1px solid var(--line);
  }
  .eyebrow{flex:1;font:600 9px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--mute);}
  .x-btn{
    width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:7px;background:transparent;color:var(--mute);
    font:15px/1 var(--sans);transition:color 180ms ease,border-color 180ms ease;
  }
  .x-btn:hover{color:var(--ink);border-color:var(--line);}
  /* Quote sits in the footer with the buttons that end an edit, between
     Cancel and Save — it ends this one and starts the next. Only a note's
     leaf has it: a quote can't be quoted, and a new note has nothing yet to
     quote. The quote mark says what it does before the word is read. */
  .btn-quote{display:inline-flex;align-items:center;gap:4px;padding-left:10px;}
  .btn-quote.stepaside{display:none;}
  .sheet-ft .btn{white-space:nowrap;}
  .btn-quote-g{font:400 18px/12px var(--serif);height:12px;padding-top:5px;color:var(--ribbon);}
  .sheet-bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 15px 17px;display:flex;flex-direction:column;gap:14px;}
  .sheet-ft{
    flex:none;display:flex;align-items:center;gap:8px;padding:10px 11px;
    border-top:1px solid var(--line);background:var(--bg);
  }
  /* Head and foot are the two fixed shores; only the middle scrolls. With the
     keyboard up the sheet gets short, so the body must be allowed to collapse
     rather than push Save off the bottom. */
  .sheet-hd,.sheet-ft{flex-shrink:0;}
  /* one line of warning, fixed above the footer so it is seen before the
     button it is about is pressed */
  .ed-warn{flex:none;display:flex;align-items:center;gap:8px;padding:8px 11px 8px 15px;
    border-top:1px solid var(--line);background:var(--panel);font:12px/1.4 var(--sans);color:var(--ink2);}
  .ed-warn[hidden]{display:none;}
  .ed-warn span{flex:1;}
  .ed-warn .btn{flex:none;border-color:var(--nar-3);color:var(--nar-3);}
  .ed-warn .btn[hidden]{display:none;}
  .sheet-bd{min-height:0;}
  .grow{flex:1;}

  .f-title{
    width:100%;border:none;border-bottom:1px solid var(--line);background:transparent;
    font:400 19px/1.35 var(--serif);color:var(--ink);padding:2px 0 8px;outline:none;
    transition:border-color 180ms ease;
  }
  .f-title:focus{border-bottom-color:var(--ribbon);}
  .f-note{
    width:100%;border:1px solid var(--line);border-radius:8px;background:transparent;resize:vertical;
    font:400 13px/1.5 var(--sans);color:var(--ink2);padding:8px 10px;outline:none;min-height:64px;
    transition:border-color 180ms ease;
  }
  .f-note:focus{border-color:var(--ribbon);}
  .f-title::placeholder,.f-note::placeholder{color:var(--mute);opacity:.8;}
  /* The note being quoted opens the leaf, as the thing being answered, and a
     rule closes it off. Everything below the rule — the words, the day, the
     narratives, the grain — belongs to the quote being written, never to the
     note it quotes. */
  .f-quote{padding-bottom:14px;margin-bottom:2px;border-bottom:1px dashed var(--line);}
  .f-quote[hidden]{display:none;}
  .f-quote-box{
    display:flex;flex-direction:column;gap:3px;padding:7px 10px 8px;
    border:1px solid var(--line);border-inline-start:2px solid var(--qc,var(--rail));
    border-radius:6px;background:var(--bg);
  }
  .f-quote-when{font:600 9px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);}
  .f-quote-title{font:400 14.5px/1.3 var(--serif);color:var(--ink);}
  .f-quote-note{font:12px/1.45 var(--sans);color:var(--mute);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .f-quote-box.gone .f-quote-title{font-style:italic;color:var(--mute);}
  .f-lb{display:block;font:600 9px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--mute);margin-bottom:7px;}
  .f-row{display:flex;gap:9px;}
  .pick{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px;
    border:1px solid var(--line);border-radius:8px;background:transparent;
    padding:6px 10px 8px;text-align:left;color:var(--ink);transition:border-color 180ms ease;
  }
  .pick:hover{border-color:var(--ribbon);}
  .pick-v{font:15px/1.15 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}

  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
    background:transparent;padding:5px 11px 6px 9px;color:var(--ink2);
    font:600 11.5px/1 var(--sans);letter-spacing:.01em;
    transition:background 180ms ease,border-color 180ms ease,color 180ms ease;
  }
  .chip i{width:10px;height:4px;border-radius:1px 4px 1px 4px;display:block;transform:rotate(-6deg);}
  .chip.on{border-color:currentColor;background:rgba(var(--ink-rgb),.05);}

  /* the two standing pills: one opens a blank narrative, one opens the shelf
     where they are all kept. They read as actions, not as things to pick. */
  .chip-add{border-style:dashed;color:var(--ink2);}
  .chip-add:hover{border-color:var(--ribbon);color:var(--ribbon);}
  .chip-manage{border-color:transparent;color:var(--mute);}
  .chip-manage:hover{border-color:var(--line);color:var(--ink2);}
  .chip-none{color:var(--mute);font:12px/1.4 var(--sans);letter-spacing:0;text-transform:none;}

  .swatches{display:flex;flex-wrap:wrap;gap:8px;}
  .sw{
    width:27px;height:27px;flex:none;border-radius:50%;
    border:2px solid transparent;padding:3px;background-clip:content-box;
    transition:border-color 160ms ease,transform 160ms ease;
  }
  .sw:hover{transform:scale(1.08);}
  .sw.on{border-color:var(--ink);}

  .nn-bd{padding:13px 14px 15px;display:flex;flex-direction:column;gap:12px;}
  .man-list{
    max-height:min(48vh,320px);overflow-y:auto;padding:8px 10px;
    display:flex;flex-direction:column;gap:5px;
    scrollbar-width:thin;scrollbar-color:var(--rail) transparent;
  }
  .man-list{position:relative;}
  .man-row{display:flex;align-items:center;gap:8px;}

  /* A narrative's row and its colour picker move as one piece. */
  .man-item{display:flex;flex-direction:column;gap:5px;position:relative;
    border-radius:8px;}
  /* The grip. Its target is a thumb wide though its ink is small, and it
     takes the whole gesture for itself so the list doesn't scroll under a drag. */
  .man-grip{
    flex:none;display:flex;align-items:center;justify-content:center;
    width:24px;height:34px;margin:0 -6px 0 -4px;border:0;border-radius:6px;
    background:transparent;color:var(--rail);cursor:grab;
    touch-action:none;user-select:none;-webkit-user-select:none;
    transition:color 160ms ease;
  }
  .man-grip svg{display:block;fill:currentColor;}
  @media (hover:hover){ .man-grip:hover{color:var(--ink2);} }
  .man-grip:focus-visible{outline:2px solid var(--ribbon);outline-offset:-2px;color:var(--ink2);}
  .man-list.sorting{user-select:none;-webkit-user-select:none;}
  .man-list.sorting .man-item{transition:transform 160ms ease;}
  .man-list.sorting .man-item.dragging{
    transition:none;z-index:2;background:var(--panel);
    box-shadow:0 6px 18px rgba(var(--ink-rgb),.22);
  }
  .man-list.sorting .man-item.dragging .man-grip{color:var(--ribbon);cursor:grabbing;}
  .man-list.settling .man-item.dragging{transition:transform 150ms ease,box-shadow 150ms ease;
    box-shadow:none;}
  .man-dot{
    width:23px;height:23px;flex:none;border-radius:50%;
    border:1px solid var(--line);padding:3px;background-clip:content-box;
    transition:border-color 160ms ease;
  }
  .man-dot:hover{border-color:var(--ribbon);}
  .man-name{
    flex:1;min-width:0;border:1px solid transparent;border-radius:6px;background:transparent;
    color:var(--ink);font:14px/1 var(--serif);padding:6px;outline:none;
    transition:border-color 160ms ease;
  }
  .man-name:hover{border-color:var(--line);}
  .man-name:focus{border-color:var(--ribbon);}
  .man-count{
    flex:none;font:600 9px/1 var(--sans);letter-spacing:.1em;
    text-transform:uppercase;color:var(--mute);white-space:nowrap;
  }
  .man-x{
    flex:none;height:24px;min-width:24px;border:1px solid transparent;border-radius:6px;
    background:transparent;color:var(--mute);font:14px/1 var(--sans);
    transition:color 160ms ease,border-color 160ms ease,background 160ms ease;
  }
  .man-x:hover{color:var(--nar-3);border-color:var(--nar-3);}
  .man-x.armed{
    background:var(--nar-3);border-color:var(--nar-3);color:var(--panel);
    padding:0 9px;font:600 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;
  }
  .man-sw{padding:3px 0 8px 53px;}
  /* a row on the shelf: what the book is called, and when it was last open */
  /* The whole row up to the remove button is the one target: the name, the
     file, the date and the entry count all open the book. */
  .shelf-open{
    flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:8px;
    border:1px solid transparent;border-radius:7px;background:transparent;
    padding:6px 7px;text-align:left;
    transition:border-color 160ms ease;
  }
  .shelf-open:hover{border-color:var(--line);}
  .shelf-txt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;}
  .shelf-open.on{border-color:var(--ribbon);}
  .shelf-nm{
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--ink);font:14px/1.2 var(--serif);
  }
  .shelf-open.on .shelf-nm{color:var(--ribbon);}
  .shelf-sub{font:600 9px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);}
  /* the file the book is saved to, as the file system spells it — not set in
     capitals like the line below it, since a file name's case is part of it */
  .shelf-file{
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    margin:-1px 0 2px;color:var(--ink2);font:11.5px/1.25 var(--sans);
  }
  /* Finding and ordering the shelf. The field filters as it is typed — the
     shelf is short, and a list that answers each letter needs no enter key.
     Only drawn once there are two books to tell apart. */
  .shelf-tools{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);}
  .shelf-tools[hidden]{display:none;}
  .sh-find{
    flex:1;min-width:0;display:flex;align-items:center;gap:6px;
    height:32px;padding:0 4px 0 9px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--mute);cursor:text;
    transition:border-color 160ms ease;
  }
  .sh-find:focus-within{border-color:var(--ribbon);}
  .sh-find svg{flex:none;display:block;}
  .sh-in{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:15px/1.2 var(--serif);padding:3px 0;}
  .sh-in:focus{outline:none;}
  .sh-in::placeholder{color:var(--mute);}
  .sh-x{
    flex:none;display:flex;align-items:center;justify-content:center;
    width:22px;height:22px;border:1px solid transparent;border-radius:6px;
    background:transparent;color:var(--mute);font:12px/1 var(--sans);
  }
  .sh-x[hidden]{display:none;}
  @media (hover:hover){ .sh-x:hover{border-color:var(--line);color:var(--ink2);} }
  .sh-sort{flex:none;}
  .sh-sort .seg{flex:none;height:32px;padding:0 9px;font-size:9.5px;}
  .shelf-none{padding:16px 10px;color:var(--mute);font:13px/1.5 var(--sans);text-align:center;overflow-wrap:anywhere;}
  /* Two shelves behind one door: the books the reader wrote, and the books
     that came with the app. Tabs rather than one long list, because a sample
     is never what you are looking for when you are looking for your own
     notebook — and never in the way when you are not. */
  .shelf-tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);}
  .shelf-tab{
    flex:none;background:transparent;border:0;border-bottom:2px solid transparent;
    margin-bottom:-1px;padding:9px 8px 8px;color:var(--mute);
    font:600 9.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;
    transition:color 160ms ease,border-color 160ms ease;
  }
  @media (hover:hover){ .shelf-tab:hover{color:var(--ink2);} }
  .shelf-tab.on{color:var(--ribbon);border-bottom-color:var(--ribbon);}
  /* What all four samples have in common, said once above the list rather
     than four times inside it. */
  .sample-say{padding:4px 7px 9px;color:var(--mute);font:12px/1.55 var(--sans);}
  .sample-row .shelf-nm{font-style:italic;color:var(--ink2);}
  .sample-row .shelf-open.on .shelf-nm{font-style:italic;color:var(--ribbon);}
  .man-empty{padding:16px 10px;color:var(--mute);font:13px/1.5 var(--sans);text-align:center;}

  .segs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg{
    flex:1;background:transparent;border:none;border-left:1px solid var(--line);
    padding:8px 4px 9px;color:var(--ink2);
    font:600 10px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;
    transition:background 180ms ease,color 180ms ease;
  }
  .seg:first-child{border-left:none;}
  .seg.on{background:var(--ink);color:var(--panel);}
  .segs.grain .seg{padding:8px 2px 9px;letter-spacing:.05em;}

  /* ---- popovers: month grid and clock ---- */
  .pop{
    position:fixed;left:0;right:0;top:0;bottom:var(--kb,0px);
    z-index:50;display:flex;align-items:center;justify-content:center;
    padding:16px;background:var(--scrim);
    transition:bottom 140ms ease;
  }
  .pop[hidden]{display:none;}
  /* Starting a thread is reached from the narratives list as often as from an
     entry, so the two have to stack rather than replace each other. This one
     is always the newer layer, and it dims lightly — a second full scrim over
     the first would bury the list it was opened from. */
  #popNar{z-index:55;background:rgba(var(--ink-rgb),.24);}
  /* Naming a notebook can be asked from over the shelf, so it sits above it. */
  #popName{z-index:56;}
  .pn-say{margin:0;}
  .pn-say[hidden],#pnCancel[hidden]{display:none;}
  .pop-card{
    width:min(322px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 18px 44px rgba(var(--ink-rgb),.32);overflow:hidden;
    animation:rise 200ms cubic-bezier(.2,.7,.3,1);
  }
  .pop-hd{position:relative;display:flex;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid var(--line);}
  /* Taken out of the flow rather than sat beside the title, so the title
     stays centred on the card instead of centred on what's left of it. */
  .pop-x{
    position:absolute;top:50%;right:8px;transform:translateY(-50%);
    display:flex;align-items:center;justify-content:center;
    width:26px;height:26px;border:1px solid transparent;border-radius:7px;
    background:transparent;color:var(--mute);font:13px/1 var(--sans);
    transition:border-color 180ms ease,color 180ms ease;
  }
  @media (hover:hover){ .pop-x:hover{border-color:var(--line);color:var(--ink2);} }
  .pop-ft{display:flex;align-items:center;gap:8px;padding:9px 10px;border-top:1px solid var(--line);}
  .pop-title{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;}
  /* Month and year are wheels you thumb, not text: drag either one up or down
     and it counts on. The window is masked top and bottom so it reads as a
     dial seen through a slot rather than a label that happens to move. */
  .spin{
    position:relative;border:1px solid transparent;border-radius:7px;background:transparent;
    color:var(--ink);font:16px/1 var(--serif);font-variant-numeric:tabular-nums;
    padding:5px 8px 6px;cursor:ns-resize;touch-action:none;
    -webkit-user-select:none;user-select:none;
    transition:background 180ms ease,border-color 180ms ease;
  }
  .spin:hover,.spin.spinning{background:rgba(var(--ink-rgb),.06);border-color:var(--line);}
  .spin::before,.spin::after{
    content:"";position:absolute;left:50%;margin-left:-3px;
    width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;
    opacity:0;transition:opacity 180ms ease;
  }
  .spin::before{top:-1px;border-bottom:3.5px solid var(--mute);}
  .spin::after{bottom:-1px;border-top:3.5px solid var(--mute);}
  .spin:hover::before,.spin:hover::after,.spin.spinning::before,.spin.spinning::after{opacity:1;}

  .dp-week{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 10px 3px;color:var(--mute);font-size:10px;text-align:center;}
  /* Six rows are drawn whatever the month needs, so the card never changes
     height under the pointer, and the grid slides sideways between months. */
  .dp-win{overflow:hidden;padding:2px 10px 11px;touch-action:none;}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .dp-grid.slide{transition:transform 230ms cubic-bezier(.2,.7,.3,1);}
  .dpc{
    aspect-ratio:1;border:none;background:transparent;border-radius:6px;color:var(--ink);
    font:13.5px/1 var(--serif);font-variant-numeric:tabular-nums;
    display:flex;align-items:center;justify-content:center;
    transition:background 160ms ease,color 160ms ease;
  }
  .dpc:hover{background:rgba(var(--ink-rgb),.07);}
  .dpc.barred{opacity:.28;text-decoration:line-through;text-decoration-thickness:1px;cursor:not-allowed;}
  .dpc.out{color:var(--mute);opacity:.45;}
  .dpc.has{font-weight:600;}
  .dpc.tdy{box-shadow:inset 0 0 0 1.25px var(--ribbon);}
  .dpc.on{background:var(--ink);color:var(--panel);}

  .clock-hd{display:flex;align-items:center;justify-content:center;gap:3px;padding:13px 10px 2px;}
  .tseg{
    border:1px solid transparent;border-radius:8px;background:transparent;color:var(--mute);
    font:34px/1 var(--serif);font-variant-numeric:tabular-nums;padding:3px 9px 5px;
    transition:color 180ms ease,border-color 180ms ease;
  }
  .tseg.on{color:var(--ink);border-color:var(--ribbon);}
  .tcol{font:30px/1 var(--serif);color:var(--mute);}
  .ampm{display:flex;flex-direction:column;gap:3px;margin-left:9px;}
  .ampm button{
    border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:6px;
    padding:3px 8px;font:600 10px var(--sans);letter-spacing:.06em;
    transition:background 180ms ease,color 180ms ease,border-color 180ms ease;
  }
  .ampm button.on{background:var(--ink);border-color:var(--ink);color:var(--panel);}
  .dialwrap{padding:2px 12px 8px;display:flex;justify-content:center;touch-action:none;}
  .dialwrap svg{width:100%;max-width:236px;height:auto;display:block;cursor:pointer;user-select:none;}
  .dialwrap.off{opacity:.5;}
  .dial-face{fill:rgba(var(--ink-rgb),.05);}
  .dial-hand{stroke:var(--ribbon);stroke-width:1.7;}
  .dial-hub,.dial-knob{fill:var(--ribbon);}
  .dial-n{fill:var(--ink2);font:14px var(--serif);text-anchor:middle;dominant-baseline:central;}
  .dial-n.on{fill:var(--panel);font-weight:600;}
  .allday{display:flex;align-items:center;gap:7px;flex:1;color:var(--ink2);font:12px var(--sans);cursor:pointer;}
  .allday input{accent-color:var(--ribbon);width:14px;height:14px;}

  /* Cards are deliberately absent here: manipulation hands the horizontal
     back to the browser, which then cancels the pointer two moves into a
     swipe. They set pan-y instead, further up, which suppresses the
     double-tap delay just the same while keeping the sideways gesture. */
  .cell,.dpc{touch-action:manipulation;}

  @media (max-width:620px){
    .ov{padding:0;align-items:flex-end;}
    .sheet{width:100%;max-height:calc(94dvh - var(--kb,0px));
           border-radius:14px 14px 0 0;border-bottom:none;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}

</style>
<style>
  /* Windowed journal: spacing lives inside each block (padding, not margin),
     so offsetHeight is the block's full pitch and nothing depends on which
     rule happens to be first in the rendered window. */
  .daygroup{margin-bottom:0;padding-bottom:9px;}
  .monthrule{margin-top:0;margin-bottom:0;padding:8px 0 11px;}
  #days > .monthrule:first-of-type{margin-top:0;}
  #days > .monthrule.book-first{padding-top:2px;}
  #days .daygroup, #days .monthrule{transition:opacity 140ms ease;}
  #days.gliding .daygroup, #days.gliding .monthrule{opacity:.25;transition:none;}

  /* ---- teaching the height ---- */
  /* A ladder with one height on it is a control that does nothing when it is
     pressed, and the first thing it would teach is that it does nothing. It
     stays folded until the book holds two grains; the trail arrows keep their
     places either side, and the card goes too once they have nowhere to go. */
  .railwrap.noladder .railcol{display:none;}
  .railwrap.noladder.notrail{display:none;}
  /* The moment the ladder arrives is the lesson, so it is marked once: the
     card rings, and the rungs are inked from the ground up. */
  .railwrap.intro{opacity:1;border-color:var(--ribbon);animation:railring 1100ms ease-out 2;}
  @keyframes railring{from{box-shadow:0 0 0 0 var(--ribbon);}to{box-shadow:0 0 0 8px transparent;}}
  .railwrap.intro .rung{animation:rungink 900ms ease both;animation-delay:calc(var(--i,0) * 120ms + 150ms);}
  @keyframes rungink{40%{height:5px;background:var(--ribbon);opacity:1;}}
  /* a saved entry lights the rung it can still be read from */
  .railwrap.lit{opacity:1;border-color:var(--rail);}
  .rung.ping{animation:rungping 1300ms ease;}
  @keyframes rungping{20%,55%{height:6px;background:var(--ribbon);opacity:1;}}
  /* the second line of the caption: what the step took away or gave back */
  .zoomcap .cap-more{display:block;margin-top:1px;font-size:11.5px;color:var(--mute);}
  /* Climbing: what leaves is seen leaving. It steps back toward the margin,
     then the page closes over the gap while the entry being read holds still.
     Coming down, what returns is seen arriving. */
  #days .post.departing{opacity:0;translate:-10px 0;pointer-events:none;
    transition:opacity 160ms ease,translate 160ms ease;}
  #days .closing{overflow:hidden;
    transition:height 200ms cubic-bezier(.3,.6,.3,1),padding 200ms cubic-bezier(.3,.6,.3,1),margin 200ms cubic-bezier(.3,.6,.3,1);}
  #days .post.departing.closing{
    transition:opacity 160ms ease,translate 160ms ease,
      height 200ms cubic-bezier(.3,.6,.3,1),padding 200ms cubic-bezier(.3,.6,.3,1),margin 200ms cubic-bezier(.3,.6,.3,1);}
  #days .post.arriving{animation:postarrive 280ms ease both;}
  @keyframes postarrive{from{opacity:0;translate:-10px 0;}}
  /* the grain, said as what it means for reading */
  .f-hint{margin:7px 0 0;font:italic 400 12.5px/1.4 var(--serif);color:var(--ink2);}
  @media (prefers-reduced-motion:reduce){
    .railwrap.intro,.railwrap.intro .rung,.rung.ping,#days .post.arriving{animation:none;}
  }

  /* ---- the desk: the book lies open ----
     A phone holds the book closed and turns it on its edge: contents above,
     journal below, the ribbon lying across the fold. A desk has the room to
     open it flat, so the same two pages sit side by side — the table of
     contents on the left, the journal on the right — and the fold becomes
     the spine, with the ribbon hanging from its head the way it does in a
     bound book.

     Only for a screen that is both wide and tall. A phone turned on its side
     is wide enough to qualify on width alone, and it is the layout already
     tuned on Android, so it keeps it. */
  @media (min-width:900px) and (min-height:540px){
    :root{
      --calw:420px;       /* the contents page; set from JS as the spine is dragged */
      --measure:780px;    /* the journal's column: long enough for a full-width
                             year-level line, short enough to read in one sweep */
      --rowp:36px;        /* one week row of the contents, gap included */
    }
    #split{flex-direction:row;}
    #split.dragging{cursor:col-resize;}
    #calPane{
