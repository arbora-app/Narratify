function drawReminders(){
  remSub.textContent=tr("Due in the next 7 days","در "+nf(REM_WINDOW)+" روز آینده");
  remList.textContent="";
  var list=dueReminders();
  var now=list.filter(function(x){return x.now;});
  remFt.hidden=!now.length;
  remAll.checked=now.length>0&&now.every(function(x){return x.read;});
  document.getElementById("remAllL").textContent=tr("I have read the reminders","یادآورها را خوانده‌ام");
  if(!list.length){
    remList.appendChild(el("p","rem-empty",
      tr("Nothing is due in the next 7 days. Set a reminder when you write or edit a note.",
         "در "+nf(REM_WINDOW)+" روز آینده یادآوری نیست. هنگام نوشتن یا ویرایش یادداشت می‌توانید یادآور بگذارید.")));
    return;
  }
  var past=list.filter(function(x){return x.e.dk<todayKey;});
  var ahead=list.filter(function(x){return x.e.dk>=todayKey;});
  [[tr("From the past","از گذشته"),past],[tr("From the future","از آینده"),ahead]].forEach(function(sec){
    var box=el("div","rem-sec");
    box.appendChild(el("span","f-lb",sec[0]));
    if(!sec[1].length) box.appendChild(el("p","rem-none",tr("Nothing this week.","این هفته چیزی نیست.")));
    sec[1].forEach(function(it){ box.appendChild(remRow(it)); });
    remList.appendChild(box);
  });
}
remAll.addEventListener("change",function(){
  var on=remAll.checked;
  dueReminders().forEach(function(x){
    if(!x.now) return;
    var r=x.e.rem, at=r.read.indexOf(todayKey);
    if(on&&at<0) r.read.push(todayKey);
    if(!on&&at>=0) r.read.splice(at,1);
    r.read=r.read.filter(function(d){return d===todayKey;});
  });
  persist();
  paintRemDot();
  drawReminders();
});
function remRow(it){
  var e=it.e, title=e.title||tr("Untitled note","یادداشت بی‌عنوان");
  var row=el("div","rem-row"+(it.read?" read":""));
  var go=el("button","rem-go");
  go.type="button";
  var t=el("span","rem-t",title); t.dir="auto";
  go.appendChild(t);
  go.appendChild(el("span","rem-w"+(it.day===todayKey?" now":""),remWhen(it.day)));
  go.setAttribute("title",fmtDate(e.dk));
  go.addEventListener("click",function(){ closeReminders(); showReminded(e.id); });
  row.appendChild(go);
  return row;
}
/* A note behind a filter, a search or a height is brought back into view
   rather than left unreachable, and the reader is told why the page changed. */
function showReminded(id){
  var it=findEntry(id);
  if(!it) return;
  var widened=false;
  if(searching()&&!matchText(it)){clearSearch(false);widened=true;}
  if(filtering()&&!matchNar(it)){narFilter=[];widened=true;}
  if(!matchChap(it)){dropChapFilter();widened=true;}
  if(it.imp<zoom){zoom=1;widened=true;}
  selected=it.dk; selectedItem=it.id;
  refresh(false);
  selected=it.dk; selectedItem=it.id;
  renderSelection();
  scrollCalendarTo(it.dk,true);
  focusEntry(it.id,true);
  if(widened) toast(tr("Showing the whole notebook to reach this note.",
                       "برای رسیدن به این یادداشت، همهٔ دفترچه نمایش داده شد."));
}

/* ------------------------------- theme toggle ----------------------------- */
/* No stylesheet edit needed to switch modes: every color already lives in
   CSS custom properties, so flipping [data-theme] on <html> retints the
   page instantly. The handful of colors JS baked into inline styles and
   custom properties at build time (tag swatches, the tinted post fill,
   the day's ink-weight shading) don't hear about that change on their own,
   so repaint() re-reads the fresh tokens and touches up just those. */
var themeState=null;   /* null = follow the system; else "light" | "dark" */
var prefersDark=window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");

function effectiveTheme(){
  if(themeState) return themeState;
  return (prefersDark && prefersDark.matches) ? "dark" : "light";
}
function repaint(){
  dropColorCache();
  NEUTRAL=cssVar("--mute");
  PANEL=cssVar("--panel"); INK_RGB=cssVar("--ink-rgb");

  var swatches=document.querySelectorAll("i[data-nar]");
  for(var i=0;i<swatches.length;i++) swatches[i].style.background=narColor(swatches[i].dataset.nar);

  var mt=document.querySelectorAll(".meta-tag[data-nar]");
  for(var j=0;j<mt.length;j++) mt[j].style.color=narColor(mt[j].dataset.nar);

  var posts=document.querySelectorAll(".post[data-imp]");
  for(var k=0;k<posts.length;k++){
    var p=posts[k];
    var nar=p.dataset.nar?p.dataset.nar.split(","):[];
    paintTags(p,nar,+p.dataset.w||MID);
    var tm=p.querySelector(".time");
    if(tm) tm.style.color=leadColor(nar);
  }

  var strips=document.querySelectorAll(".qpv[data-far],.rstrip[data-far]");
  for(var s2=0;s2<strips.length;s2++) paintStrip(strips[s2]);

  /* calendar cells need nothing: their shading is var(--ink-rgb) in CSS */

  buildNarbar();
  if(draft) buildChips();
  if(!popMan.hidden) drawManage();
}
function updateToggleUI(){ paintSet(); }
function applyTheme(state){
  themeState=state;
  if(state) document.documentElement.setAttribute("data-theme",state);
  else document.documentElement.removeAttribute("data-theme");
  repaint();
  updateToggleUI();
}
if(prefersDark && prefersDark.addEventListener){
  prefersDark.addEventListener("change",function(){
    if(!themeState){ repaint(); updateToggleUI(); }
  });
}

/* ---------------------------------- start -------------------------------- */
/* The shelf is in hand already; the book comes out of IndexedDB, which means
   the page is built one turn later than it used to be. */

/* -------------------------------- chapters -------------------------------- */
/* A chapter is a gathering of notes the reader chose, and it holds them the
   way a table of contents holds its pages: by reference. Nothing is copied.
   Editing a note edits it in every chapter it sits in; deleting a note takes
   it out of them. The order is always the notebook's own, by day and hour, so
   a chapter can never disagree with the book about when something happened.

     id     "c1", "c2", …
     title  the reader's name for it
     ids    its notes, by id — renumbered along with them on every open
     at     when it was made
     tpl    the template it was last printed in
     refl   whether the reflections on its notes print with them (1 / 0) */
var chapters=[], nextChapId=1;
var TEMPLATES=["journal","manuscript","timeline","cards"];

/* idMap is normalize's own record of old id -> new id; notes is the list the
   ids have to land in. A note that didn't arrive leaves its chapters quietly. */
function cleanChapters(list,idMap,notes){
  var have={}, out=[], seen={};
  (notes||[]).forEach(function(e){have[e.id]=1;});
  (Array.isArray(list)?list:[]).forEach(function(c){
    if(!c||typeof c!=="object") return;
    var id=String(c.id||"");
    if(!/^c\d+$/.test(id)||seen[id]) id="";
    if(id) seen[id]=1;
    var ids=[], got={};
    (Array.isArray(c.ids)?c.ids:[]).forEach(function(x){
      var v=validId(x);
      if(v==null) return;
      var to=idMap?idMap[v]:v;
      if(to==null||!have[to]||got[to]) return;
      got[to]=1; ids.push(to);
    });
    out.push({id:id,title:String(c.title||"").replace(/\s+/g," ").trim().slice(0,80),ids:ids,
      at:+c.at||Date.now(),tpl:TEMPLATES.indexOf(c.tpl)>=0?c.tpl:"journal",refl:c.refl===0?0:1});
  });
  nextChapId=1;
  out.forEach(function(c){var m=/^c(\d+)$/.exec(c.id); if(m&&+m[1]>=nextChapId) nextChapId=+m[1]+1;});
  out.forEach(function(c){if(!c.id) c.id="c"+(nextChapId++);});
  return out;
}
function chaptersOut(){
  return (chapters||[]).map(function(c){
    return {id:c.id,title:c.title,ids:c.ids.slice(),at:c.at,tpl:c.tpl,refl:c.refl};
  });
}
function chapById(id){
  for(var i=0;i<chapters.length;i++) if(chapters[i].id===id) return chapters[i];
  return null;
}
function chaptersOf(noteId){
  return chapters.filter(function(c){return c.ids.indexOf(noteId)>=0;});
}
function dropFromChapters(gone){
  chapters.forEach(function(c){c.ids=c.ids.filter(function(id){return !gone[id];});});
}
/* the chapter's notes, in the notebook's own order */
function chapterNotes(c){
  var inC={};
  c.ids.forEach(function(id){inC[id]=1;});
  return entries.filter(function(e){return inC[e.id];});
}
function chapterName(c){return (c&&c.title)||tr("Untitled chapter","فصل بی‌نام");}
function quoteName(s){return isFa()?"«"+s+"»":"\u201c"+s+"\u201d";}
/* "3 – 9 April 2026", "28 March – 9 April 2026", "30 December 2025 – 2 January 2026" */
function spanLabel(a,b){
  if(!a) return "";
  if(a===b) return fullDate(a);
  var ca=cdate(a), cb=cdate(b);
  if(ca.y!==cb.y) return fullDate(a)+" \u2013 "+fullDate(b);
  if(ca.m!==cb.m) return dayMonth(a)+" \u2013 "+fullDate(b);
  return nf(ca.d)+" \u2013 "+fullDate(b);
}
function chapterSpan(list){return list.length?spanLabel(list[0].dk,list[list.length-1].dk):"";}
/* Anything a chapter changes is a change to the notebook, so a loan becomes
   a notebook of its own the moment one is made in it. */
function chaptersChanged(){writeIn(); persist(); if(chapFilter) syncChapFilter();}

/* ---- reading a chapter in the notebook ----
   The notebook narrowed to one chapter's notes, the same way a narrative or a
   search narrows it, and combined with them. It opens on the ground floor so
   every note in the chapter is on the page, and the pill at the front of the
   narrative bar says whose notes these are and how many of them are showing.
   Like a search it is a question asked now, not a place kept with the book. */
var chapFilter=null, chapSet={}, chapFilterSig="", selReturn=null;
var CHAP_READ_TAUGHT="narratify.chapReadTaught";
function matchChap(e){return !chapFilter||!!chapSet[e.id];}
function setChapSet(c){
  chapSet={};
  if(c) c.ids.forEach(function(id){chapSet[id]=1;});
  chapFilterSig=c?c.ids.join(","):"";
}
/* forgets the chapter without rebuilding; for callers already rebuilding */
function dropChapFilter(){chapFilter=null; setChapSet(null);}
function readChapter(id){
  var c=chapById(id);
  if(!c) return;
  var notes=chapterNotes(c);
  if(!notes.length) return;
  if(zoomAnim) finishZoom(true);
  if(selMode) stopSelecting();
  closeChapShelf();
  chapFilter=c.id; setChapSet(c);
  zoom=1;
  var widened=false;
  if(!notes.some(visible)){
    narFilter=[];
    if(searching()) clearSearch(false);
    widened=true;
  }
  var first=notes.filter(visible)[0]||notes[0];
  selected=first.dk; selectedItem=first.id;
  refresh(false);
  selected=first.dk; selectedItem=first.id;
  renderSelection();
  scrollCalendarTo(first.dk,true);
  focusEntry(first.id,true);
  if(widened) toast(tr("Narratives and search cleared, so the chapter's notes can show.",
                       "روایت‌ها و جستجو کنار رفتند تا یادداشت‌های فصل دیده شوند."));
  else if(!lsGet(CHAP_READ_TAUGHT)){
    lsSet(CHAP_READ_TAUGHT,"1");
    hint(tr("Only this chapter's notes are showing. The \u2715 on the chapter pill brings back the whole notebook.",
            "فقط یادداشت‌های این فصل نمایش داده می‌شوند. \u2715 روی برچسب فصل همهٔ دفترچه را برمی‌گرداند."));
  }
}
function leaveChapterView(){
  if(!chapFilter) return;
  dropChapFilter();
  applyFilter();
}
/* a chapter that changed while being read: renamed, gathered again, emptied, removed */
function syncChapFilter(){
  var c=chapById(chapFilter);
  if(!c||!c.ids.length){leaveChapterView(); return;}
  if(c.ids.join(",")!==chapFilterSig){setChapSet(c); applyFilter();}
  else buildNarbar();
}
/* after a delete, which rebuilds by itself */
function chapFilterFollow(){
  var c=chapById(chapFilter);
  if(!c||!c.ids.length) dropChapFilter(); else setChapSet(c);
}
/* returns whether a chapter is being read, so the bar knows to stay up */
function paintChapPill(){
  var box=document.getElementById("nbChap");
  if(!box) return false;
  var c=chapFilter?chapById(chapFilter):null;
  box.hidden=!c;
  if(!c) return false;
  var notes=chapterNotes(c), v=notes.filter(visible).length, n=notes.length;
  document.getElementById("nbcName").textContent=chapterName(c);
  document.getElementById("nbcN").textContent=v===n?nf(n):tr(v+" of "+n,nf(v)+" از "+nf(n));
  var go=document.getElementById("nbcGo"), x=document.getElementById("nbcX");
  go.title=tr("Open this chapter","باز کردن این فصل");
  go.setAttribute("aria-label",tr("Reading the chapter ","در حال خواندن فصل ")+chapterName(c)+tr(", ","، ")+
    (v===n?notesN(n):tr(v+" of "+n+" notes showing",nf(v)+" از "+nf(n)+" یادداشت در نما")));
  x.title=tr("Show the whole notebook","نمایش همهٔ دفترچه");
  x.setAttribute("aria-label",x.title);
  return true;
}

/* The editor's delete warning names the chapters a note would leave. */
function draftChapters(){return (draft&&draft.id!=null)?chaptersOf(draft.id):[];}
function chapterWarn(lead){
  var cs=draftChapters();
  if(!cs.length) return "";
  var names=cs.map(function(c){return quoteName(chapterName(c));}).join(tr(", ","، "));
  if(isFa()) return lead+(cs.length===1
    ?"این یادداشت در فصل "+names+" است؛ با حذف، از آن فصل هم بیرون می‌رود."
    :"این یادداشت در "+nf(cs.length)+" فصل است ("+names+")؛ با حذف، از همهٔ آن‌ها بیرون می‌رود.");
  return lead+(cs.length===1
    ?"It is in the chapter "+names+"; deleting takes it out."
    :"It is in "+cs.length+" chapters ("+names+"); deleting takes it out of them.");
}

/* -------------------------------- holding --------------------------------- */
/* A hold is the one gesture the page had left: a tap looks, a double-tap
   opens, a swipe files, a pinch climbs. Held still for a breath, a note offers
   what can be done with it; a day in the calendar does the same for its days.

   The hold gives way to everything already claimed. Moving further than a
   fingertip's wobble is a swipe or a scroll, a second finger is a pinch, and
   the lift that ends a hold is never also read as a tap. A right-click, the
   context-menu key and Shift+F10 are the same hold for a mouse and a keyboard. */
var HOLD_MS=480, HOLD_SLOP=9, HOLD_QUIET=700;
var holdAbort=null;
function armHold(node,onHold,canStart){
  var pid=null, x0=0, y0=0, timer=0, firedAt=0;
  function cancel(){
    clearTimeout(timer); timer=0; pid=null;
    node.classList.remove("pressing");
    if(holdAbort===cancel) holdAbort=null;
  }
  function fire(ev){
    firedAt=Date.now();
    if(ev.touch&&navigator.vibrate){try{navigator.vibrate(10);}catch(err){}}
    try{var s=window.getSelection(); if(s&&s.removeAllRanges) s.removeAllRanges();}catch(err){}
    onHold(ev);
  }
  function quiet(e){
    if(Date.now()-firedAt>=HOLD_QUIET) return;
    e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation();
  }
  node.addEventListener("pointerdown",function(e){
    if(e.button) return;
    if(pid!==null){cancel();return;}          /* a second finger is a pinch */
    if(!ov.hidden||(canStart&&!canStart(e))) return;
    if(holdAbort) holdAbort();
    pid=e.pointerId; x0=e.clientX; y0=e.clientY;
    var touch=e.pointerType==="touch", shift=e.shiftKey;
    holdAbort=cancel;
    node.classList.add("pressing");
    timer=setTimeout(function(){
      cancel();
      fire({x:x0,y:y0,shift:shift,touch:touch});
    },HOLD_MS);
  });
  node.addEventListener("pointermove",function(e){
    if(pid===null||e.pointerId!==pid) return;
    if(Math.abs(e.clientX-x0)>HOLD_SLOP||Math.abs(e.clientY-y0)>HOLD_SLOP) cancel();
  });
  node.addEventListener("pointerup",function(e){if(e.pointerId===pid) cancel();});
  node.addEventListener("pointercancel",function(e){if(e.pointerId===pid) cancel();});
  node.addEventListener("click",quiet,true);
  node.addEventListener("dblclick",quiet,true);
  node.addEventListener("contextmenu",function(e){
    e.preventDefault();
    /* a finger's own long press raises this too; the timer already has it */
    if(pid!==null||Date.now()-firedAt<HOLD_QUIET) return;
    if(!ov.hidden||(canStart&&!canStart(e))) return;
    fire({x:e.clientX,y:e.clientY,shift:e.shiftKey,touch:false});
  });
}
/* A wheel moves the page out from under a pointer that hasn't moved. */
tlScroll.addEventListener("wheel",function(){if(holdAbort) holdAbort();},{passive:true});
calScroll.addEventListener("wheel",function(){if(holdAbort) holdAbort();},{passive:true});

/* Five plain taps on notes and no hold yet: the hold is said once, on this device. */
var HOLD_TAUGHT="narratify.holdTaught", SEL_TAUGHT="narratify.selTaught", tapsSeen=0;
function noteTapped(){
  if(++tapsSeen!==5||lsGet(HOLD_TAUGHT)) return;
  lsSet(HOLD_TAUGHT,"1");
  setTimeout(function(){
    if(selMode||!holdMenu.hidden) return;
    hint(tr("Hold a note to set a reminder, reflect on it, or start selecting notes for a chapter.",
            "یادداشتی را نگه دارید تا برایش یادآور بگذارید، بر آن تأمل کنید یا برای یک فصل یادداشت انتخاب کنید."));
  },600);
}

/* Everything a card needs for holding and selecting. Called from buildPost
   before the card's own tap handlers, so a selection tap can keep the tap. */
function armCard(a,it){
  armHold(a,function(ev){
    if(selMode) rangeTo(it.id);
    else openHoldMenu(it,a,ev);
  },function(){return !railLive&&!pinch;});
  a.addEventListener("click",function(e){
    if(!selMode){noteTapped();return;}
    e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation();
    if(e.shiftKey) rangeTo(it.id); else togglePick(it.id);
  },true);
  a.addEventListener("dblclick",function(e){
    if(!selMode) return;
    e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation();
  },true);
  a.addEventListener("keydown",function(e){
    if(!selMode||e.target!==a) return;
    if(e.key!==" "&&e.key!=="Enter") return;
    e.preventDefault();
    if(e.shiftKey) rangeTo(it.id); else togglePick(it.id);
  });
  if(selMode) dressPick(a,it.id);
}

/* ---- the hold menu ----
   Three things, and only the ones that make sense for this note: a reflection
   can't be reflected on, so it offers two. It opens above the finger, where
   the hand isn't, and goes away the moment anything else is touched. */
var holdMenu=document.getElementById("holdMenu");
var hmRemind=document.getElementById("hmRemind");
var hmReflect=document.getElementById("hmReflect");
var hmSelect=document.getElementById("hmSelect");
var holdFor=null, holdCard=null, holdAt=0;
/* A toast that only offers to go somewhere is done with once the reader goes
   somewhere else; an Undo keeps its full time. */
function dropGoToast(){
  if(!toastEl.hidden&&toastAct.dataset.go==="1"){clearTimeout(toastTimer); toastEl.hidden=true;}
}
function openHoldMenu(it,card,ev){
  dropGoToast();
  lsSet(HOLD_TAUGHT,"1");
  closeHoldMenu();
  clearTimeout(tapTimer);
  holdFor=it.id; holdCard=card; holdAt=Date.now();
  card.classList.add("held");
  hmReflect.hidden=(it.q!=null);
  disarmHoldDelete();
  holdMenu.hidden=false;
  var r=card.getBoundingClientRect(), x=ev.x, y=ev.y, keyed=(!x&&!y);
  if(keyed){x=r.left+r.width/2; y=r.top+12;}
  holdAt0={x:x,y:y};
  placeHoldMenu();
  if(keyed){
    var first=holdMenu.querySelector(".hm-btn:not([hidden])");
    if(first) try{first.focus({preventScroll:true});}catch(err){first.focus();}
  }
}
var holdAt0={x:0,y:0};
function placeHoldMenu(){
  var x=holdAt0.x, y=holdAt0.y;
  var w=holdMenu.offsetWidth, h=holdMenu.offsetHeight;
  var vw=window.innerWidth, vh=window.innerHeight;
  var left=Math.max(8,Math.min(vw-w-8,x-w/2));
  var top=y-h-20;
  if(top<56) top=Math.min(vh-h-8,y+24);
  holdMenu.style.left=left+"px";
  holdMenu.style.top=top+"px";
}
function closeHoldMenu(){
  if(holdMenu.hidden) return;
  disarmHoldDelete();
  var wasIn=holdMenu.contains(document.activeElement), card=holdCard;
  holdMenu.hidden=true;
  if(holdCard) holdCard.classList.remove("held");
  holdFor=null; holdCard=null;
  if(wasIn&&card&&card.isConnected) try{card.focus({preventScroll:true});}catch(err){}
}
document.addEventListener("pointerdown",function(e){
  if(!holdMenu.hidden&&!holdMenu.contains(e.target)) closeHoldMenu();
},true);
/* the rebuilds that follow a hold can nudge the page; only a real scroll closes it */
tlScroll.addEventListener("scroll",function(){if(!holdMenu.hidden&&Date.now()-holdAt>400) closeHoldMenu();},{passive:true});
window.addEventListener("resize",closeHoldMenu);
holdMenu.addEventListener("keydown",function(e){
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight"&&e.key!=="ArrowUp"&&e.key!=="ArrowDown") return;
  e.preventDefault();
  var bs=[].slice.call(holdMenu.querySelectorAll(".hm-btn:not([hidden])"));
  var at=bs.indexOf(document.activeElement);
  var fwd=(e.key==="ArrowRight"||e.key==="ArrowDown")!==(isFa()&&(e.key==="ArrowLeft"||e.key==="ArrowRight"));
  var n=bs[(at+(fwd?1:-1)+bs.length)%bs.length];
  if(n) n.focus();
});
hmRemind.addEventListener("click",function(){
  var id=holdFor; closeHoldMenu();
  if(id!=null) openEditor(id,null,null,"rem");
});
hmReflect.addEventListener("click",function(){
  var id=holdFor; closeHoldMenu();
  if(id!=null) openEditor(null,null,id);
});
hmSelect.addEventListener("click",function(){
  var id=holdFor; closeHoldMenu();
  if(id!=null) startSelecting(id);
});

/* ---- deleting from a hold ----
   The first tap arms it and says what else the delete would touch: the
   reflections that would be left quoting nothing, the chapters the note would
   leave. The second tap deletes, and the toast can put everything back — the
   note, its place in its chapters, and the reflections' link to it. */
var hmDelete=document.getElementById("hmDelete"), hmWarn=document.getElementById("hmWarn");
var hmDelArmed=false, hmDelTimer=0;
function disarmHoldDelete(){
  clearTimeout(hmDelTimer); hmDelTimer=0;
  if(!hmDelArmed) return;
  hmDelArmed=false;
  hmDelete.classList.remove("armed");
  document.getElementById("hmDeleteL").textContent=tr("Delete","\u062d\u0630\u0641");
  hmWarn.hidden=true; hmWarn.textContent="";
  holdMenu.style.width="";
  if(!holdMenu.hidden) placeHoldMenu();
}
function holdDeleteSays(it){
  var bits=[];
  var refl=it.q==null?(quotedBy[it.id]||[]).filter(function(q){return !!findEntry(q);}).length:0;
  if(refl) bits.push(tr((refl===1?"Its reflection stays, reflecting":"Its "+refl+" reflections stay, reflecting")+" on a deleted note.",
                        (refl===1?"تأمل آن":nf(refl)+" تأمل آن")+" می‌ماند و بر یادداشتی حذف‌شده تأمل خواهد کرد."));
  var cs=chaptersOf(it.id);
  if(cs.length===1) bits.push(tr("It leaves the chapter "+quoteName(chapterName(cs[0]))+".",
                                 "از فصل "+quoteName(chapterName(cs[0]))+" بیرون می‌رود."));
  else if(cs.length>1) bits.push(tr("It leaves "+cs.length+" chapters.","از "+nf(cs.length)+" فصل بیرون می‌رود."));
  return bits.join(" ");
}
hmDelete.addEventListener("click",function(){
  var it=holdFor!=null?findEntry(holdFor):null;
  if(!it){closeHoldMenu();return;}
  if(!hmDelArmed){
    hmDelArmed=true;
    holdMenu.style.width=holdMenu.offsetWidth+"px";
    hmDelete.classList.add("armed");
    document.getElementById("hmDeleteL").textContent=tr("Confirm","\u062a\u0623\u06cc\u06cc\u062f");
    var say=holdDeleteSays(it);
    hmWarn.textContent=say; hmWarn.hidden=!say;
    placeHoldMenu();
    hmDelTimer=setTimeout(disarmHoldDelete,4500);
    return;
  }
  var id=it.id;
  closeHoldMenu();
  deleteNote(id);
});
function deleteNote(id){
  var e=findEntry(id);
  if(!e) return;
  if(zoomAnim) finishZoom(true);
  writeIn();
  var sid=String(id);
  delete openPosts[id]; delete openStrips[id]; delete allRefl[id];
  Object.keys(openRefl).forEach(function(k){
    var two=k.split(":"); if(two[0]===sid||two[1]===sid) delete openRefl[k];
  });
  var inChaps=chaptersOf(id).map(function(c){return {c:c,at:c.ids.indexOf(id)};});
  var wasReading=chapFilter;
  entries=entries.filter(function(x){return x.id!==id;});
  var gone={}; gone[id]=1;
  dropFromChapters(gone);
  if(chapFilter) chapFilterFollow();
  var anchor=selected, held=(selectedItem===id)?null:selectedItem;
  refresh(false);
  keepPlace(anchor,held);
  var title=e.title||tr("Untitled","بی‌عنوان");
  toast(tr("Deleted "+quoteName(title)+".","\u00ab"+title+"\u00bb حذف شد."),function(){
    if(findEntry(id)) return;
    if(zoomAnim) finishZoom(true);
    writeIn();
    entries.push(e);
    inChaps.forEach(function(r){
      if(chapters.indexOf(r.c)<0||r.c.ids.indexOf(id)>=0) return;
      r.c.ids.splice(Math.min(r.at,r.c.ids.length),0,id);
    });
    if(wasReading&&!chapFilter&&chapById(wasReading)){chapFilter=wasReading;}
    if(chapFilter) setChapSet(chapById(chapFilter));
    selected=e.dk; selectedItem=id;
    refresh(false);
    selected=e.dk; selectedItem=id;
    renderSelection();
    scrollCalendarTo(e.dk,false);
    focusEntry(id,false);
    toast(tr("Note restored.","یادداشت بازگردانده شد."));
  });
}

/* ------------------------------- selecting -------------------------------- */
/* Selection is a mode, and the page says so: every card grows a ring to fill,
   one tap fills or empties it, and the bar at the foot counts what is held.
   A swipe can't file anything and a double-tap opens nothing while it lasts.

   A hold in the journal works like Shift: everything between the last note
   held and this one is taken in — everything that is in view, that is, at this
   height, in these narratives and under this search, because the journal is
   what the reader is looking at. A hold on two days of the calendar takes in
   the days between. The calendar is a map of the whole notebook, so when some
   of those days' notes are out of view it asks which were meant, with both
   counts, rather than choosing silently. */
var selMode=false, picked={}, anchor=null, selChap=null, selSayTimer=0, pickDays={};
var selBar=document.getElementById("selBar");
var sbN=document.getElementById("sbN"), sbSub=document.getElementById("sbSub");
var sbAdd=document.getElementById("sbAdd"), sbMake=document.getElementById("sbMake");
var sbClose=document.getElementById("sbClose");
var selAsk=document.getElementById("selAsk");
var saH=document.getElementById("saH"), saP=document.getElementById("saP");
var saAll=document.getElementById("saAll"), saView=document.getElementById("saView"), saNo=document.getElementById("saNo");

function pickedList(){return entries.filter(function(e){return picked[e.id];});}
function entryIndex(id){
  for(var i=0;i<entries.length;i++) if(entries[i].id===id) return i;
  return -1;
}
/* fromId: the note the selection starts with. chapId: a chapter whose notes
   are being gathered again — its notes arrive already picked. */
function startSelecting(fromId,chapId){
  closeHoldMenu();
  if(zoomAnim) finishZoom();
  selMode=true; picked={}; anchor=null; selChap=chapId||null;
  var c=selChap?chapById(selChap):null;
  if(c) c.ids.forEach(function(id){picked[id]=1;});
  if(fromId!=null&&findEntry(fromId)){picked[fromId]=1; anchor={id:fromId};}
  document.documentElement.classList.add("selecting");
  tlScroll.querySelectorAll(".post[data-item]").forEach(function(p){dressPick(p,+p.dataset.item);});
  selBar.hidden=false;
  paintPicks();
  measureClips();
  if(!lsGet(SEL_TAUGHT)){
    lsSet(SEL_TAUGHT,"1");
    hint(tr("Tap notes to select them. Hold another note to take in every note in view between the two.",
            "روی یادداشت‌ها ضربه بزنید تا انتخاب شوند. یادداشت دیگری را نگه دارید تا هر یادداشتِ در نما میان این دو هم انتخاب شود."));
  }
}
function stopSelecting(){
  if(!selMode) return;
  selMode=false; picked={}; anchor=null; selChap=null;
  clearTimeout(selSayTimer); selSayTimer=0; selBar.classList.remove("told");
  closeAsk();
  document.documentElement.classList.remove("selecting");
  tlScroll.querySelectorAll(".post[data-item]").forEach(undressPick);
  if(selBar.contains(document.activeElement)) document.activeElement.blur();
  selBar.hidden=true;
  paintPickCells();
  measureClips();
  if(selReturn){
    var back=chapById(selReturn);
    selReturn=null;
    if(back&&back.ids.length){chapFilter=back.id; setChapSet(back); applyFilter();}
  }
}
function dressPick(p,id){
  p.classList.add("selectable");
  p.classList.toggle("picked",!!picked[id]);
  if(!p.querySelector(".pick-tick")){
    var t=el("span","pick-tick");
    t.setAttribute("aria-hidden","true");
    p.appendChild(t);
  }
}
function undressPick(p){
  p.classList.remove("selectable","picked");
  var t=p.querySelector(".pick-tick");
  if(t) t.parentNode.removeChild(t);
}
function togglePick(id){
  closeAsk();
  if(picked[id]) delete picked[id]; else picked[id]=1;
  paintPicks();
}
/* a note deleted mid-selection is no longer held */
function prunePicks(){
  var have={};
  entries.forEach(function(e){have[e.id]=1;});
  for(var id in picked) if(!have[id]) delete picked[id];
  if(anchor&&anchor.id!=null&&!have[anchor.id]) anchor=null;
}
function paintPicks(){
  tlScroll.querySelectorAll(".post[data-item]").forEach(function(p){
    p.classList.toggle("picked",!!picked[+p.dataset.item]);
  });
  paintPickCells();
  paintSelBar();
}
/* a small ribbon mark in the corner of every day holding a selected note */
function paintPickCells(){
  var olds=calScroll.querySelectorAll(".cell.haspick");
  for(var i=0;i<olds.length;i++) olds[i].classList.remove("haspick");
  pickDays={};
  if(!selMode) return;
  var days=pickDays;
  entries.forEach(function(e){if(picked[e.id]) days[e.dk]=1;});
  Object.keys(days).forEach(function(dk){
    var cell=calScroll.querySelector('[data-date="'+dk+'"]');
    if(cell) cell.classList.add("haspick");
  });
}
function paintSelBar(){
  if(!selMode) return;
  var n=0, out=0;
  entries.forEach(function(e){
    if(!picked[e.id]) return;
    n++;
    if(!visible(e)) out++;
  });
  var c=selChap?chapById(selChap):null;
  sbN.textContent=n?tr(n+" selected",nf(n)+" انتخاب‌شده"):tr("Tap notes to select","روی یادداشت‌ها ضربه بزنید");
  if(!selSayTimer){
    var bits=[];
    if(c) bits.push(tr("Editing ","ویرایش ")+quoteName(chapterName(c)));
    if(out) bits.push(tr(out+" of them out of view",nf(out)+" از آن‌ها بیرون از نما"));
    sbSub.textContent=bits.join(tr(" \u00b7 "," \u00b7 "));
    sbSub.hidden=!bits.length;
  }
  sbAdd.hidden=!!c||!chapters.length;
  sbAdd.disabled=!n;
  sbMake.textContent=c?tr("Save chapter","ذخیرهٔ فصل"):tr("Make chapter","ساختن فصل");
  sbMake.disabled=!c&&!n;
}
/* A line the bar says for a moment, in place of its usual one: what a hold
   just did, including what it left out. */
function saySel(msg){
  clearTimeout(selSayTimer);
  sbSub.textContent=msg; sbSub.hidden=false;
  selBar.classList.add("told");
  selSayTimer=setTimeout(function(){
    selSayTimer=0; selBar.classList.remove("told"); paintSelBar();
  },3200);
}
/* A hold in the journal: from the last hold to this note, taking in what is
   in view. The two notes held are always taken, even if a pinch has since put
   one of them out of view. */
function rangeTo(id){
  closeAsk();
  var ti=entryIndex(id);
  if(ti<0) return;
  prunePicks();
  if(!anchor){
    picked[id]=1; anchor={id:id};
    paintPicks();
    saySel(tr("Hold another note to take in every note in view between the two.",
              "یادداشت دیگری را نگه دارید تا هر یادداشتِ در نما میان این دو انتخاب شود."));
    return;
  }
  var lo, hi, i;
  if(anchor.id!=null){
    var ai=entryIndex(anchor.id);
    lo=Math.min(ai,ti); hi=Math.max(ai,ti);
  }else{
    /* the last hold was a day in the calendar */
    var dk=anchor.dk, tdk=entries[ti].dk;
    if(tdk>=dk){
      lo=ti; for(i=0;i<entries.length;i++) if(entries[i].dk>=dk){lo=i;break;}
      hi=ti;
    }else{
      lo=ti; hi=ti;
      for(i=entries.length-1;i>=0;i--) if(entries[i].dk<=dk){hi=i;break;}
    }
  }
  var took=0, left=0;
  for(i=lo;i<=hi;i++){
    var e=entries[i];
    if(visible(e)||e.id===id||(anchor.id!=null&&e.id===anchor.id)){picked[e.id]=1; took++;}
    else left++;
  }
  anchor={id:id};
  paintPicks();
  var msg=tr(notesN(took)+" selected between the two",notesN(took)+" میان این دو انتخاب شد");
  if(left) msg+=tr("; "+left+" out of view left out","؛ "+nf(left)+" یادداشتِ بیرون از نما کنار ماند");
  saySel(msg+tr(".","."));
}
/* A hold in the calendar. With nothing held yet it takes that day; with a
   note or a day held before it, every day between. */
function holdDay(k){
  closeHoldMenu();
  if(!selMode) startSelecting(null);
  prunePicks();
  var from=null;
  if(anchor){
    if(anchor.dk) from=anchor.dk;
    else{var ae=findEntry(anchor.id); if(ae) from=ae.dk;}
  }
  var a=from||k, b=k;
  if(a>b){var s=a; a=b; b=s;}
  anchor={dk:k};
  var all=entries.filter(function(e){return e.dk>=a&&e.dk<=b;});
  var inView=all.filter(visible);
  if(!all.length){
    paintPicks();
    saySel(from
      ?tr("Nothing is written between "+spanLabel(a,b)+".","میان "+spanLabel(a,b)+" چیزی نوشته نشده است.")
      :tr("Nothing is written on "+fullDate(k)+". Hold another day to take in the days between.",
          "در "+fullDate(k)+" چیزی نوشته نشده است. روز دیگری را نگه دارید تا روزهای میان آن دو انتخاب شوند."));
    return;
  }
  if(inView.length===all.length){takeDays(all,a,b,from);return;}
  closeAsk();
  saH.textContent=spanLabel(a,b);
  var n=all.length, v=inView.length;
  saP.textContent=v
    ?tr(notesN(n)+" on "+(a===b?"this day":"these days")+": "+v+" in view, "+(n-v)+" out of view at this height, filter or search.",
        notesN(n)+" در "+(a===b?"این روز":"این روزها")+": "+nf(v)+" در نما، "+nf(n-v)+" بیرون از نما در این ارتفاع، فیلتر یا جستجو.")
    :tr(notesN(n)+" on "+(a===b?"this day":"these days")+", and none of them is in view.",
        notesN(n)+" در "+(a===b?"این روز":"این روزها")+"، و هیچ‌کدام در نما نیست.");
  saView.hidden=!v;
  saView.textContent=tr("Only the "+v+" in view","فقط "+nf(v)+" یادداشتِ در نما");
  saAll.textContent=tr("All "+n,"همهٔ "+nf(n));
  saAll.className="btn"+(v?"":" primary");
  saView.onclick=function(){closeAsk(); takeDays(inView,a,b,from);};
  saAll.onclick=function(){closeAsk(); takeDays(all,a,b,from);};
  selAsk.hidden=false;
}
function takeDays(list,a,b,from){
  list.forEach(function(e){picked[e.id]=1;});
  paintPicks();
  var msg=tr(notesN(list.length)+" selected from "+spanLabel(a,b)+".",notesN(list.length)+" از "+spanLabel(a,b)+" انتخاب شد.");
  if(!from) msg+=tr(" Hold another day to take in the days between."," روز دیگری را نگه دارید تا روزهای میان آن دو هم انتخاب شوند.");
  saySel(msg);
}
function closeAsk(){
  if(selAsk.hidden) return;
  if(selAsk.contains(document.activeElement)) document.activeElement.blur();
  selAsk.hidden=true;
}
saNo.addEventListener("click",closeAsk);
sbClose.addEventListener("click",stopSelecting);
sbMake.addEventListener("click",function(){
  var c=selChap?chapById(selChap):null;
  if(c){
    c.ids=pickedList().map(function(e){return e.id;});
    chaptersChanged();
    stopSelecting();
    toast(tr(quoteName(chapterName(c))+" saved with "+notesN(c.ids.length)+".",quoteName(chapterName(c))+" با "+notesN(c.ids.length)+" ذخیره شد."),
      function(){openChapShelf(c.id);},tr("Open","باز کن"));
    return;
  }
  makeChapter();
});
sbAdd.addEventListener("click",openChapPick);

/* Named on the way in, and named plainly: a chapter's name is what the shelf
   and the printed page will both carry. */
function makeChapter(){
  var list=pickedList();
  if(!list.length) return;
  askName({title:tr("New chapter","فصل تازه"),ok:tr("Make chapter","ساختن فصل"),
           placeholder:tr("Untitled chapter","فصل بی‌نام"),
           say:tr(notesN(list.length)+", "+chapterSpan(list)+". The notes stay where they are in the notebook; the chapter links to them.",
                  notesN(list.length)+"، "+chapterSpan(list)+". یادداشت‌ها سر جایشان در دفترچه می‌مانند؛ فصل فقط به آن‌ها پیوند می‌دهد.")},
    function(name){
      var c={id:"c"+(nextChapId++),title:name,ids:list.map(function(e){return e.id;}),
             at:Date.now(),tpl:"journal",refl:1};
      chapters.push(c);
      chaptersChanged();
      stopSelecting();
      toast(tr("Chapter "+quoteName(chapterName(c))+" made, "+notesN(c.ids.length)+". It is on the chapter shelf.",
               "فصل "+quoteName(chapterName(c))+" با "+notesN(c.ids.length)+" ساخته شد. در قفسهٔ فصل‌ها است."),
        function(){openChapShelf(c.id);},tr("Open","باز کن"));
    });
}

/* ---- adding to a chapter that exists ---- */
var popChapPick=document.getElementById("popChapPick");
var cpList=document.getElementById("cpList");
function newestFirst(){return chapters.slice().reverse();}
function openChapPick(){
  if(!pickedList().length) return;
  drawChapPick();
  popChapPick.hidden=false;
}
function drawChapPick(){
  var list=pickedList();
  cpList.textContent="";
  newestFirst().forEach(function(c){
    var have={};
    c.ids.forEach(function(id){have[id]=1;});
    var fresh=list.filter(function(e){return !have[e.id];});
    var row=el("div","man-row");
    var b=el("button","shelf-open");
    b.type="button";
    var txt=el("span","shelf-txt");
    var nm=el("span","shelf-nm",chapterName(c)); nm.dir="auto";
    txt.appendChild(nm);
    txt.appendChild(el("span","shelf-sub",notesN(c.ids.length)));
    b.appendChild(txt);
    b.appendChild(el("span","man-count",fresh.length?tr("+"+fresh.length+" new","+"+nf(fresh.length)+" تازه"):tr("all there","همه هست")));
    b.addEventListener("click",function(){
      closeChapPick();
      c.ids=c.ids.concat(fresh.map(function(e){return e.id;}));
      if(fresh.length) chaptersChanged();
      stopSelecting();
      toast(fresh.length
        ?tr("Added "+notesN(fresh.length)+" to "+quoteName(chapterName(c))+"; it holds "+notesN(c.ids.length)+" now.",
            notesN(fresh.length)+" به "+quoteName(chapterName(c))+" افزوده شد؛ اکنون "+notesN(c.ids.length)+" دارد.")
        :tr("All of them were already in "+quoteName(chapterName(c))+".","همهٔ آن‌ها از پیش در "+quoteName(chapterName(c))+" بودند."),
        function(){openChapShelf(c.id);},tr("Open","باز کن"));
    });
    row.appendChild(b);
    cpList.appendChild(row);
  });
}
function closeChapPick(){popChapPick.hidden=true;}
document.getElementById("cpClose").addEventListener("click",closeChapPick);
popChapPick.addEventListener("click",function(e){if(e.target===popChapPick) closeChapPick();});

/* ----------------------------- the chapter shelf ---------------------------- */
/* Kept under the notebook's menu, beside the shelf of notebooks, and set the
   same way: a name, what it covers, how much it holds. A chapter opens to its
   notes, which lead back into the journal, and to the three things a chapter
   is for: gathering its notes again, printing it, and putting it away. */
var popChap=document.getElementById("popChap");
var chTitle=document.getElementById("chTitle"), chBack=document.getElementById("chBack");
var chBody=document.getElementById("chBody"), chFt=document.getElementById("chFt");
var chapView=null, chNameTimer=0;
function openChapShelf(id){
  dropGoToast();
  closeMenu(); closeHoldMenu(); closeChapPick();
  chapView=(id&&chapById(id))?id:null;
  drawChap();
  popChap.hidden=false;
}
function closeChapShelf(){
  flushChapName();
  if(popChap.contains(document.activeElement)) document.activeElement.blur();
  popChap.hidden=true;
  chapView=null;
}
function flushChapName(){
  if(!chNameTimer) return;
  clearTimeout(chNameTimer); chNameTimer=0;
  chaptersChanged();
}
function drawChap(){
  if(chapView&&!chapById(chapView)) chapView=null;
  if(chapView) drawChapter(chapById(chapView)); else drawChapShelf();
}
function footBtn(cls,label,fn){
  var b=el("button","btn"+(cls?" "+cls:""),label);
  b.type="button";
  b.addEventListener("click",fn);
  chFt.appendChild(b);
  return b;
}
function drawChapShelf(){
  flushChapName();
  chTitle.textContent=tr("Chapter shelf","قفسهٔ فصل‌ها");
  chBack.hidden=true;
  chBody.textContent=""; chFt.textContent="";
  var list=el("div","man-list ch-list");
  if(!chapters.length){
    list.appendChild(el("p","man-empty",
      tr("No chapters yet. Hold a note, choose Select, tap the notes that belong together, then Make chapter.",
         "هنوز فصلی نیست. یادداشتی را نگه دارید، «انتخاب» را بزنید، روی یادداشت‌هایی که با هم‌اند ضربه بزنید و سپس «ساختن فصل» را بزنید.")));
  }
  newestFirst().forEach(function(c){
    var notes=chapterNotes(c);
    var row=el("div","man-row");
    var open=el("button","shelf-open");
    open.type="button";
    var txt=el("span","shelf-txt");
    var nm=el("span","shelf-nm",chapterName(c)); nm.dir="auto";
    txt.appendChild(nm);
    txt.appendChild(el("span","shelf-sub",notes.length?chapterSpan(notes):tr("no notes","بدون یادداشت")));
    open.appendChild(txt);
    open.appendChild(el("span","man-count",notesN(notes.length)));
    open.addEventListener("click",function(){chapView=c.id; drawChap(); chBody.scrollTop=0;});
    row.appendChild(open);
    var x=el("button","man-x","\u2715");
    x.type="button";
    x.setAttribute("aria-label",tr("Remove ","حذف ")+chapterName(c));
    var armed=false;
    x.addEventListener("click",function(){
      if(!armed){
        armed=true; x.classList.add("armed"); x.textContent=tr("Remove","حذف");
        setTimeout(function(){if(armed){armed=false;x.classList.remove("armed");x.textContent="\u2715";}},4000);
        return;
      }
      removeChapter(c);
    });
    row.appendChild(x);
    list.appendChild(row);
  });
  chBody.appendChild(list);
  var say=el("span","ch-foot-say",tr("A chapter links to notes; it copies nothing.","فصل به یادداشت‌ها پیوند می‌دهد و چیزی را کپی نمی‌کند."));
  chFt.appendChild(say);
  footBtn("primary",tr("New chapter","فصل تازه"),function(){
    closeChapShelf();
    if(!entries.length){toast(tr("The notebook is blank \u2014 write a note first.","دفترچه خالی است \u2014 اول یادداشتی بنویسید."));return;}
    startSelecting(null);
  });
}
function removeChapter(c){
  var at=chapters.indexOf(c);
  if(at<0) return;
  chapters.splice(at,1);
  chaptersChanged();
  if(chapView===c.id) chapView=null;
  if(!popChap.hidden) drawChap();
  toast(tr("Chapter "+quoteName(chapterName(c))+" taken off the shelf. Its notes are still in the notebook.",
           "فصل "+quoteName(chapterName(c))+" از قفسه برداشته شد. یادداشت‌هایش هنوز در دفترچه‌اند."),function(){
    chapters.splice(Math.min(at,chapters.length),0,c);
    chaptersChanged();
    if(!popChap.hidden) drawChap();
    toast(tr("Chapter back on the shelf.","فصل به قفسه برگشت."));
  });
}
function drawChapter(c){
  chTitle.textContent=tr("Chapter","فصل");
  chBack.hidden=false;
  chBody.textContent=""; chFt.textContent="";
  var notes=chapterNotes(c);

  var head=el("div","ch-head");
  var nm=el("input","f-title ch-name");
  nm.type="text"; nm.maxLength=80; nm.value=c.title;
  nm.placeholder=tr("Untitled chapter","فصل بی‌نام");
  nm.setAttribute("aria-label",tr("Chapter name","نام فصل"));
  nm.autocomplete="off"; nm.spellcheck=false;
  nm.addEventListener("input",function(){

  nm.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();nm.blur();}});

  head.appendChild(el("p","f-hint",notes.length
    ?notesN(notes.length)+tr(", ","، ")+chapterSpan(notes)
    :tr("No notes in this chapter. Gather some with Edit notes.","این فصل یادداشتی ندارد. با «ویرایش یادداشت‌ها» گردشان بیاورید.")));
  chBody.appendChild(head);

  if(notes.length){
    var list=el("div","man-list ch-notes");
    notes.forEach(function(e){
      var row=el("div","man-row");

      go.type="button";

      if(isFa()) w.dir="rtl";
      go.appendChild(w);
      var t=el("span","ch-t",(e.q!=null?"\u201c ":"")+(e.title||tr("Untitled","بی‌عنوان")));
      t.dir="auto";
      go.appendChild(t);
      go.title=tr("Go to this note","رفتن به این یادداشت");
      go.addEventListener("click",function(){closeChapShelf(); showReminded(e.id);});
      row.appendChild(go);
      var x=el("button","man-x","\u2715");
      x.type="button";
      x.setAttribute("aria-label",tr("Take ","بیرون آوردن ")+quoteName(e.title||tr("Untitled","بی‌عنوان"))+tr(" out of the chapter"," از فصل"));
      x.title=tr("Take out of the chapter","بیرون آوردن از فصل");
      x.addEventListener("click",function(){
        var was=c.ids.slice();
        c.ids=c.ids.filter(function(id){return id!==e.id;});
        chaptersChanged(); drawChap();
        toast(tr("Taken out of the chapter. The note is still in the notebook.","از فصل بیرون آمد. یادداشت هنوز در دفترچه است."),function(){
          c.ids=was; chaptersChanged();
          if(!popChap.hidden) drawChap();
        });
      });
      row.appendChild(x);
      list.appendChild(row);
    });

  var del=footBtn("danger",tr("Delete","حذف"),function(){

      setTimeout(function(){if(del.isConnected){del.classList.remove("armed");del.textContent=tr("Delete","حذف");}},4000);
      return;
    }
    removeChapter(c);
  });
  chFt.appendChild(el("span","grow"));
  footBtn("",tr("Edit notes","ویرایش یادداشت‌ها"),function(){
    closeChapShelf();

    startSelecting(null,c.id);
  });
  var reading=(chapFilter===c.id);

                  :tr("Show only this chapter's notes in the notebook","نمایش فقط یادداشت‌های این فصل در دفترچه");

/* ---------------------------------- print ---------------------------------- */
/* A chapter prints as a page of its own, built fresh from the notes as they
   stand. It is always set on paper, whatever the screen is reading by, and
   in the reader's language and calendar. The preview is that very page, so
   Print prints what is shown, and Save as page keeps a copy that opens
   anywhere, for a browser that won't print from inside another page. */
var popPrint=document.getElementById("popPrint");
var prTpl=document.getElementById("prTpl"), prSay=document.getElementById("prSay");
var prView=document.getElementById("prView"), prFrame=document.getElementById("prFrame");
var prRefl=document.getElementById("prRefl"), prReflRow=document.getElementById("prReflRow");
var prGo=document.getElementById("prGo"), prSave=document.getElementById("prSave");
var printFor=null, prReady=false, prWant=false;
var PAGE_W=794;
function tplNames(){return isFa()?["دفترچه","دست‌نوشته","خط زمان","کارت‌ها"]:["Notebook","Manuscript","Timeline","Cards"];}
function tplSays(){
  return isFa()?[
    "مثل خود دفترچه: روز به روز، هر یادداشت به اندازهٔ حدّش، با روایت‌هایش.",
    "برای خواندن پیوسته: تاریخ، عنوان و متن، و دیگر هیچ.",
    "ستونی از تاریخ‌ها در حاشیه؛ فشرده، برای یادداشت‌های بسیار.",
    "دو کارت در هر ردیف، هر یادداشت روی یک کارت."
  ]:[
    "Set like the notebook: day by day, each note at the size of its grain, with its narratives.",
    "For reading straight through: dates, titles and words, and nothing else.",
    "A column of dates down the margin; compact, for many notes.",
    "Two to a row, one note to a card."
  ];
}
function chapterHasOuterReflections(c){
  var inC={};
  c.ids.forEach(function(id){inC[id]=1;});
  return chapterNotes(c).some(function(e){
    return e.q==null&&(quotedBy[e.id]||[]).some(function(q){return !inC[q]&&!!findEntry(q);});
  });
}
function openPrint(c){
  printFor=c.id;
  popPrint.hidden=false;
  drawPrint();
}
function closePrint(){
  if(popPrint.contains(document.activeElement)) document.activeElement.blur();
  popPrint.hidden=true;
  printFor=null; prReady=false; prWant=false;
  prFrame.removeAttribute("srcdoc");
}
function drawPrint(){
  var c=chapById(printFor);
  if(!c){closePrint();return;}
  document.getElementById("prTitle").textContent=tr("Print chapter","چاپ فصل");
  prTpl.textContent="";
  prTpl.setAttribute("aria-label",tr("Template","قالب"));
  var names=tplNames();
  TEMPLATES.forEach(function(t,i){
    var b=el("button","seg",names[i]);
    b.type="button"; b.setAttribute("role","radio");
    var on=c.tpl===t;
    b.classList.toggle("on",on);
    b.setAttribute("aria-checked",on?"true":"false");
    b.addEventListener("click",function(){
      if(c.tpl===t) return;
      c.tpl=t; chaptersChanged(); drawPrint();
    });
    prTpl.appendChild(b);
  });
  prSay.textContent=tplSays()[Math.max(0,TEMPLATES.indexOf(c.tpl))];
  var hasRefl=chapterHasOuterReflections(c);
  prReflRow.hidden=!hasRefl;
  prRefl.checked=!!c.refl;
  document.getElementById("prReflL").textContent=tr("With the reflections written on these notes","همراه با تأمل‌هایی که بر این یادداشت‌ها نوشته شده");
  prSave.textContent=tr("Save as page","ذخیره به‌صورت صفحه");
  prGo.textContent=tr("Print","چاپ");
  prFrame.title=tr("Preview of the printed chapter","پیش‌نمایش فصل چاپی");
  prReady=false;
  prFrame.srcdoc=chapterDoc(c,c.tpl,hasRefl&&!!c.refl);
  requestAnimationFrame(fitPreview);
}
function fitPreview(){
  if(popPrint.hidden) return;
  var w=prView.clientWidth, h=prView.clientHeight;
  if(!w) return;
  var s=w/PAGE_W;
  prFrame.style.width=PAGE_W+"px";
  prFrame.style.height=Math.ceil(h/s)+"px";
  prFrame.style.transform="scale("+s+")";
}
window.addEventListener("resize",fitPreview);
prFrame.addEventListener("load",function(){
  if(!prFrame.getAttribute("srcdoc")) return;
  prReady=true;
  if(prWant){prWant=false; printNow();}
});
prRefl.addEventListener("change",function(){
  var c=chapById(printFor);
  if(!c) return;
  c.refl=prRefl.checked?1:0;
  chaptersChanged(); drawPrint();
});
function printNow(){
  var w=prFrame.contentWindow;
  try{w.focus(); w.print();}
  catch(err){
    toast(tr("This browser won't print from here. Save as page, then print that page.",
             "این مرورگر از اینجا چاپ نمی‌کند. آن را به‌صورت صفحه ذخیره کنید و آن صفحه را چاپ کنید."));
  }
}
prGo.addEventListener("click",function(){
  if(!chapById(printFor)) return;
  if(!prReady){prWant=true;return;}
  printNow();
});
prSave.addEventListener("click",function(){
  var c=chapById(printFor);
  if(!c) return;
  var html=chapterDoc(c,c.tpl,chapterHasOuterReflections(c)&&!!c.refl);
  var a=document.createElement("a");
  var url=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  a.href=url; a.download=(fileBase(chapterName(c))||"chapter")+".html";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1500);
  toast(tr("Chapter saved as a page.","فصل به‌صورت صفحه ذخیره شد."));
});
document.getElementById("prClose").addEventListener("click",closePrint);
popPrint.addEventListener("click",function(e){if(e.target===popPrint) closePrint();});

/* The page itself. Paper is always light, so the inks are the daylight ones,
   written out rather than read from the stylesheet the screen is using. */
var PRINT_INK=["#9C8967","#35527C","#3F6B45","#A24B5E","#A97B23","#6B4E8E","#257A87","#9C5626","#6E7A34","#4C5A6B","#7A3F6B"];
function inkFor(id){
  if(id===REFLECT) return "#7D6A56";
  var n=id?narById(id):null;
  return n?(PRINT_INK[n.c]||PRINT_INK[0]):"#CBB88C";
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"]/g,function(ch){
    return ch==="&"?"&amp;":ch==="<"?"&lt;":ch===">"?"&gt;":"&quot;";
  });
}

function chapterDoc(c,tpl,withRefl){
  var notes=chapterNotes(c), inC={};
  notes.forEach(function(e){inC[e.id]=1;});
  function dirOf(e){return textDir((e.title||"")+" "+(e.note||""));}
  function title(e){return esc(e.title||tr("Untitled","بی‌عنوان"));}
  function noteP(e){return e.note?'<p class="n">'+esc(e.note)+'</p>':"";}
  function altOn(dk){return DUAL?'<span class="alt">'+esc(altFull(dk))+'</span>':"";}
  function tm(e){return e.t?'<span class="tm">'+esc(fmtTime(e.t))+'</span>':"";}
  function quoted(e){
    if(e.q==null) return "";
    var t=e.q?findEntry(e.q):null;
    return '<p class="of">'+esc(t
      ?tr("Reflecting on ","تأمل بر ")+quoteName(t.title||tr("Untitled","بی‌عنوان"))+tr(", ","، ")+fmtDate(t.dk)
      :tr("Reflecting on a note that has been deleted","تأمل بر یادداشتی که حذف شده است"))+'</p>';
  }
  function refls(e){
    if(!withRefl||e.q!=null) return "";
    var qs=(quotedBy[e.id]||[]).map(findEntry).filter(function(q){return q&&!inC[q.id];});
    if(!qs.length) return "";
    return '<div class="rfs">'+qs.map(function(q){
      return '<div class="rf" dir="'+dirOf(q)+'"><p class="rf-when">'+esc(fmtDate(q.dk))+
        '</p><h4 class="t">'+title(q)+'</h4>'+noteP(q)+'</div>';
    }).join("")+'</div>';
  }
  function tags(e){
    var ns=narsOf(e);
    if(!ns.length) return esc(tr("no narrative","بدون روایت"));
    return ns.map(function(id){return '<span style="color:'+inkFor(id)+'">'+esc(narName(id))+'</span>';})
      .join('<span class="sep"> \u00b7 </span>');
  }
  function lead(e){var ns=narsOf(e); return inkFor(ns[0]||"");}

  var body="";
  if(!notes.length){
    body='<p class="empty">'+esc(tr("This chapter holds no notes.","این فصل یادداشتی ندارد."))+'</p>';
  }else if(tpl==="manuscript"){
    body='<div class="ms">'+notes.map(function(e){
      return '<article class="note" dir="'+dirOf(e)+'"><p class="when">'+esc(weekLong(e.dk)+tr(", ","، ")+fullDate(e.dk))+
        (e.t?esc(tr(", ","، ")+fmtTime(e.t)):"")+altOn(e.dk)+'</p><h3 class="t">'+title(e)+'</h3>'+
        noteP(e)+quoted(e)+refls(e)+'</article>';
    }).join('<p class="orn" aria-hidden="true">\u2042</p>')+'</div>';
  }else if(tpl==="timeline"){
    var lastY=null;
    notes.forEach(function(e){
      var y=ykey(e.dk);
      if(y!==lastY){body+='<h2 class="yr">'+esc(yearLabel(y))+'</h2>'; lastY=y;}
      body+='<article class="row g'+e.imp+'" style="--bc:'+lead(e)+'"><div class="when"><b>'+esc(dayMonth(e.dk))+
        '</b><span>'+esc(weekLong(e.dk)+(e.t?tr(", ","، ")+fmtTime(e.t):""))+'</span>'+altOn(e.dk)+
        '</div><i class="dot"></i><div class="what" dir="'+dirOf(e)+'"><h3 class="t">'+title(e)+'</h3>'+
        noteP(e)+quoted(e)+refls(e)+'</div></article>';
    });
  }else if(tpl==="cards"){
    body='<div class="deck">'+notes.map(function(e){
      return '<article class="card" style="--bc:'+lead(e)+'" dir="'+dirOf(e)+'"><p class="when">'+
        esc(fullDate(e.dk)+(e.t?tr(", ","، ")+fmtTime(e.t):""))+altOn(e.dk)+'</p><h3 class="t">'+title(e)+'</h3>'+
        noteP(e)+quoted(e)+'<p class="meta">'+tags(e)+'</p>'+refls(e)+'</article>';
    }).join("")+'</div>';
  }else{
    tpl="journal";
    var lastM=null, lastD=null, open=false;
    notes.forEach(function(e){
      var mk=mkey(e.dk), cd=cdate(e.dk);
      if(mk!==lastM){
        if(open){body+='</div></section>'; open=false;}
        body+='<h2 class="mo">'+esc(MONTHS[cd.m-1])+' <span>'+esc(yearLabel(pad4(cd.y)))+'</span></h2>';
        lastM=mk; lastD=null;
      }
      if(e.dk!==lastD){
        if(open) body+='</div></section>';
        body+='<section class="day"><div class="dd"><b>'+esc(nf(cd.d))+'</b><span>'+esc(weekLong(e.dk))+'</span>'+
          altOn(e.dk)+'</div><div class="dn">';
        open=true; lastD=e.dk;
      }
      body+='<article class="note g'+e.imp+'" style="--bc:'+lead(e)+'" dir="'+dirOf(e)+'"><h3 class="t">'+tm(e)+title(e)+'</h3>'+
        noteP(e)+quoted(e)+'<p class="meta">'+tags(e)+'<span class="sep"> \u00b7 </span>'+esc(SIG_LABELS[e.imp-1])+'</p>'+
        refls(e)+'</article>';
    });
    if(open) body+='</div></section>';
  }
  var sub=[notes.length?chapterSpan(notes):"",notesN(notes.length)].filter(Boolean).join(" \u00b7 ");
  return '<!doctype html><html lang="'+LANG+'" dir="'+(isFa()?"rtl":"ltr")+'"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>'+esc(chapterName(c)+(bookName?" \u2014 "+bookName:""))+'</title><style>'+printCSS()+'</style></head>'+
    '<body class="t-'+tpl+'"><main class="doc"><header class="hd">'+
    (bookName?'<p class="bk" dir="auto">'+esc(bookName)+'</p>':"")+
    '<h1 dir="auto">'+esc(chapterName(c))+'</h1><p class="sp">'+esc(sub)+'</p></header>'+body+
    '<footer class="ft">'+esc(tr("From Narratify, ","از Narratify، ")+fullDate(todayKey))+'</footer></main></body></html>';
}

/* Leaving a notebook leaves its selection, its menus and its chapter panels. */
function leaveChapters(){
  selReturn=null;
  stopSelecting();
  dropChapFilter();
  var pill=document.getElementById("nbChap"); if(pill) pill.hidden=true;
  closeHoldMenu();
  closeChapPick();
  if(!popPrint.hidden) closePrint();
  if(!popChap.hidden) closeChapShelf();
}
/* the words the new panels carry that the stylesheet's markup can't */
function paintChapWords(){
  document.getElementById("hmRemindL").textContent=tr("Remind","یادآور");
  document.getElementById("hmReflectL").textContent=tr("Reflect","تأمل");
  document.getElementById("hmSelectL").textContent=tr("Select","انتخاب");
  if(!hmDelArmed) document.getElementById("hmDeleteL").textContent=tr("Delete","حذف");
  holdMenu.setAttribute("aria-label",tr("Note actions","کارهای یادداشت"));
  sbClose.setAttribute("aria-label",tr("Stop selecting","پایان انتخاب"));
  sbClose.title=tr("Stop selecting","پایان انتخاب");
  sbAdd.textContent=tr("Add to\u2026","افزودن به\u2026");
  sbAdd.title=tr("Add to a chapter","افزودن به یک فصل");
  selBar.setAttribute("aria-label",tr("Selecting notes","انتخاب یادداشت‌ها"));
  saNo.textContent=tr("Cancel","انصراف");
  document.getElementById("cpTitle").textContent=tr("Add to a chapter","افزودن به یک فصل");
  document.getElementById("cpClose").setAttribute("aria-label",tr("Close","بستن"));
  chBack.setAttribute("aria-label",tr("Back to the chapter shelf","بازگشت به قفسهٔ فصل‌ها"));
  document.getElementById("chClose").setAttribute("aria-label",tr("Close the chapter shelf","بستن قفسهٔ فصل‌ها"));
  document.getElementById("prClose").setAttribute("aria-label",tr("Close","بستن"));
}
paintChapWords();

start();

function start(){
paintStatic();
paintPeekLabel();
setSplit(50);
buildNarbar();
reindex();
syncPaneH();
buildCalendar();
buildTimeline();
buildRail();
selectedItem=firstIdOn(todayKey);
renderSelection();
updateToggleUI();
paintTitle();
syncGrid();
paintRemDot();
/* No book is open yet, so the only handle worth recalling is the last file
   touched, whose name Export offers. A book's own file is looked up as it is
   opened. */
recallHandle("book").then(function(h){
  if(h&&typeof h.getFile==="function") lastHandle=h;
});
sweepOrphans();
fillFileNames();
assessDirty();
setTimeout(function(){
  lockC(900);
  centerIn(calScroll,calScroll.querySelector('[data-date="'+todayKey+'"]'),false);
  focusEntry(selectedItem,false);
  syncGrid();
  paintTodayFab();
  openShelf();   /* the shelf is the front door */
},50);
}

})();
</script>
