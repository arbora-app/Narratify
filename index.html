from my uncle Gardiner: they are found, not married, but Wickham will marry her for a hundred pounds a year and her share of the five thousand. Papa says no man would take her for so little, and that my uncle must have laid down a great deal of money. Mama has gone from despair to wedding clothes in a single morning."}, {"id": 93, "dk": "1812-08-06", "t": null, "nar": ["n2", "n10"], "imp": 4, "j": true, "title": "Exactly the man who would suit me", "note": "I am sorry I told Mr. Darcy. It is not that I fear him spreading it. It is that I now understand he was exactly the man who, in disposition and talents, would most suit me. His understanding and temper would have answered all my wishes. It would have been a union to the advantage of both. And no such happy marriage could now teach the admiring multitude what connubial felicity really was."}, {"id": 94, "dk": "1812-08-10", "t": "20:40", "nar": ["n4", "n5"], "imp": 1, "j": false, "title": "Papa will not receive the Wickhams", "note": "Mama has been choosing houses in the neighbourhood for Lydia: Haye Park, Stoke, Purvis Lodge. Papa told her that into one house in this neighbourhood they shall never have admittance. He will not advance a guinea for wedding clothes either. Mama was more shocked by that than by the fortnight Lydia lived with Wickham before they married."}, {"id": 95, "dk": "1812-08-24", "t": "18:45", "nar": ["n5", "n3"], "imp": 2, "j": false, "title": "The Wickhams come to Longbourn", "note": "Lydia was married this morning in London and came straight to us, still Lydia: wild, noisy and fearless. She took Jane's place at table and told her she ought to go lower, because she was a married woman. Wickham was all smiles and easy address. I have never known two people so unembarrassed by what they had done."}, {"id": 96, "dk": "1812-08-27", "t": "11:25", "nar": ["n5", "n2"], "imp": 3, "j": false, "title": "\"Mr. Darcy was at my wedding\"", "note": "Lydia described her wedding and let slip that Mr. Darcy was there, then remembered she had promised to keep it secret. Mr. Darcy! The one place he had least to do, and the people he would least wish to see. I wrote to my aunt the same afternoon, begging her to tell me, unless there is very good reason for secrecy."}, {"id": 97, "dk": "1812-09-01", "t": "17:10", "nar": ["n3", "n10"], "imp": 2, "j": false, "title": "\"We are brother and sister, you know\"", "note": "Wickham caught me walking alone and tried to talk about Pemberley, Mrs. Reynolds and the living. I let him know, lightly, that I knew the truth. Then I held out my hand and said, \"Come, Mr. Wickham, we are brother and sister, you know. Do not let us quarrel about the past.\" He kissed my hand with gallantry, and we went into the house."}, {"id": 98, "dk": "1812-09-03", "t": "09:00", "nar": ["n5", "n4"], "imp": 1, "j": false, "title": "The Wickhams leave for Newcastle", "note": "Lydia went off to Newcastle with her husband, promising to write, with no intention of it. Mama cried. Papa said Wickham is as fine a fellow as ever he saw: he simpers, smirks and makes love to us all, and he is prodigiously proud of him."}, {"id": 99, "dk": "1812-09-05", "t": null, "nar": ["n4"], "imp": 1, "j": false, "title": "Mama misses Lydia", "note": "Mama says there is nothing so bad as parting with one's friends, and that the house seems forlorn without them. Papa says it is one of the advantages of marrying a daughter. Mary has begun reading aloud again."}, {"id": 100, "dk": "1812-09-08", "t": "12:30", "nar": ["n2", "n5", "n10"], "imp": 4, "j": true, "title": "What my aunt told me", "note": "My aunt's letter. Mr. Darcy found Lydia and Wickham, paid his debts, bought his commission, added a thousand pounds to her portion, and would let no one know it was him. He said it was his fault, for keeping Wickham's character a secret. My aunt thinks there was another motive. I dare not think it. I feel ashamed of everything I have ever said about him, and proud of him, and I don't know which is worse."}, {"id": 101, "dk": "1812-09-21", "t": "15:40", "nar": ["n1", "n8", "n4"], "imp": 2, "j": false, "title": "Mr. Bingley returns to Netherfield", "note": "Mrs. Nicholls says Mr. Bingley is coming down to Netherfield to shoot. Jane says it makes no difference to her at all, and changed colour when she said it. Mama is already counting the days until she can reasonably send an invitation."}, {"id": 102, "dk": "1812-09-25", "t": "11:15", "nar": ["n2", "n8", "n4"], "imp": 2, "j": false, "title": "Two gentlemen ride up to Longbourn", "note": "Mr. Bingley called, and Mr. Darcy with him. Mama was effusive to Bingley and cold to Darcy, not knowing she owes Lydia to him. I sat with my work and could not raise my eyes. He said almost nothing. Jane was calm; Bingley was more in love than ever."}, {"id": 103, "dk": "1812-10-01", "t": "21:10", "nar": ["n2", "n1", "n8"], "imp": 2, "j": false, "title": "A dinner at Longbourn, and no chair beside me", "note": "Bingley took the seat by Jane as if it had always been his. Mr. Darcy was at the other end of the table next to Mama, and neither of them enjoyed it. After dinner the ladies crowded round me so closely that he could not come near me. I told myself he would not have come anyway."}, {"id": 104, "dk": "1812-10-08", "t": "20:30", "nar": ["n1", "n8"], "imp": 4, "j": true, "title": "Jane is engaged", "note": "Mama cleared the room so obviously that even Kitty noticed, and Mr. Bingley took his chance. Jane came to me and said she was the happiest creature in the world. \"I would not on any account trifle with her feelings,\" he told Papa, and Papa told Jane she will always exceed her income. He was never so pleased with anything."}, {"id": 105, "dk": "1812-10-11", "t": "22:40", "nar": ["n1", "n10"], "imp": 1, "j": false, "title": "Jane wishes me a Mr. Bingley", "note": "Jane said, \"If I could but see you as happy! If there were but such another man for you!\" I told her that till I have her disposition and her goodness I can never have her happiness. \"Perhaps, if I have very good luck, I may meet with another Mr. Collins in time.\""}, {"id": 106, "dk": "1812-10-15", "t": "11:30", "nar": ["n9", "n2", "n10"], "imp": 4, "j": true, "title": "Lady Catherine comes to Longbourn", "note": "Lady Catherine came in a chaise and four, walked me into the wilderness, and demanded that I promise never to accept an engagement with her nephew. She said the upstart pretensions of a young woman without family would pollute the shades of Pemberley. I told her I am a gentleman's daughter, and that I am resolved to act in the way that constitutes my own happiness without reference to her. I did not promise. She left in a fury."}, {"id": 107, "dk": "1812-10-17", "t": "10:00", "nar": ["n4", "n7", "n2"], "imp": 2, "j": false, "title": "Papa laughs at Mr. Collins's letter", "note": "Mr. Collins has written to warn us, on Lady Catherine's authority, against a match between me and Mr. Darcy. Papa read it aloud with enormous delight: Mr. Darcy, who never looked at me except to see a blemish! I had to laugh when I could have cried. Papa is so sure it's absurd."}, {"id": 108, "dk": "1812-10-20", "t": "12:30", "nar": ["n2", "n10"], "imp": 5, "j": true, "title": "His feelings are what they were last April", "note": "We walked out together at last, and I could not keep back my thanks for what he had done for Lydia. He said, \"If your feelings are still what they were last April, tell me so at once. My affections and wishes are unchanged, but one word from you will silence me on this subject for ever.\" They were not what they were in April. I told him so, badly, and he told me how his aunt's visit had taught him to hope. We walked on without knowing in what direction."}, {"id": 109, "dk": "1812-10-20", "t": "23:15", "nar": ["n1", "n2"], "imp": 3, "j": false, "title": "\"Lizzy, it cannot be!\"", "note": "I told Jane tonight. She did not believe me. \"You are joking, Lizzy. This cannot be! Engaged to Mr. Darcy!\" I had to tell her everything I have been keeping back since April before she would believe it. And then she asked me how long I had loved him, and I said it came on so gradually that I hardly know, but that I believe I must date it from my first seeing his beautiful grounds at Pemberley."}, {"id": 110, "dk": "1812-10-21", "t": "15:20", "nar": ["n4", "n2"], "imp": 3, "j": false, "title": "Papa's consent, and Mama's", "note": "Papa was frightened for me: \"Lizzy, what are you doing? Are you out of your senses, to be accepting this man?\" I had to convince him I love him. When I told him about Lydia, he said, \"So much the better. It will save me a world of trouble and economy.\" Mama sat perfectly still for ten minutes. Then: \"Ten thousand a year! A house in town! Everything that is charming!\""}, {"id": 111, "dk": "1812-10-24", "t": "16:00", "nar": ["n2", "n10"], "imp": 2, "j": false, "title": "\"I was in the middle before I knew that I had begun\"", "note": "I made him tell me how he began to fall in love. He said he could not fix on the hour, or the spot, or the look, or the words. He was in the middle before he knew he had begun. I told him it was for my impertinence, that he was sick of women who looked and thought and spoke only for his approval. He did not deny it."}, {"id": 112, "dk": "1812-11-01", "t": null, "nar": ["n2", "n4"], "imp": 1, "j": false, "title": "He bears with Uncle Phillips", "note": "My uncle Phillips talked to Mr. Darcy for an entire visit about hunting and Meryton gossip, and Mama was very civil to him in a way that was worse than rudeness. Mr. Darcy bore it all with admirable calmness. I kept him with me as much as I could, to spare him."}, {"id": 113, "dk": "1812-11-05", "t": "20:10", "nar": ["n2", "n10"], "imp": 2, "j": false, "title": "A letter to my aunt Gardiner", "note": "I owe my aunt a long letter of thanks and a confession. I wrote that I am the happiest creature in the world, happier even than Jane: she only smiles, I laugh. Mr. Darcy sends her all the love in the world he can spare from me, and says we are all to come to Pemberley at Christmas."}, {"id": 114, "dk": "1812-11-12", "t": "15:05", "nar": ["n6", "n7", "n9"], "imp": 1, "j": false, "title": "The Collinses come to Lucas Lodge", "note": "Charlotte and Mr. Collins have come to Lucas Lodge until the storm blows over. Lady Catherine has been extremely angry about my engagement. Charlotte is sincerely happy for me. When Sir William complimented Mr. Darcy on carrying away the brightest jewel of the country, Mr. Darcy bore it with decent composure, and only shrugged once Sir William was out of sight."}, {"id": 115, "dk": "1812-11-19", "t": "11:30", "nar": ["n2", "n1", "n4"], "imp": 5, "j": true, "title": "Married, with Jane, on the same day", "note": "Happy for all her maternal feelings was the day Mama got rid of her two most deserving daughters. Jane and I were married in the same church on the same morning. Papa pretended he would miss me only on occasion. I will miss him more than I can put into writing."}, {"id": 116, "dk": "1812-11-24", "t": "16:45", "nar": ["n2", "n10"], "imp": 4, "j": true, "title": "Coming home to Pemberley", "note": "We drove through the woods and came out at the same spot where I first saw the house in July, and he stopped the carriage without my asking. Georgiana was waiting at the door. Mrs. Reynolds curtseyed and smiled as if she had always known. I am mistress of Pemberley, and I know exactly what I once thought of its master."}, {"id": 117, "dk": "1812-12-05", "t": null, "nar": ["n2", "n10"], "imp": 1, "j": false, "title": "Georgiana is learning to laugh", "note": "Georgiana watched me tease her brother at breakfast and looked at me with something close to alarm. By the end of the meal she was laughing too. Mr. Darcy says I am a bad influence. He says it with a look I intend to keep deserving."}, {"id": 118, "dk": "1812-12-24", "t": "22:00", "nar": ["n4", "n2", "n1"], "imp": 3, "j": false, "title": "Christmas at Pemberley", "note": "The Gardiners are here, as we promised. Jane writes from Netherfield that Mama calls every day, and that Bingley has begun, very gently, to look at estates in the north. Georgiana has learned from me that a woman may take liberties with her husband which a brother will not always allow in a sister ten years younger. My uncle and aunt brought us together, and I will never stop being grateful to them."}]}},
{"fa": "\u062f\u0641\u062a\u0631\u0686\u0647\u0654 \u062f\u06a9\u062a\u0631 \u0648\u0627\u062a\u0633\u0648\u0646", "say": "Dr. Watson's notebook, from Conan Doyle's The Hound of the Baskervilles \u2014 Baker Street, and then the moor.", "sayFa": "\u062f\u0641\u062a\u0631\u0686\u0647\u0654 \u062f\u06a9\u062a\u0631 \u0648\u0627\u062a\u0633\u0648\u0646\u060c \u0627\u0632 \u00ab\u0633\u06af \u0628\u0627\u0633\u06a9\u0631\u0648\u06cc\u0644\u200c\u0647\u0627\u00bb\u06cc \u0622\u0631\u062a\u0648\u0631 \u06a9\u0627\u0646\u0646 \u062f\u0648\u06cc\u0644.", "book": {"v": 4, "zoom": 3, "flat": 0, "narf": [], "title": "Dr. Watson's Notebook", "narratives": [{"id": "n1", "label": "Holmes", "c": 1}, {"id": "n2", "label": "The Legend", "c": 2}, {"id": "n3", "label": "Sir Henry", "c": 3}, {"id": "n4", "label": "The Moor", "c": 4}, {"id": "n5", "label": "The Barrymores", "c": 5}, {"id": "n6", "label": "The Stapletons", "c": 6}, {"id": "n7", "label": "The Convict", "c": 7}, {"id": "n8", "label": "Mortimer & the Neighbours", "c": 8}, {"id": "n9", "label": "Clues", "c": 9}, {"id": "n10", "label": "Myself", "c": 10}], "entries": [{"id": 1, "dk": "1889-09-20", "t": null, "nar": ["n1", "n10"], "imp": 1, "j": false, "title": "A slack week at Baker Street", "note": "No clients for five days. Holmes has been lying on the sofa with his violin, scraping at nothing in particular, and conducting a chemical experiment that has made the sitting room smell of burnt almonds. Mrs. Hudson has asked me whether he is ill. I told her he is merely bored, which in Holmes is worse."}, {"id": 2, "dk": "1889-09-22", "t": null, "nar": ["n1", "n10"], "imp": 1, "j": false, "title": "Holmes on the monograph he will never finish", "note": "Holmes spent the afternoon explaining the difference between the ashes of a hundred and forty kinds of tobacco, which he considers a subject of vital importance. I read the evening paper and nodded in the right places. Rain on the window, a good fire. There are worse ways to spend a Sunday."}, {"id": 3, "dk": "1889-09-24", "t": "22:40", "nar": ["n9", "n1"], "imp": 1, "j": false, "title": "A visitor forgot his stick", "note": "We were out this evening and missed a caller, who waited and then went away, leaving his walking stick behind: a fine, thick piece of wood, bulbous-headed, with a broad silver band an inch across. On the band: \"To James Mortimer, M.R.C.S., from his friends of the C.C.H.\", and the date 1884."}, {"id": 4, "dk": "1889-09-25", "t": "09:10", "nar": ["n1", "n9", "n10"], "imp": 2, "j": false, "title": "My deductions from the stick", "note": "Holmes, back to me at the breakfast table, asked what I made of the stick. He could see me in the polished silver coffee pot. I reasoned that Mortimer was an elderly country doctor, well esteemed, and that C.C.H. was some local hunt. Holmes said I was a conductor of light, not luminous myself, and then that most of my conclusions were erroneous. He was right. A young man, not old; Charing Cross Hospital, not a hunt; and a dog, a little larger than a terrier and smaller than a mastiff."}, {"id": 5, "dk": "1889-09-25", "t": "10:05", "nar": ["n8", "n1"], "imp": 1, "j": false, "title": "Dr. Mortimer covets Holmes's skull", "note": "Dr. Mortimer arrived, with the spaniel Holmes had predicted at his heels. A tall, thin young man with a long nose and gold spectacles. He greeted Holmes by saying he had hardly expected so dolichocephalic a skull, and that a cast of it would be an ornament to any anthropological museum. Holmes invited him to sit down before he could reach for it."}, {"id": 6, "dk": "1889-09-25", "t": "10:40", "nar": ["n2", "n8"], "imp": 3, "j": false, "title": "The curse of the Baskervilles", "note": "Mortimer read us a manuscript dated 1742 telling how Hugo Baskerville, a wild and godless man, carried off a yeoman's daughter, rode out after her across the moor with his hounds when she escaped, and was found dead beside her with a great black beast tearing at his throat. The family has been warned ever since not to cross the moor in the dark hours when the powers of evil are exalted. Holmes yawned and said it would interest a collector of fairy tales."}, {"id": 7, "dk": "1889-09-25", "t": "11:15", "nar": ["n2", "n9", "n8"], "imp": 4, "j": true, "title": "\"The footprints of a gigantic hound\"", "note": "Then Mortimer read the newspaper account of Sir Charles Baskerville's death on the fourth of May: found face down at the end of the yew alley, no sign of violence, his face so distorted that Mortimer hardly knew him. Holmes asked whether there were footprints. There were, Mortimer said, some little distance off, fresh and clear. A man's or a woman's? He looked at us strangely and his voice sank almost to a whisper: \"Mr. Holmes, they were the footprints of a gigantic hound.\" I have been hearing it all day."}, {"id": 8, "dk": "1889-09-25", "t": "21:00", "nar": ["n1", "n10"], "imp": 2, "j": false, "title": "A room full of smoke", "note": "I spent the day at my club, as Holmes asked. When I came back the sitting room was so full of tobacco smoke that I began coughing in the doorway. Holmes had sent to Stamford's for the Ordnance map of the moor and had been in Devonshire all day, he said, in spirit. His body had stayed in the armchair and consumed two large pots of coffee and an incredible amount of tobacco."}, {"id": 9, "dk": "1889-09-26", "t": "10:00", "nar": ["n3", "n9"], "imp": 3, "j": false, "title": "A warning built out of newspaper", "note": "Sir Henry Baskerville, the young heir, came with Mortimer. He is small, alert, sturdily built, with a weather-beaten face from years in Canada. He produced a letter delivered to his hotel: a single sentence pasted from printed words, \"As you value your life or your reason keep away from the moor,\" with \"moor\" printed in ink. Holmes had the Times leader it came from inside a minute, and pointed out it was cut with short-bladed nail scissors."}, {"id": 10, "dk": "1889-09-26", "t": "10:35", "nar": ["n3", "n9"], "imp": 1, "j": false, "title": "One new brown boot missing", "note": "Sir Henry also mentioned, in passing, that one of a new pair of brown boots had vanished from outside his hotel room overnight. He had never even worn them. Holmes asked for every detail of it, which Sir Henry clearly thought strange."}, {"id": 11, "dk": "1889-09-26", "t": "11:20", "nar": ["n1", "n9"], "imp": 3, "j": false, "title": "The bearded man in the cab", "note": "Holmes and I followed Sir Henry and Mortimer down Oxford Street and Regent Street at a distance, and saw that a hansom was following them too. There was a man inside with a bushy black beard and piercing eyes. He saw us, shouted to his driver, and the cab flew off down Regent Street. Holmes got its number: 2704. He was more annoyed with himself than I have seen him in months."}, {"id": 12, "dk": "1889-09-26", "t": "14:20", "nar": ["n3", "n9"], "imp": 1, "j": false, "title": "Now an old black boot is gone", "note": "At lunch in the Northumberland Hotel, Sir Henry came storming down the corridor. This time an old black boot had been stolen. He said he could put up with being played for a sucker by a stranger, but that it was getting beyond a joke. Holmes looked very serious."}, {"id": 13, "dk": "1889-09-26", "t": "16:45", "nar": ["n5", "n9"], "imp": 1, "j": false, "title": "Is Barrymore at the Hall?", "note": "Holmes sent a telegram to Barrymore at Baskerville Hall asking if all was ready for Sir Henry, and another to the postmaster at Grimpen to deliver it into his own hands, or return it if he was absent. It is Barrymore who has the black beard, according to Mortimer."}, {"id": 14, "dk": "1889-09-27", "t": "09:30", "nar": ["n3", "n9"], "imp": 1, "j": false, "title": "The brown boot returns", "note": "Sir Henry's new brown boot has reappeared under a cabinet in his room, where the whole hotel says it certainly was not yesterday. The old black one is still missing."}, {"id": 15, "dk": "1889-09-27", "t": "18:00", "nar": ["n1", "n9"], "imp": 2, "j": false, "title": "\"Sherlock Holmes\" was the passenger", "note": "John Clayton, the driver of cab 2704, came to Baker Street. His bearded passenger paid him two guineas to follow the gentlemen and, as he got out at Waterloo, told him he might like to know he had been driving Mr. Sherlock Holmes. Holmes burst out laughing. \"Touch\u00e9, Watson. I feel a foil as quick and supple as my own.\""}, {"id": 16, "dk": "1889-09-27", "t": "21:15", "nar": ["n3", "n1", "n10"], "imp": 3, "j": false, "title": "I am to go to Devonshire", "note": "Holmes cannot leave London at present because of a blackmail case, and asked me to go down with Sir Henry. Sir Henry said he would be very glad to have me by his side. I agreed at once. Holmes gave me orders to report every fact, however trivial, and to leave the theorising to him. And to keep my revolver close, day and night."}, {"id": 17, "dk": "1889-09-28", "t": "10:30", "nar": ["n1", "n10"], "imp": 2, "j": false, "title": "Holmes's last word at Paddington", "note": "At the station Holmes repeated to Sir Henry the one line of the legend he wanted him to remember: avoid the moor in those dark hours when the powers of evil are exalted. Then he walked alongside the carriage and asked if I had my revolver. I said yes. He said, \"Keep your eyes open.\""}, {"id": 18, "dk": "1889-09-28", "t": "15:40", "nar": ["n4", "n7"], "imp": 2, "j": false, "title": "Soldiers at the little station", "note": "At the station there were two soldiers leaning on their rifles. A convict, Selden, the Notting Hill murderer, escaped from Princetown three days ago, and the warders watch every road. The driver pointed out the prison. The countryside is red earth and green fields, and then, beyond it, the grey sweep of the moor, with jagged hills like a dream landscape."}, {"id": 19, "dk": "1889-09-28", "t": "18:10", "nar": ["n3", "n2"], "imp": 3, "j": false, "title": "First sight of Baskerville Hall", "note": "Sunset, and in a hollow of stunted oaks the two towers of the Hall rose above the trees. Sir Henry went silent and pale. The drive was dark as a tunnel, and at the far end the house glimmered like a ghost. The great hall is heavily beamed, with coats of arms and stags' heads on the walls. \"It's just as I imagined it,\" Sir Henry said. I don't think he meant it happily."}, {"id": 20, "dk": "1889-09-28", "t": "20:40", "nar": ["n5", "n3"], "imp": 2, "j": false, "title": "The Barrymores wish to leave", "note": "Barrymore is a remarkable-looking man: tall, handsome, with a square black beard and a pale, distinguished face. At dinner he told Sir Henry that he and his wife would like to leave his service once the new staff can be arranged. Sir Charles's death has shaken them, he says. It seemed a sad beginning for Sir Henry."}, {"id": 21, "dk": "1889-09-29", "t": "02:15", "nar": ["n5", "n10"], "imp": 2, "j": false, "title": "A woman sobbing in the night", "note": "I could not sleep. The clock struck the quarters. And then, clear in the stillness of the house, I heard the sound of a woman sobbing, the muffled, strangled gasp of someone torn by uncontrollable sorrow. It was somewhere inside the house. I lay awake half an hour listening, and heard nothing else but the chiming clock."}, {"id": 22, "dk": "1889-09-29", "t": "08:45", "nar": ["n5", "n3", "n9"], "imp": 2, "j": false, "title": "Barrymore denies it; his wife's eyes are red", "note": "At breakfast Sir Henry had heard the sobbing too. Barrymore went pale and said there are only two women in the house, the scullery maid who sleeps in the other wing, and his wife, and it could not have been her. When I met Mrs. Barrymore in the long corridor with the sun on her face, her eyes were red and swollen. He had lied."}, {"id": 23, "dk": "1889-09-29", "t": "11:30", "nar": ["n5", "n9"], "imp": 1, "j": false, "title": "Holmes's test telegram failed", "note": "Walked four miles to the Grimpen post office. The postmaster said the telegram was delivered as instructed. His boy gave it to Mrs. Barrymore because her husband was up in the loft. So we still don't know whether Barrymore was in London on Thursday."}, {"id": 24, "dk": "1889-09-29", "t": "12:15", "nar": ["n6", "n4"], "imp": 2, "j": false, "title": "A naturalist with a butterfly net", "note": "On the way back a man overtook me: small, slim, clean-shaven, prim-faced, about thirty-five, with a tin box for botanical specimens and a green butterfly net. Stapleton, of Merripit House. He knew who I was, knew Holmes, and wanted to know whether Holmes had any explanation of Sir Charles's death. I told him Holmes was busy in London. He seemed to find that interesting."}, {"id": 25, "dk": "1889-09-29", "t": "12:40", "nar": ["n4", "n6"], "imp": 3, "j": false, "title": "Grimpen Mire takes a pony", "note": "Stapleton pointed out the great Grimpen Mire, a bright green plain flecked with rushes. As we watched, a moor pony wandered into it. Its head writhed out of the bog, it gave a dreadful cry, and it was gone. \"It's gone,\" said Stapleton. \"The mire has him. Two in two days.\" He says he knows the only safe paths into the heart of it."}, {"id": 26, "dk": "1889-09-29", "t": "12:55", "nar": ["n4", "n2", "n6"], "imp": 3, "j": false, "title": "A cry across the moor", "note": "A long, low moan swept over the moor, filling the whole air, rising to a deep roar and sinking to a melancholy murmur. Stapleton looked at me with an odd expression. \"The peasants say it is the Hound of the Baskervilles calling for its prey.\" He says it may be a bittern booming. I have been round the world with the army and have never heard a stranger or more frightening noise."}, {"id": 27, "dk": "1889-09-29", "t": "13:20", "nar": ["n6", "n9"], "imp": 3, "j": false, "title": "\"Go straight back to London\"", "note": "Stapleton ran off after a butterfly and his sister came up the path. She is dark, tall and very beautiful, nothing like her brother. She took me for Sir Henry and said in a low urgent voice, \"Go back! Go straight back to London, instantly.\" Then her brother returned and she turned the conversation to orchids. When she learned who I was, she asked me to forget what she'd said. I will not."}, {"id": 28, "dk": "1889-09-30", "t": "16:30", "nar": ["n3", "n6"], "imp": 2, "j": false, "title": "Sir Henry is struck by Miss Stapleton", "note": "Sir Henry called at Merripit House with me and was taken with Miss Stapleton from the first moment. They talked of Canada and orchids and the moor. On the way home he spoke of nothing else. Stapleton was all politeness, and took Sir Henry to see the spot where the legend of wicked Hugo is supposed to have begun."}, {"id": 29, "dk": "1889-10-01", "t": null, "nar": ["n3", "n10"], "imp": 1, "j": false, "title": "Sir Henry's plans for the Hall", "note": "Sir Henry wants electric lamps down the whole front of the house, a thousand candle-power Swan and Edison in front of the hall door. He has begun talking to builders. It is good to see someone who looks at this place and thinks of improvements."}, {"id": 30, "dk": "1889-10-02", "t": "10:15", "nar": ["n3", "n2", "n9"], "imp": 2, "j": false, "title": "The yew alley where Sir Charles died", "note": "Sir Henry and I walked down the yew alley: two high walls of clipped hedge, a narrow strip of gravel between, and at the far end the little wicket gate out on to the moor. Here Sir Charles stood waiting, knocking the ash off his cigar twice. Here he ran, on his toes, as Mortimer said. Sir Henry said nothing all the way back to the house."}, {"id": 31, "dk": "1889-10-02", "t": "19:30", "nar": ["n5"], "imp": 1, "j": false, "title": "Mrs. Barrymore", "note": "Mrs. Barrymore is a heavy, solid person, very limited, intensely respectable and inclined to be puritanical. You could hardly imagine a less emotional subject. Yet I have seen her face wet with tears. Some deep sorrow gnaws at her heart, and Barrymore watches her more closely than a husband ordinarily would."}, {"id": 32, "dk": "1889-10-03", "t": "15:10", "nar": ["n8", "n4"], "imp": 1, "j": false, "title": "Mr. Frankland of Lafter Hall", "note": "Met our neighbour Mr. Frankland, an elderly man, red-faced, white-haired and choleric. His passion is British law, and he has spent a fortune on lawsuits for the pleasure of fighting, sometimes for a right of way and sometimes against one. He has a telescope on his roof and lies there all day sweeping the moor for the escaped convict."}, {"id": 33, "dk": "1889-10-04", "t": null, "nar": ["n3", "n10"], "imp": 1, "j": false, "title": "Billiards and bad dreams", "note": "Sir Henry and I played billiards till midnight to avoid going to bed. He says he dreamed of the portraits in the dining room, all those Baskervilles watching him eat. I told him I dreamed of nothing at all, which was a lie. I dreamed of the sound on the moor."}, {"id": 34, "dk": "1889-10-05", "t": "14:00", "nar": ["n4", "n6"], "imp": 1, "j": false, "title": "Stone huts of prehistoric people", "note": "Walked out with Stapleton to see the grey stone huts of Neolithic man scattered on the slopes. He showed me one with the roof still on, and the flat stone where the occupant slept. You could imagine a skin-clad hairy man crawling out of the low door. The moor is full of these, and full of the long-forgotten dead."}, {"id": 35, "dk": "1889-10-07", "t": null, "nar": ["n4", "n10"], "imp": 1, "j": false, "title": "The moor gets into one's soul", "note": "The longer one stays here, the more the spirit of the moor sinks into the soul, its vastness and its grim charm. Out on its bosom you leave modern England behind entirely. I find I walk out every day now, even when there is no reason to."}, {"id": 36, "dk": "1889-10-08", "t": "20:30", "nar": ["n6", "n3"], "imp": 1, "j": false, "title": "Stapleton's butterflies", "note": "Dined at Merripit House. Stapleton showed us his collection of moths and butterflies, beautifully arranged, and told us he hopes to find a rare Cyclopides this season. He talks of the moor as a man might talk of a lover. His sister watched Sir Henry across the table the whole evening."}, {"id": 37, "dk": "1889-10-10", "t": "13:30", "nar": ["n8"], "imp": 1, "j": false, "title": "Mortimer digs up a skull", "note": "Dr. Mortimer lunched with us. He has been excavating a barrow at Long Down and got a prehistoric skull out of it, which has filled him with great joy. He brought it with him. Sir Henry held it at arm's length and passed it to me."}, {"id": 38, "dk": "1889-10-11", "t": null, "nar": ["n8"], "imp": 1, "j": false, "title": "Frankland sues Mortimer", "note": "Frankland is going to law against Dr. Mortimer, for opening a grave at Long Down without the consent of the next of kin. Mortimer is quite bewildered. Frankland is enjoying himself tremendously and says it will be a case of the greatest public importance."}, {"id": 39, "dk": "1889-10-12", "t": null, "nar": ["n7", "n4"], "imp": 1, "j": false, "title": "No sign of the convict for a fortnight", "note": "No one has seen Selden for a fortnight. Most people believe he has got away or starved. But there are stone huts enough to hide a man, and sheep on the moor to feed him. Frankland keeps up his telescope watch. I lock my window."}, {"id": 40, "dk": "1889-10-13", "t": "02:05", "nar": ["n5", "n9"], "imp": 3, "j": false, "title": "Barrymore at the western window", "note": "Woke to a stealthy step outside my door. I looked out and saw Barrymore creeping along the corridor, candle in hand, in shirt and trousers, bare feet. He went into an empty room and stood at the window, holding the candle against the glass and staring out into the black moor. He stood there for several minutes. Then he groaned and put the light out."}, {"id": 41, "dk": "1889-10-13", "t": "11:45", "nar": ["n1", "n10"], "imp": 2, "j": false, "title": "My first report to Holmes", "note": "Wrote Holmes a long report: the moor, Frankland, Mortimer's skull, the Stapletons, Sir Henry's growing interest in the lady, and Barrymore at the window. I tried to set down only facts, as he told me. It is harder than it sounds, when every fact on this moor seems to lean towards the same dreadful conclusion."}, {"id": 42, "dk": "1889-10-13", "t": "15:30", "nar": ["n3", "n6"], "imp": 3, "j": false, "title": "Stapleton rages at Sir Henry", "note": "Sir Henry went out alone to meet Miss Stapleton, and I followed at a distance, feeling a traitor. He met her on the path and took her in his arms. Then Stapleton came running at them, his butterfly net flying, and raged at Sir Henry, dancing with excitement. He took his sister away. Sir Henry says he offered her marriage and she seemed to want him, and her brother went mad at the thought. What can the man object to?"}, {"id": 43, "dk": "1889-10-14", "t": "12:20", "nar": ["n6", "n3"], "imp": 1, "j": false, "title": "Stapleton comes to apologise", "note": "Stapleton called at the Hall to apologise for his madness yesterday. He says his sister is all he has in the world, and the thought of losing her was a terrible shock. He asks that Sir Henry wait three months and be content with friendship until then. We are to dine at Merripit House on Friday as a sign of peace."}, {"id": 44, "dk": "1889-10-15", "t": "01:10", "nar": ["n5", "n7", "n9"], "imp": 3, "j": false, "title": "The signal at the window", "note": "Second night of watching with Sir Henry. At one o'clock we heard Barrymore's step, followed him, and found him at the western window again with his candle. Sir Henry demanded an explanation. Barrymore refused; it was not his secret to tell. Then Mrs. Barrymore came in: \"It is my doing. My unhappy brother is starving on the moor.\" Selden the convict is her younger brother, and they have been leaving him food."}, {"id": 45, "dk": "1889-10-15", "t": "01:50", "nar": ["n7", "n4", "n3"], "imp": 3, "j": false, "title": "Chasing the convict in the dark", "note": "We went out after the light on the moor, Sir Henry with his hunting crop and I with my revolver. Suddenly that strange cry came again over the moor, long and deep. Sir Henry grabbed my sleeve and asked me what the people here say about it. I told him. Then we saw an evil yellow face over a rock, framed in a guttering candle, a terrible animal face, and he was gone, springing from boulder to boulder."}, {"id": 46, "dk": "1889-10-15", "t": "02:30", "nar": ["n4", "n9", "n10"], "imp": 4, "j": true, "title": "A man standing on the tor", "note": "As we turned back, the moon was low, and against its silver disc, on the peak of a granite tor, stood the figure of a man, black as an ebony statue. It was not the convict. This was a tall, thin man, standing with his legs a little apart, arms folded, head bowed, as though brooding over the moor. By the time I turned to show Sir Henry, the tor was empty. I have told no one but Holmes."}, {"id": 47, "dk": "1889-10-15", "t": "14:30", "nar": ["n1", "n10"], "imp": 1, "j": false, "title": "My second report", "note": "Posted my second report to Holmes, covering the Barrymore secret, the chase and the man on the tor. Selden is at least explained. The watcher on the hill is not, and neither is the hound."}, {"id": 48, "dk": "1889-10-16", "t": "10:00", "nar": ["n4", "n10"], "imp": 2, "j": false, "title": "A dull and foggy day", "note": "Drizzle and fog, the house banked in with rolling clouds. Sir Henry is in black reaction after last night. I feel a weight on my heart, a sense of danger all the more terrible because I cannot define it. And I keep coming back to it: two of us have heard that cry. It is impossible that the laws of nature are broken. And yet."}, {"id": 49, "dk": "1889-10-16", "t": "15:20", "nar": ["n5", "n7"], "imp": 2, "j": false, "title": "Barrymore's bargain for his brother-in-law", "note": "Barrymore asked to see Sir Henry, and said it was not fair to hunt a man he had given his secret to. He swears Selden will be shipped off to South America within days. Sir Henry agreed not to tell the police. I said so too, though it troubles me to leave a murderer loose on the moor."}, {"id": 50, "dk": "1889-10-16", "t": "15:40", "nar": ["n5", "n9", "n2"], "imp": 3, "j": false, "title": "A burned letter signed L. L.", "note": "In gratitude Barrymore told us what he knows of Sir Charles's death. On the morning he died, Sir Charles had a letter from Coombe Tracey in a woman's hand. Months later Mrs. Barrymore found its ashes in the grate. One strip was still readable: \"Please, please, as you are a gentleman, burn this letter, and be at the gate by ten o'clock.\" It was signed L. L."}, {"id": 51, "dk": "1889-10-17", "t": "16:10", "nar": ["n4", "n7", "n10"], "imp": 1, "j": false, "title": "Walking in the rain", "note": "Rained all day, rustling on the ivy, dripping from the eaves. I thought of Selden out on the bleak, cold, shelterless moor. Poor devil; whatever his crimes, he has suffered something. In the evening I put on my waterproof and walked far out on the sodden moor, full of dark imaginings. There was no sign of the man on the tor."}, {"id": 52, "dk": "1889-10-17", "t": "18:45", "nar": ["n8", "n9"], "imp": 2, "j": false, "title": "Laura Lyons of Coombe Tracey", "note": "Dr. Mortimer, driving back over Foulmire, was asked who in the district has the initials L. L. After some thought: Laura Lyons, Frankland's daughter, who married an artist who deserted her. Her father will not speak to her. She lives in Coombe Tracey, typing, helped by charitable friends. Sir Charles among them."}, {"id": 53, "dk": "1889-10-17", "t": "22:20", "nar": ["n5", "n4", "n9"], "imp": 2, "j": false, "title": "Another man on the moor", "note": "Barrymore says Selden has seen another man hiding out on the moor, not a convict, a gentleman as far as he can tell. He lives in the old stone huts, and a lad brings him everything he needs from Coombe Tracey. Barrymore said he wished this whole place were cleared of its terrors. So do I."}, {"id": 54, "dk": "1889-10-18", "t": "11:30", "nar": ["n9", "n8", "n2"], "imp": 3, "j": false, "title": "I interview Mrs. Lyons", "note": "Laura Lyons is very beautiful, and did not like my questions. She admitted writing to Sir Charles to ask for his help, asking him to meet her at the gate at ten o'clock the night he died. She says she did not go, because she received help from another quarter. She would not say from whom. She was hiding something, though I think not murder."}, {"id": 55, "dk": "1889-10-18", "t": "15:15", "nar": ["n8", "n4", "n9"], "imp": 2, "j": false, "title": "Frankland's telescope finds the boy", "note": "On the road home Frankland stopped me, triumphant about a lawsuit, and invited me in. From his roof he showed me a boy creeping along the hillside with a bundle, making for the hut where he believes the convict is fed. The police would not listen to Frankland about anything, so he will not tell them. I know better: the bundle is for the man on the tor."}, {"id": 56, "dk": "1889-10-18", "t": "17:30", "nar": ["n4", "n10"], "imp": 2, "j": false, "title": "Waiting in the stone hut", "note": "I found the hut. Inside: blankets, a pot, a tin of tongue, and a note in pencil: \"Dr. Watson has gone to Coombe Tracey.\" It is me he is watching. I sat in the dark corner with my revolver cocked and waited for him. The sun was sinking, the moor was glowing, and then I heard a step, and a shadow fell across the doorway."}, {"id": 57, "dk": "1889-10-18", "t": "17:50", "nar": ["n1", "n10"], "imp": 4, "j": true, "title": "\"It is a lovely evening, my dear Watson\"", "note": "A familiar voice said, \"It is a lovely evening, my dear Watson. I really think that you will be more comfortable outside than in.\" Holmes. He has been living in the hut for days, fed by young Cartwright, and my reports were forwarded to him from Baker Street. I was hurt, I admit it, that he trusted me so little. He said my being deceived was part of the plan. He said my reports had been invaluable. I am partly soothed."}, {"id": 58, "dk": "1889-10-18", "t": "18:20", "nar": ["n1", "n6", "n9"], "imp": 3, "j": false, "title": "Stapleton's sister is his wife", "note": "Holmes told me what he has learned. The lady who calls herself Miss Stapleton is in fact Stapleton's wife. He used to run a school in the north of England under another name. And he promised to marry Laura Lyons once she was free of her husband. It was Stapleton who set up the meeting at the gate. We were talking about how to warn Sir Henry when a scream burst out over the moor."}, {"id": 59, "dk": "1889-10-18", "t": "18:45", "nar": ["n7", "n3", "n4"], "imp": 4, "j": true, "title": "A body among the rocks", "note": "We ran towards the scream, and the deep baying of a hound behind it. At the foot of a cliff we found a man face down, his neck broken. He was wearing Sir Henry's tweed suit. I cannot describe what I felt. Then Holmes turned the head and shouted with joy: it was the convict, not Sir Henry. Barrymore gave him Sir Henry's old clothes. The hound has been set on the scent of those clothes."}, {"id": 60, "dk": "1889-10-18", "t": "19:10", "nar": ["n6", "n7"], "imp": 2, "j": false, "title": "Stapleton arrives out of the dark", "note": "A figure came towards us with a cigar: Stapleton. He started when he saw the body, and more when he saw it was not Sir Henry. He asked whether we had heard the hound. Holmes told him quite calmly that he was returning to London tomorrow, having failed. I watched them stare at each other."}, {"id": 61, "dk": "1889-10-18", "t": "22:30", "nar": ["n1", "n2", "n9"], "imp": 4, "j": true, "title": "Hugo Baskerville's portrait", "note": "At dinner Holmes kept looking at the portraits. He stood on a chair holding a candle to Hugo Baskerville's picture and covered the hat and long ringlets with his arm. Out of the frame looked the face of Stapleton. He is a Baskerville, a son of Sir Charles's younger brother, with his eyes on the estate. \"We have him, Watson, we have him, and I dare swear that before tomorrow night he will be fluttering in our net.\""}, {"id": 62, "dk": "1889-10-19", "t": "10:30", "nar": ["n1", "n3"], "imp": 2, "j": false, "title": "Holmes asks Sir Henry to be brave", "note": "Holmes told Sir Henry we must return to London, and that he must keep his dinner engagement at Merripit House tonight without us, send his carriage home, and walk back across the moor. Sir Henry was hurt to be deserted and frightened of what he was being asked. He agreed. He trusts Holmes completely."}, {"id": 63, "dk": "1889-10-19", "t": "12:40", "nar": ["n8", "n6", "n9"], "imp": 2, "j": false, "title": "Holmes tells Laura Lyons the truth", "note": "At Coombe Tracey Holmes showed Mrs. Lyons proof that Stapleton is married. She broke down and told us everything: Stapleton dictated the letter, then persuaded her not to go to the gate, and made her swear to say nothing after the death. She had been a tool. I believe she has had a lucky escape."}, {"id": 64, "dk": "1889-10-19", "t": "17:40", "nar": ["n1", "n9"], "imp": 2, "j": false, "title": "Lestrade on the 5:40", "note": "Lestrade came off the London express, small and wiry, bull-dog-like, with a look of reverence for Holmes that I have never seen in him before. Holmes offered to get the London fog out of his throat with a breath of Dartmoor night air."}, {"id": 65, "dk": "1889-10-19", "t": "21:45", "nar": ["n4", "n6"], "imp": 2, "j": false, "title": "Fog creeping over the Grimpen Mire", "note": "We lay among the rocks near Merripit House, watching Sir Henry and Stapleton at dinner through the window. Stapleton went out to an outhouse and came back. And then the fog began to roll in from the mire, a great white bank moving slowly towards the house and the path Sir Henry must take. Holmes muttered that it was the one thing on earth that could ruin his plans."}, {"id": 66, "dk": "1889-10-19", "t": "22:30", "nar": ["n2", "n3", "n1", "n10"], "imp": 5, "j": true, "title": "The Hound of the Baskervilles", "note": "Sir Henry came out of the fog, walking fast and looking behind him. And then out of the fog sprang a hound: an enormous coal-black hound, but not a hound such as mortal eyes have ever seen. Fire burst from its open mouth, its eyes glowed, its muzzle and hackles were outlined in flickering flame. Never in the delirious dream of a disordered brain could anything more savage have been conceived. Holmes and I fired together. It screamed, which meant it could be hurt. It had Sir Henry down when Holmes emptied five barrels into its flank. It was dead. It was a real animal, and it was painted with phosphorus."}, {"id": 67, "dk": "1889-10-19", "t": "22:55", "nar": ["n3"], "imp": 3, "j": false, "title": "Sir Henry lives", "note": "Sir Henry lay unconscious, his throat untouched, saved by seconds. We got brandy into him and he opened his eyes. \"My God! What was it? What, in heaven's name, was it?\" Holmes said it was dead, whatever it was. He could not stand. He has had a shock that his nerves will not soon forget."}, {"id": 68, "dk": "1889-10-19", "t": "23:40", "nar": ["n6", "n9"], "imp": 3, "j": false, "title": "Mrs. Stapleton bound in an upper room", "note": "Stapleton was gone from the house. In a locked bedroom we found his wife tied to a post, gagged with a towel, her arms bruised by the lash. She cried out first to ask if Sir Henry had escaped, and then whether the hound was dead. She has loved her husband, and been his tool, and lately his prisoner. Now she only wants him caught. She says he has gone to the island in the heart of the mire."}, {"id": 69, "dk": "1889-10-20", "t": "10:30", "nar": ["n4", "n6", "n9"], "imp": 3, "j": false, "title": "Into the Grimpen Mire", "note": "The fog lifted and Mrs. Stapleton led us to the path through the mire, marked with little wands. Rank reeds, green scum, and pits that could swallow a man. Halfway in we found Sir Henry's old black boot, which Stapleton had used to set the hound on his scent. No footprints beyond. The mire must have him. Somewhere in that great bog he is buried for ever."}, {"id": 70, "dk": "1889-10-20", "t": "12:15", "nar": ["n4", "n9", "n2"], "imp": 2, "j": false, "title": "The hound's lair on the island", "note": "On the island, an abandoned tin mine where the hound was kept chained. A tin of phosphorus paste. And the skeleton of Dr. Mortimer's poor curly-haired spaniel, which went missing this autumn. Holmes held the phosphorus under my nose. \"A fitting paint for such a creature.\" It was a dog bought in London, starved and trained. That is all the Hound of the Baskervilles ever was."}, {"id": 71, "dk": "1889-10-22", "t": null, "nar": ["n3", "n8"], "imp": 2, "j": false, "title": "Sir Henry in a fever", "note": "Sir Henry has been in a high fever, with Mortimer attending him day and night. What hurts most is the discovery that the woman he loved was deceiving him. Mortimer says his body will recover soon; his nerves will take much longer, and he recommends a long voyage."}, {"id": 72, "dk": "1889-10-24", "t": null, "nar": ["n10", "n4"], "imp": 1, "j": false, "title": "The moor in clear weather", "note": "Walked out on the moor alone in pale sunshine, the first time since that night. The tors look like any other hills. I heard a bittern, or something like one, and did not jump. I think that is the moor's last trick on me."}, {"id": 73, "dk": "1889-10-26", "t": "16:10", "nar": ["n1", "n10"], "imp": 2, "j": false, "title": "Home to Baker Street", "note": "Back in London. Holmes went straight to his chair and pipe as if he had been away an afternoon. I unpacked, and found the moor mud still dried on my boots, and could not bring myself to let Mrs. Hudson clean them just yet."}, {"id": 74, "dk": "1889-11-02", "t": null, "nar": ["n10"], "imp": 1, "j": false, "title": "Dartmoor in my sleep", "note": "Back in the London routine, and the moor still comes to me at night: the yellow face in the candlelight, the flame round the hound's jaws. In daylight I am quite sensible about it. Phosphorus and a starved dog. But I sleep with the lamp turned down, not out."}, {"id": 75, "dk": "1889-11-06", "t": null, "nar": ["n1"], "imp": 1, "j": false, "title": "Holmes and the Colonel Upwood affair", "note": "Holmes has been occupied with two cases of the greatest importance, including the atrocious conduct of Colonel Upwood in the famous card scandal at the Nonpareil Club, and has had no time to go over the Baskerville affair. He does not seem to find it strange. He finds each case wipes out the last."}, {"id": 76, "dk": "1889-11-14", "t": "19:00", "nar": ["n1"], "imp": 1, "j": false, "title": "The Montpensier case", "note": "Holmes has succeeded in clearing Madame Montpensier of the charge of murdering her step-daughter, the young lady who turned up alive and married in New York. He came home, ate, and fell asleep in his chair. I sat and watched the fire."}, {"id": 77, "dk": "1889-11-21", "t": "13:00", "nar": ["n1"], "imp": 1, "j": false, "title": "Holmes, idle again", "note": "A dead week. Holmes has been improvising on the violin and rearranging his index of criminal biographies. He asked me today whether I intend to write up the Baskerville business. I said perhaps. He said, if I do, I must at least put more science in it than my usual romances."}, {"id": 78, "dk": "1889-11-29", "t": "15:30", "nar": ["n3", "n8"], "imp": 2, "j": false, "title": "Sir Henry and Mortimer call before their voyage", "note": "Sir Henry and Dr. Mortimer came to say goodbye. They leave on a long voyage around the world, which Mortimer thinks will restore Sir Henry's shattered nerves. Sir Henry is still pale, but shook my hand with the grip of the man who once came into our sitting room with a pasted letter. I hope the sea does him good."}, {"id": 79, "dk": "1889-11-29", "t": "21:30", "nar": ["n1", "n9", "n2", "n10"], "imp": 3, "j": false, "title": "A retrospection by the fire", "note": "A raw foggy night. Holmes finally went through the whole affair with me: Stapleton's real name, his flight from South America, his plan to frighten Sir Charles to death with the painted hound, the boots, the letter pasted from the Times by his wife to warn Sir Henry. Then he stood up. \"And now, my dear Watson, we have had some weeks of severe work, and for one evening I think we may turn our thoughts into more pleasant channels.\" He has a box for Les Huguenots, and wants dinner at Marcini's first."}]}},
{"fa": "\u062f\u0641\u062a\u0631\u0686\u0647\u0654 \u06a9\u0627\u067e\u06cc\u062a\u0627\u0646 \u0627\u0633\u06a9\u0627\u062a", "say": "Captain Scott's notebook, from his Antarctic journals \u2014 the Terra Nova, the Barrier, and the road to the Pole.", "sayFa": "\u062f\u0641\u062a\u0631\u0686\u0647\u0654 \u06a9\u0627\u067e\u06cc\u062a\u0627\u0646 \u0627\u0633\u06a9\u0627\u062a\u060c \u0627\u0632 \u06cc\u0627\u062f\u062f\u0627\u0634\u062a\u200c\u0647\u0627\u06cc \u0642\u0637\u0628 \u062c\u0646\u0648\u0628 \u0627\u0648.", "book": {"v": 4, "zoom": 3, "flat": 0, "narf": [], "title": "Captain Scott's Notebook", "narratives": [{"id": "n1", "label": "The Pole", "c": 1}, {"id": "n2", "label": "Companions", "c": 2}, {"id": "n3", "label": "The Ponies", "c": 3}, {"id": "n4", "label": "Dogs & Motors", "c": 4}, {"id": "n5", "label": "Ice & Weather", "c": 5}, {"id": "n6", "label": "The Ship", "c": 6}, {"id": "n7", "label": "Winter Quarters", "c": 7}, {"id": "n8", "label": "Science", "c": 8}, {"id": "n9", "label": "Amundsen", "c": 9}, {"id": "n10", "label": "Home", "c": 10}], "entries": [{"id": 1, "dk": "1910-11-26", "t": "15:00", "nar": ["n6", "n10"], "imp": 2, "j": false, "title": "The Terra Nova leaves Lyttelton", "note": "We advertised our start at 3 P.M., and at three minutes to the hour the Terra Nova pushed off from the jetty before a great mass of people. K. and I went out in the ship and left her inside the heads, coming home in the harbour tug, with innumerable small boats following. Ponting busy with his cinematograph. We walked over the hills to Sumner and saw the Terra Nova, a little dot to the south-east."}, {"id": 2, "dk": "1910-11-29", "t": "14:30", "nar": ["n6", "n10"], "imp": 3, "j": true, "title": "Away from Port Chalmers", "note": "Thanked Glendenning for his handsome gift of 130 grey jerseys, and saw the Mayor. We left the wharf at 2.30 in bright sunshine, a very gay scene, with even more craft following than at Lyttelton. Mrs. Wilson, Mrs. Evans and K. left us at the Heads and went back in the harbour tug. Pennell swung the ship for compass adjustment, and then away. Evening: the loom of the land, and Cape Saunders light blinking."}, {"id": 3, "dk": "1910-12-02", "t": null, "nar": ["n6", "n3", "n5"], "imp": 4, "j": true, "title": "A day of great disaster", "note": "From four o'clock last night the wind freshened with great rapidity, and soon we were plunging heavily and taking much water over the lee rail. Loose coal sacks, lifted bodily by the seas, battered the lashed petrol cases like rams, and nearly all hands laboured for hours in the waist of the ship heaving them overboard, now and again completely submerged, clinging to any fixture. Oates and Atkinson kept the ponies on their legs. Below, the water rose in the engine-room and the pumps choked. We have been baling with buckets in two-hour shifts."}, {"id": 4, "dk": "1910-12-03", "t": "10:00", "nar": ["n6", "n3"], "imp": 2, "j": false, "title": "The pump runs again", "note": "The wind fell slowly towards evening and our baling began to gain. By 10 P.M. a hole had been cut through the engine-room bulkhead, and Evans wriggled over the coal and down the pump shaft to clear the suction of coal balls. To the joy of all, a good stream of water came from the pump. This morning the water no longer swishes from side to side. We got the two dead ponies out through the forecastle skylight, a curious proceeding, as the space looked quite inadequate."}, {"id": 5, "dk": "1910-12-10", "t": "00:00", "nar": ["n5", "n8"], "imp": 2, "j": false, "title": "Midnight over the pack", "note": "Stayed on deck till midnight. The sun just dipped below the southern horizon. The scene was incomparable: the northern sky gloriously rosy and reflected in the calm sea between the ice, which varied from burnished copper to salmon pink; bergs and pack to the north a pale green with deep purple shadows. We watered ship from a hummocky floe, about 8 tons. Rennick's sounding, 1960 fathoms, brought up two small lumps of volcanic lava."}, {"id": 6, "dk": "1910-12-19", "t": null, "nar": ["n6", "n5"], "imp": 2, "j": false, "title": "Monstrous floes", "note": "The worst outlook we have had: a terribly heavy screwed pack stretching in all directions as far as the eye can see. We jammed through some of the most monstrous floes I have ever seen, pressure ridges rising 24 feet above the surface. I'm afraid we have strained our rudder. Great patience is the only panacea for our ill case."}, {"id": 7, "dk": "1910-12-24", "t": "07:00", "nar": ["n5", "n6"], "imp": 2, "j": false, "title": "Christmas Eve, and the pack closes again", "note": "Alas! alas! I turned in at three thinking we had come to the end of our troubles. At seven we were brought up by a solid sheet of pack extending in all directions save that from which we had come. There was nothing to do but stop and bank fires. If we let the fires out it means a dead loss of over 2 tons of coal to heat the boiler again. The most difficult of decisions."}, {"id": 8, "dk": "1910-12-25", "t": "23:59", "nar": ["n6", "n2"], "imp": 2, "j": false, "title": "Christmas in the ice", "note": "The scene is altogether too Christmassy: ice all round, low clouds letting fall light snowflakes. We are captured. But everyone on board is cheerful; the mess is decorated with our banners, and there was a lusty singing of hymns at the Service. Crean's rabbit produced a family of 17, it is said, and Crean has given away 22. Dinner: tomato soup, stewed penguin breast, roast beef, plum-pudding and mince pies, with champagne. For five hours the company has sat round the table singing."}, {"id": 9, "dk": "1910-12-30", "t": "06:00", "nar": ["n6", "n5"], "imp": 3, "j": false, "title": "Out of the pack at last", "note": "We are out of the pack at length and at last. Bowers steered through the last ice stream at 1 A.M., and at six this morning we were well in the open sea. One breathes again and hopes it will be possible to carry out the main part of our programme, though the coal will need tender nursing."}, {"id": 10, "dk": "1911-01-03", "t": "18:00", "nar": ["n5", "n6"], "imp": 2, "j": false, "title": "Cape Crozier is denied us", "note": "No good!! Alas! Cape Crozier with all its attractions is denied us. We came up to the Barrier five miles east of the Cape after 1 P.M., but the swell from the E.N.E. continued to the end, and there could be no landing."}, {"id": 11, "dk": "1911-01-04", "t": null, "nar": ["n7", "n6"], "imp": 3, "j": false, "title": "Our wintering place", "note": "This work is full of surprises. At 6 A.M. we came through the last of the Strait pack and ran on past Cape Royds in clear water, farther than I have ever seen it open. My main wish was a place not easily cut off from the Barrier, and my eye fell on the cape we used to call the Skuary. I have rechristened it Cape Evans, in honour of our excellent second in command. A glance at the land showed ideal spots for a wintering station."}, {"id": 12, "dk": "1911-01-05", "t": null, "nar": ["n6", "n4", "n5"], "imp": 2, "j": false, "title": "Killer whales under the floe", "note": "Six or seven killer whales were skirting the floe edge where our two Esquimaux dogs were tethered. I shouted to Ponting, who ran with his camera for a picture. The next moment the whole floe under him and the dogs heaved up and split into fragments, with a booming noise as whale after whale struck it from below with their backs. Ponting kept his feet and flew to safety, and by an extraordinary chance the splits went around and between the dogs."}, {"id": 13, "dk": "1911-01-08", "t": "07:30", "nar": ["n4", "n6"], "imp": 3, "j": false, "title": "The third motor goes through the ice", "note": "A day of disaster. I stupidly gave permission for the third motor to be got out this morning. Crossing a sludgy patch, Campbell tried to rush the machine across on a line. A man on the rope went through to the shoulders and was hauled out; then the ice under the motor gave, and it disappeared. The rope cut through the ice towards the men with increasing strain until one after another had to let go. Half a minute later nothing remained but a big hole."}, {"id": 14, "dk": "1911-01-10", "t": null, "nar": ["n7"], "imp": 2, "j": false, "title": "We are landed", "note": "Six days in McMurdo Sound, and to-night I can say we are landed. Were it impossible to land another pound we could go on without a hitch. Nothing like it has been done before, nothing so expeditious and complete. The hut progresses apace, with double boarding and a layer of quilted seaweed insulation in the walls. All agree it should be the most perfectly comfortable habitation."}, {"id": 15, "dk": "1911-01-17", "t": null, "nar": ["n7", "n2"], "imp": 2, "j": false, "title": "We move into the hut", "note": "We took up our abode in the hut to-day and are simply overwhelmed with its comfort. Bowers built a bulkhead of cases to shut off the officers' space from the men's, to the satisfaction of both. Bowers, Oates, Atkinson, Meares and Cherry-Garrard, special friends all, have one space and have already made it very habitable. It will be a fortnight to-morrow since we arrived."}, {"id": 16, "dk": "1911-01-19", "t": null, "nar": ["n7"], "imp": 1, "j": false, "title": "A house under Erebus", "note": "The hut is becoming the most comfortable dwelling-place imaginable; the word hut is misleading. It is 50 feet long by 25 wide, nestling below a small hill on a long stretch of black sand, with provision cases in neat blocks in front and the sea lapping the ice foot below. Always towering above us is the great snowy peak of Erebus with its smoking summit."}, {"id": 17, "dk": "1911-01-21", "t": null, "nar": ["n6"], "imp": 2, "j": false, "title": "The ship ashore", "note": "My anxiety for the ship was not unfounded. In the night the ice broke with a northerly swell and she was on a dead lee shore; at six she backed out to windward, and almost at once a large berg drove in and grounded where she had lain. In the afternoon came the report that she was ashore off the Cape. I ran out with Evans and saw it was only too true."}, {"id": 18, "dk": "1911-01-22", "t": null, "nar": ["n6"], "imp": 1, "j": false, "title": "A quiet day", "note": "A quiet day with little to record. The ship lies peacefully in the bay again."}, {"id": 19, "dk": "1911-01-26", "t": "17:00", "nar": ["n6", "n3", "n4"], "imp": 2, "j": false, "title": "Farewell to the ship", "note": "The dogs caught sight of a whale in the lead and made for it; it was all we could do to stop them short of the water. Pennell had the men aft, and I thanked them for their splendid work. They have behaved like bricks, and a finer lot of fellows never sailed in a ship. Ponting had his half-hour photographing us, the ponies and the dog teams. It was a little sad to say farewell to Campbell and his men. God bless them."}, {"id": 20, "dk": "1911-02-03", "t": "08:00", "nar": ["n3"], "imp": 2, "j": false, "title": "The triumph of the snowshoe", "note": "Bowers, leading, plunged into soft snow, and soon three ponies were plunging and struggling in a drift. Then came the triumph of the snowshoe again: we put a set on Bowers' big pony, and after a few awkward minutes he settled down and brought in his load over places into which he had been plunging. If we had more of these shoes we could put them on nearly all our ponies."}, {"id": 21, "dk": "1911-02-06", "t": "18:00", "nar": ["n5", "n3", "n2"], "imp": 1, "j": false, "title": "Blizzard at Corner Camp", "note": "The wind increased in the night, and it has blown very hard all day. No fun to be out of the tent, but there are no shirkers with us. Oates has been out regularly to feed the ponies."}, {"id": 22, "dk": "1911-02-17", "t": null, "nar": ["n1", "n3"], "imp": 3, "j": false, "title": "One Ton Depot", "note": "Built the depot at Lat. 79\u00b0 29': provisions, oil, oats, fodder and biscuit, well over a ton of stuff with packing. It is a pity we couldn't get to 80\u00b0, but as it is we shall have a good leg up for next year and can at least feed the ponies full up to this point."}, {"id": 23, "dk": "1911-02-21", "t": "15:20", "nar": ["n4", "n2"], "imp": 3, "j": false, "title": "Dogs down a crevasse", "note": "Running beside the sledges, we were travelling unknowingly along the bridge of a crevasse. The middle dogs of our team disappeared, then two by two the whole team sank, hanging howling in the abyss between the sledge and Osman, the leader, who kept his foothold by great strength. Why the sledge didn't follow we shall never know. With the Alpine rope we hauled them up two by two, and I was lowered 65 feet to a snow bridge to fetch the last two. All thirteen recovered. Wilson and Cherry-Garrard were excellent."}, {"id": 24, "dk": "1911-02-22", "t": "04:30", "nar": ["n4", "n3"], "imp": 1, "j": false, "title": "Dogs thin as rakes", "note": "Reached Safety Camp. The dogs are as thin as rakes, ravenous and very tired; they are underfed, and next year the ration must be increased. Found Evans' party in excellent health, but alas, with only one pony. Forde's pony sank in a blizzard in spite of the most tender care."}, {"id": 25, "dk": "1911-02-22", "t": "22:00", "nar": ["n9", "n1"], "imp": 4, "j": true, "title": "Amundsen is in the Bay of Whales", "note": "Every incident of the day pales before the startling contents of the mail bag Atkinson gave me: a letter from Campbell, who found Amundsen established in the Bay of Whales. One thing fixes itself definitely in my mind. The proper, as well as the wiser, course is to proceed exactly as though this had not happened. To go forward and do our best for the honour of the country without fear or panic. His plan is a very serious menace to ours: a shorter distance by 60 miles, many dogs, and he can start early in the season, which is impossible with ponies."}, {"id": 26, "dk": "1911-03-01", "t": null, "nar": ["n3"], "imp": 2, "j": false, "title": "Weary Willy died in the night", "note": "Our pony died in the night. It is hard to have got him back so far only for this. These blizzards are terrible for the poor animals. It makes a late start necessary for next year. Well, we have done our best and bought our experience at a heavy cost."}, {"id": 27, "dk": "1911-03-02", "t": null, "nar": ["n3", "n2", "n5"], "imp": 4, "j": true, "title": "The sea ice breaks up", "note": "The events of the past 48 hours bid fair to wreck the expedition. The sea was full of broken pieces of Barrier edge, and Bowers, Cherry-Garrard and Crean had camped with the ponies on the sea ice. In the night it broke all round them. They jumped the ponies from floe to floe while killer whales put their heads up on all sides, and Crean, volunteering, leapt from floe to floe and climbed the Barrier face to reach me. A desperate venture, but successful. We got the men up with the Alpine rope."}, {"id": 28, "dk": "1911-03-03", "t": null, "nar": ["n3", "n2"], "imp": 3, "j": false, "title": "We saved one pony", "note": "The ponies drifted off on their floe in the night. We found them again and tried to rush them for a last chance of life. Punch fell in trying to leap a gap, and we had to kill him. Bowers' pony slipped at a jump and plunged into the water among excited killer whales, and the only merciful thing was to kill it. We saved one. These incidents were too terrible. Everything out of joint with the loss of the ponies, but mercifully all the party alive and well."}, {"id": 29, "dk": "1911-04-14", "t": null, "nar": ["n7"], "imp": 1, "j": false, "title": "Good Friday", "note": "Good Friday. A peaceful day, the wind continuing 20 to 30 miles an hour. Had divine service."}, {"id": 30, "dk": "1911-04-22", "t": null, "nar": ["n7", "n3"], "imp": 2, "j": false, "title": "Back at Cape Evans", "note": "Cape Evans, Winter Quarters. The sledging season is at an end. It's good to be back in spite of all the losses we have sustained. A very exceptional calm. Oates and the rest are exercising the ponies, and I am sorting my papers for the winter work."}, {"id": 31, "dk": "1911-04-23", "t": null, "nar": ["n7", "n5"], "imp": 2, "j": false, "title": "The last day of the sun", "note": "The last day of the sun, and a very glorious view of its golden light over the Barne Glacier. The long mild twilight, like a silver clasp, unites to-day with yesterday. Divine Service, with only seven hymn-books, the others having stupidly gone back to the ship. I begin to think we are too comfortable in the hut and hope it will not make us slack; but so far not a rift in the social arrangements."}, {"id": 32, "dk": "1911-04-24", "t": null, "nar": ["n7", "n8"], "imp": 1, "j": false, "title": "A night watchman for the aurora", "note": "A night watchman has been instituted, mainly to observe the aurora. He looks round every hour and is allowed cocoa and sardines with bread and butter. I took the first turn last night."}, {"id": 33, "dk": "1911-05-08", "t": "21:00", "nar": ["n1", "n3", "n4"], "imp": 3, "j": false, "title": "My plans for next season", "note": "Gave the company an outline of my plans for next season. I could not but hint that the problem of reaching the Pole can best be solved by relying on the ponies and man haulage, and the whole company appeared to be in sympathy. Everyone seems to distrust the dogs when it comes to glacier and summit. I have asked everyone to give thought to it and bring me suggestions. It's going to be a tough job."}, {"id": 34, "dk": "1911-05-18", "t": null, "nar": ["n7"], "imp": 1, "j": false, "title": "Football in the dark", "note": "Calm, with slight snowfall. An excellent football match, the only outdoor game possible in this light. I think our winter routine very good, though I suppose every leader thinks that, since he has the power of altering it."}, {"id": 35, "dk": "1911-06-04", "t": null, "nar": ["n7", "n2"], "imp": 1, "j": false, "title": "A typical Sunday", "note": "Breakfast, then hymns chosen while the hut is cleared up. Wilson strikes the note on which the hymn is to start, and I try to hit it after him with doubtful success. After church Wilson, Bowers, Cherry-Garrard, Lashly and I went to start building our first igloo. There is much difference of opinion over the best implement for cutting snow blocks. I think my knife will prove most effective, but the others don't acknowledge it yet."}, {"id": 36, "dk": "1911-06-06", "t": "21:00", "nar": ["n7", "n10"], "imp": 2, "j": false, "title": "My birthday", "note": "It is my birthday, a fact I might easily have forgotten, but my kind people did not. At lunch an immense birthday cake appeared, which Clissold had decorated with chocolate, crystallised fruit, flags and photographs of myself, and we were photographed around it. To-night the moon sails across a cloudless northern sky, the wind has fallen, and the scene is glorious."}, {"id": 37, "dk": "1911-06-22", "t": "19:00", "nar": ["n7", "n2"], "imp": 3, "j": false, "title": "Midwinter Day", "note": "Kept with all the festivity of Christmas at home. Flags hung about the table, glass and champagne bottles instead of mugs. Seal soup, roast beef and Yorkshire pudding, a flaming plum-pudding and mince pies. I screwed myself up to a little speech: we are at the half-way mark, and it would have been impossible to choose people more fitted to support me in the enterprise to the South. I thanked them all for putting their shoulders to the wheel. We drank to the Success of the Expedition."}, {"id": 38, "dk": "1911-06-27", "t": null, "nar": ["n2", "n8"], "imp": 3, "j": false, "title": "The Crozier Party sets out", "note": "Wilson, Bowers and Cherry-Garrard departed this morning in good spirits for Cape Crozier, in the dark of winter, to study the embryos of the Emperor penguin. Their heavy load is on two 9-foot sledges. Ponting photographed them by flashlight. This winter travel is a new and bold venture, but the right men have gone to attempt it. All good luck go with them."}, {"id": 39, "dk": "1911-07-04", "t": "23:45", "nar": ["n7", "n2", "n5"], "imp": 3, "j": false, "title": "Atkinson lost on the floe", "note": "A day of blizzard and adventure. Without my knowledge Atkinson and Gran set out over the floe at 5.30 for the thermometer screens. Gran was back by dinner; Atkinson was not. By ten, search parties were out in every direction with sledges, sleeping-bags and brandy, and I had a flare lit on Wind Vane Hill. Eleven o'clock came, then 11.30, with six hours of absence. At 11.45 I heard voices from the Cape, and Meares and Debenham led our wanderer home, badly frostbitten in the hand, confused, but otherwise well."}, {"id": 40, "dk": "1911-07-10", "t": null, "nar": ["n5", "n7"], "imp": 2, "j": false, "title": "The worst gale I have ever known", "note": "The worst gale I have ever known in these regions, and not done with yet. On Saturday the wind averaged 60 miles an hour for an hour, with gusts above 70, and the temperature stayed below -35\u00b0 for the best part of two days. On my night duty, stepping outside, one seemed robbed of breath, and ten paces against the wind were enough to freeze one's face."}, {"id": 41, "dk": "1911-07-14", "t": null, "nar": ["n3", "n2"], "imp": 3, "j": false, "title": "Bones has colic", "note": "A horrible fright. At noon yesterday Bones, one of the best ponies, went off his feed; he had colic. Every few minutes he was seized with a spasm of pain. I never realised how pathetic a horse can be: no sound escapes him, only dumb movements of the head with a patient expression of appeal. Oates gave him opium, sacks were heated in the oven, and Oates and Crean never left him. Towards midnight I felt very downcast. We cannot afford to lose a single pony."}, {"id": 42, "dk": "1911-07-15", "t": null, "nar": ["n3"], "imp": 1, "j": false, "title": "Bones is getting on well", "note": "Bones seems to be getting on well, though not yet quite so buckish as before his trouble. A good big ventilator has been fitted in the stable. It is not easy to get over the alarm of Thursday night."}, {"id": 43, "dk": "1911-07-27", "t": null, "nar": ["n7", "n2"], "imp": 2, "j": false, "title": "The light advancing", "note": "Calmer days, the sky rosier, the light visibly advancing. We have never suffered from low spirits, and the presence of day raises us to high spirits. The light, merry humour of our company has never been eclipsed, and the good-natured chaff has never ceased since the early days."}, {"id": 44, "dk": "1911-08-02", "t": null, "nar": ["n2", "n8", "n5"], "imp": 4, "j": true, "title": "The Crozier Party returns", "note": "They returned last night after five weeks of the hardest conditions on record, faces scarred and wrinkled, eyes dull, hands whitened with cold. For more than a week the thermometer stayed below -60\u00b0; one night it showed -77\u00b0, 109 degrees of frost. At Crozier they built a stone hut; in a blizzard their tent was whirled away, and after fourteen hours the roof went too. They lay in their bags a night and half a day. The tent was found a quarter of a mile off, practically uninjured. They brought back three Emperor eggs. Bowers is the hardest traveller that ever undertook a Polar journey."}, {"id": 45, "dk": "1911-08-23", "t": null, "nar": ["n7", "n5"], "imp": 1, "j": false, "title": "Toasting a sun we cannot see", "note": "We toasted the sun in champagne last night, coupled with Victor Campbell's name as his birthday coincides. We haven't had a glimpse of the sun and the champagne went wholly unappreciated. Meanwhile the gale continues, nearly 70 miles an hour for some hours."}, {"id": 46, "dk": "1911-08-26", "t": null, "nar": ["n3", "n5"], "imp": 2, "j": false, "title": "The sun comes back", "note": "Almost calm. Yesterday afternoon Evans caught a glimpse of the upper limb of the sun from the floe, and Simpson saw it from Wind Vane Hill. The ponies are very buckish and can scarcely be held in at exercise; they certainly feel the return of daylight."}, {"id": 47, "dk": "1911-08-28", "t": null, "nar": ["n4"], "imp": 2, "j": false, "title": "Julick comes home", "note": "Ponting and Gran, coming back from the bergs last night, saw a dog coming over the floe from the north. It leapt about them with every sign of intense joy: our long-lost Julick, missing exactly a month. His mane was crusted with blood and he smelt strongly of seal blubber. One would give a great deal to hear his tale."}, {"id": 48, "dk": "1911-09-10", "t": null, "nar": ["n1", "n2"], "imp": 3, "j": false, "title": "The Southern plans are finished", "note": "My whole time this week has gone into detailed plans for the Southern journey, and they are finished at last. Every figure has been checked by Bowers, who has been an enormous help. If the motors succeed we shall have no difficulty getting to the Glacier, and if they fail we shall still get there with any ordinary good fortune. I fear to be too sanguine, yet I feel our chances ought to be good."}, {"id": 49, "dk": "1911-09-13", "t": "21:00", "nar": ["n1", "n2"], "imp": 2, "j": false, "title": "Holding forth on the Southern Plans", "note": "I held forth on the Southern Plans to-day. Everyone was enthusiastic, and there was not a single suggestion offered for improvement. The scheme seems to have earned full confidence. It remains to play the game out."}, {"id": 50, "dk": "1911-09-28", "t": null, "nar": ["n2", "n8", "n5"], "imp": 2, "j": false, "title": "Home from the spring journey west", "note": "Back after thirteen days on a remarkably pleasant and instructive little spring journey to the west: 152 geographical miles by sledge in 10 marching days. The double tent is a great asset. We captured many frost-bites. Bowers insists on doing all the camp work; he is a positive wonder. I never met such a sledge traveller."}, {"id": 51, "dk": "1911-10-08", "t": null, "nar": ["n7", "n2"], "imp": 2, "j": false, "title": "Clissold falls from a berg", "note": "Clissold was acting as Ponting's model on a berg. After one of his poses he missed his footing, slid 12 feet over rounded ice and dropped 6 feet onto a sharp angle. He struck his back and head and is suffering concussion. We brought him home in a sleeping-bag. Atkinson has given him morphia and will watch by him tonight. I still feel very anxious."}, {"id": 52, "dk": "1911-10-24", "t": "10:00", "nar": ["n4"], "imp": 2, "j": false, "title": "The motors start south", "note": "The motors got off shortly after 10 this morning. Many stops at first, but the engines seem to improve all the time. Day sets his motor going, climbs off, and walks alongside with an occasional finger on the throttle. The pace is very slow, and the weights seem heavier than we bargained for."}, {"id": 53, "dk": "1911-10-31", "t": null, "nar": ["n1", "n7", "n10"], "imp": 4, "j": true, "title": "The last entry at Cape Evans", "note": "The blizzard has blown itself out and the sun is shining. Meares and Ponting are off to Hut Point, and if the weather holds we shall all get off to-morrow. So here end the entries in this diary with the first chapter of our History. The future is in the lap of the gods. I can think of nothing left undone to deserve success."}, {"id": 54, "dk": "1911-11-01", "t": "11:00", "nar": ["n3", "n1"], "imp": 3, "j": false, "title": "Away south", "note": "We got away in detachments. The little devil Christopher was harnessed with the usual difficulty and started in kicking mood, Oates holding on for all he was worth. Bones ambled off gently with Crean, and I led Snippets in his wake. Evans and Snatcher passed at their usual full speed. The wind blew very strong at the Razor Back, and the ponies hate the wind. I ended where I best wished to be, at the tail of the line."}, {"id": 55, "dk": "1911-11-06", "t": null, "nar": ["n4", "n3"], "imp": 3, "j": false, "title": "The motor has failed", "note": "The black dots to the south proved to be the motor. A note from Evans: the big end of No. 1 cylinder cracked. The engines are not fitted for this climate, but the system of pr
