      flex:none;height:auto;width:var(--calw);min-height:0;min-width:0;
      box-shadow:inset -10px 0 12px -12px rgba(var(--ink-rgb),.16);
    }
    #tlPane{
      min-height:0;min-width:0;
      box-shadow:inset 10px 0 12px -12px rgba(var(--ink-rgb),.12);
    }

    /* The spine. The same 15px strip, stood upright; its grab target reaches
       into both pages sideways instead of up and down. */
    #seam{
      width:15px;height:auto;align-self:stretch;
      border-top:0;border-left:1px solid var(--line);
      cursor:col-resize;
    }
    #seam::before{left:-7px;right:-7px;top:0;bottom:0;}
    #seam.dragging{cursor:col-resize;}
    /* A ribbon hung from the head of the spine is longer than one tucked
       across a fold. flex:none, or a 22px ribbon in a 15px strip is
       squeezed to the strip. */
    .handle{flex:none;top:-1px;height:44px;}
    #seam:hover .handle,#seam.dragging .handle{height:54px;width:25px;}

    /* Cells a little taller: a column of weeks this narrow reads as a
       calendar when its days are nearer square, and a pointer is aimed with
       more room than a thumb needs anyway. --rowp above keeps the months that
       are not drawn yet at the same pitch. */
    .cell{min-height:34px;}
    @media (hover:hover){
      .cell:not(.sel):not(.today):hover{box-shadow:inset 0 0 0 1px var(--rail);}
      .cell.today:not(.sel):hover{box-shadow:inset 0 0 0 1.25px var(--ribbon),inset 0 0 0 2.5px rgba(var(--ink-rgb),.06);}
    }

    /* The journal is set to a column rather than to the window, so a line
       doesn't run the width of a monitor. The four channels the ladder uses
       are all measured against this column, so the ragged edge that tells a
       month's shape at a glance survives intact. */
    #days{max-width:var(--measure);margin-left:auto;margin-right:auto;}
    .where-stacked{display:none;}
    .where-open{display:inline;}

    /* Everything that works the journal stays in the journal's margin rather
       than in the window's corner: on a wide screen the corner can be a
       third of a metre from the text it acts on. --off is how far the column
       sits in from the pane's own padding. */
    #tlPane{--off:max(0px,calc((100% - 80px - var(--measure)) / 2));}
    .railwrap{right:calc(var(--off) + 2px);}
    .zoomcap{right:calc(var(--off) + 14px);}
    .fab,.todayfab{
      --off:max(0px,calc((100vw - var(--calw) - 15px - 80px - var(--measure)) / 2));
    }
    .fab{right:calc(var(--off) + 14px);bottom:22px;}
    .todayfab{right:calc(var(--off) + 19px);bottom:86px;}
    /* the toast speaks for the page it concerns, so it is centred on it */
    .toast{left:calc(var(--calw) + 15px + (100vw - var(--calw) - 15px) / 2);}

    /* More paper to write on. The sheet was sized to a phone held upright;
       at a desk the note is typed, and a three-line box is a letterbox. */
    .sheet{width:min(560px,100%);}
    .f-note{min-height:150px;}
    /* The shelf and the list of narratives carry names and file names that
       were being cut short to fit a phone's width. */
    #popShelf .pop-card,#popMan .pop-card{width:min(440px,100%);}
    .man-list{max-height:min(56vh,440px);}
  }
</style>
<style>
  /* ---- Persian: the same book, read from the other edge ----
     dir="rtl" mirrors everything laid out by flex and grid on its own. What
     follows is only what was placed by a physical side: the margins, the
     things hung off one edge, the strokes drawn down one side of a card. */
  /* the gap after the time sits on whichever side the card's own text runs from */
  .pbody[dir="ltr"] .time{margin-right:7px;margin-left:0;}
  .pbody[dir="rtl"] .time{margin-left:7px;margin-right:0;}
  .lang-glyph{font:600 11px/1 var(--sans);letter-spacing:0;}
  html[lang="fa"] .lang-glyph[lang="en"]{font-size:10px;}

  /* Persian letters join, so they are never tracked out, never set in
     capitals (there are none) and never slanted: an oblique Persian face is
     a Latin habit, not a Persian one. */
  html[lang="fa"]{
    --sans:"Vazirmatn","Vazir",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Vazirmatn","Noto Naskh Arabic","Times New Roman",serif;
    --badge-w:64px;
  }
  html[lang="fa"] *{letter-spacing:0 !important;text-transform:none !important;font-style:normal !important;}
  /* Persian at a Latin label's size reads smaller than the Latin did. */
  html[lang="fa"] .f-lb,html[lang="fa"] .eyebrow{font-size:11px;}
  html[lang="fa"] .post .meta{font-size:10.5px;}
  html[lang="fa"] .meta-tag{font-size:11px;}
  html[lang="fa"] .shelf-sub,html[lang="fa"] .man-count{font-size:11px;}
  html[lang="fa"] .shelf-tab{font-size:11.5px;}
  html[lang="fa"] .sample-say{font-size:12.5px;}
  html[lang="fa"] .seg,html[lang="fa"] .sh-sort .seg{font-size:12px;}
  html[lang="fa"] .swipemark{font-size:11px;}
  html[lang="fa"] .man-x.armed{font-size:11.5px;}
  html[lang="fa"] .weekrow{font-size:12px;}
  html[lang="fa"] .dp-week{font-size:11.5px;}
  html[lang="fa"] .mname{font-size:10.5px;line-height:1.25;text-overflow:clip;}
  html[lang="fa"] .monthbadge{padding:3px 4px 4px;}
  html[lang="fa"] .daybadge{padding:3px 4px 4px;gap:3px;}
  html[lang="fa"] .bnum{font-size:14px;}
  html[lang="fa"] .bstack{font-size:9.5px;line-height:1.3;}
  html[lang="fa"] .ampm button{font-size:11px;}
  html[lang="fa"] .toast-act{font-size:12px;}

  /* ---- both calendars ----
     The second calendar is always the quieter one: a small figure in the
     cell's far corner, a pair of short month names under the chapter tab, a
     line after the month's name in the journal. Its figures are Latin in
     either language, so the two can be told apart at a glance. */
  .cell .alt{
    position:absolute;top:3px;inset-inline-end:4px;
    font:9px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--mute);opacity:.8;
    letter-spacing:0;pointer-events:none;
  }
  /* the day a month of the second calendar turns over */
  .cell .alt.first{font-weight:700;color:var(--ink2);opacity:1;}
  .cell.sel .alt{color:rgba(var(--panel-rgb),.7);}
  /* the tab's second line has to hold two short month names side by side */
  html.dual:not([lang="fa"]){--badge-w:64px;}
  .malt{display:block;margin:1px 0;max-width:100%;
    font:9px/1.15 var(--sans);color:var(--mute);white-space:nowrap;letter-spacing:0;}
  .month.active .malt{color:rgba(var(--panel-rgb),.72);}
  .mralt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font:11px/1 var(--serif);color:var(--mute);}
  .dp-alt{padding:6px 10px 0;text-align:center;font:11.5px/1.2 var(--serif);color:var(--mute);}
  .dp-alt[hidden]{display:none;}
  .pick-alt{font:11.5px/1.15 var(--sans);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .pick-alt[hidden]{display:none;}
  /* a Persian month name inside an English page, or the reverse, keeps the
     letters of its own script unspaced */
  [lang="fa"].alt-fa{letter-spacing:0;text-transform:none;}

  /* a title is set in its own direction, so an English name is cut at its
     end rather than its beginning */
  html[dir="rtl"] .booktitle{unicode-bidi:plaintext;}
  html[dir="rtl"] .brand{margin-left:0;margin-right:-6px;}
  html[dir="rtl"] .tools{margin-left:0;margin-right:2px;}
  html[dir="rtl"] .loadbar::before{left:auto;right:0;transform:translateX(100%);}
  html[dir="rtl"] #app.importing .loadbar::before{animation-name:loadglidertl;}
  @keyframes loadglidertl{from{transform:translateX(100%);}to{transform:translateX(-300%);}}
  html[dir="rtl"] .yearbtn{padding:3px 3px 4px 5px;}
  html[dir="rtl"] .yearlist{left:auto;right:0;}
  html[dir="rtl"] .yopt,html[dir="rtl"] .bstack,html[dir="rtl"] .pick,
  html[dir="rtl"] .shelf-open{text-align:right;}
  html[dir="rtl"] .tl-line{left:auto;right:calc(var(--badge-w)/2);}
  html[dir="rtl"] .post{padding:5px 15px 6px 10px;}
  html[dir="rtl"] .post::before{left:auto;right:1px;}
  html[dir="rtl"] .dot{left:auto;right:calc(-1 * (var(--gap) + var(--badge-w)/2 + var(--dotr)));}
  html[dir="rtl"] #days .post.departing{translate:10px 0;}
  html[dir="rtl"] #days .post.arriving{animation-name:postarrivertl;}
  @keyframes postarrivertl{from{opacity:0;translate:10px 0;}}
  html[dir="rtl"] .empty{margin:6px calc(var(--badge-w) + 3px) 0 0;}
  html[dir="rtl"] .empty-mark{margin:0 -4px 14px 0;}
  html[dir="rtl"] .monthrule{margin-left:0;margin-right:calc(var(--badge-w) + 3px);}
  html[dir="rtl"] #tlScroll{padding-right:var(--gutter);padding-left:64px;}
  html[dir="rtl"] .railwrap{right:auto;left:2px;}
  /* Back and forward are a path through time, not a direction of reading:
     the left arrow goes back and the right one forward in either language. */
  html[dir="rtl"] .railwrap{direction:ltr;}
  html[dir="rtl"] .zoomcap{right:auto;left:14px;text-align:left;}
  html[dir="rtl"] .todayfab{right:auto;left:19px;}
  html[dir="rtl"] .fab{right:auto;left:14px;}
  html[dir="rtl"] .man-grip{margin:0 -4px 0 -6px;}
  html[dir="rtl"] .man-sw{padding:3px 53px 8px 0;}
  html[dir="rtl"] .sh-find{padding:0 9px 0 4px;}
  html[dir="rtl"] .seg{border-left:none;border-right:1px solid var(--line);}
  html[dir="rtl"] .seg:first-child{border-right:none;}
  html[dir="rtl"] .pop-x{right:auto;left:8px;}
  html[dir="rtl"] .chip{padding:5px 9px 6px 11px;}
  /* A clock face is not written in a direction: hours stay on the left of the
     colon in Persian too. */
  html[dir="rtl"] .clock-hd{direction:ltr;}
  @media (min-width:900px) and (min-height:540px){
    html[dir="rtl"] #calPane{box-shadow:inset 10px 0 12px -12px rgba(var(--ink-rgb),.16);}
    html[dir="rtl"] #tlPane{box-shadow:inset -10px 0 12px -12px rgba(var(--ink-rgb),.12);}
    html[dir="rtl"] #seam{border-left:0;border-right:1px solid var(--line);}
    html[dir="rtl"] .railwrap{right:auto;left:calc(var(--off) + 2px);}
    html[dir="rtl"] .zoomcap{right:auto;left:calc(var(--off) + 14px);}
    html[dir="rtl"] .fab{right:auto;left:calc(var(--off) + 14px);}
    html[dir="rtl"] .todayfab{right:auto;left:calc(var(--off) + 19px);}
    html[dir="rtl"] .toast{left:calc((100vw - var(--calw) - 15px) / 2);}
  }

  /* ---- reminders ----
     A reminder belongs to the note it was set on. The book never interrupts
     for one: the bell in the far corner carries a small ribbon-coloured dot
     while something falls due today and has not been checked off, and the
     list behind it holds only the coming week. */
  #remBtn{position:relative;}
  .kdot{
    position:absolute;top:-3px;inset-inline-end:-3px;width:8px;height:8px;border-radius:50%;
    background:var(--ribbon);box-shadow:0 0 0 2px var(--bg);pointer-events:none;
  }
  .kdot[hidden]{display:none;}
  #popRem .pop-card{width:min(360px,100%);}
  .rem-sub{padding:7px 12px 0;text-align:center;font:italic 12.5px/1.3 var(--serif);color:var(--mute);}
  .rem-list{
    max-height:min(58vh,400px);overflow-y:auto;padding:4px 10px 10px;
    scrollbar-width:thin;scrollbar-color:var(--rail) transparent;
  }
  .rem-sec{padding-top:10px;}
  .rem-sec+.rem-sec{margin-top:6px;border-top:1px dashed var(--line);}
  .rem-sec .f-lb{margin:2px 2px 5px;}
  .rem-row{display:flex;align-items:center;gap:6px;}
  .rem-ft[hidden]{display:none;}
  .rem-go{
    flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;
    border:1px solid transparent;border-radius:7px;background:transparent;
    padding:7px 6px 8px;text-align:start;color:var(--ink);
    transition:border-color 160ms ease;
  }
  @media (hover:hover){ .rem-go:hover{border-color:var(--line);} }
  .rem-t{flex:1;min-width:0;font:15px/1.25 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;}
  .rem-w{flex:none;font:12px/1 var(--sans);color:var(--mute);}
  /* a title keeps its own direction but sits on the page's reading side */
  html[dir="ltr"] .rem-t{text-align:left;}
  html[dir="rtl"] .rem-t{text-align:right;}
  .rem-w.now{color:var(--ribbon);font-weight:600;}
  .rem-row.read .rem-t{color:var(--mute);}

  .rem-row.read .rem-w.now{color:var(--mute);font-weight:400;}
  .rem-none{margin:0;padding:2px 2px 6px;font:italic 13px/1.4 var(--serif);color:var(--mute);}
  .rem-empty{margin:0;padding:18px 12px 12px;text-align:center;font:13px/1.5 var(--sans);color:var(--mute);}

  /* the reminder, set on the leaf itself */
  .rem-set{display:flex;flex-direction:column;gap:10px;}
  .rem-set .f-lb{margin-bottom:0;}
  .rem-set [hidden]{display:none !important;}
  .rem-custom{display:flex;align-items:center;flex-wrap:wrap;gap:7px 8px;}
  .rem-say{font:13px/1 var(--sans);color:var(--ink2);}
  .rem-n{
    width:58px;height:32px;border:1px solid var(--line);border-radius:7px;background:transparent;
    color:var(--ink);font:15px/1 var(--serif);text-align:center;outline:none;
    transition:border-color 180ms ease;-moz-appearance:textfield;
  }
  .rem-n:focus{border-color:var(--ribbon);}
  .rem-custom .segs{flex:1;min-width:210px;}
  .rem-tg,html[dir="rtl"] .rem-tg{padding:5px 11px 6px;}
  .rem-tg.on{color:var(--ribbon);}
  .rem-end-x{align-self:center;}
  .rem-set .f-hint{margin:0;}
  html[lang="fa"] .rem-w{font-size:12.5px;}
</style>
<style>
  /* ---- holding ----
     A hold is felt before it is finished: the card inks its own edge while the
     finger is down, and a phone is kept from raising its own text-selection
     handles or callout over the note. A mouse keeps its text selection. */
  .post,.cell{-webkit-touch-callout:none;}
  @media (pointer:coarse){ .post,.cell{-webkit-user-select:none;user-select:none;} }
  .post.pressing{box-shadow:inset 0 0 0 1.5px var(--ribbon);
    transition:box-shadow 340ms ease 140ms,transform 240ms ease,opacity 240ms ease;}
  .post.held{box-shadow:inset 0 0 0 2px var(--ribbon),0 4px 14px rgba(var(--ink-rgb),.18);}
  .cell.pressing{box-shadow:inset 0 0 0 1.5px var(--ribbon);transition:box-shadow 340ms ease 140ms;}

  .holdmenu{
    position:fixed;z-index:45;display:flex;gap:2px;padding:4px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 12px 30px rgba(var(--ink-rgb),.26);
    animation:rise 160ms cubic-bezier(.2,.7,.3,1);
  }
  .holdmenu[hidden]{display:none;}
  .hm-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    min-width:68px;height:56px;padding:6px 9px 6px;border:1px solid transparent;border-radius:9px;
    background:transparent;color:var(--ink2);font:600 11.5px/1 var(--sans);letter-spacing:.01em;
    transition:border-color 160ms ease,color 160ms ease,background 160ms ease;
  }
  .hm-btn[hidden]{display:none;}
  .hm-btn svg{display:block;flex:none;}
  .hm-q{display:block;flex:none;height:18px;overflow:hidden;font:400 30px/40px var(--serif);color:var(--ribbon);}
  @media (hover:hover){ .hm-btn:hover{border-color:var(--ribbon);color:var(--ribbon);} }
  .hm-btn:active{background:rgba(var(--ink-rgb),.06);}
  .hm-btn:focus-visible{outline:2px solid var(--ribbon);outline-offset:-2px;}
  html[lang="fa"] .hm-btn{font-size:12.5px;}
  .holdmenu{flex-wrap:wrap;}
  .hm-sep{flex:none;align-self:center;width:1px;height:30px;margin:0 2px;background:var(--line);}
  /* Delete asks twice, the way the leaf does: the first tap arms it */
  @media (hover:hover){ .hm-del:hover{border-color:var(--nar-3);color:var(--nar-3);} }
  .hm-del.armed,.hm-del.armed:hover{background:var(--nar-3);border-color:var(--nar-3);color:var(--panel);}
  .hm-warn{flex:1 0 100%;margin:3px 4px 2px;font:12px/1.4 var(--sans);color:var(--ink2);}
  .hm-warn[hidden]{display:none;}

  /* ---- selecting ----
     Every card grows a ring at its far corner to fill; a filled one is taken.
     The card keeps its size, its grain and its colours, so the page being
     chosen from is still the page being read. */
  .post.selectable{padding-right:32px;}
  html[dir="rtl"] .post.selectable{padding-left:32px;}
  .pick-tick{
    position:absolute;top:7px;right:8px;width:18px;height:18px;border-radius:50%;
    border:1.5px solid var(--rail);background:var(--panel);pointer-events:none;
    transition:background 160ms ease,border-color 160ms ease,transform 160ms ease;
  }
  html[dir="rtl"] .pick-tick{right:auto;left:8px;}
  .pick-tick::after{
    content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;
    border:solid var(--panel);border-width:0 1.8px 1.8px 0;transform:rotate(45deg);opacity:0;
  }
  .post.picked .pick-tick{background:var(--ribbon);border-color:var(--ribbon);transform:scale(1.06);}
  .post.picked .pick-tick::after{opacity:1;}
  .post.picked{box-shadow:inset 0 0 0 2px var(--ribbon),0 1px 5px rgba(var(--ink-rgb),.15);}
  .post.picked .dot{background:var(--ribbon);border-color:var(--ribbon);}
  /* the days holding a selected note */
  /* set against the day's own number, so it can't be read as the next day's */
  .cell.haspick .num::after{
    content:"";display:inline-block;width:6px;height:6px;margin-inline-start:3px;vertical-align:.2em;
    border-radius:50%;background:var(--ribbon);pointer-events:none;
  }
  html.selecting .fab,html.selecting .todayfab{display:none !important;}
  html.selecting .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px));}

  .selbar{
    position:fixed;z-index:22;left:50%;transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    width:min(470px,calc(100% - 20px));display:flex;align-items:center;gap:7px;
    padding:7px 8px 7px 6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 10px 30px rgba(var(--ink-rgb),.26);
    animation:barrise 220ms cubic-bezier(.2,.7,.3,1);
  }
  html[dir="rtl"] .selbar{padding:7px 6px 7px 8px;}
  @keyframes barrise{from{opacity:0;transform:translateX(-50%) translateY(10px);}}
  .selbar[hidden]{display:none;}
  .sb-x{
    flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:9px;background:transparent;color:var(--mute);font:14px/1 var(--sans);
    transition:border-color 160ms ease,color 160ms ease;
  }
  @media (hover:hover){ .sb-x:hover{border-color:var(--line);color:var(--ink2);} }
  .sb-say{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .sb-n{font:15px/1.2 var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-sub{font:11.5px/1.3 var(--sans);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-sub[hidden]{display:none;}
  .selbar.told .sb-sub{color:var(--ink2);white-space:normal;}
  .selbar .btn{flex:none;white-space:nowrap;padding:7px 11px;}
  .selbar .btn[hidden]{display:none;}

  /* Asked only when a calendar range reaches notes that are out of view. */
  .selask{
    position:fixed;z-index:23;left:50%;transform:translateX(-50%);
    bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(470px,calc(100% - 20px));
    padding:12px 14px;background:var(--panel);border:1px solid var(--ribbon);border-radius:12px;
    box-shadow:0 12px 30px rgba(var(--ink-rgb),.24);
    animation:barrise 200ms cubic-bezier(.2,.7,.3,1);
  }
  .selask[hidden]{display:none;}
  .sa-h{margin:0 0 3px;font:16px/1.25 var(--serif);color:var(--ink);}
  .sa-p{margin:0 0 11px;font:12.5px/1.45 var(--sans);color:var(--ink2);}
  .sa-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .sa-row .btn[hidden]{display:none;}

  /* ---- the chapter shelf ---- */
  #popChap .pop-card{width:min(400px,100%);}
  #popChapPick{z-index:55;}
  #popChapPick .pop-card{width:min(360px,100%);}
  .ch-title{font:15px/1.2 var(--serif);color:var(--ink);padding:0 30px;min-width:0;}
  .pop-back{
    position:absolute;top:50%;left:8px;transform:translateY(-50%);
    display:flex;align-items:center;justify-content:center;width:26px;height:26px;padding-bottom:3px;
    border:1px solid transparent;border-radius:7px;background:transparent;color:var(--mute);
    font:22px/1 var(--serif);transition:border-color 180ms ease,color 180ms ease;
  }
  .pop-back[hidden]{display:none;}
  @media (hover:hover){ .pop-back:hover{border-color:var(--line);color:var(--ink2);} }
  html[dir="rtl"] .pop-back{left:auto;right:8px;transform:translateY(-50%) scaleX(-1);}
  .ch-head{padding:12px 14px 6px;display:flex;flex-direction:column;gap:7px;}
  .ch-head .f-hint{margin:0;}
  .ch-notes{max-height:min(44vh,340px);padding-top:4px;}
  .ch-go{
    flex:1;min-width:0;position:relative;display:flex;align-items:baseline;gap:9px;
    padding:7px 7px 8px 12px;border:1px solid transparent;border-radius:7px;background:transparent;
    text-align:start;color:var(--ink);transition:border-color 160ms ease;
  }
  html[dir="rtl"] .ch-go{padding:7px 12px 8px 7px;}
  .ch-go::before{
    content:"";position:absolute;inset-inline-start:3px;top:8px;bottom:8px;width:3px;border-radius:3px;
    background:var(--bc,var(--rail));
  }
  @media (hover:hover){ .ch-go:hover{border-color:var(--line);} }
  .ch-when{flex:none;font:12px/1 var(--sans);color:var(--mute);font-variant-numeric:tabular-nums;}
  .ch-t{flex:1;min-width:0;font:14.5px/1.25 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:start;}
  .ch-foot-say{flex:1;min-width:0;font:italic 12px/1.35 var(--serif);color:var(--mute);}
  #chFt .btn{white-space:nowrap;}

  /* ---- print ---- */
  #popPrint{z-index:57;}
  #popPrint .pop-card{width:min(540px,100%);display:flex;flex-direction:column;
    max-height:calc(100dvh - 32px - var(--kb,0px));}
  .pr-bd{flex:1;min-height:0;padding:12px 12px 6px;display:flex;flex-direction:column;gap:10px;}
  .pr-tpl .seg{padding:9px 2px 10px;letter-spacing:.05em;}
  .pr-bd .f-hint{margin:0;min-height:1.4em;}
  /* the page itself, shrunk to the card: paper is paper, whatever the screen reads by */
  .pr-view{
    position:relative;direction:ltr;flex:none;height:min(50dvh,440px);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;
  }
  .pr-view iframe{position:absolute;left:0;top:0;width:794px;height:100%;border:0;background:#fff;transform-origin:0 0;}
  .pr-refl[hidden]{display:none;}

  /* a reminder asked for from a hold: the leaf opens with its place marked */
  #fRem.flash{animation:remflash 1500ms ease;border-radius:8px;}
  @keyframes remflash{0%,55%{box-shadow:0 0 0 7px rgba(var(--ink-rgb),.06),0 0 0 8.5px var(--ribbon);}}

  @media (min-width:900px) and (min-height:540px){
    .selbar,.selask{left:calc(var(--calw) + 15px + (100vw - var(--calw) - 15px) / 2);}
    .selbar{bottom:22px;}
    .selask{bottom:84px;}
    html.selecting .toast{bottom:92px;}
    html[dir="rtl"] .selbar,html[dir="rtl"] .selask{left:calc((100vw - var(--calw) - 15px) / 2);}
    #popChap .pop-card{width:min(460px,100%);}
  }
  @media (prefers-reduced-motion:reduce){ .holdmenu,.selbar,.selask,#fRem.flash{animation:none;} }
</style>
<style>
  /* ---- a chapter being read ----
     Pinned ahead of the narratives rather than scrolling with them: while it
     is on, it is the first thing that explains why the notebook is so short. */
  .nb-chap{
    flex:none;display:flex;align-items:center;height:26px;max-width:min(52%,230px);
    border:1px solid var(--ribbon);border-radius:20px;background:var(--panel);color:var(--ribbon);
  }
  .nb-chap[hidden]{display:none;}
  .nbc-go{
    flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:100%;
    padding:0 4px 0 9px;border:0;border-radius:20px 0 0 20px;background:transparent;color:inherit;
    font:600 11.5px/1 var(--sans);letter-spacing:.01em;
  }
  html[dir="rtl"] .nbc-go{padding:0 9px 0 4px;border-radius:0 20px 20px 0;}
  .nbc-go svg{flex:none;display:block;}
  .nbc-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
  .nbc-n{flex:none;font-weight:400;color:var(--mute);white-space:nowrap;}
  .nbc-x{
    flex:none;width:26px;height:100%;display:flex;align-items:center;justify-content:center;
    border:0;border-radius:0 20px 20px 0;background:transparent;color:var(--ribbon);font:11px/1 var(--sans);
  }
  html[dir="rtl"] .nbc-x{border-radius:20px 0 0 20px;}
  @media (hover:hover){ .nbc-go:hover .nbc-name{text-decoration:underline;} .nbc-x:hover{background:rgba(var(--ink-rgb),.06);} }
  .nbc-go:focus-visible,.nbc-x:focus-visible{outline:2px solid var(--ribbon);outline-offset:-2px;}
  html[lang="fa"] .nbc-go{font-size:12.5px;}
  #chFt{flex-wrap:wrap;column-gap:6px;row-gap:8px;justify-content:flex-end;}
  #chFt .grow{margin-inline-end:-6px;}
  @media (max-width:380px){ #chFt .btn{padding-left:11px;padding-right:11px;} }
  /* the notebook's filter to this chapter: a toggle, lit while it is on */
  #chFt .ch-filter{display:inline-flex;align-items:center;gap:4px;}
  #chFt .ch-filter::before{content:"";flex:none;width:8px;height:10px;background:currentColor;opacity:.55;
    clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);}
  #chFt .ch-filter[aria-pressed="true"]{border-color:var(--ribbon);color:var(--ribbon);background:rgba(var(--ink-rgb),.04);}
  #chFt .ch-filter[aria-pressed="true"]::before{opacity:1;}
</style>
</head>

<script>
(function(){
"use strict";

/* -------------------------------- language -------------------------------- */
/* Two ways to read the book: English on the Gregorian calendar, or Persian,
   right to left, on the Solar Hijri calendar with Persian digits. One switch
   in the gear menu moves all four together. The book itself never changes:
   every date it stores stays a Gregorian key, so a notebook opens the same
   in either and a file exported from one reads in the other. */
var LANG_KEY="narratify.lang";
var LANG=(function(){try{return localStorage.getItem(LANG_KEY)==="fa"?"fa":"en";}catch(e){return "en";}})();
var DUAL_KEY="narratify.dual";
var DUAL=(function(){try{return localStorage.getItem(DUAL_KEY)==="1";}catch(e){return false;}})();
function isFa(){return LANG==="fa";}
function tr(en,p){return LANG==="fa"?p:en;}
var FA_DIGITS="\u06F0\u06F1\u06F2\u06F3\u06F4\u06F5\u06F6\u06F7\u06F8\u06F9";
function nf(x){
  x=String(x);
  return LANG==="fa"?x.replace(/[0-9]/g,function(c){return FA_DIGITS.charAt(+c);}):x;
}
function notesN(k){return tr(k+(k===1?" note":" notes"),nf(k)+" یادداشت");}
function applyDocLang(){
  document.documentElement.classList.toggle("dual",DUAL);
  document.documentElement.lang=LANG;
  document.documentElement.dir=isFa()?"rtl":"ltr";
}
applyDocLang();

/* Everything the page prints that the stylesheet's markup already carries:
   read once, as English, and put back in whichever language is in force. */

(function(){

    var rec={el:n,attrs:{},text:null}, any=false;
    ATTRS.forEach(function(a){
      var v=n.getAttribute(a);
      if(v&&FA_STATIC[v]){rec.attrs[a]=v;any=true;}
    });
    if(n.childNodes.length===1&&n.firstChild.nodeType===3){
      var t=n.firstChild.nodeValue.trim();
      if(FA_STATIC[t]){rec.text=t;any=true;}
    }
    if(any) staticEls.push(rec);
  }
})();

}

var EN_MONTHS=["January","February","March","April","May","June",
               "July","August","September","October","November","December"];
var FA_MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور",

/* Solar Hijri <-> Gregorian, after the jalaali-js arithmetic (Borkowski's
   33-year breaks). Every date the book stores stays Gregorian; these only
   turn it into the reader's calendar and back. */
var JBREAKS=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jdiv(a,b){return ~~(a/b);}
function jmod(a,b){return a-~~(a/b)*b;}
function jalCal(jy,noLeap){
  var bl=JBREAKS.length, gy=jy+621, leapJ=-14, jp=JBREAKS[0], jm, jump=0, leap, leapG, march, n, i;
  if(jy<jp||jy>=JBREAKS[bl-1]) return null;
  for(i=1;i<bl;i++){
    jm=JBREAKS[i]; jump=jm-jp;
    if(jy<jm) break;
    leapJ=leapJ+jdiv(jump,33)*8+jdiv(jmod(jump,33),4);
    jp=jm;
  }
  n=jy-jp;
  leapJ=leapJ+jdiv(n,33)*8+jdiv(jmod(n,33)+3,4);
  if(jmod(jump,33)===4&&jump-n===4) leapJ+=1;
  leapG=jdiv(gy,4)-jdiv((jdiv(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(noLeap) return {gy:gy,march:march};
  if(jump-n<6) n=n-jump+jdiv(jump+4,33)*33;
  leap=jmod(jmod(n+1,33)-1,4);
  if(leap===-1) leap=4;
  return {leap:leap,gy:gy,march:march};
}
function g2dn(gy,gm,gd){
  var d=jdiv((gy+jdiv(gm-8,6)+100100)*1461,4)+jdiv(153*jmod(gm+9,12)+2,5)+gd-34840408;
  return d-jdiv(jdiv(gy+100100+jdiv(gm-8,6),100)*3,4)+752;
}
function dn2g(jdn){
  var j=4*jdn+139361631;
  j=j+jdiv(jdiv(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=jdiv(jmod(j,1461),4)*5+308;
  var gd=jdiv(jmod(i,153),5)+1, gm=jmod(jdiv(i,153),12)+1;
  return {gy:jdiv(j,1461)-100100+jdiv(8-gm,6),gm:gm,gd:gd};
}
function j2dn(jy,jm,jd){
  var r=jalCal(jy,true);
  return g2dn(r.gy,3,r.march)+(jm-1)*31-jdiv(jm,7)*(jm-7)+jd-1;
}
function dn2j(jdn){
  var gy=dn2g(jdn).gy, jy=gy-621, r=jalCal(jy,false);
  var k=jdn-g2dn(gy,3,r.march);
  if(k>=0){
    if(k<=185) return {y:jy,m:1+jdiv(k,31),d:jmod(k,31)+1};
    k-=186;
  }else{
    jy-=1; k+=179;
    if(r.leap===1) k+=1;
  }
  return {y:jy,m:7+jdiv(k,30),d:jmod(k,30)+1};
}
function jMonthLen(jy,jm){
  if(jm<=6) return 31;
  if(jm<=11) return 30;
  var r=jalCal(jy,false);
  return (r&&r.leap===0)?30:29;
}

/* A stored key seen through the reader's calendar. Asked of the same few
   thousand days over and over as the page is built, so each is worked out once. */
var jMemo={};
function jOf(dk){
  var hit=jMemo[dk];
  if(hit) return hit;
  var y=+dk.slice(0,4), m=+dk.slice(5,7), d=+dk.slice(8,10), out;
  if(y<700||y>3700) out={y:y,m:m,d:d};           /* outside the table: left as written */
  else out=dn2j(g2dn(y,m,d));
  return (jMemo[dk]=out);
}
function cdate(dk){
  return isFa()?jOf(dk):{y:+dk.slice(0,4),m:+dk.slice(5,7),d:+dk.slice(8,10)};
}
/* The month and year a day files under, as "YYYY-MM" and "YYYY" in the
   calendar in force. The Gregorian ones are just the front of the key. */
function mkey(dk){
  if(!isFa()) return dk.slice(0,7);
  var j=jOf(dk);
  return pad4(j.y)+"-"+pad(j.m);
}
function ykey(dk){return mkey(dk).slice(0,4);}
/* The same day in the other calendar, with Latin figures whichever language
   is in force. */
function altOf(dk){
  var c=isFa()?{y:+dk.slice(0,4),m:+dk.slice(5,7),d:+dk.slice(8,10)}:jOf(dk);
  c.name=(isFa()?EN_MONTHS:FA_MONTHS)[c.m-1];
  return c;
}
/* a span holding the other calendar's words, set in that calendar's script
   and direction */
function altSpan(cls,text){
  var s=el("span",cls,text);
  if(!isFa()){s.lang="fa";s.dir="rtl";s.classList.add("alt-fa");}
  else{s.lang="en";s.dir="ltr";}
  return s;
}
/* "31 May 2007" / "10 خرداد 1386" */
function altFull(dk){var a=altOf(dk);return a.d+" "+a.name+" "+a.y;}
/* The other calendar's months across a stretch of days, full or short:
   "August – September 2026", "December 2005 – January 2006". */
function altRange(k1,k2,short){
  var a=altOf(k1), b=altOf(k2);
  function nm(x){return short?x.name.slice(0,3):x.name;}
  if(a.y!==b.y) return nm(a)+" "+a.y+" \u2013 "+nm(b)+" "+b.y;
  if(a.m===b.m) return nm(a)+" "+a.y;
  return nm(a)+" \u2013 "+nm(b)+" "+a.y;
}
function monthEnds(cm){return [key(cm.first),key(addDays(cm.first,cm.daysIn-1))];}
function monthNoK(dk){var c=cdate(dk);return c.y*12+c.m-1;}
/* A month of the calendar in force, by running number: where it starts on
   the real clock, how long it is, and what it is called. */
function calMonth(n){
  var y=Math.floor(n/12), m=n%12, first, daysIn;
  if(isFa()&&y>=80&&y<3170){
    var g=dn2g(j2dn(y,m+1,1));
    first=new Date(g.gy,g.gm-1,g.gd);
    daysIn=jMonthLen(y,m+1);
  }else{
    first=new Date(y,m,1);
    daysIn=new Date(y,m+1,0).getDate();
  }
  return {y:y,m:m,first:first,daysIn:daysIn,mk:pad4(y)+"-"+pad(m+1),name:MONTHS[m]};
}

/* ------------------------------- constants ------------------------------- */

/* Colors live in CSS (:root, plus a prefers-color-scheme:dark override) so
   light and dark stay in one definition each — JS just reads whichever is
   active rather than carrying its own hardcoded copy. */
var rootStyle = getComputedStyle(document.documentElement);
function cssVar(name){return rootStyle.getPropertyValue(name).trim();}

/* Narratives are the book's own threads: nothing is predefined, the reader
   makes them. Colour is stored as a slot in a fixed palette rather than a raw
   hex, so each one keeps its identity when the page turns to lamplight —
   the slot resolves to a different ink in the dark theme. */
var PALETTE = 10;
var NEUTRAL = cssVar("--mute");
var narratives = [];
var nextNarId = 1;

/* Ten fixed inks that change only when the page turns to lamplight, but
   resolving one asks the browser for a computed style — a style recalculation
   per dot, thousands of them on a calendar covering a few years. Read once
   per theme instead; the cache is emptied where the theme is applied. */
var slotCache={}, narCache={};
function slotColor(c){
  var n=(c>=1&&c<=PALETTE)?c:1;
  var hit=slotCache[n];
  return hit!==undefined?hit:(slotCache[n]=cssVar("--nar-"+n));
}
function dropColorCache(){slotCache={};narCache={};}
/* Reflection is the one narrative the app keeps itself. Every quote is filed
   under it automatically and nothing else can be: it isn't offered in the
   editor, it isn't listed among the book's own narratives to rename, recolour
   or remove, and it is never written to the file — whether a note is a
   reflection is already written there, as its quote. It has its own ink,
   outside the ten slots, so it never collides with a narrative the reader
   made. */
var REFLECT="reflection";
function reflectionNar(){return {id:REFLECT,label:tr("Reflection","تأمل"),c:0};}
function isReservedLabel(label){
  var l=String(label||"").trim().toLowerCase();
  return l==="reflection"||l==="تأمل";
}
function narById(id){
  if(id===REFLECT) return reflectionNar();
  for(var i=0;i<narratives.length;i++) if(narratives[i].id===id) return narratives[i];
  return null;
}
function narColor(id){
  var hit=narCache[id];
  if(hit!==undefined) return hit;
  if(id===REFLECT){
    var r=slotCache.r;
    return (narCache[id]=(r!==undefined?r:(slotCache.r=cssVar("--nar-reflect"))));
  }
  var n=narById(id);
  return (narCache[id]=n?slotColor(n.c):NEUTRAL);
}
function narName(id){var n=narById(id);return n?n.label:"";}
function narCount(id){
  var k=0;
  entries.forEach(function(e){if(e.nar.indexOf(id)>=0) k++;});
  return k;
}
function freeSlot(){
  var used={};
  narratives.forEach(function(n){used[n.c]=1;});
  for(var i=1;i<=PALETTE;i++) if(!used[i]) return i;
  return ((narratives.length)%PALETTE)+1;
}
function makeNarrative(label,c){
  /* the reader's own thread can't take the app's name */
  if(isReservedLabel(label)) label=String(label).trim()+" 2";
  var n={id:"n"+(nextNarId++),label:String(label||"").slice(0,40)||tr("Untitled","بی‌نام"),
         c:(c>=1&&c<=PALETTE)?c:freeSlot()};
  narratives.push(n);
  return n;
}
/* Accepts ids as well as bare names, so a book exported before narratives
   existed — or the sample, which carries plain words — still opens. */
function resolveNar(list,allowCreate){
  var out=[];
  (list||[]).forEach(function(t){
    if(t===REFLECT) return;           /* assigned by the app, never by a file */
    var n=narById(t);
    if(!n){
      var want=String(t||"").trim().toLowerCase();
      if(!want) return;
      for(var i=0;i<narratives.length;i++){
        if(narratives[i].label.toLowerCase()===want){n=narratives[i];break;}
      }
      if(!n&&allowCreate) n=makeNarrative(String(t).trim());
    }
    if(n&&out.indexOf(n.id)<0) out.push(n.id);
  });
  return out.slice(0,6);
}
function normalizeNarratives(list){
  var out=[], seen={};
  (list||[]).forEach(function(n){
    if(!n||!n.id||seen[n.id]) return;
    seen[n.id]=1;
    out.push({id:String(n.id),
              label:String(n.label||tr("Untitled","بی‌نام")).slice(0,40),
              c:(+n.c>=1&&+n.c<=PALETTE)?+n.c:1});
  });
  nextNarId=1;
  out.forEach(function(n){
    var m=/^n(\d+)$/.exec(n.id);
    if(m&&+m[1]>=nextNarId) nextNarId=+m[1]+1;
  });
  return out;
}


/* The five are grains of time, not ranks. A level says how long a stretch an
   entry stays significant across: a day, a week, a month, a year, a life.
   Nothing in the machinery knows what a week is — the filter is still one
   number against another — but every word the reader meets is the definition
   of the level rather than a story told about it, which is the one thing an
   abstract scale could never manage.

   A moment and a decade were both cut. A moment is not a grain anybody sorts
   by, it is just the bottom of the day; and a decade is a distinction nobody
   can draw against a life without pausing over it, which is exactly what this
   is meant to spare them.

   GRAIN is the noun. SIG_LABELS is the filing mark on the card, ALT_LABELS is
   what the view says about itself at that height. Still never a number. */
var LEVELS = 5;
var MID = 3;               /* a month: where the pen points before it is moved */
/* "-level" rather than "-sized": the rest of the app talks in heights — rungs,
   climbing, coming down a step — and a contour line is the right thing for a
   margin to be naming. */
/* Said as what is on the page rather than what has left it, and inclusive:
   at week height the week-sized entries are precisely what you came for. The
   bottom rung is not a special case under this wording — a day or longer is
   everything, because a day is the smallest grain there is. */

/* A year, in a book with years in it. Kept short here so two months of sample
   entries can still show the resurfacing outline. */
var RESURFACE_DAYS = 30;
var SNAPS = [30,55,78];
var PANEL = cssVar("--panel");
var INK_RGB = cssVar("--ink-rgb");

/* Four notebooks kept by narrators who never kept one, in the app's own file

   door an imported file comes through. They are shown, never written down.

   Each carries the name it is shelved under in its own title, a Persian name
   beside it, and a line saying where it came from — which is what the
   row's tooltip says. The order is the order they are read in: by the year
   the first entry falls, 1811 to 1922, so the shelf runs forward through its
   own century. */
var SAMPLES = [
{"fa": "\u062f\u0641\u062a\u0631\u0686\u0647\u0654 \u0627\u0644\u06cc\u0632\u0627\u0628\u062a \u0628\u0646\u062a", "say": "Elizabeth Bennet's notebook, from Jane Austen's Pride and Prejudice \u2014 a Hertfordshire autumn, and everything that followed it.", "sayFa": "\u062f\u0641\u062a\u0631\u0686\u0647\u0654 \u0627\u0644\u06cc\u0632\u0627\u0628\u062a \u0628\u0646\u062a\u060c \u0627\u0632 \u00ab\u063a\u0631\u0648\u0631 \u0648 \u062a\u0639\u0635\u0628\u00bb \u062c\u06cc\u0646 \u0622\u0633\u062a\u0646.", "book": {"v": 4, "zoom": 3, "flat": 0, "narf": [], "title": "Elizabeth Bennet's Notebook", "narratives": [{"id": "n1", "label": "Jane", "c": 1}, {"id": "n2", "label": "Mr. Darcy", "c": 2}, {"id": "n3", "label": "Mr. Wickham", "c": 3}, {"id": "n4", "label": "My Family", "c": 4}, {"id": "n5", "label": "Lydia", "c": 5}, {"id": "n6", "label": "Charlotte", "c": 6}, {"id": "n7", "label": "Mr. Collins", "c": 7}, {"id": "n8", "label": "The Bingleys", "c": 8}, {"id": "n9", "label": "Lady Catherine", "c": 9}, {"id": "n10", "label": "My Own Judgement", "c": 10}], "entries": [{"id": 1, "dk": "1811-09-18", "t": "10:20", "nar": ["n4", "n8"], "imp": 2, "j": false, "title": "Netherfield Park is let at last", "note": "Mama came in from Mrs. Long's quite breathless: a young man of large fortune from the north of England has taken Netherfield, and is to be in possession before Michaelmas. Single, of course. Four or five thousand a year. She has already married him to one of us, and Papa asked whether that was his design in settling here."}, {"id": 2, "dk": "1811-09-19", "t": null, "nar": ["n10"], "imp": 1, "j": false, "title": "A wet morning with Papa's books", "note": "Rain all day. Read in Papa's library while Mary made extracts and Kitty coughed with no discretion at all. Papa says I have something more of quickness than my sisters. I am not sure it is a compliment to any of us."}, {"id": 3, "dk": "1811-09-26", "t": "13:05", "nar": ["n4"], "imp": 2, "j": false, "title": "Papa had called on Mr. Bingley all along", "note": "After a week of Mama declaring she would never visit him, Papa let fall that he had already been. The whole room turned to him. He enjoyed our astonishment enormously and then withdrew, leaving Mama to call him the best of husbands. He does love to tease her, and she never once sees it coming."}, {"id": 4, "dk": "1811-10-02", "t": "11:40", "nar": ["n8"], "imp": 1, "j": false, "title": "A blue coat and a black horse", "note": "Mr. Bingley returned Papa's call and sat ten minutes in the library. We saw nothing of him but what could be seen from an upper window: a blue coat and a black horse. Lydia has decided he is handsome on that evidence."}, {"id": 5, "dk": "1811-10-05", "t": null, "nar": ["n4"], "imp": 1, "j": false, "title": "Mama's poor nerves", "note": "Mama told Papa he takes delight in vexing her and has no compassion for her poor nerves. Papa said he has a high respect for her nerves. They are his old friends, and he has heard her mention them with consideration these twenty years at least."}, {"id": 6, "dk": "1811-10-08", "t": null, "nar": ["n8", "n4"], "imp": 1, "j": false, "title": "Mama's dinner is refused", "note": "Mama had planned a dinner that was to do her housekeeping credit, and Mr. Bingley has written that he must go to town. She is certain he will be forever flying about and never settled at Netherfield as he ought."}, {"id": 7, "dk": "1811-10-15", "t": "21:30", "nar": ["n1", "n8"], "imp": 2, "j": false, "title": "Jane danced twice with Mr. Bingley", "note": "The Meryton assembly. Mr. Bingley is everything a young man ought to be: good-humoured, easy, and he danced every dance. He asked Jane twice. She was more admired than anyone in the room, and she will not admit it even to me."}, {"id": 8, "dk": "1811-10-15", "t": "23:50", "nar": ["n2", "n10"], "imp": 4, "j": true, "title": "\"Tolerable, but not handsome enough to tempt me\"", "note": "I sat out two dances for want of gentlemen, and so overheard Mr. Darcy of Pemberley, who has ten thousand a year and no manners, tell his friend I was tolerable, but not handsome enough to tempt him. I told the story all round the room with great spirit. I laughed at it. I think I shall go on laughing at it, which is not the same thing as not minding."}, {"id": 9, "dk": "1811-10-16", "t": "12:15", "nar": ["n6", "n10"], "imp": 1, "j": false, "title": "The Lucases come to talk it over", "note": "Charlotte and her sisters came to discuss the ball. Charlotte says a man of his family and fortune has a right to be proud. \"I could easily forgive his pride,\" I said, \"if he had not mortified mine.\" Mary then explained the difference between pride and vanity at some length."}, {"id": 10, "dk": "1811-10-19", "t": null, "nar": ["n4", "n10"], "imp": 1, "j": false, "title": "Mary's extracts", "note": "Mary read us a passage she had copied on the vanity of human wishes and looked round for approval. Kitty yawned and Lydia laughed. I said something kind and wished I had said something useful."}, {"id": 11, "dk": "1811-10-22", "t": "17:30", "nar": ["n6", "n1"], "imp": 2, "j": false, "title": "Charlotte's view of courtship", "note": "Charlotte thinks Jane hides her feelings too well and should show more affection than she feels, or Bingley may never be sure of her. \"Happiness in marriage is entirely a matter of chance,\" she says. I laughed and told her she would never act so herself. She did not laugh."}, {"id": 12, "dk": "1811-10-29", "t": "22:10", "nar": ["n2", "n10"], "imp": 2, "j": false, "title": "I will not dance at Lucas Lodge", "note": "Sir William tried to give my hand to Mr. Darcy for a reel, and Mr. Darcy, to my astonishment, was not unwilling. I declined. It was a very pleasant thing to decline. I noticed afterward that he kept listening to my talk with Colonel Forster, which is odd behaviour in a man who finds me merely tolerable."}, {"id": 13, "dk": "1811-10-29", "t": "23:20", "nar": ["n4"], "imp": 1, "j": false, "title": "Mary played too long again", "note": "Mary would play after me, and played a long concerto, and then Scotch and Irish airs for Lydia and the officers to dance to. She has application but no taste. I wish someone had told her so gently years ago, so nobody would have to do it unkindly now."}, {"id": 14, "dk": "1811-11-04", "t": "10:45", "nar": ["n5", "n4"], "imp": 1, "j": false, "title": "Regimentals", "note": "The militia is quartered in Meryton for the winter. Kitty and Lydia walk there four times a week and can talk of nothing but officers. Papa observed at breakfast that they must be two of the silliest girls in the country. Mama was offended on their behalf; Lydia did not notice."}, {"id": 15, "dk": "1811-11-07", "t": "16:20", "nar": ["n3", "n5", "n4"], "imp": 1, "j": false, "title": "News from Aunt Phillips", "note": "Aunt Phillips has had the officers to dinner and can talk of nothing else. Lydia knows every officer's name and connections already. My aunt says a new one is expected any day, and that the whole regiment is mad to meet him."}, {"id": 16, "dk": "1811-11-12", "t": "09:30", "nar": ["n1", "n8", "n4"], "imp": 2, "j": false, "title": "Jane rides to Netherfield in the rain", "note": "Jane was asked to dine at Netherfield with Miss Bingley. Mama refused the carriage and sent her on horseback because it looked like rain. It rained. Mama is quite pleased with herself."}, {"id": 17, "dk": "1811-11-13", "t": "08:40", "nar": ["n1", "n8"], "imp": 2, "j": false, "title": "Jane is ill at Netherfield", "note": "A note from Jane: she was soaked through, has a sore throat and a headache, and they insist she stay. Mama says if she dies it will be a comfort to know it was in pursuit of Mr. Bingley. Papa agreed, gravely."}, {"id": 18, "dk": "1811-11-13", "t": "11:55", "nar": ["n2", "n8", "n10"], "imp": 3, "j": false, "title": "Three miles through the mud", "note": "I walked to Netherfield alone, jumping over stiles and springing over puddles, and arrived with dirty stockings and a face glowing with exercise. Mrs. Hurst and Miss Bingley were astonished that I had come at all. Mr. Darcy said nothing about the mud. I learned later that he said my eyes were brightened by the walk."}, {"id": 19, "dk": "1811-11-14", "t": "20:45", "nar": ["n2", "n8", "n10"], "imp": 1, "j": false, "title": "What is an accomplished woman?", "note": "Miss Bingley listed the accomplishments a woman must have: music, singing, drawing, dancing, modern languages, and \"a certain something in her air.\" Mr. Darcy added the improvement of her mind by extensive reading. I said I no longer wondered at his knowing only six accomplished women; I rather wondered at his knowing any."}, {"id": 20, "dk": "1811-11-15", "t": "12:00", "nar": ["n4", "n5", "n8"], "imp": 2, "j": false, "title": "Mama comes to Netherfield", "note": "Mama came to see Jane and made sure to say that the country is as pleasant as town, that the Lucases are very good sort of girls, and that Jane is beautiful. Lydia reminded Mr. Bingley that he had promised to give a ball. He agreed with good humour. I could have sunk through the floor."}, {"id": 21, "dk": "1811-11-16", "t": "21:15", "nar": ["n2", "n10"], "imp": 2, "j": false, "title": "Pride and resentment", "note": "Mr. Darcy says his temper is too little yielding, that his good opinion once lost is lost for ever. I told him implacable resentment is a shade in a character, and that I could not laugh at it. He said my defect is to wilfully misunderstand everyone. We were both quite pleased with ourselves."}, {"id": 22, "dk": "1811-11-17", "t": "14:30", "nar": ["n1", "n2"], "imp": 1, "j": false, "title": "Home again from Netherfield", "note": "We came home on Sunday. Mr. Darcy scarcely spoke ten words to me all day and was careful not to look at me. Very well. Papa was glad to see us. He said the conversation at dinner had lost all its sense while Jane and I were away."}, {"id": 23, "dk": "1811-11-18", "t": "16:00", "nar": ["n7", "n4"], "imp": 2, "j": false, "title": "Mr. Collins arrives at four o'clock", "note": "Papa's cousin, who is to inherit Longbourn when Papa dies, arrived exactly when his letter promised. He is tall, heavy, grave and formal. He admired the hall, the dining room and the furniture, and Mama suspected he was valuing it as his future property. He praised the cooking and asked which of his fair cousins had made it."}, {"id": 24, "dk": "1811-11-18", "t": "21:40", "nar": ["n7", "n5"], "imp": 1, "j": false, "title": "Fordyce's Sermons", "note": "After tea Mr. Collins was offered a novel and recoiled. He chose Fordyce's Sermons instead. Three pages in, Lydia interrupted to tell Mama that my uncle Phillips means to turn away Richard. Mr. Collins was offended and gave up reading to play backgammon with Papa."}, {"id": 25, "dk": "1811-11-19", "t": "12:25", "nar": ["n3", "n2"], "imp": 3, "j": false, "title": "A stranger in Meryton", "note": "Walking into Meryton we met Mr. Denny with a gentleman of most gentlemanlike appearance, Mr. Wickham, newly taking his commission. Just then Mr. Darcy and Mr. Bingley rode up. Mr. Darcy and Mr. Wickham saw each other: one went white, the other red. Mr. Wickham touched his hat; Mr. Darcy barely returned it. What can it mean?"}, {"id": 26, "dk": "1811-11-20", "t": "22:50", "nar": ["n3", "n2", "n10"], "imp": 3, "j": false, "title": "Mr. Wickham tells me everything", "note": "At my aunt Phillips's party Mr. Wickham sat by me and, with very little prompting, told me that old Mr. Darcy had meant him to have a living in the church, and that the present Mr. Darcy had given it away out of jealousy. It fits exactly with everything I think of Mr. Darcy. I believed every word, and it did not strike me until I was home that he had told all this to a stranger on first acquaintance."}, {"id": 27, "dk": "1811-11-21", "t": "10:10", "nar": ["n1", "n3", "n2"], "imp": 1, "j": false, "title": "Jane will not think badly of anyone", "note": "Told Jane the whole story. She cannot believe Mr. Darcy so unworthy of Mr. Bingley's regard, nor Mr. Wickham capable of inventing it, so she has decided they have both been deceived in some way we cannot guess. Dear Jane. I love her for it and cannot share it."}, {"id": 28, "dk": "1811-11-23", "t": null, "nar": ["n4", "n5"], "imp": 1, "j": false, "title": "Rain, and shoe-roses by proxy", "note": "It has rained every day since the invitations to the Netherfield ball arrived, so there has been no walking to Meryton, no aunt, no officers, no news. Even the shoe-roses for the ball had to be fetched by proxy. Lydia may not survive it."}, {"id": 29, "dk": "1811-11-26", "t": "20:35", "nar": ["n3", "n2"], "imp": 2, "j": false, "title": "Mr. Wickham is not at the ball", "note": "I dressed with more than usual care, meaning to conquer whatever remained of Mr. Wickham's heart, and he was not there. Mr. Denny said he had gone to town on business, and added with a meaning smile that he would not have gone if he had not wished to avoid a certain gentleman. I blamed Mr. Darcy for all of it."}, {"id": 30, "dk": "1811-11-26", "t": "21:20", "nar": ["n7"], "imp": 1, "j": false, "title": "Two dances of mortification", "note": "My first two dances were with Mr. Collins: awkward and solemn, apologising instead of attending, moving wrong without being aware of it. He introduced himself to Mr. Darcy uninvited, as Lady Catherine's clergyman. I watched Mr. Darcy's face and wanted to disappear."}, {"id": 31, "dk": "1811-11-26", "t": "22:15", "nar": ["n2", "n3", "n10"], "imp": 3, "j": false, "title": "I danced with Mr. Darcy", "note": "He asked me so abruptly that I accepted without knowing what I did. Charlotte told me I would find him agreeable. We danced in silence until I made him talk, and then I brought up Mr. Wickham. He said Wickham is blessed with manners that ensure his making friends; whether he is equally capable of keeping them is less certain. We parted in mutual dissatisfaction, though I think his was less than mine."}, {"id": 32, "dk": "1811-11-26", "t": "23:45", "nar": ["n4", "n8", "n10"], "imp": 2, "j": false, "title": "My family exposes itself", "note": "Mama talked loudly all through supper about Jane marrying Mr. Bingley, and would not lower her voice when I begged her. Mary sang, badly, until Papa said \"You have delighted us long enough.\" Mr. Collins gave a speech. It seemed my family had agreed to show off as much as they could in one evening, and Mr. Darcy watched the whole of it."}, {"id": 33, "dk": "1811-11-27", "t": "10:30", "nar": ["n7", "n4", "n10"], "imp": 3, "j": false, "title": "Mr. Collins proposes", "note": "After breakfast he asked to speak to me alone. He listed his reasons for marrying: first, clergymen should set the example; second, it would make him happy; third, Lady Catherine told him to. Only then did he mention the violence of his affection. I refused him three times. He took each refusal as the modesty of an elegant female."}, {"id": 34, "dk": "1811-11-27", "t": "12:10", "nar": ["n4", "n7"], "imp": 2, "j": false, "title": "Papa takes my side", "note": "Mama sent for Papa to insist that I marry him. Papa said, \"An unhappy alternative is before you, Elizabeth. Your mother will never see you again if you do not marry Mr. Collins, and I will never see you again if you do.\" I have never loved him so much."}, {"id": 35, "dk": "1811-11-28", "t": "11:00", "nar": ["n1", "n8"], "imp": 3, "j": false, "title": "The Bingleys have gone to London", "note": "A letter to Jane from Miss Bingley: the whole party has left Netherfield for town, with no intention of returning this winter, and she hints that her brother will soon be engaged to Miss Georgiana Darcy. Jane is sure Caroline cannot mean to deceive her. I am sure she does."}, {"id": 36, "dk": "1811-11-30", "t": "13:20", "nar": ["n6", "n7", "n10"], "imp": 3, "j": false, "title": "Charlotte is to marry Mr. Collins", "note": "Charlotte came to tell me herself. Three days after I refused him, he proposed to her and she accepted. I cried out, \"Engaged to Mr. Collins! My dear Charlotte, impossible!\" She reminded me she is not romantic; she asks only a comfortable home. I wished her joy. I don't think I will ever quite understand her again."}, {"id": 37, "dk": "1811-12-03", "t": null, "nar": ["n4"], "imp": 1, "j": false, "title": "Mama cannot stop lamenting", "note": "Mama is in a constant state of injury: I have thrown away an estate, Charlotte has taken it, and the Lucases will be mistress of Longbourn after Papa's death. She says it to Lady Lucas's face, very nearly."}, {"id": 38, "dk": "1811-12-10", "t": "15:30", "nar": ["n3", "n10"], "imp": 1, "j": false, "title": "Mr. Wickham calls often", "note": "Mr. Wickham is with us almost every day now. The whole story of how Mr. Darcy wronged him is openly acknowledged and discussed in Meryton, and everyone says they always disliked Mr. Darcy. I am rather glad to hear it."}, {"id": 39, "dk": "1811-12-16", "t": null, "nar": ["n7", "n6"], "imp": 1, "j": false, "title": "Mr. Collins returns on Monday fortnight", "note": "Mr. Collins is back, punctual as ever, and spends his days at Lucas Lodge. The wedding is fixed for January. He speaks of his happiness at dinner without any sign that he remembers proposing to me three weeks ago."}, {"id": 40, "dk": "1811-12-20", "t": null, "nar": ["n10"], "imp": 1, "j": false, "title": "A walk to Oakham Mount", "note": "Walked out to Oakham Mount alone this morning in a sharp frost. The whole country looks clean and simple from up there, and the house very small. I could think clearly for an hour, which is more than I can do in the drawing room."}, {"id": 41, "dk": "1811-12-23", "t": "17:15", "nar": ["n4", "n1"], "imp": 2, "j": false, "title": "The Gardiners come for Christmas", "note": "My uncle and aunt Gardiner arrived from Gracechurch Street with presents and the newest fashions, long sleeves among them. My aunt is sensible, elegant and kind. Mama poured out all her grievances before she had taken off her bonnet. My aunt listened, and then took Jane and me aside."}, {"id": 42, "dk": "1811-12-27", "t": "21:05", "nar": ["n3", "n10"], "imp": 2, "j": false, "title": "My aunt warns me about Mr. Wickham", "note": "My aunt says, very kindly, that I must not fall in love with a man who has nothing to marry on. I told her that at present I am not in love with Mr. Wickham, which is true, and that I will not be in a hurry, which I hope is. She has invited Jane to London."}, {"id": 43, "dk": "1812-01-02", "t": "09:00", "nar": ["n1", "n8"], "imp": 2, "j": false, "title": "Jane goes to London", "note": "Jane left with the Gardiners this morning. She pretends her only object is my aunt's company. I know she hopes to see Miss Bingley, and perhaps her brother, and I could not bring myself to say anything that might make the hope smaller."}, {"id": 44, "dk": "1812-01-09", "t": "12:40", "nar": ["n6", "n7"], "imp": 3, "j": false, "title": "Charlotte's wedding", "note": "Charlotte was married this morning. As we said goodbye she asked me to come and see her at Hunsford in March, with her father and Maria, and said she would think of it as a favour. I promised, though I think it was more from pity than hope of pleasure."}, {"id": 45, "dk": "1812-01-15", "t": null, "nar": ["n6", "n7"], "imp": 1, "j": false, "title": "Charlotte writes from Hunsford", "note": "Charlotte's first letter is cheerful. The house, furniture, neighbourhood and roads are all to her taste, and Lady Catherine's behaviour most friendly and obliging. It is Mr. Collins's picture of Hunsford, rationally softened. I shall have to go and see for myself."}, {"id": 46, "dk": "1812-01-20", "t": "11:30", "nar": ["n1", "n8"], "imp": 2, "j": false, "title": "Jane's letter from Gracechurch Street", "note": "Jane has called on Miss Bingley in Grosvenor Street and was received without warmth. Caroline said her brother was very busy and that they saw a great deal of Miss Darcy. Jane is still making excuses for her."}, {"id": 47, "dk": "1812-02-04", "t": "16:45", "nar": ["n3", "n10"], "imp": 2, "j": false, "title": "Mr. Wickham turns to Miss King", "note": "Mr. Wickham's attentions have moved to Miss Mary King, who has just come into ten thousand pounds. I find I am not unhappy about it, only thoughtful. My heart was never more than slightly touched. And I notice that I am quite ready to forgive in him what I would have called mercenary in Charlotte."}, {"id": 48, "dk": "1812-02-16", "t": "10:50", "nar": ["n1", "n8"], "imp": 3, "j": false, "title": "Miss Bingley has been cruel to Jane", "note": "After four weeks Miss Bingley finally returned Jane's call, stayed a few minutes, and made it plain she did not wish to continue the acquaintance. Jane writes that she is no longer deceived. She says she pities Caroline. I cannot. And I cannot believe Mr. Bingley has not heard that she is in town."}, {"id": 49, "dk": "1812-02-28", "t": null, "nar": ["n4", "n10"], "imp": 1, "j": false, "title": "Dull days at Longbourn", "note": "Jane gone, Charlotte gone, Mr. Wickham busy with Miss King, and Mama and my younger sisters no substitute for any of them. I walk out every morning I can. Hunsford is beginning to seem like something to look forward to."}, {"id": 50, "dk": "1812-03-03", "t": "20:30", "nar": ["n1", "n10"], "imp": 2, "j": false, "title": "A night in Gracechurch Street", "note": "On our way to Kent, Sir William, Maria and I stopped at my uncle's. Jane is well but low. My aunt has asked me to join them on a summer tour as far as the Lakes. I cried, \"What are young men to rocks and mountains?\" and meant it, mostly."}, {"id": 51, "dk": "1812-03-04", "t": "15:10", "nar": ["n6", "n7"], "imp": 2, "j": false, "title": "The parsonage at Hunsford", "note": "We arrived to Mr. Collins showing us every view from every window, every walk in the garden, and every piece of furniture, all with reference to Lady Catherine. Charlotte has arranged her life very sensibly: she encourages him to garden, and she sits in a back room where he has no reason to come. She is, I think, content."}, {"id": 52, "dk": "1812-03-05", "t": "11:20", "nar": ["n9", "n6"], "imp": 1, "j": false, "title": "Miss de Bourgh stops at the gate", "note": "Maria came running upstairs breathless to fetch me to see something wonderful. It was Miss de Bourgh and her companion in a low phaeton at the garden gate. She is thin and small and says nothing. Mr. Collins says her ill health has prevented her from making many accomplishments."}, {"id": 53, "dk": "1812-03-06", "t": "22:00", "nar": ["n9", "n10"], "imp": 2, "j": false, "title": "Dinner at Rosings", "note": "Lady Catherine asked how many sisters I had, whether any were likely to marry, whether they were handsome, where we were educated, what carriage my father kept, and why all five of us are out at once. She told me I give my opinion very decidedly for so young a person. I refused to tell her my age. I believe I am the first person ever to do so."}, {"id": 54, "dk": "1812-03-10", "t": "09:50", "nar": ["n10", "n9"], "imp": 1, "j": false, "title": "My own path in the park", "note": "I have found a sheltered path along the edge of the park that nobody else seems to value. Lady Catherine thinks a young woman walking alone must be up to something. I walk there every fine morning."}, {"id": 55, "dk": "1812-03-11", "t": "14:30", "nar": ["n9", "n7"], "imp": 1, "j": false, "title": "Sir William goes home", "note": "Sir William stayed only a week, long enough to be satisfied that his daughter is most comfortably settled and to have a carriage and a Lady Catherine to talk about for the rest of his life. Mr. Collins drove him about the lanes every morning."}, {"id": 56, "dk": "1812-03-14", "t": null, "nar": ["n9", "n7"], "imp": 1, "j": false, "title": "Lady Catherine manages the parish", "note": "Lady Catherine finds fault with the arrangement of Charlotte's furniture and the size of her joints of meat, and settles every quarrel among the cottagers by scolding them into harmony and plenty. Mr. Collins tells us this as though it were the highest praise."}, {"id": 57, "dk": "1812-03-23", "t": "12:30", "nar": ["n2", "n9"], "imp": 2, "j": false, "title": "Mr. Darcy arrives at Rosings", "note": "Mr. Darcy has come to spend Easter with his aunt, with his cousin Colonel Fitzwilliam. They called at the parsonage the very next morning. Colonel Fitzwilliam talks easily and pleasantly. Mr. Darcy asked after my family in his usual manner and was silent. Charlotte thinks they would not have called so soon on her account."}, {"id": 58, "dk": "1812-03-29", "t": "21:30", "nar": ["n2", "n9", "n10"], "imp": 2, "j": false, "title": "At the pianoforte on Easter Day", "note": "At Rosings this evening I played, and Mr. Darcy came to stand by the instrument where he could see my face. I told Colonel Fitzwilliam how Mr. Darcy had behaved in Hertfordshire. Mr. Darcy said he lacked the talent of conversing easily with strangers. I said I did not play as well as I should because I did not take the trouble to practise. He said, \"We neither of us perform to strangers.\""}, {"id": 59, "dk": "1812-03-31", "t": "11:45", "nar": ["n2", "n6"], "imp": 1, "j": false, "title": "Mr. Darcy calls and sits silent", "note": "Mr. Darcy called at the parsonage when I was alone. We had ten minutes of conversation that went nowhere; he seemed to think Mr. Collins's wife very fortunate in living so near her family. Charlotte came in and said afterwards, \"My dear Eliza, he must be in love with you.\" Nonsense."}, {"id": 60, "dk": "1812-04-04", "t": "10:15", "nar": ["n2", "n10"], "imp": 1, "j": false, "title": "Unexpected meetings in the park", "note": "I have met Mr. Darcy in the grove three times now, on the walk I told him is my favourite. It seems like wilful ill-nature, or a voluntary penance. He asks odd questions about my pleasure in solitary walks and whether I will stay at Rosings when I come into Kent again."}, {"id": 61, "dk": "1812-04-06", "t": "12:40", "nar": ["n2", "n10"], "imp": 1, "j": false, "title": "Colonel Fitzwilliam on younger sons", "note": "Colonel Fitzwilliam walked back with me and said, half joking, that younger sons cannot marry where they like, that they must attend to money. I told him I was not a fortune, in case he had wondered. He laughed. He is very easy to talk to, and I don't think either of us was in any danger."}, {"id": 62, "dk": "1812-04-08", "t": "13:00", "nar": ["n2", "n1", "n8"], "imp": 3, "j": false, "title": "Colonel Fitzwilliam tells me about Mr. Bingley", "note": "Walking with Colonel Fitzwilliam, I learned that Mr. Darcy recently congratulated himself on saving a friend from a most imprudent marriage. There were strong objections against the lady. It can only be Jane. I went back to my room and cried with anger, and gave myself a headache that kept me from Rosings tonight."}, {"id": 63, "dk": "1812-04-08", "t": "19:40", "nar": ["n2", "n10"], "imp": 5, "j": true, "title": "Mr. Darcy asks me to marry him", "note": "He came into the parlour and said, \"In vain I have struggled. It will not do. My feelings will not be repressed.\" He told me he loved me, and then told me at length how he had fought against loving someone so beneath him, whose family he could not respect. I refused him. I accused him of ruining Jane's happiness and Mr. Wickham's prospects. I told him that he was the last man in the world whom I could ever be prevailed on to marry. When he had gone I sat down and cried for half an hour."}, {"id": 64, "dk": "1812-04-09", "t": "08:30", "nar": ["n2"], "imp": 3, "j": false, "title": "A letter handed to me in the grove", "note": "I went out early to avoid him, and he was waiting at the gate of the park. He held out a letter, said, \"Will you do me the honour of reading that letter?\" and walked away without another word. Two sheets, very close writing, and the envelope full as well."}, {"id": 65, "dk": "1812-04-09", "t": "12:50", "nar": ["n2", "n3", "n1", "n10"], "imp": 5, "j": true, "title": "Till this moment I never knew myself", "note": "I have read the letter twice. Mr. Wickham took three thousand pounds in place of the living, gambled it away, and last summer tried to elope with Georgiana Darcy, who was fifteen, for her thirty thousand pounds. And about Jane: he believed her indifferent, because her feelings do not show. I defended both judgements a hundred times and they are both wrong. I prided myself on my discernment. I courted prejudice and drove reason away. How despicably I have acted. Till this moment I never knew myself."}, {"id": 66, "dk": "1812-04-10", "t": "15:00", "nar": ["n9", "n2"], "imp": 1, "j": false, "title": "The gentlemen have left Rosings", "note": "Mr. Darcy and Colonel Fitzwilliam left this morning. Lady Catherine is very dull without them and thinks she must be very dull to us, and invites us to dine to console us. Mr. Collins is overcome by the honour."}, {"id": 67, "dk": "1812-04-17", "t": null, "nar": ["n2", "n10"], "imp": 2, "j": false, "title": "Reading the letter again", "note": "I read the letter every day. My feelings change every time. His style is still not penitent, but it is not insolent either. His attachment is a compliment that makes me grateful, and his character I must respect. I cannot approve him. I cannot regret refusing him. But I no longer feel the slightest wish to see him again, only a wish that I had judged him fairly."}, {"id": 68, "dk": "1812-04-23", "t": null, "nar": ["n9"], "imp": 1, "j": false, "title": "Lady Catherine on packing", "note": "Lady Catherine has explained to Maria the only right way to pack a gown, and insists we will be unpacking it all again at the other end. She also says she will not have young women travelling post by themselves. She has arranged our entire journey for us."}, {"id": 69, "dk": "1812-05-04", "t": "10:30", "nar": ["n6", "n7"], "imp": 2, "j": false, "title": "Leaving Hunsford", "note": "Mr. Collins made a parting speech on the smallness of their house, their humble abode, and the superior advantages of seeing Lady Catherine every day. Charlotte seemed sorry to see us go but did not ask for pity. She has chosen with her eyes open. I respect it more now than I did in November."}, {"id": 70, "dk": "1812-05-12", "t": "14:20", "nar": ["n5", "n3"], "imp": 2, "j": false, "title": "Lydia's salad at the inn", "note": "Kitty and Lydia met the carriage at the inn with a meal they had ordered and could not pay for, having spent all their money on a bonnet Lydia thinks is ugly. News: Mr. Wickham is safe, Mary King has gone to her uncle in Liverpool, and the regiment is going to Brighton. \"I am sure Papa will take us all there.\""}, {"id": 71, "dk": "1812-05-13", "t": "22:30", "nar": ["n1", "n3", "n2", "n10"], "imp": 3, "j": false, "title": "I tell Jane everything, nearly", "note": "I told Jane about the proposal and the letter, but not what Mr. Darcy said of Bingley. She was shocked for Mr. Darcy's sake and could not believe such wickedness in Mr. Wickham. We decided not to expose him: the regiment leaves soon, and it would do more harm than good to Georgiana. I hope we are not wrong."}, {"id": 72, "dk": "1812-05-20", "t": "13:15", "nar": ["n5", "n4"], "imp": 2, "j": false, "title": "Lydia is invited to Brighton", "note": "Mrs. Forster, the colonel's young wife, has asked Lydia to go with her to Brighton. Lydia is in raptures and Kitty is in despair. Mama can think of nothing but sea-bathing and officers."}, {"id": 73, "dk": "1812-05-22", "t": "18:50", "nar": ["n5", "n4", "n10"], "imp": 3, "j": false, "title": "Papa will not stop her", "note": "I begged Papa not to let Lydia go. She will be the most determined flirt that ever made herself and her family ridiculous. He said we will have no peace at Longbourn if she does not, that Colonel Forster is sensible, and that she is too poor to be anybody's prey. I have done what I can. I don't feel easy."}, {"id": 74, "dk": "1812-05-27", "t": "21:30", "nar": ["n3", "n2"], "imp": 2, "j": false, "title": "\"Mr. Darcy improves on acquaintance\"", "note": "Mr. Wickham dined with the officers at Longbourn. When he mentioned Rosings, I said I had seen a good deal of Mr. Darcy, and that he improves on acquaintance, not in his manners but because in knowing him better his disposition was better understood. Mr. Wickham looked alarmed. He was very careful the rest of the evening."}, {"id": 75, "dk": "1812-06-01", "t": "08:15", "nar": ["n5"], "imp": 2, "j": false, "title": "Lydia leaves for Brighton", "note": "Lydia went off this morning, loud in her happiness, and could hardly be troubled to say goodbye. Kitty cried. Mama wept with pleasure and envy. The house feels less noisy already, and that should not be such a relief."}, {"id": 76, "dk": "1812-06-08", "t": null, "nar": ["n5"], "imp": 1, "j": false, "title": "A letter from Brighton", "note": "Lydia's letter was short and much underlined. They had just come from the library, where officers had attended them, and she had seen such beautiful ornaments as made her quite wild. She has a new gown and a new parasol. There was something about the camp she could not write because Kitty would hear of it before she could."}, {"id": 77, "dk": "1812-06-18", "t": null, "nar": ["n4", "n10"], "imp": 2, "j": false, "title": "My father and mother", "note": "With Lydia gone I have been thinking about my parents. Papa married for beauty and good humour and found a weak mind and a narrow understanding, and has amused himself with her folly ever since. I have never been blind to how improper that is in a father, especially in front of his daughters. I understand now what it has cost us."}, {"id": 78, "dk": "1812-06-25", "t": "11:00", "nar": ["n4"], "imp": 1, "j": false, "title": "Kitty goes into Meryton without tears", "note": "Kitty was well enough today to go into Meryton without crying, and I began to hope that by next Christmas she might be tolerably reasonable, and not mention an officer more than once a day."}, {"id": 79, "dk": "1812-07-02", "t": "11:10", "nar": ["n2", "n10"], "imp": 2, "j": false, "title": "The tour is shortened to Derbyshire", "note": "My aunt writes that my uncle's business will delay us and there is no longer time for the Lakes. We will go no farther north than Derbyshire, and stay a few days at Lambton, where my aunt grew up. Pemberley is five miles from Lambton. I tell myself I can surely enter his county and steal a few of its spars without being seen."}, {"id": 80, "dk": "1812-07-13", "t": "07:30", "nar": ["n10"], "imp": 1, "j": false, "title": "We set out north", "note": "We left the Gardiner children with Jane and set out: Oxford, Blenheim, Warwick, Kenilworth, Birmingham. My uncle is excellent company in a carriage. My aunt keeps saying how much she wants to see Pemberley again."}, {"id": 81, "dk": "1812-07-16", "t": null, "nar": ["n10"], "imp": 1, "j": false, "title": "Warwick and Kenilworth", "note": "Castles all day. My aunt knows the history of every stone, and my uncle knows the price of every farm. I am happy to stand in a ruin and feel very small."}, {"id": 82, "dk": "1812-07-20", "t": "19:20", "nar": ["n2", "n10"], "imp": 1, "j": false, "title": "Lambton", "note": "We are settled at the inn at Lambton. At dinner I asked the chambermaid whether the family was at Pemberley for the summer. The answer was no. I can visit it tomorrow like any tourist. I was very relieved and a little disappointed, and would not tell anyone that last part."}, {"id": 83, "dk": "1812-07-21", "t": "11:20", "nar": ["n2", "n10"], "imp": 3, "j": false, "title": "Pemberley", "note": "The woods, then the house on rising ground, stone and handsome, with a stream in front, neither formal nor falsely adorned. I have never seen a place where nature has done more, or taste interfered less. I felt that to be mistress of Pemberley might be something. Then I remembered I had refused to be."}, {"id": 84, "dk": "1812-07-21", "t": "12:05", "nar": ["n2"], "imp": 3, "j": false, "title": "What the housekeeper said", "note": "Mrs. Reynolds showed us the house and could not say enough of her master. She has never had a cross word from him since he was four years old. The best landlord and the best master that ever lived. His picture in the gallery was smiling, as I have seen him smile at me sometimes. I stood in front of it far longer than I needed."}, {"id": 85, "dk": "1812-07-21", "t": "12:45", "nar": ["n2", "n10"], "imp": 4, "j": true, "title": "I met Mr. Darcy on the lawn", "note": "He came round the corner of the stables, a day earlier than expected, and we were face to face before either of us could look away. He was not rude. He was not proud. He asked after my family twice, and invited my uncle to fish, and asked if he might introduce his sister to me. I was mortified to be found there, and I could not stop wondering what had changed him."}, {"id": 86, "dk": "1812-07-22", "t": "11:30", "nar": ["n2", "n8"], "imp": 2, "j": false, "title": "Georgiana Darcy and Mr. Bingley", "note": "Mr. Darcy brought his sister to the inn, as he had said, and Mr. Bingley came too. Georgiana is not proud at all, only very shy. Mr. Bingley asked whether all my sisters were at Longbourn, and mentioned the day he had last seen Jane: the twenty-sixth of November, when we were all dancing at Netherfield. He remembered the date."}, {"id": 87, "dk": "1812-07-23", "t": "12:00", "nar": ["n2", "n8", "n10"], "imp": 2, "j": false, "title": "Miss Bingley's jibe about the militia", "note": "We called at Pemberley. Miss Bingley asked whether the militia had been removed from Meryton, meaning Wickham, meaning to hurt Georgiana without knowing it. I answered calmly. Mr. Darcy's sister went red and could not look up, and he looked at me with gratitude. When we had gone, Miss Bingley told him I had grown brown and coarse. He said I was one of the handsomest women of his acquaintance."}, {"id": 88, "dk": "1812-07-24", "t": "10:40", "nar": ["n5", "n3", "n2"], "imp": 5, "j": true, "title": "Lydia has gone off with Mr. Wickham", "note": "Two letters from Jane, the first sent astray. Lydia has left Brighton with Wickham. Not to Scotland, they think; there is no reason to believe they mean to marry at all. Mr. Darcy walked in as I was reading. I told him everything before I could stop myself, and saw him walk up and down the room, grave and silent, and I understood that my power over him was sinking; that everything must sink under such proof of family weakness. And I never so honestly felt that I could have loved him as now, when all love must be in vain."}, {"id": 89, "dk": "1812-07-24", "t": "16:30", "nar": ["n4", "n5"], "imp": 2, "j": false, "title": "The long way home", "note": "We left Lambton within the hour. My uncle has promised to go to London to help Papa. I spent the journey going over everything I knew about Wickham and did not say, and the one thing I could have done: warned Lydia, or Papa, or anyone."}, {"id": 90, "dk": "1812-07-25", "t": "18:00", "nar": ["n4", "n1"], "imp": 2, "j": false, "title": "Longbourn in disorder", "note": "Mama is upstairs in her room, blaming Colonel Forster, and asking who will fight Wickham if Papa is killed, and who will turn us out if he is. Jane has been holding the house together and looks exhausted. Kitty confesses she knew of the attachment. Mary offered moral extracts."}, {"id": 91, "dk": "1812-08-01", "t": "19:30", "nar": ["n4"], "imp": 2, "j": false, "title": "Papa comes home", "note": "Papa came home from London and said very little. To me he said, \"Let me once in my life feel how much I have been to blame. I am not afraid of being overpowered by the impression. It will pass away soon enough.\" Then he promised Kitty she will never be allowed out of the house without evidence that she spent ten minutes of every day in a rational manner."}, {"id": 92, "dk": "1812-08-04", "t": "10:05", "nar": ["n5", "n3", "n4"], "imp": 3, "j": false, "title": "My uncle has found them", "note": "A letter
