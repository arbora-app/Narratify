/* A bare key is only a command when nothing else can be meant by it: no
   modifier held (Ctrl+T and Cmd+N belong to the browser), no field being
   typed in, and no card open over the page — a shortcut that acts on the
   journal behind the shelf acts where the reader can't see. */
function commandKey(e){
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing) return false;
  if(!ov.hidden) return false;
  var t=e.target;
  if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return false;
  var pops=document.querySelectorAll(".pop");
  for(var i=0;i<pops.length;i++) if(!pops[i].hidden) return false;
  return true;
}
/* n for a new entry, / to search, t for today — when the reader isn't typing */
document.addEventListener("keydown",function(e){
  if(!commandKey(e)) return;
  if(e.key==="n"||e.key==="N"){
    e.preventDefault();
    openEditor(null,selected);
  }else if(e.key==="/"){
    e.preventDefault();
    openFind();
  }else if(e.key==="t"||e.key==="T"){
    e.preventDefault();
    todayFab.click();
  }
});
/* Ctrl+Enter (Cmd+Enter on a Mac) pins the leaf in from anywhere on it,
   the note included, where Enter alone has to stay a new line. */
ov.addEventListener("keydown",function(e){
  if(e.key!=="Enter"||!(e.ctrlKey||e.metaKey)) return;
  e.preventDefault();
  if(!edSave.disabled) commit();
});

/* --------------------------- the book as a file --------------------------- */
/* The browser keeps the working copy; a JSON file is how the book leaves the
   browser and comes back. Where modern browsers allow it, the handle to that
   file is kept in IndexedDB, so the book can be reopened from its own shelf
   rather than hunted for again. Nothing is read or written without a click. */

var FSA = !!(window.showOpenFilePicker && window.showSaveFilePicker);
var fileHandle=null;   /* the open book's own file, written to as it changes */
var lastHandle=null;   /* the last file touched by anything: the name Export suggests */

var bookBtn=document.getElementById("bookBtn");
var bookMenu=document.getElementById("bookMenu");
var fileIn=document.getElementById("fileIn");
var toastEl=document.getElementById("toast");
var toastMsg=document.getElementById("toastMsg");
var toastAct=document.getElementById("toastAct");
var toastTimer=null;

function toast(msg,undo,label){
  toastMsg.textContent=msg;
  toastEl.classList.remove("hint");
  clearTimeout(toastTimer);
  if(undo){
    toastAct.textContent=label||tr("Undo",FA_STATIC["Undo"]);
    toastAct.dataset.go=label?"1":"";
    toastAct.hidden=false;
    toastAct.onclick=function(){toastEl.hidden=true;undo();};
  }else{
    toastAct.hidden=true; toastAct.onclick=null;
  }
  toastEl.hidden=false;
  toastTimer=setTimeout(function(){toastEl.hidden=true;},undo?9000:3400);
}

/* A hint teaches a gesture, and it appears exactly when the reader is in the
   middle of using it — so it must never be the thing their next tap lands
   on. It lets every tap through to what is under it, and the first touch
   anywhere puts it away. Toasts that carry a button (Undo) stay as they are. */
function hint(msg){
  toast(msg);
  toastEl.classList.add("hint");
}
document.addEventListener("pointerdown",function(){
  if(!toastEl.hidden&&toastEl.classList.contains("hint")){
    clearTimeout(toastTimer); toastEl.hidden=true; toastEl.classList.remove("hint");
  }
},true);
function idbOpen(){
  return new Promise(function(res,rej){
    if(!window.indexedDB){rej();return;}
    var r=indexedDB.open("narratify",2);
    r.onupgradeneeded=function(){
      var db=r.result;
      if(!db.objectStoreNames.contains("handles")) db.createObjectStore("handles");
      if(!db.objectStoreNames.contains("books")) db.createObjectStore("books");
    };
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){rej(r.error);};
  });
}
function idbGet(store,k){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var r=db.transaction(store,"readonly").objectStore(store).get(k);
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){rej(r.error);};
    });
  });
}
function idbPut(store,k,v){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(store,"readwrite");
      tx.objectStore(store).put(v,k);
      tx.oncomplete=function(){res(true);};
      tx.onerror=function(){rej(tx.error);};
    });
  });
}
function idbKeys(store){
  return idbOpen().then(function(db){
    return new Promise(function(res){
      var st=db.transaction(store,"readonly").objectStore(store);
      if(!st.getAllKeys){res([]);return;}
      var r=st.getAllKeys();
      r.onsuccess=function(){res(r.result||[]);};
      r.onerror=function(){res([]);};
    });
  }).catch(function(){return [];});
}
function idbDel(store,k){
  return idbOpen().then(function(db){
    return new Promise(function(res){
      var tx=db.transaction(store,"readwrite");
      tx.objectStore(store).delete(k);
      tx.oncomplete=function(){res(true);};
      tx.onerror=function(){res(false);};
    });
  }).catch(function(){return false;});
}
/* Links a file to the open book. "writable" is true only when the caller has
   just been granted readwrite on it (a save picker, an export); a file that
   was only opened for reading has its write permission looked up instead, so
   the first change asks the browser for it rather than failing. The shelf
   record keeps the file's name, which is what stops the book ever being
   offered the save picker again, even in a browser that loses the handle. */
function rememberHandle(h,writable){
  fileHandle=h; lastHandle=h; askedFile=true; permRefused=false;
  permOk=!!writable;
  if(!writable&&h&&h.queryPermission){
    h.queryPermission({mode:"readwrite"}).then(function(st){
      if(fileHandle===h&&st==="granted") permOk=true;
    }).catch(function(){});
  }
  /* the file's name is the file's: the notebook's own name is asked for, or
     carried in the file, never taken from what the file is called */
  var r=curBook&&shelfRec(curBook);
  if(r&&h&&h.name){r.file=h.name; delete r.nofile; writeShelf();}
  var k=curBook||"book";
  idbOpen().then(function(db){
    var st=db.transaction("handles","readwrite").objectStore("handles");
    st.put(h,k);
    st.put(h,"book");   /* also the most recent, for the name Export suggests */
  }).catch(function(){});
}
function recallHandle(k){
  if(!FSA) return Promise.resolve(null);
  return idbOpen().then(function(db){
    return new Promise(function(res){
      var r=db.transaction("handles","readonly").objectStore("handles").get(k||"book");
      r.onsuccess=function(){res(r.result||null);};
      r.onerror=function(){res(null);};
    });
  }).catch(function(){return null;});
}
function ensurePerm(h,mode){
  if(!h.queryPermission) return Promise.resolve(true);
  var o={mode:mode};
  return h.queryPermission(o).then(function(s){
    if(s==="granted") return true;
    return h.requestPermission(o).then(function(s2){return s2==="granted";});
  });
}

function bookJSON(){
  return JSON.stringify({
    app:"Narratify", v:5, id:curBook||null, title:bookName, zoom:zoom, narf:narFilter,
    saved:Date.now(), exported:new Date().toISOString(),
    narratives:narratives.map(function(n){return {id:n.id,label:n.label,c:n.c};}),
    entries:entries.map(function(e){
      /* the id rides along so a quote can still find its note in the file */
      var row={id:e.id,dk:e.dk,t:e.t,nar:e.nar,imp:e.imp,j:e.j?1:0,title:e.title,note:e.note};
      if(e.q!=null) row.q=e.q;
      if(e.rem) row.rem=remOut(e.rem);
      return row;
    }),
    chapters:chaptersOut()
  },null,2);
}
/* Replacing the whole book on one click deserves a way back, so the old one
   is held in memory and the toast offers it for as long as it is up. */
function adoptBook(text,label,lastMod){
  var parsed;
  try{parsed=JSON.parse(text);}catch(err){toast(tr("That file isn't valid JSON.","این فایل JSON معتبری نیست."));return false;}
  var list=Array.isArray(parsed)?parsed:(parsed&&parsed.entries);
  if(!Array.isArray(list)){toast(tr("No Narratify notes in that file.","در این فایل یادداشتی از Narratify نیست."));return false;}
  var prevNar=narratives, prevNarId=nextNarId;
  narratives=normalizeNarratives(parsed&&parsed.narratives);
  var pv=parsed&&+parsed.v;
  var next=normalize(list,pv>=4?5:(pv===3?7:3)), dropped=skipped;
  var nextChaps=cleanChapters(parsed&&parsed.chapters,lastIdMap,next), nextChapN=nextChapId;
  if(!next.length&&list.length){
    narratives=prevNar; nextNarId=prevNarId;
    toast(tr("No readable notes in that file.","در این فایل یادداشت خوانایی نیست."));return false;
  }

  /* A file that names a book already on the shelf is that book coming home,
     not a second copy of it. Whichever side is newer wins, without asking:
     the copy here can legitimately be ahead of the file, because this is
     where the writing happens and the file is only where it is sent. */
  var fileId=(parsed&&parsed.id)?String(parsed.id):"";
  var known=fileId?shelfRec(fileId):null;
  var fileAt=Math.max(+lastMod||0,+(parsed&&parsed.saved)||0);
  if(known&&fileAt&&(known.at||0)>fileAt){
    narratives=prevNar; nextNarId=prevNarId;
    toast(tr("Kept the copy on this device \u2014 it's newer than the file you opened.","نسخهٔ این دستگاه حفظ شد \u2014 از فایلی که باز کردید تازه‌تر است."));
    if(fileId!==curBook) openBook(fileId);
    return true;
  }

  /* Otherwise the file is adopted: into that same book if it is one we know,
     and onto a fresh slot if it is a stranger, so nothing open is written over. */
  var prev=entries, prevNext=nextId;
  var prevBook=curBook, prevName=bookName, prevScratch=scratch, prevSample=curSample;
  leaveChapters();
  var prevChaps=chapters, prevChapN=nextChapId;
  /* The book on the page loses its file with its entries: until the caller
     links the new file, nothing may be written to the old one. Undo gives
     both back together. */
  var prevHandle=fileHandle, prevPerm=permOk, prevAsked=askedFile, prevRefused=permRefused;
  clearTimeout(autoTimer);
  fileHandle=null; permOk=false; permRefused=false;
  bookSeq++; pendingNoFile=false;
  askedFile=true;   /* it came from a file; doImport hands the handle over */
  entries=next; nextId=entries.length+1;
  chapters=nextChaps; nextChapId=nextChapN;
  curBook=known?fileId:null; scratch=false; curSample=null;
  selected=todayKey;
  reindex(); selectedItem=firstIdOn(todayKey);
  refresh();
  var madeBook=known?null:curBook;   /* only a brand new slot is undone */

  var n=entries.length;
  var msg=(label?label+" \u2014 ":"")+tr(n+(n===1?" note":" notes")+" loaded",nf(n)+" یادداشت بارگذاری شد");
  if(dropped) msg+=tr(" ("+dropped+" unreadable "+(dropped===1?"row":"rows")+" skipped)"," ("+nf(dropped)+" ردیف ناخوانا نادیده گرفته شد)");
  toast(prev.length?msg+tr(", replacing "+prev.length,"، به‌جای "+nf(prev.length)+" یادداشت قبلی"):msg, prev.length?function(){
    if(madeBook){dropBookContent(madeBook);shelfDrop(madeBook);}
    leaveChapters();
    entries=prev; nextId=prevNext;
    chapters=prevChaps; nextChapId=prevChapN;
    narratives=prevNar; nextNarId=prevNarId;
    curBook=prevBook; scratch=prevScratch; curSample=prevSample;
    clearTimeout(autoTimer); bookSeq++;
    fileHandle=prevHandle; permOk=prevPerm; askedFile=prevAsked; permRefused=prevRefused;
    bookName=prevName; paintTitle();
    reindex(); selectedItem=firstIdOn(selected);
    refresh();
    toast(tr("Previous notebook restored.","دفترچهٔ قبلی بازگردانده شد."));
  }:null);
  var storedTitle=parsed&&parsed.title?String(parsed.title):"";
  if(storedTitle) setBookName(storedTitle);
  else if(label) setBookName(label);
  markSaved();   /* it came out of a file a moment ago */
  /* imported from the shelf: the book it brought is the one to look at now */
  if(!popShelf.hidden) closeShelf();
  return known?true:"new";   /* "new": the first time this notebook is on this shelf */
}

/* ------------------------------ import wait ------------------------------ */
/* Most books arrive before anything could be seen, so nothing shows unless
   the wait passes a quarter of a second. Once shown, it stays long enough to
   read as something that happened rather than a flicker. The wait starts
   after the file is chosen: time spent in the picker is the reader's own. */
var IMPORT_DELAY=250, IMPORT_MIN=400, IMPORT_BIG=400000;
var importing=null, importShown=false;
function beginImport(name){
  if(importing) endImport(importing,true);
  var job={name:String(name||"notebook").replace(/\.json$/i,""),shownAt:0,timer:0,done:false};
  job.timer=setTimeout(function(){showImport(job);},IMPORT_DELAY);
  importing=job;
  return job;
}
function showImport(job){
  if(job.done||job.shownAt) return;
  job.shownAt=performance.now();
  importShown=true;
  document.getElementById("app").classList.add("importing");
  document.getElementById("split").setAttribute("aria-busy","true");
  bookTitle.readOnly=true;
  bookTitle.value=tr("Opening ","در حال باز کردن ")+job.name+"\u2026";
  /* on a narrow header the name would be cut to nothing; say less instead */
  if(bookTitle.scrollWidth>bookTitle.clientWidth+1) bookTitle.value=tr("Opening notebook\u2026","در حال باز کردن دفترچه\u2026");
}
/* Parsing and redrawing hold the page until they finish, so the bar has to
   be painted before that work starts or it would only ever appear after it.
   A large file is shown for straight away, since its own wait is ahead. */
function adoptWhenPainted(job,text,run){
  if(job.done) return;   /* a newer import took over */
  if(!job.shownAt&&text.length>IMPORT_BIG) showImport(job);
  if(!job.shownAt){try{run();}finally{endImport(job);}return;}
  requestAnimationFrame(function(){setTimeout(function(){
    if(job.done) return;
    try{run();}finally{endImport(job);}
  },0);});
}
function endImport(job,now){
  if(!job||job.done) return;
  job.done=true; clearTimeout(job.timer);
  if(importing===job) importing=null;
  if(!job.shownAt) return;
  var wait=now?0:Math.max(0,IMPORT_MIN-(performance.now()-job.shownAt));
  setTimeout(function(){
    if(importing&&importing.shownAt) return;   /* a newer import owns the bar */
    importShown=false;
    document.getElementById("app").classList.remove("importing");
    document.getElementById("split").removeAttribute("aria-busy");
    bookTitle.readOnly=false;
    paintTitle();
  },wait);
}

function doImport(){
  closeMenu();
  if(FSA){
    var job=null;
    window.showOpenFilePicker({
      multiple:false,
      types:[{description:tr("Narratify notebook","دفترچهٔ Narratify"),accept:{"application/json":[".json"]}}]
    }).then(function(hs){
      var h=hs[0];
      job=beginImport(h.name);
      return h.getFile().then(function(f){
        var lm=f.lastModified;
        return f.text().then(function(t){
          adoptWhenPainted(job,t,function(){
            var got=adoptBook(t,h.name,lm);
            if(got) rememberHandle(h);   /* opened for reading only */
            if(got==="new") nameImported(h.name);
          });
        });
      });
    }).catch(function(){
      /* no job means the picker was closed: that is not an error */
      if(job&&!job.done){endImport(job);toast(tr("That file couldn't be read.","این فایل خوانده نشد."));}
    });
  }else{
    fileIn.value=""; fileIn.click();
  }
}
fileIn.addEventListener("change",function(){
  var f=fileIn.files&&fileIn.files[0];
  if(!f) return;
  var job=beginImport(f.name);
  var r=new FileReader();
  r.onload=function(){
    var t=String(r.result);
    adoptWhenPainted(job,t,function(){
      if(adoptBook(t,f.name,f.lastModified)==="new") nameImported(f.name);
    });
  };
  r.onerror=function(){endImport(job);toast(tr("That file couldn't be read.","این فایل خوانده نشد."));};
  r.readAsText(f);
});

/* ------------------------------- auto-save -------------------------------- */
/* Saving is not a setting. A book is asked once, as it is written for the
   first time, where it should live; after that every change goes to that file
   on its own, and the handle is kept in the index so the question is never
   asked twice. Each book keeps its own file \u2014 the whole point of the shelf
   is that one book is never written into another's.

   The ask has to ride on the tap that created the entry, which is why it is
   started from the same breath as the write rather than from a timer. */

var autoTimer=null, writingFile=false, dirtyAgain=false, permOk=false, askedFile=false;
var permRefused=false;   /* the browser was asked this session and said no */
var toldUnlinked={};     /* books told once a session that their file isn't linked here */

/* Called on every write to the browser's copy. */
function touchFile(){
  if(scratch||!curBook) return;
  if(!fileHandle){askForFile();return;}
  if(permOk){scheduleSave();return;}
  /* A book with a file never gets the save picker again. The browser keeps
     the link but not the permission to write, so the first change of a
     session asks the browser for it ("Allow this site to edit …?"). Refused,
     it is not asked again until the book is opened again; the dot stays lit,
     because the writing is only on this device. */
  if(permRefused) return;
  var h=fileHandle, seq=bookSeq;
  ensurePerm(h,"readwrite").then(function(ok){
    if(seq!==bookSeq||h!==fileHandle) return;
    permOk=ok;
    if(ok) scheduleSave();
    else{
      permRefused=true;
      toast(tr("Not allowed to edit "+h.name+" \u2014 changes stay on this device for now.","اجازهٔ ویرایش "+h.name+" داده نشد \u2014 تغییرات فعلاً روی همین دستگاه می‌مانند."));
    }
  }).catch(function(){});   /* no tap to ask on: the next change will */
}
function scheduleSave(){
  if(!fileHandle||scratch) return;
  clearTimeout(autoTimer);
  autoTimer=setTimeout(saveToFile,1200);
}
function saveToFile(){
  if(!fileHandle||!permOk) return;
  if(writingFile){dirtyAgain=true;return;}
  writingFile=true;
  var json=bookJSON(), h=fileHandle;
  h.createWritable().then(function(w){
    return w.write(json).then(function(){return w.close();});
  }).then(function(){
    writingFile=false;
    if(dirtyAgain){dirtyAgain=false;scheduleSave();}
    else markSaved();
  }).catch(function(){
    writingFile=false; dirtyAgain=false; permOk=false;
    toast(tr("Couldn't write to "+(h&&h.name||"the file")+".","نوشتن در "+(h&&h.name||"فایل")+" ممکن نشد."));
  });
}
/* What a picked file already holds, read before anything is written to it:
   "empty", "this" (this book's own file), "book" (a different Narratify book,
   with its text), "other" (something that isn't a book) or "unknown" when it
   can't be read, which is treated as before and written. */
function fileHolds(h){
  if(!h.getFile) return Promise.resolve({kind:"unknown"});
  return h.getFile().then(function(f){
    if(!f.size) return {kind:"empty"};
    return f.text().then(function(t){
      var p; try{p=JSON.parse(t);}catch(e){return {kind:"other"};}
      var list=Array.isArray(p)?p:(p&&p.entries);
      if(!Array.isArray(list)) return {kind:"other"};
      if(p&&p.id&&curBook&&String(p.id)===curBook) return {kind:"this"};
      if(!list.length) return {kind:"empty"};
      return {kind:"book",text:t,lm:f.lastModified};
    });
  }).catch(function(){return {kind:"unknown"};});
}

/* Once per book, and never again \u2014 declined or not. A book whose shelf
   record names a file has had its question: if the link to that file is gone
   (another browser profile, storage that couldn't keep it), the reader is told
   how to link it again instead of being asked to save it a second time. */
function askForFile(){
  if(!FSA||askedFile||fileHandle||!entries.length) return;
  askedFile=true;
  var rec=shelfRec(curBook);
  if(rec&&rec.file){
    if(!toldUnlinked[curBook]){
      toldUnlinked[curBook]=1;
      toast(tr(rec.file+" isn't linked in this browser \u2014 import it once to keep saving to it.",rec.file+" در این مرورگر پیوند نشده است \u2014 یک بار واردش کنید تا ذخیره در آن ادامه یابد."));
    }
    return;
  }
  if(rec&&rec.nofile) return;
  var seq=bookSeq;
  window.showSaveFilePicker({
    suggestedName:(bookName?bookName.replace(/[\\/:*?"<>|]/g,"").slice(0,60)+".json":"narratify-notebook.json"),
    types:[{description:tr("Narratify notebook","دفترچهٔ Narratify"),accept:{"application/json":[".json"]}}]
  }).then(function(h){
    return ensurePerm(h,"readwrite").then(function(ok){
      if(seq!==bookSeq) return;
      if(!ok){
        /* the file was chosen; only writing was refused. It stays this book's
           file, and the browser is asked again on a later visit. */
        rememberHandle(h); permRefused=true;
        toast(tr("Not allowed to edit "+h.name+" \u2014 changes stay on this device for now.","اجازهٔ ویرایش "+h.name+" داده نشد \u2014 تغییرات فعلاً روی همین دستگاه می‌مانند."));
        return;
      }
      return fileHolds(h).then(function(held){
        if(seq!==bookSeq) return;
        if(held.kind==="book"||held.kind==="other"){
          toast(isFa()
            ?(h.name+(held.kind==="book"?" از قبل دفترچهٔ دیگری در خود دارد":" دفترچهٔ Narratify نیست")+
              " \u2014 دست‌نخورده ماند. با «خروجی» می‌توانید این دفترچه را با نام تازه‌ای ذخیره کنید.")
            :(h.name+(held.kind==="book"?" already holds another notebook":" isn't a Narratify notebook")+
              " \u2014 it was left alone. Export can save this one under a new name."));
          return;
        }
        rememberHandle(h,true);
        saveToFile();
        toast(tr("This notebook is saved to "+h.name+" from now on.","از این پس این دفترچه در "+h.name+" ذخیره می‌شود."));
      });
    });
  }).catch(function(){
    /* no file chosen: the browser's copy is still kept, and Export can give
       it a file later without being asked for one again */
    var r=shelfRec(curBook);
    if(r){r.nofile=true;writeShelf();}
  });
}

/* Where a new book will live, asked on the tap that made it rather than on
   the Save of its first entry, where the picker would land on top of an editor
   closing (and, on Android, a keyboard going down). The page is blank behind
   it; choosing a file puts the book on the shelf under that file's name, and
   declining is remembered the same way declining the first-entry ask is —
   once per book, not again. The first-entry ask stays for books that never
   passed through New book: the blank page of a first visit, or a sample
   written into. */
var pendingNoFile=false, bookSeq=0;
function askNewBookFile(){
  if(!FSA) return;
  askedFile=true;                  /* the first entry won't ask a second time */
  var seq=bookSeq;
  var blankId=curBook;   /* set when the new notebook was named, else null */
  window.showSaveFilePicker({
    suggestedName:nameAsFile(bookName),
    types:[{description:tr("Narratify notebook","دفترچهٔ Narratify"),accept:{"application/json":[".json"]}}]
  }).then(function(h){
    if(seq!==bookSeq) return;      /* another book was opened meanwhile */
    return ensurePerm(h,"readwrite").then(function(ok){
      if(seq!==bookSeq) return;
      if(!ok){pendingNoFile=true;toast(tr("Permission to write "+h.name+" was declined.","اجازهٔ نوشتن در "+h.name+" رد شد."));return;}
      return fileHolds(h).then(function(held){
        if(seq!==bookSeq) return;
        /* An existing book picked for a new one: that book is opened, never
           blanked. A file that isn't a book is left as it was. */
        if(held.kind==="book"){
          var job=beginImport(h.name);
          adoptWhenPainted(job,held.text,function(){
            var got=adoptBook(held.text,h.name,held.lm);
            if(!got) return;
            rememberHandle(h,true);
            /* the blank notebook just named for it was never written in:
               it goes, rather than staying on the shelf empty */
            var br=blankId&&blankId!==curBook&&shelfRec(blankId);
            if(br&&!br.n){dropBookContent(blankId);shelfDrop(blankId);}
            if(got==="new"){
              askName({title:tr("Name this notebook","نام‌گذاری این دفترچه"),ok:tr("Done","تأیید"),keep:true,value:bookName,
                       say:tr(h.name+" already holds a notebook, so it was opened instead.",h.name+" از قبل یک دفترچه در خود دارد، پس همان باز شد.")},
                function(name){ if(name!==bookName) setBookName(name); });
            }
          });
          return;
        }
        if(held.kind==="other"){
          askedFile=false;   /* still a book without a file: its first entry asks */
          toast(tr(h.name+" isn't a Narratify notebook \u2014 it was left alone.",h.name+" دفترچهٔ Narratify نیست \u2014 دست‌نخورده ماند."));
          return;
        }
        if(!curBook) curBook=newBookId();
        persist();
        rememberHandle(h,true);
        saveToFile();
        toast(tr("This notebook is saved to "+h.name+" from now on.","از این پس این دفترچه در "+h.name+" ذخیره می‌شود."));
      });
    });
  }).catch(function(){
    if(seq!==bookSeq) return;
    /* no file chosen: kept in the browser as before; Export still works */
    var r=curBook&&shelfRec(curBook);
    if(r){r.nofile=true;writeShelf();}
    else pendingNoFile=true;
  });
}

/* ------------------------------ naming ------------------------------ */
/* A notebook's name and its file's name are two different things, and each is
   asked for in its own place: the name here, in the app, and the file's in the
   file picker that follows. The name is asked for when a notebook is created,
   the first time a file is brought onto this shelf, and on every export —
   which is the moment it is written into a file someone else may open. */
var popName=document.getElementById("popName");
var pnTitle=document.getElementById("pnTitle"), pnSay=document.getElementById("pnSay");
var pnName=document.getElementById("pnName"), pnOk=document.getElementById("pnOk");
var pnCancel=document.getElementById("pnCancel"), pnClose=document.getElementById("pnClose");
var nameJob=null;
/* o: title, say, ok, value, keep (true when closing keeps things as they are,
   so there is no Cancel to offer). done(name) runs on the confirming tap, so a
   file picker opened from it has the tap it needs. */
function askName(o,done,cancelled){
  nameJob={done:done,cancelled:cancelled||null};
  pnTitle.textContent=o.title;
  pnSay.textContent=o.say||""; pnSay.hidden=!o.say;
  pnOk.textContent=o.ok;
  pnCancel.hidden=!!o.keep;
  pnClose.setAttribute("aria-label",o.keep?tr("Keep this name","نگه داشتن این نام"):tr("Cancel","انصراف"));
  pnName.placeholder=o.placeholder||tr("Untitled notebook",FA_STATIC["Untitled notebook"]);
  pnName.value=o.value||""; fitDir(pnName);
  popName.hidden=false;
  pnName.focus();                 /* in the tap, so a phone raises its keyboard */
  pnName.select();
}
function closeName(ok){
  var j=nameJob;
  nameJob=null;
  popName.hidden=true;
  if(!j) return;
  if(ok) j.done(pnName.value.replace(/\s+/g," ").trim().slice(0,80));
  else if(j.cancelled) j.cancelled();
}
pnOk.addEventListener("click",function(){closeName(true);});
pnCancel.addEventListener("click",function(){closeName(false);});
pnClose.addEventListener("click",function(){closeName(false);});
popName.addEventListener("click",function(e){if(e.target===popName) closeName(false);});
pnName.addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();closeName(true);}
});
/* a name made safe to offer as a file name; the reader can change it there */
function fileBase(name){
  return String(name||"").replace(/[\\/:*?"<>|]/g,"").replace(/\s+/g," ").trim().slice(0,60);
}
function nameAsFile(name){var b=fileBase(name);return (b||"narratify-notebook")+".json";}

/* New notebook: the name first, then the page, then where its file goes. */
function startNewNotebook(){
  askName({title:tr("New notebook","دفترچهٔ تازه"),ok:tr("Create","ساختن"),
           say:FSA?tr("You\u2019ll choose the file it\u2019s saved to next.","در گام بعد، فایلی را که دفترچه در آن ذخیره می‌شود انتخاب می‌کنید."):""},
    function(name){
      newBook();
      if(name) setBookName(name);
      askNewBookFile();
    });
}
/* A file brought onto the shelf for the first time: its notebook is named
   here, starting from the name it carries (or its file's, if it carries
   none). The import has already happened; closing keeps that name. */
function nameImported(file){
  askName({title:tr("Name this notebook","نام‌گذاری این دفترچه"),ok:tr("Done","تأیید"),keep:true,value:bookName,
           say:tr("Imported from "+file+". The file keeps its own name.","از "+file+" وارد شد. نام خود فایل تغییر نمی‌کند.")},
    function(name){ if(name!==bookName) setBookName(name); });
}

function doExport(){
  closeMenu();
  if(!entries.length){toast(tr("The notebook is blank \u2014 nothing to export yet.","دفترچه خالی است \u2014 هنوز چیزی برای خروجی نیست."));return;}
  askName({title:tr("Export notebook","خروجی گرفتن از دفترچه"),ok:tr("Export","خروجی"),value:bookName,
           say:FSA?tr("This name goes inside the file. You\u2019ll choose the file\u2019s own name next.","این نام درون فایل نوشته می‌شود. نام خود فایل را در گام بعد انتخاب می‌کنید.")
                  :tr("This name goes inside the file.","این نام درون فایل نوشته می‌شود.")},
    function(name){
      /* The name is set before the notebook is written out, but saved to this
         device only after the file picker has been asked for, so nothing else
         spends the tap the picker needs. */
      var changed=(name!==bookName);
      if(changed){writeIn(); bookName=name; paintTitle();}
      exportNow();
      if(changed) persist();
    });
}
function exportNow(){
  var json=bookJSON();
  if(FSA){
    window.showSaveFilePicker({
      suggestedName:(fileHandle&&fileHandle.name)||nameAsFile(bookName),
      types:[{description:tr("Narratify notebook","دفترچهٔ Narratify"),accept:{"application/json":[".json"]}}]
    }).then(function(h){
      return ensurePerm(h,"readwrite").then(function(ok){
        if(!ok){toast(tr("Permission to write that file was declined.","اجازهٔ نوشتن در آن فایل رد شد."));return;}
        return h.createWritable().then(function(w){
          return w.write(json).then(function(){return w.close();});
        }).then(function(){
          rememberHandle(h,true);
          markSaved();
          toast(tr("Saved to "+h.name,"در "+h.name+" ذخیره شد"));
        });
      });
    }).catch(function(){});
  }else{
    var a=document.createElement("a");
    var url=URL.createObjectURL(new Blob([json],{type:"application/json"}));
    a.href=url; a.download=nameAsFile(bookName);
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1500);
    markSaved();   /* it is in a file now, even if the browser chose where */
    toast(tr("Notebook downloaded.","دفترچه دانلود شد."));
  }
}

/* Two panels, one corner: either can be opened from under the other, so each
   one shuts the other on the way up. Neither can rely on the document handler
   to do it, because each button stops its own click from reaching it. */
function openMenu(){closeSet();bookMenu.hidden=false;bookBtn.setAttribute("aria-expanded","true");}
function closeMenu(){bookMenu.hidden=true;bookBtn.setAttribute("aria-expanded","false");}

bookBtn.addEventListener("click",function(e){
  e.stopPropagation();
  if(bookMenu.hidden) openMenu(); else closeMenu();
});
document.addEventListener("click",function(e){
  if(bookMenu.hidden) return;
  if(bookMenu.contains(e.target)||bookBtn.contains(e.target)||bookTitle.contains(e.target)) return;
  closeMenu();
});

var bookTitle=document.getElementById("bookTitle");
var dirtyDot=document.getElementById("dirtyDot");

/* Lit while this book holds something no file does. Only a file puts it out
   \u2014 a write to the linked file, or an export. Saving to the browser does
   not count, which means on a browser without the file pickers it stays lit
   until the book is exported. That is the honest reading: the writing is on
   this device and nowhere else. */
var fileDirty=false;
var measureCv=null;
function titleWidth(){
  var t=bookTitle.value||bookTitle.placeholder||"";
  if(!t) return 0;
  try{
    if(!measureCv) measureCv=document.createElement("canvas");
    var cs=getComputedStyle(bookTitle);
    var ctx=measureCv.getContext("2d");
    ctx.font=[cs.fontStyle,cs.fontWeight,cs.fontSize,cs.fontFamily].join(" ");
    return ctx.measureText(t).width;
  }catch(e){return t.length*7.5;}
}
/* The title is set in the middle of the header. The space it has is not in
   the middle — the buttons on the right take more room than the logo on the
   left — so the narrow side is given the difference as a margin, which puts
   the field, and the centred text in it, on the header's centre line. A name
   too long for the evened-up field takes back as much of that margin as it
   needs: it is better a little off centre than cut short. */
function centerTitle(){
  var wrap=bookTitle.parentNode, hdr=wrap&&wrap.parentNode;
  if(!hdr) return;
  wrap.style.marginLeft=""; wrap.style.marginRight="";
  var hr=hdr.getBoundingClientRect(), br=wrap.getBoundingClientRect();
  if(!hr.width||!br.width) return;
  var d=(hr.right-br.right)-(br.left-hr.left);    /* right side minus left side */
  if(Math.abs(d)<1) return;
  var cs=getComputedStyle(bookTitle);
  var chrome=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0)+
             (parseFloat(cs.borderLeftWidth)||0)+(parseFloat(cs.borderRightWidth)||0);
  var need=titleWidth()+chrome+(fileDirty?8:0);   /* the unsaved dot needs its room too */
  var shift=Math.min(Math.abs(d),Math.max(0,br.width-need));
  if(d>0) wrap.style.marginLeft=shift+"px"; else wrap.style.marginRight=shift+"px";
}
function paintDot(){
  if(!dirtyDot) return;
  centerTitle();
  dirtyDot.hidden=!fileDirty;
  if(!fileDirty) return;
  var cs=getComputedStyle(bookTitle);
  var padL=parseFloat(cs.paddingLeft)||0;
  var padR=parseFloat(cs.paddingRight)||0;
  var bdL=parseFloat(cs.borderLeftWidth)||0;
  var room=Math.max(bookTitle.clientWidth-padL-padR,0);   /* where the text is clipped */
  var w=Math.min(titleWidth(),room);
  /* the text is centred, so it starts half the unused room in */
  /* after the last letter, which on a right-to-left page is the left one */
  var x=isFa()?bdL+padL+(room-w)/2-7:bdL+padL+(room-w)/2+w+2;
  dirtyDot.style.left=Math.round(x)+"px";
}

/* Books are kept side by side rather than one on top of another: opening one
   puts the other back on the shelf instead of over it, and starting a new one
   costs nothing that was already written. */

var popShelf=document.getElementById("popShelf");

function shelfWhen(ts){
  if(!ts) return "";
  var d=new Date(ts);
  if(key(d)===todayKey) return tr("today","امروز");
  if(isFa()) return fullDate(key(d));
  return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3).toLowerCase()+" "+d.getFullYear();
}
/* Puts a book on the page and the one that was there back on the shelf. */
function openBook(id){
  if(!id||(id===curBook&&!scratch)) return;
  leaveChapters();
  pendingZoom=null; pendingFlat=false; pendingName="";
  narratives=[]; nextNarId=1; narFilter=[]; query=""; qTerms=[]; openPosts={}; openRefl={}; allRefl={};
  curBook=id; scratch=false; curSample=null;
  bookSeq++; pendingNoFile=false; permRefused=false;
  var seq=bookSeq;
  fileHandle=null; permOk=false;
  askedFile=true;   /* held shut until we know whether this book has a file */
  recallHandle(id).then(function(h){
    if(seq!==bookSeq) return;               /* another book is open now */
    if(fileHandle){assessDirty();return;}   /* linked meanwhile by an import */
    if(h&&typeof h.createWritable==="function"){
      fileHandle=h;
      var fr=shelfRec(id);
      if(fr&&h.name&&fr.file!==h.name){fr.file=h.name; delete fr.nofile; writeShelf();}
      if(h.queryPermission){
        h.queryPermission({mode:"readwrite"}).then(function(st){permOk=(st==="granted");}).catch(function(){});
      }else permOk=true;
    }else{
      var r=shelfRec(id);
      askedFile=!!(r&&r.nofile);   /* no file yet: the next change asks for one
                                      (or, if it once had one, says how to relink) */
    }
    assessDirty();
  }).catch(assessDirty);
  /* The book has to be fetched before it can be shown; nothing else about the
     page changes until it is in hand, so a failed read leaves the reader where
     they were rather than on a blank page. */
  readBookContent(id).then(function(raw){
    if(raw==null){
      shelfDrop(id); curBook=null;
      toast(tr("That notebook's pages couldn't be found.","صفحه‌های آن دفترچه پیدا نشد."));
      drawShelf();
      return;
    }
    entries=parseBook(raw);
    nextId=1;
    entries.forEach(function(e){if(e.id>=nextId) nextId=e.id+1;});
    zoom=pendingZoom||1;
    flat=pendingFlat;
    bookName=pendingName; paintTitle();
    selected=todayKey;
    reindex();
    zoom=snapZoom(zoom);
    selectedItem=firstIdOn(todayKey);
    /* Opening a book is not a change to it. Recorded as already written, so
       the rebuild below doesn't write it back, light the dot, or reach for
       its file. */
    var st=bookState(); if(st!=null) lastJson[id]=st;
    refresh();
    paintSet();
    shelf.cur=id; writeShelf();
  }).catch(function(){});
}
/* A blank page, with everything else left where it was. */
function newBook(quiet){
  var was=bookName;
  leaveChapters(); chapters=[]; nextChapId=1;
  narratives=[]; nextNarId=1; narFilter=[]; query=""; qTerms=[]; openPosts={}; openRefl={}; allRefl={};
  entries=[]; nextId=1;
  curBook=null; scratch=false; curSample=null;
  fileHandle=null; permOk=false; askedFile=false;   /* a new book, asked once, later */
  bookSeq++; pendingNoFile=false; permRefused=false;
  markSaved();   /* a blank page is in no file, but it is also nothing yet */
  shelf.cur=null; writeShelf();   /* the blank page is what opens next time */
  bookName=""; paintTitle();
  zoom=1; selected=todayKey; selectedItem=null;
  reindex();
  refresh();
  paintSet();
  if(!quiet) toast(was?tr("New notebook started. "+was+" is still on the shelf.","دفترچهٔ تازه آغاز شد. "+was+" هنوز در قفسه است.")
                       :tr("New notebook started.","دفترچهٔ تازه آغاز شد."));
}

/* One list, in the order the reader chose: by date, the book changed last
   first; by name, A to Z the way a person sorts (accents and case don't
   separate names, "Book 2" comes before "Book 10"), untitled books after the
   named ones, and the newer first among equals. The order is kept with the
   shelf; what was typed into the field is not, and is gone next time. */
var shelfQuery="";
var shelfTools=document.getElementById("shelfTools");
var shelfQ=document.getElementById("shelfQ");
var shelfQX=document.getElementById("shelfQX");
function foldName(t){
  t=String(t||"");
  try{t=t.normalize("NFD").replace(/[\u0300-\u036f]/g,"");}catch(e){}
  return t.toLowerCase();
}
var nameOrder=(window.Intl&&Intl.Collator)?new Intl.Collator(undefined,{numeric:true,sensitivity:"base"}):null;
function shelfOrder(books){
  var byDate=function(a,b){return (b.at||0)-(a.at||0);};
  if(shelf.sort!=="name") return books.sort(byDate);
  return books.sort(function(a,b){
    var ta=(a.title||"").trim(), tb=(b.title||"").trim();
    if(!ta!==!tb) return ta?-1:1;
    var c=nameOrder?nameOrder.compare(ta,tb):(foldName(ta)<foldName(tb)?-1:foldName(ta)>foldName(tb)?1:0);
    return c||byDate(a,b);
  });
}
/* A book is found by its name, or by the name of its file. */
function shelfFinds(b,words){
  var hay=foldName((b.title||tr("Untitled notebook","دفترچهٔ بی‌نام"))+" "+(b.file||""));
  return words.every(function(w){return hay.indexOf(w)>=0;});
}
function paintShelfTools(){
  var sort=shelf.sort==="name"?"name":"date";
  shelfTools.querySelectorAll(".sh-sort .seg").forEach(function(b){

/* Books linked to a file before the shelf kept file names get theirs from the
   stored link, which can be read without asking for any permission. */
function fillFileNames(){
  if(!FSA) return;
  var missing=shelf.books.filter(function(b){return !b.file;});
  if(!missing.length) return;
  Promise.all(missing.map(function(b){
    return recallHandle(b.id).then(function(h){
      if(h&&h.name&&shelfRec(b.id)&&!b.file){b.file=h.name; delete b.nofile; return true;}
      return false;
    }).catch(function(){return false;});
  })).then(function(got){
    if(got.indexOf(true)<0) return;
    writeShelf();
    if(!popShelf.hidden) drawShelf();
  });
}
/* Which of the two shelves is showing. A reading position for one visit, not
   a setting: the shelf opens on the reader's own books every time, and the
   tab is only remembered for as long as the card is up. */
var shelfTab="mine";
var shelfTabs=document.getElementById("shelfTabs");

function setShelfTab(t){

function drawShelf(){
  paintShelfTabs();

  shelfList.textContent="";
  shelfTools.hidden=shelf.books.length<2&&!shelfQuery;
  paintShelfTools();
  var words=foldName(shelfQuery).split(/\s+/).filter(Boolean);
  var books=shelfOrder(shelf.books.slice());

  if(!shelf.books.length){
    shelfList.appendChild(el("p","man-empty",
      tr("Nothing of yours on the shelf yet. Write a note and this notebook will be kept here.","هنوز چیزی از شما در قفسه نیست. یادداشتی بنویسید تا این دفترچه اینجا نگه داشته شود.")));
  }else if(!books.length){
    shelfList.appendChild(el("p","shelf-none",tr("No notebook on the shelf is called \u201c"+shelfQuery.trim()+"\u201d.","هیچ دفترچه‌ای در قفسه «"+shelfQuery.trim()+"» نام ندارد.")));
  }
  books.forEach(function(b){
    var row=el("div","man-row");

    var open=el("button","shelf-open");

    var txt=el("span","shelf-txt");

    if(b.file){

      txt.appendChild(fn);
    }
    txt.appendChild(el("span","shelf-sub",
      (b.id===curBook&&!scratch?tr("open","باز"):shelfWhen(b.at))));
    open.appendChild(txt);
    var k=b.n||0;
    open.appendChild(el("span","man-count",notesN(k)));
    open.addEventListener("click",function(){
      if(b.id===curBook&&!scratch){closeShelf();return;}
      closeShelf(); openBook(b.id);
    });
    row.appendChild(open);

    var x=el("button","man-x","\u2715");
    x.setAttribute("aria-label",tr("Remove ","حذف ")+(b.title||tr("this notebook","این دفترچه")));
    var armed=false;
    x.addEventListener("click",function(){
      if(!armed){
        armed=true; x.classList.add("armed"); x.textContent=tr("Remove","حذف");
        setTimeout(function(){
          if(armed){armed=false;x.classList.remove("armed");x.textContent="\u2715";}
        },4000);
        return;
      }
      var wasOpen=(b.id===curBook);
      dropBookContent(b.id); shelfDrop(b.id);
      if(wasOpen){curBook=null; newBook(true);}
      drawShelf();
    });
    row.appendChild(x);

    shelfList.appendChild(row);
  });

function setShelfQuery(q){

/* Both toggles live behind the gear: neither is touched often enough to earn
